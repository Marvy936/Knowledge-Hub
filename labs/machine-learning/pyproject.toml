[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-hub-ml-flagship-lab"
version = "0.1.0"
description = "Deterministic end-to-end ML fundamentals lab for the Knowledge Hub"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "joblib>=1.5,<2",
  "numpy>=2.3,<2.5",
  "pandas>=2.2,<3.1",
  "scikit-learn>=1.8,<1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
ml-lab = "ml_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
