name: kh-postgres-index-performance

services:
  postgres:
    image: postgres:16-alpine
    container_name: kh-lab-postgres-index
    environment:
      POSTGRES_DB: labdb
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: labpass
    healthcheck:
      # The official image uses a temporary Unix-socket-only PostgreSQL server
      # while initializing a new data directory. Probe TCP so "healthy" means
      # the final server is running after initialization has completed.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U labuser -d labdb"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
