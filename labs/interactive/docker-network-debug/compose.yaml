name: kh-docker-network-debug

services:
  docker:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - docker-data:/var/lib/docker

  lab:
    build:
      context: .
      dockerfile: lab/Dockerfile
    depends_on:
      docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://docker:2375
      LAB_WORKSPACE: /workspace
    stdin_open: true
    tty: true
    volumes:
      - workspace:/workspace

volumes:
  docker-data:
  workspace:
