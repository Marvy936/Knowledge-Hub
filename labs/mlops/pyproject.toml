[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-hub-mlops-flagship-lab"
version = "0.1.0"
description = "Deterministic lineage and promotion foundation for the Knowledge Hub MLOps flagship"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
mlops-lab = "mlops_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
