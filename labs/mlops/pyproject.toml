[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-hub-mlops-flagship-lab"
version = "0.8.0"
description = "Deterministic lineage, registry, serving, monitoring, controlled retraining and deployment handoff contracts for the Knowledge Hub MLOps flagship"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
registry = [
  "joblib>=1.5,<2",
  "mlflow==3.14.0",
  "pandas>=2.2,<3.1",
  "scikit-learn>=1.8,<1.10",
]
serving = [
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
]
dev = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pytest>=8,<10",
]

[project.scripts]
mlops-lab = "mlops_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
