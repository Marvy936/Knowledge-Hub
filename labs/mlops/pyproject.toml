[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-hub-mlops-flagship-lab"
version = "0.1.0"
description = "Local MLflow-backed MLOps lifecycle lab for the Knowledge Hub"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "joblib>=1.5,<2",
  "mlflow==3.14.0",
  "numpy>=2.3,<2.5",
  "pandas>=2.2,<3.1",
  "scikit-learn>=1.8,<1.10",
  "skops>=0.13,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
mlops-lab = "mlops_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
