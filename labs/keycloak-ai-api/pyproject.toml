[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-hub-keycloak-ai-api"
version = "0.1.0"
description = "Strict Keycloak OIDC resource-server and PKCE/service-account contracts for Knowledge Hub Practical v1"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "PyJWT[crypto]==2.13.0",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "httpx2==2.7.0",
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
