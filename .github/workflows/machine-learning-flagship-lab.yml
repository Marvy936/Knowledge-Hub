name: Machine Learning flagship lab

on:
  pull_request:
    paths:
      - "labs/machine-learning/**"
      - "docs/18-machine-learning-fundamentals/README.md"
      - "FUTURE-IDENTITY-AI-ROADMAP.md"
  push:
    branches:
      - main
    paths:
      - "labs/machine-learning/**"
      - "docs/18-machine-learning-fundamentals/README.md"
      - "FUTURE-IDENTITY-AI-ROADMAP.md"

permissions:
  contents: read

jobs:
  test-runtime-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      selected_model: ${{ steps.evidence.outputs.selected_model }}
      decision_threshold: ${{ steps.evidence.outputs.decision_threshold }}
      test_f1: ${{ steps.evidence.outputs.test_f1 }}
      test_recall: ${{ steps.evidence.outputs.test_recall }}
      dataset_sha256: ${{ steps.evidence.outputs.dataset_sha256 }}
      model_sha256: ${{ steps.evidence.outputs.model_sha256 }}
      library_versions: ${{ steps.evidence.outputs.library_versions }}
    env:
      PYTHONHASHSEED: "0"
      RUNTIME_DIR: "${{ runner.temp }}/knowledge-hub-ml-lab"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/machine-learning/pyproject.toml

      - name: Install lab
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "labs/machine-learning[dev]"

      - name: Run unit and integrity tests
        run: pytest labs/machine-learning/tests -q

      - name: Execute positive lifecycle
        run: |
          mkdir -p "$RUNTIME_DIR/data"
          python -m ml_lab generate-data \
            --output "$RUNTIME_DIR/data/customers.csv" \
            --rows 1200 \
            --seed 20260805
          python -m ml_lab validate-data \
            --input "$RUNTIME_DIR/data/customers.csv"
          python -m ml_lab train \
            --input "$RUNTIME_DIR/data/customers.csv" \
            --output-dir "$RUNTIME_DIR/artifact" \
            --seed 20260805
          python -m ml_lab infer \
            --artifact-dir "$RUNTIME_DIR/artifact" \
            --input labs/machine-learning/data/sample-request.json

      - name: Verify negative leakage path
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd

          runtime = Path(os.environ["RUNTIME_DIR"])
          source = runtime / "data/customers.csv"
          target = runtime / "data/customers-leaked.csv"
          frame = pd.read_csv(source)
          frame["future_refund_30d"] = frame["churned_next_30d"]
          frame.to_csv(target, index=False)
          PY

          if python -m ml_lab validate-data \
            --input "$RUNTIME_DIR/data/customers-leaked.csv"; then
            echo "::error::Leakage validation unexpectedly succeeded."
            exit 1
          fi

      - name: Verify artifact manifest and collect evidence
        id: evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          runtime = Path(os.environ["RUNTIME_DIR"])
          manifest = json.loads((runtime / "artifact/manifest.json").read_text())
          assert manifest["selected_model"] != "dummy_most_frequent"
          assert manifest["test_metrics"]["f1"] >= 0.55
          assert manifest["test_metrics"]["recall"] >= 0.55
          assert len(manifest["model_sha256"]) == 64

          versions = ",".join(
              f"{name}={value}"
              for name, value in sorted(manifest["library_versions"].items())
          )
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"selected_model={manifest['selected_model']}\n")
              handle.write(f"decision_threshold={manifest['decision_threshold']}\n")
              handle.write(f"test_f1={manifest['test_metrics']['f1']}\n")
              handle.write(f"test_recall={manifest['test_metrics']['recall']}\n")
              handle.write(f"dataset_sha256={manifest['dataset_sha256']}\n")
              handle.write(f"model_sha256={manifest['model_sha256']}\n")
              handle.write(f"library_versions={versions}\n")
          print("Manifest acceptance gates passed and evidence was exported.")
          PY
          rm -rf "$RUNTIME_DIR"
          test ! -e "$RUNTIME_DIR"

  publish-main-statuses:
    if: ${{ github.event_name == 'push' && always() }}
    needs: test-runtime-lifecycle
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      RUNTIME_RESULT: ${{ needs.test-runtime-lifecycle.result }}
      SELECTED_MODEL: ${{ needs.test-runtime-lifecycle.outputs.selected_model }}
      DECISION_THRESHOLD: ${{ needs.test-runtime-lifecycle.outputs.decision_threshold }}
      TEST_F1: ${{ needs.test-runtime-lifecycle.outputs.test_f1 }}
      TEST_RECALL: ${{ needs.test-runtime-lifecycle.outputs.test_recall }}
      DATASET_SHA256: ${{ needs.test-runtime-lifecycle.outputs.dataset_sha256 }}
      MODEL_SHA256: ${{ needs.test-runtime-lifecycle.outputs.model_sha256 }}
      LIBRARY_VERSIONS: ${{ needs.test-runtime-lifecycle.outputs.library_versions }}
    steps:
      - name: Publish connector-readable commit statuses
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const success = process.env.RUNTIME_RESULT === 'success';
            const statuses = [{
              context: 'knowledge-hub/ml-flagship-runtime',
              state: success ? 'success' : 'failure',
              description: success
                ? '5/5 tests and complete synthetic lifecycle passed'
                : 'Machine Learning flagship runtime lifecycle failed',
            }];

            if (success) {
              statuses.push(
                {
                  context: 'knowledge-hub/ml-metrics',
                  state: 'success',
                  description: `${process.env.SELECTED_MODEL}; threshold=${process.env.DECISION_THRESHOLD}; f1=${process.env.TEST_F1}; recall=${process.env.TEST_RECALL}`,
                },
                {
                  context: 'knowledge-hub/ml-dataset-sha256',
                  state: 'success',
                  description: `sha256=${process.env.DATASET_SHA256}`,
                },
                {
                  context: 'knowledge-hub/ml-model-sha256',
                  state: 'success',
                  description: `sha256=${process.env.MODEL_SHA256}`,
                },
                {
                  context: 'knowledge-hub/ml-runtime-versions',
                  state: 'success',
                  description: process.env.LIBRARY_VERSIONS.slice(0, 140),
                },
              );
            }

            for (const status of statuses) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: status.state,
                context: status.context,
                description: status.description,
                target_url: runUrl,
              });
            }
