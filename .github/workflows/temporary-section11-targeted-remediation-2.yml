name: Temporary Section 11 final cleanup gate

on:
  push:
    branches:
      - agent/sections-10-13-prose-first-revalidation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-section11-final-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sections-10-13-prose-first-revalidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate current content and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check
          python scripts/audit_learning_depth.py --all-docs --report /tmp/audit.md --json /tmp/audit.json

          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path('/tmp/audit.json').read_text(encoding='utf-8'))
          findings = [
              item for item in audit['findings']
              if item['path'].startswith('docs/11-cloud-and-aws/')
              and item['severity'] in {'critical', 'high', 'medium'}
          ]
          if findings:
              for item in findings:
                  print(item)
              raise SystemExit('Section 11 still has strict findings')

          for path in Path('docs/11-cloud-and-aws').glob('*.md'):
              text = path.read_text(encoding='utf-8')
              if 'cite' in text or 'turn398658' in text:
                  raise SystemExit(f'UI citation marker remains in {path}')
          PY

          git add docs GLOSSARY.md ROADMAP.md
          git rm -f --ignore-unmatch \
            .github/section11-quality-report.txt \
            .github/section11-remediation-trigger.txt \
            .github/section11-strict-findings.txt \
            .github/workflows/temporary-apply-cloudops-blobs.yml \
            .github/workflows/temporary-fix-section-11-checker.yml \
            .github/workflows/temporary-section-11-final-gate.yml \
            .github/workflows/temporary-section-11-quality-validation.yml \
            .github/workflows/temporary-section11-findings.yml \
            .github/workflows/temporary-section11-practical-polish.yml \
            .github/workflows/temporary-section11-targeted-remediation.yml \
            .github/workflows/temporary-section11-targeted-remediation-2.yml

          if ! git diff --cached --quiet; then
            git commit -m "docs(aws): finalize Section 11 and remove temporary audit files"
            git push origin HEAD:agent/sections-10-13-prose-first-revalidation
          fi
