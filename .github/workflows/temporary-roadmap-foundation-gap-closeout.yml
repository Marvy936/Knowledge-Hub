name: Temporary roadmap foundation gap closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "ROADMAP.md"
      - ".github/workflows/temporary-roadmap-foundation-gap-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-roadmap-foundation-gap-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/roadmap-foundation-gap-closeout

      - name: Close stale roadmap gaps
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          roadmap = Path("ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")

          replacements = {
              "- [ ] Memory a CPU fundamentals": "- [x] [CPU a memory fundamentals](docs/01-linux-and-systems/cpu-and-memory-fundamentals.md)",
              "- [ ] Ports a sockets": "- [x] [Porty a sockety](docs/02-networking-and-web/ports-and-sockets.md)",
              "- [ ] HTTPS, TLS, certificates a PKI": "- [x] [HTTPS, TLS, certifikáty a PKI](docs/02-networking-and-web/https-tls-certificates-pki.md)",
              "- [ ] REST APIs a WebSockets": "- [x] [REST API a WebSockety](docs/02-networking-and-web/rest-apis-and-websockets.md)",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one roadmap target for {old!r}, found {count}")
              text = text.replace(old, new, 1)

          if "- [ ] " in text:
              remaining = [line for line in text.splitlines() if line.startswith("- [ ] ")]
              raise SystemExit(f"Unchecked roadmap entries remain: {remaining}")

          targets = [
              Path("docs/01-linux-and-systems/cpu-and-memory-fundamentals.md"),
              Path("docs/02-networking-and-web/ports-and-sockets.md"),
              Path("docs/02-networking-and-web/https-tls-certificates-pki.md"),
              Path("docs/02-networking-and-web/rest-apis-and-websockets.md"),
          ]
          missing = [str(path) for path in targets if not path.is_file()]
          if missing:
              raise SystemExit(f"Roadmap targets do not exist: {missing}")

          roadmap.write_text(text, encoding="utf-8", newline="\n")
          print("All roadmap topics are linked and checked.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md

          if git diff --cached --quiet; then
            echo "No roadmap changes required."
            exit 0
          fi

          git commit -m "docs: close remaining roadmap gaps"
          git push origin HEAD:agent/roadmap-foundation-gap-closeout
