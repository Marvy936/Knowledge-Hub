name: Temporary fix RAG runtime driver

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/actions-runner-context'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/actions-runner-context
          persist-credentials: true
          fetch-depth: 1

      - name: Patch stale RAG v2 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('labs/llm-rag/scripts/run_clean_checkout_runtime.py')
          text = path.read_text(encoding='utf-8')

          marker = '\n\ndef _citation_chunk_ids(result: Mapping[str, Any]) -> set[str]:\n'
          helper = '''\n\ndef _query_from_chunks(chunks: Sequence[Mapping[str, Any]]) -> str:\n    for chunk in chunks:\n        try:\n            return _query_from_chunk(chunk)\n        except RagRuntimeError:\n            continue\n    raise RagRuntimeError("cannot derive positive query from any canonical corpus chunk")\n'''
          if 'def _query_from_chunks(' not in text:
              if marker not in text:
                  raise SystemExit('citation helper marker not found')
              text = text.replace(marker, helper + marker, 1)

          old_query = '        positive_query = _query_from_chunk(chunks[0])\n'
          new_query = '        positive_query = _query_from_chunks(chunks)\n'
          if old_query not in text and new_query not in text:
              raise SystemExit('positive query call marker not found')
          text = text.replace(old_query, new_query, 1)

          text = text.replace(
              '            ("implementation_revision", subject_sha),\n',
              '',
              1,
          )
          text = text.replace(
              '                        "--runtime-root",\n                        str(runtime_root),\n',
              '                        "--runtime-root",\n                        ".runtime/llm-rag",\n',
              1,
          )
          text = text.replace(
              '                "evidence_generation": "rag-clean-checkout-runtime-v1",\n',
              '                "evidence_generation": "rag-clean-checkout-runtime-v2",\n',
              1,
          )
          lifecycle_marker = '            "runtime_config_id": runtime_config_id,\n'
          lifecycle_add = lifecycle_marker + '            "implementation_revision": subject_sha,\n'
          if '            "implementation_revision": subject_sha,\n' not in text:
              if lifecycle_marker not in text:
                  raise SystemExit('lifecycle runtime config marker not found')
              text = text.replace(lifecycle_marker, lifecycle_add, 1)

          required = [
              'def _query_from_chunks(',
              'positive_query = _query_from_chunks(chunks)',
              '"--runtime-root",\n                        ".runtime/llm-rag",',
              '"evidence_generation": "rag-clean-checkout-runtime-v2"',
              '"implementation_revision": subject_sha',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('RAG v2 patch incomplete: ' + repr(missing))
          if '("implementation_revision", subject_sha),' in text:
              raise SystemExit('stale raw-SHA prompt release assertion remains')

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/llm-rag/scripts/run_clean_checkout_runtime.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(rag): align clean-checkout v2 runtime contract'
          git push origin HEAD:fix/actions-runner-context
