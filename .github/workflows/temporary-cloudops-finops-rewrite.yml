name: Temporary CloudOps and FinOps rewrite

on:
  push:
    branches:
      - agent/sections-10-13-prose-first-revalidation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-cloudops-finops-rewrite
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: self-hosted
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/sections-10-13-prose-first-revalidation
          fetch-depth: 0

      - name: Write practical CloudOps and FinOps chapters
        shell: bash
        run: |
