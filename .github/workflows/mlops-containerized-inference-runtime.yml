name: MLOps containerized inference runtime

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "labs/machine-learning/**"
      - "labs/mlops/**"
      - ".github/workflows/mlops-containerized-inference-runtime.yml"
  push:
    branches: [main]
    paths:
      - "labs/machine-learning/**"
      - "labs/mlops/**"
      - ".github/workflows/mlops-containerized-inference-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlops-containerized-inference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      evidence_id: ${{ steps.evidence.outputs.evidence_id }}
      deployment_id: ${{ steps.evidence.outputs.deployment_id }}
      docker_image_id: ${{ steps.evidence.outputs.docker_image_id }}
      registry_version: ${{ steps.evidence.outputs.registry_version }}
      model_sha256: ${{ steps.evidence.outputs.model_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      PYTHONHASHSEED: "0"
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VENV_DIR: "${{ github.workspace }}/../knowledge-hub-mlops-container-venv"
      RUNTIME_DIR: "${{ github.workspace }}/../knowledge-hub-mlops-container-runtime"
      TRACKING_URI: "http://127.0.0.1:5057"
      EVIDENCE: "${{ github.workspace }}/../knowledge-hub-mlops-container-evidence.json"

    steps:
      - name: Checkout exact subject revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Verify Docker runtime
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info

      - name: Install isolated ML and MLOps runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VENV_DIR" "$RUNTIME_DIR"
          rm -f "$EVIDENCE"
          python -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/python" -m pip install \
            -e "labs/machine-learning" \
            -e "labs/mlops[dev,registry,serving]"

      - name: Run MLOps contract suite
        shell: bash
        env:
          PYTHONWARNINGS: error
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" -m pytest labs/mlops/tests -q

      - name: Build live Registry source subjects
        shell: bash
        run: |
          set -euo pipefail
          bash labs/mlops/scripts/run_registry_gate.sh

      - name: Execute containerized inference runtime gate
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" labs/mlops/scripts/run_containerized_inference_runtime.py \
            --repo-root . \
            --runtime-dir "$RUNTIME_DIR" \
            --subject-sha "$SUBJECT_SHA" \
            --sample-request labs/machine-learning/data/sample-request.json \
            --output "$EVIDENCE" \
            --host 127.0.0.1 \
            --port 18080

      - name: Verify driver evidence before outer cleanup
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(Path(os.environ["EVIDENCE"]).read_text(encoding="utf-8"))
          assert evidence["subject_sha"] == os.environ["SUBJECT_SHA"]
          assert evidence["cleanup_verified"] is True
          assert evidence["container_uid"] == "10001"
          assert evidence["invalid_request_status"] == 422
          assert evidence["wrong_image_digest"]["refused"] is True
          assert evidence["docker_image_id"].startswith("sha256:")
          assert evidence["prediction"]["deployment_id"] == evidence["deployment_id"]
          assert evidence["prediction"]["image_digest"] == evidence["docker_image_id"]
          assert evidence["registry_exact_uri"].endswith("/" + evidence["registry_version"])
          assert "@" not in evidence["registry_exact_uri"]
          PY

      - name: Cleanup disposable Registry and Python runtime
        shell: bash
        run: |
          set -euo pipefail
          pkill -f "$VENV_DIR/bin/mlflow server" 2>/dev/null || true
          rm -rf "$RUNTIME_DIR" "$VENV_DIR"
          test ! -e "$RUNTIME_DIR"
          test ! -e "$VENV_DIR"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["EVIDENCE"])
          evidence = json.loads(path.read_text(encoding="utf-8"))
          evidence["workflow_cleanup_verified"] = True
          payload = {key: value for key, value in evidence.items() if key != "evidence_id"}
          canonical = json.dumps(
              payload,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          evidence["evidence_id"] = hashlib.sha256(canonical).hexdigest()
          path.write_text(json.dumps(evidence, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Collect final evidence outputs
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(Path(os.environ["EVIDENCE"]).read_text(encoding="utf-8"))
          assert evidence["subject_sha"] == os.environ["SUBJECT_SHA"]
          assert evidence["cleanup_verified"] is True
          assert evidence["workflow_cleanup_verified"] is True
          values = {
              "evidence_id": evidence["evidence_id"],
              "deployment_id": evidence["deployment_id"],
              "docker_image_id": evidence["docker_image_id"],
              "registry_version": evidence["registry_version"],
              "model_sha256": evidence["model_sha256"],
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          print(json.dumps(values, sort_keys=True))
          PY

      - name: Upload canonical container runtime evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mlops-containerized-inference-${{ env.SUBJECT_SHA }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 30

      - name: Emergency cleanup and residue check
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          pkill -f "$VENV_DIR/bin/mlflow server" 2>/dev/null || true
          docker ps -aq --filter "name=kh-mlops-runtime-" | xargs -r docker rm -f
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
            | awk '$1 ~ /^knowledge-hub-mlops-runtime:/ {print $2}' \
            | sort -u \
            | xargs -r docker image rm -f || true
          rm -rf "$RUNTIME_DIR" "$VENV_DIR"
          test ! -e "$RUNTIME_DIR"
          test ! -e "$VENV_DIR"
          test -z "$(docker ps -aq --filter 'name=kh-mlops-runtime-')"

  publish-main-statuses:
    if: github.event_name == 'push' && always()
    needs: container-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      RUNTIME_RESULT: ${{ needs.container-runtime.result }}
      EVIDENCE_ID: ${{ needs.container-runtime.outputs.evidence_id }}
      DEPLOYMENT_ID: ${{ needs.container-runtime.outputs.deployment_id }}
      DOCKER_IMAGE_ID: ${{ needs.container-runtime.outputs.docker_image_id }}
      REGISTRY_VERSION: ${{ needs.container-runtime.outputs.registry_version }}
      MODEL_SHA256: ${{ needs.container-runtime.outputs.model_sha256 }}
      ARTIFACT_ID: ${{ needs.container-runtime.outputs.artifact_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      SUBJECT_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Publish connector-readable container runtime statuses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          success = os.environ["RUNTIME_RESULT"] == "success"
          statuses = [
              {
                  "context": "knowledge-hub/mlops-containerized-inference-runtime",
                  "state": "success" if success else "failure",
                  "description": (
                      "non-root container, live HTTP, digest refusal and cleanup passed"
                      if success
                      else "MLOps containerized inference runtime gate failed"
                  ),
              }
          ]
          if success:
              statuses.extend(
                  [
                      {
                          "context": "knowledge-hub/mlops-container-evidence",
                          "state": "success",
                          "description": f"evidence={os.environ['EVIDENCE_ID']}; artifact={os.environ['ARTIFACT_ID']}",
                      },
                      {
                          "context": "knowledge-hub/mlops-container-deployment",
                          "state": "success",
                          "description": f"deployment={os.environ['DEPLOYMENT_ID']}",
                      },
                      {
                          "context": "knowledge-hub/mlops-container-image",
                          "state": "success",
                          "description": f"image={os.environ['DOCKER_IMAGE_ID']}",
                      },
                      {
                          "context": "knowledge-hub/mlops-container-model",
                          "state": "success",
                          "description": f"registry_version={os.environ['REGISTRY_VERSION']}; model={os.environ['MODEL_SHA256']}",
                      },
                  ]
              )

          url = (
              "https://api.github.com/repos/"
              + os.environ["REPOSITORY"]
              + "/statuses/"
              + os.environ["SUBJECT_SHA"]
          )
          for status in statuses:
              request = urllib.request.Request(
                  url,
                  data=json.dumps(
                      {
                          **status,
                          "description": status["description"][:140],
                          "target_url": os.environ["RUN_URL"],
                      }
                  ).encode("utf-8"),
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Content-Type": "application/json",
                      "User-Agent": "knowledge-hub-mlops-container-runtime",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  if response.status != 201:
                      raise SystemExit(f"Unexpected status API response: {response.status}")
          PY
