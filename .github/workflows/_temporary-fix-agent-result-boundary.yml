name: Temporary fix agent result boundary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/actions-runner-context'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/actions-runner-context
          persist-credentials: true
          fetch-depth: 1

      - name: Patch completed-result integrity boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('labs/agent-ops/src/agent_ops/execution.py')
          text = path.read_text(encoding='utf-8')
          old = '''            if current["phase"] == "completed":\n                result = read_json(result_path)\n                validate_result_against_action(\n                    result,\n                    operation_id=operation["operation_id"],\n                    action_digest=operation["action_digest"],\n                    tool=operation["tool"],\n                    target=operation["target"],\n                )\n                if result["result_id"] != current["result_id"]:\n'''
          new = '''            if current["phase"] == "completed":\n                result = read_json(result_path)\n                try:\n                    validate_result_against_action(\n                        result,\n                        operation_id=operation["operation_id"],\n                        action_digest=operation["action_digest"],\n                        tool=operation["tool"],\n                        target=operation["target"],\n                    )\n                except AgentContractError as exc:\n                    raise AgentContractError(\n                        f"completed result failed canonical integrity validation: {exc}"\n                    ) from exc\n                if result["result_id"] != current["result_id"]:\n'''
          if old not in text:
              raise SystemExit('completed replay validation block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/agent-ops/src/agent_ops/execution.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(agent): classify completed result tampering'
          git push origin HEAD:fix/actions-runner-context
