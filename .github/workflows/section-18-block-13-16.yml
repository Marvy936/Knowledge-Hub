name: Section 18 ML block 13-16

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/section-18-block-13-16.yml
      - docs/18-machine-learning-fundamentals/**

permissions:
  contents: write

concurrency:
  group: section-18-ml-block-13-16
  cancel-in-progress: true

jobs:
  validate-and-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-18-ml-fundamentals-block-13-16
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate block and synchronize section state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          section = root / 'docs' / '18-machine-learning-fundamentals'
          chapters = {
              'gradient-descent-learning-rate-convergence.md': [
                  'gradient descent', 'learning rate', 'convergence', 'ML-PAY-86'
              ],
              'overfitting-underfitting-bias-variance.md': [
                  'overfitting', 'underfitting', 'bias', 'variance', 'ML-PAY-86'
              ],
              'regularization-early-stopping.md': [
                  'regularization', 'early stopping', 'weight decay', 'ML-PAY-86'
              ],
              'hyperparameters-hyperparameter-optimization.md': [
                  'hyperparameter', 'search space', 'nested', 'prun', 'ML-PAY-86'
              ],
          }

          for name, terms in chapters.items():
              path = section / name
              if not path.exists():
                  raise SystemExit(f'missing chapter: {path}')
              text = path.read_text(encoding='utf-8')
              words = re.findall(r"\b[\w'-]+\b", text, flags=re.UNICODE)
              if len(words) < 800:
                  raise SystemExit(f'{name}: only {len(words)} words; expected substantial prose')
              if text.count('```') < 4:
                  raise SystemExit(f'{name}: insufficient executable/model surface')
              lower = text.lower()
              missing = [term for term in terms if term.lower() not in lower]
              if missing:
                  raise SystemExit(f'{name}: missing required concepts {missing}')
              semantic_groups = {
                  'subject': ('subject', 'predmet'),
                  'evidence': ('evidence', 'dôkaz', 'read-back'),
                  'failure': ('failure', 'zlyhan', 'incident'),
                  'recovery': ('recovery', 'obnov', 'rollback'),
                  'acceptance': ('acceptance', 'positive', 'forbidden'),
              }
              for group, alternatives in semantic_groups.items():
                  if not any(token in lower for token in alternatives):
                      raise SystemExit(f'{name}: missing {group} semantics')

          readme = section / 'README.md'
          readme_text = readme.read_text(encoding='utf-8')
          required_readme = [
              '**16/26 · In progress**',
              '[Gradient descent, learning rate a convergence](gradient-descent-learning-rate-convergence.md)',
              '[Overfitting, underfitting, bias a variance](overfitting-underfitting-bias-variance.md)',
              '[Regularization a early stopping](regularization-early-stopping.md)',
              '[Hyperparameters a hyperparameter optimization](hyperparameters-hyperparameter-optimization.md)',
          ]
          for token in required_readme:
              if token not in readme_text:
                  raise SystemExit(f'README missing: {token}')

          roadmap = root / 'ROADMAP.md'
          roadmap_text = roadmap.read_text(encoding='utf-8')
          replacements = {
              '- [ ] Gradient descent, learning rate a convergence': '- [x] [Gradient descent, learning rate a convergence](docs/18-machine-learning-fundamentals/gradient-descent-learning-rate-convergence.md)',
              '- [ ] Overfitting, underfitting, bias a variance': '- [x] [Overfitting, underfitting, bias a variance](docs/18-machine-learning-fundamentals/overfitting-underfitting-bias-variance.md)',
              '- [ ] Regularization a early stopping': '- [x] [Regularization a early stopping](docs/18-machine-learning-fundamentals/regularization-early-stopping.md)',
              '- [ ] Hyperparameters a hyperparameter optimization': '- [x] [Hyperparameters a hyperparameter optimization](docs/18-machine-learning-fundamentals/hyperparameters-hyperparameter-optimization.md)',
          }
          for old, new in replacements.items():
              if old in roadmap_text:
                  roadmap_text = roadmap_text.replace(old, new, 1)
              elif new not in roadmap_text:
                  raise SystemExit(f'ROADMAP missing expected state: {old}')
          roadmap.write_text(roadmap_text, encoding='utf-8')

          ledger = root / 'DOCUMENTATION-REVIEW-STATUS.md'
          ledger_lines = ledger.read_text(encoding='utf-8').splitlines()
          replacement_row = (
              '| `18-machine-learning-fundamentals` — Machine Learning Fundamentals | '
              '16/26 authoritative drafting | In progress | 2026-08-03 | '
              'Šestnásť authoritative kapitol je aktívnych. Blok 13–16 oddeľuje optimization trajectory od generalization a business acceptance; '
              'underfitting, overfitting, bias a variance od leakage, population shiftu a label noise; objective penalties, weight decay, stochastic '
              'regularization a early-stopping checkpoint semantics; a exact hyperparameter search-space, trial, budget, sampler, pruner, refit a '
              'independent-test generations. Incident `ML-PAY-86` prepája false convergence, nesprávny learning-rate/resume path, chybnú generalization '
              'diagnózu, prekrývajúce sa regularization controls a opakovane spotrebovanú validation evidence. Kapitoly 17–26 zostávajú plánované. '
              'Reálne training, HPO, pruning, refit, inference a business actions neboli vykonané. |'
          )
          found = False
          for index, line in enumerate(ledger_lines):
              if line.startswith('| `18-machine-learning-fundamentals`'):
                  ledger_lines[index] = replacement_row
                  found = True
                  break
          if not found:
              raise SystemExit('Section 18 ledger row not found')
          ledger.write_text('\n'.join(ledger_lines) + '\n', encoding='utf-8')

          print('Section 18 block 13-16 content gate passed and state prepared at 16/26.')
          PY
          python scripts/update_navigation.py --write
          python scripts/update_glossary.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_navigation.py --check
          python - <<'PY'
          from pathlib import Path
          audit = Path('DOCUMENTATION-AUDIT.md').read_text(encoding='utf-8')
          marker = '### `docs/18-machine-learning-fundamentals/'
          if marker in audit:
              blocks = audit.split('\n### `')
              focused = ['### `' + block for block in blocks[1:] if block.startswith('docs/18-machine-learning-fundamentals/')]
              print('\n\n'.join(focused))
              raise SystemExit('Section 18 still appears in the critical/high learning-depth queue')
          print('Section 18 has no critical/high learning-depth entry.')
          PY
          git diff --check
      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/18-machine-learning-fundamentals ROADMAP.md DOCUMENTATION-REVIEW-STATUS.md DOCUMENTATION-AUDIT.md documentation-audit.json GLOSSARY.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No synchronized documentation changes to commit."
            exit 0
          fi
          git commit -m "docs: activate ML fundamentals chapters 13-16"
          git push origin HEAD:agent/section-18-ml-fundamentals-block-13-16
