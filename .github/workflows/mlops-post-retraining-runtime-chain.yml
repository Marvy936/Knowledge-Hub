name: MLOps post-retraining runtime chain

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "labs/machine-learning/**"
      - "labs/mlops/**"
      - ".github/workflows/mlops-post-retraining-runtime-chain.yml"
  push:
    branches: [main]
    paths:
      - "labs/machine-learning/**"
      - "labs/mlops/**"
      - ".github/workflows/mlops-post-retraining-runtime-chain.yml"

permissions:
  contents: read

concurrency:
  group: mlops-post-retraining-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-chain:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      evidence_id: ${{ steps.evidence.outputs.evidence_id }}
      operation_id: ${{ steps.evidence.outputs.operation_id }}
      registry_version: ${{ steps.evidence.outputs.registry_version }}
      deployment_id: ${{ steps.evidence.outputs.deployment_id }}
      docker_image_id: ${{ steps.evidence.outputs.docker_image_id }}
      canary_routing_state_id: ${{ steps.evidence.outputs.canary_routing_state_id }}
      rollback_routing_state_id: ${{ steps.evidence.outputs.rollback_routing_state_id }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      PYTHONHASHSEED: "0"
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VENV_DIR: "${{ github.workspace }}/../knowledge-hub-post-retraining-venv"
      RUNTIME_DIR: "${{ github.workspace }}/../knowledge-hub-post-retraining-runtime"
      TRACKING_URI: "http://127.0.0.1:5057"
      EVIDENCE_DIR: "${{ github.workspace }}/../knowledge-hub-post-retraining-evidence"
      CHAIN_EVIDENCE: "${{ github.workspace }}/../knowledge-hub-post-retraining-evidence/chain.json"

    steps:
      - name: Checkout exact subject revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Verify Docker runtime
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info

      - name: Install isolated ML and MLOps runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VENV_DIR" "$RUNTIME_DIR" "$EVIDENCE_DIR"
          python -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/python" -m pip install \
            -e "labs/machine-learning" \
            -e "labs/mlops[dev,registry,serving]"
          mkdir -p "$EVIDENCE_DIR"

      - name: Run MLOps contract suite
        shell: bash
        env:
          PYTHONWARNINGS: error
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" -m pytest labs/mlops/tests -q

      - name: Build baseline Registry subjects
        shell: bash
        run: |
          set -euo pipefail
          bash labs/mlops/scripts/run_registry_gate.sh

      - name: Execute post-retraining runtime chain
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" labs/mlops/scripts/run_post_retraining_runtime_chain.py \
            --repo-root . \
            --runtime-dir "$RUNTIME_DIR" \
            --subject-sha "$SUBJECT_SHA" \
            --sample-request labs/machine-learning/data/sample-request.json \
            --tracking-uri "$TRACKING_URI" \
            --retraining-seed 20260805 \
            --service-name knowledge-hub-churn-api \
            --generation post-retraining-live-v1 \
            --canary-basis-points 2500 \
            --container-host 127.0.0.1 \
            --container-port 18082 \
            --output "$CHAIN_EVIDENCE"

      - name: Verify composed runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(Path(os.environ["CHAIN_EVIDENCE"]).read_text(encoding="utf-8"))
          assert evidence["subject_sha"] == os.environ["SUBJECT_SHA"]
          assert evidence["live_retraining"]["provider_stopped"] is True
          assert evidence["live_retraining"]["replay_status"] == "already_completed"
          assert evidence["container_runtime"]["input_mode"] == "explicit-subjects"
          assert evidence["container_runtime"]["release_source"] == "provided-release"
          assert evidence["container_runtime"]["container_uid"] == "10001"
          assert evidence["container_runtime"]["cleanup_verified"] is True
          assert evidence["container_runtime"]["invalid_request_status"] == 422
          assert evidence["container_runtime"]["wrong_image_digest_refused"] is True
          assert evidence["handoff"]["exact_live_tested_deployment_rebuilt"] is True
          assert evidence["handoff"]["canary_basis_points"] == 2500
          assert evidence["routing_probes"]["stable"]["selected_role"] == "stable"
          assert evidence["routing_probes"]["canary"]["selected_role"] == "canary"
          assert evidence["rollback"]["stale_subject_refused"] is True
          assert evidence["rollback"]["canary_deployment_id"] is None
          assert evidence["rollback"]["canary_basis_points"] == 0
          assert evidence["proof_boundary"]["new_container"] == "live-local-docker-http"
          assert evidence["proof_boundary"]["canary_traffic"] == "deterministic-routing-state-not-live-proxy"
          assert evidence["proof_boundary"]["remote_oci_registry_claimed"] is False
          assert evidence["proof_boundary"]["production_platform_claimed"] is False
          assert isinstance(evidence["evidence_id"], str) and len(evidence["evidence_id"]) == 64
          PY

      - name: Preserve component evidence before cleanup
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNTIME_DIR/post-retraining-runtime-chain/live-retraining-evidence.json" "$EVIDENCE_DIR/live-retraining.json"
          cp "$RUNTIME_DIR/post-retraining-runtime-chain/container-evidence.json" "$EVIDENCE_DIR/container-runtime.json"
          cp "$RUNTIME_DIR/post-retraining-runtime-chain/handoff.json" "$EVIDENCE_DIR/handoff.json"
          cp "$RUNTIME_DIR/post-retraining-runtime-chain/rollback-routing.json" "$EVIDENCE_DIR/rollback-routing.json"
          cp "$RUNTIME_DIR/container-runtime-deployment.json" "$EVIDENCE_DIR/live-tested-deployment.json"

      - name: Cleanup complete runtime and record outer evidence
        shell: bash
        run: |
          set -euo pipefail
          pkill -f "$VENV_DIR/bin/python.*-m mlflow server" 2>/dev/null || true
          docker ps -aq --filter "name=kh-mlops-runtime-" | xargs -r docker rm -f
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
            | awk '$1 ~ /^knowledge-hub-mlops-runtime:/ {print $2}' \
            | sort -u \
            | xargs -r docker image rm -f || true
          rm -rf "$RUNTIME_DIR" "$VENV_DIR"
          test ! -e "$RUNTIME_DIR"
          test ! -e "$VENV_DIR"
          test -z "$(docker ps -aq --filter 'name=kh-mlops-runtime-')"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_DIR"])
          chain_path = Path(os.environ["CHAIN_EVIDENCE"])
          chain = json.loads(chain_path.read_text(encoding="utf-8"))
          chain["workflow_cleanup_verified"] = True
          payload = {key: value for key, value in chain.items() if key != "evidence_id"}
          canonical = json.dumps(
              payload,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          chain["evidence_id"] = hashlib.sha256(canonical).hexdigest()
          chain_path.write_text(json.dumps(chain, sort_keys=True, indent=2) + "\n", encoding="utf-8")

          files = {}
          for path in sorted(root.glob("*.json")):
              if path.name == "artifact-manifest.json":
                  continue
              files[path.name] = {
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size_bytes": path.stat().st_size,
              }
          manifest_payload = {
              "schema_version": 1,
              "subject_sha": os.environ["SUBJECT_SHA"],
              "chain_evidence_id": chain["evidence_id"],
              "workflow_cleanup_verified": True,
              "files": files,
          }
          manifest_id = hashlib.sha256(
              json.dumps(
                  manifest_payload,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          (root / "artifact-manifest.json").write_text(
              json.dumps({**manifest_payload, "manifest_id": manifest_id}, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Collect final chain outputs
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          chain = json.loads(Path(os.environ["CHAIN_EVIDENCE"]).read_text(encoding="utf-8"))
          manifest = json.loads((Path(os.environ["EVIDENCE_DIR"]) / "artifact-manifest.json").read_text(encoding="utf-8"))
          assert chain["subject_sha"] == os.environ["SUBJECT_SHA"]
          assert chain["workflow_cleanup_verified"] is True
          assert manifest["subject_sha"] == os.environ["SUBJECT_SHA"]
          assert manifest["chain_evidence_id"] == chain["evidence_id"]
          assert manifest["workflow_cleanup_verified"] is True
          assert len(manifest["files"]) >= 6
          values = {
              "evidence_id": chain["evidence_id"],
              "operation_id": chain["live_retraining"]["operation_id"],
              "registry_version": chain["live_retraining"]["registry_version"],
              "deployment_id": chain["container_runtime"]["deployment_id"],
              "docker_image_id": chain["container_runtime"]["docker_image_id"],
              "canary_routing_state_id": chain["handoff"]["canary_routing_state_id"],
              "rollback_routing_state_id": chain["rollback"]["routing_state_id"],
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          print(json.dumps(values, sort_keys=True))
          PY

      - name: Upload canonical post-retraining chain evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mlops-post-retraining-chain-${{ env.SUBJECT_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Emergency cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          pkill -f "$VENV_DIR/bin/python.*-m mlflow server" 2>/dev/null || true
          docker ps -aq --filter "name=kh-mlops-runtime-" | xargs -r docker rm -f
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
            | awk '$1 ~ /^knowledge-hub-mlops-runtime:/ {print $2}' \
            | sort -u \
            | xargs -r docker image rm -f || true
          rm -rf "$RUNTIME_DIR" "$VENV_DIR"
          test ! -e "$RUNTIME_DIR"
          test ! -e "$VENV_DIR"

  publish-main-statuses:
    if: github.event_name == 'push' && always()
    needs: runtime-chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      RUNTIME_RESULT: ${{ needs.runtime-chain.result }}
      EVIDENCE_ID: ${{ needs.runtime-chain.outputs.evidence_id }}
      OPERATION_ID: ${{ needs.runtime-chain.outputs.operation_id }}
      REGISTRY_VERSION: ${{ needs.runtime-chain.outputs.registry_version }}
      DEPLOYMENT_ID: ${{ needs.runtime-chain.outputs.deployment_id }}
      DOCKER_IMAGE_ID: ${{ needs.runtime-chain.outputs.docker_image_id }}
      CANARY_STATE_ID: ${{ needs.runtime-chain.outputs.canary_routing_state_id }}
      ROLLBACK_STATE_ID: ${{ needs.runtime-chain.outputs.rollback_routing_state_id }}
      ARTIFACT_ID: ${{ needs.runtime-chain.outputs.artifact_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      SUBJECT_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Publish connector-readable post-retraining chain statuses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          success = os.environ["RUNTIME_RESULT"] == "success"
          statuses = [
              {
                  "context": "knowledge-hub/mlops-post-retraining-runtime-chain",
                  "state": "success" if success else "failure",
                  "description": (
                      "new Registry model, live container, canary subject and rollback chain passed"
                      if success
                      else "MLOps post-retraining runtime chain failed"
                  ),
              }
          ]
          if success:
              statuses.extend(
                  [
                      {
                          "context": "knowledge-hub/mlops-post-retraining-evidence",
                          "state": "success",
                          "description": f"evidence={os.environ['EVIDENCE_ID']}; artifact={os.environ['ARTIFACT_ID']}",
                      },
                      {
                          "context": "knowledge-hub/mlops-post-retraining-deployment",
                          "state": "success",
                          "description": f"deployment={os.environ['DEPLOYMENT_ID']}; image={os.environ['DOCKER_IMAGE_ID']}",
                      },
                      {
                          "context": "knowledge-hub/mlops-post-retraining-routing",
                          "state": "success",
                          "description": f"canary={os.environ['CANARY_STATE_ID']}; rollback={os.environ['ROLLBACK_STATE_ID']}",
                      },
                      {
                          "context": "knowledge-hub/mlops-post-retraining-model",
                          "state": "success",
                          "description": f"operation={os.environ['OPERATION_ID']}; version={os.environ['REGISTRY_VERSION']}",
                      },
                  ]
              )

          url = (
              "https://api.github.com/repos/"
              + os.environ["REPOSITORY"]
              + "/statuses/"
              + os.environ["SUBJECT_SHA"]
          )
          for status in statuses:
              request = urllib.request.Request(
                  url,
                  data=json.dumps(
                      {
                          **status,
                          "description": status["description"][:140],
                          "target_url": os.environ["RUN_URL"],
                      }
                  ).encode("utf-8"),
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Content-Type": "application/json",
                      "User-Agent": "knowledge-hub-mlops-post-retraining-chain",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  if response.status != 201:
                      raise SystemExit(f"Unexpected status API response: {response.status}")
          PY
