name: Section 18 ML block 01-04

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/section_18_block_01_04.py
      - .github/workflows/section-18-block-01-04.yml
      - docs/18-machine-learning-fundamentals/**

permissions:
  contents: write

concurrency:
  group: section-18-ml-block-01-04
  cancel-in-progress: true

jobs:
  validate-and-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-18-ml-fundamentals-block-01-04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run strict ML block gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/section_18_block_01_04.py
          python scripts/update_navigation.py --write
          python scripts/update_glossary.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_navigation.py --check
          python - <<'PY'
          from pathlib import Path
          audit = Path('DOCUMENTATION-AUDIT.md').read_text(encoding='utf-8')
          marker = '### `docs/18-machine-learning-fundamentals/'
          if marker in audit:
              blocks = audit.split('\n### `')
              focused = [
                  '### `' + block
                  for block in blocks[1:]
                  if block.startswith('docs/18-machine-learning-fundamentals/')
              ]
              print('\n\n'.join(focused))
              raise SystemExit('Section 18 still appears in the critical/high learning-depth queue')
          print('Section 18 has no critical/high learning-depth queue entry.')
          PY
          git diff --check
      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/18-machine-learning-fundamentals ROADMAP.md DOCUMENTATION-REVIEW-STATUS.md DOCUMENTATION-AUDIT.md documentation-audit.json GLOSSARY.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No synchronized documentation changes to commit."
            exit 0
          fi
          git commit -m "docs: activate ML fundamentals chapters 01-04"
          git push origin HEAD:agent/section-18-ml-fundamentals-block-01-04
