              "helm-chart-template-values-release.md": r'''
## Praktický slice: od `values.yaml` po konkrétny Deployment

Nasledujúci minimálny slice ukazuje celý prechod od chart metadata cez values až po vyrenderovaný Kubernetes objekt. Nie je to pseudokód: rovnaké súbory možno uložiť do malého chartu a spustiť cez `helm lint` a `helm template`.

`Chart.yaml` vytvorí package identitu:

```yaml
apiVersion: v2
name: atlas-payments
version: 0.2.0
appVersion: "1.5.0"
type: application
```

`values.yaml` vytvorí configuration contract. Image je viazaný digestom, takže release subject neodkazuje iba na mutable tag:

```yaml
replicaCount: 2
image:
  repository: ghcr.io/example/atlas-payments
  digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
containerPort: 8080
config:
  logLevel: info
```

Template `templates/deployment.yaml` číta values a vytvára konkrétny Deployment:

```gotemplate
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: payments-api
          image: "{{ .Values.image.repository }}@{{ required "image.digest je povinný" .Values.image.digest }}"
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
```

Najprv vykonaj statickú kontrolu a potom vyrenderuj iba tento template:

```bash
helm lint ./atlas-payments

helm template payments-dev ./atlas-payments \
  --namespace payments-dev \
  --show-only templates/deployment.yaml \
  > /tmp/payments-deployment.yaml
```

Výstup musí obsahovať `replicas: 2`, image s exact digestom a `LOG_LEVEL` ako string. Overenie cez `yq` je presnejšie než vizuálne prezeranie veľkého manifestu:

```bash
yq '{replicas: .spec.replicas,
     image: .spec.template.spec.containers[0].image,
     logLevel: .spec.template.spec.containers[0].env[0].value}' \
  /tmp/payments-deployment.yaml
```

Očakávaný tvar je:

```yaml
replicas: 2
image: ghcr.io/example/atlas-payments@sha256:2222222222222222222222222222222222222222222222222222222222222222
logLevel: info
```

Tento výsledok preukazuje chart loading, values merge a lokálny render. Nepreukazuje Kubernetes API compatibility, admission, image pull, rollout ani business funkčnosť. Ďalší boundary preto testuje server-side dry-run:

```bash
kubectl apply --server-side --dry-run=server \
  -f /tmp/payments-deployment.yaml
```

Až tento príkaz zapojí aktuálne API discovery, schema, admission a oprávnenia volajúcej identity. Ani on však nespustí Deployment controller. Celý install, runtime a business journey je rozpracovaný v kapitole [Praktický Helm chart od prázdneho adresára po overený release](helm-chart-practical-walkthrough.md).

''',
              "template-functions-pipelines.md": r'''
## Executable lab: boolean `false`, `required`, pipeline a `toYaml`

Najčastejšie template chyby nevznikajú na zložitej syntaxi, ale na nesprávnej interpretácii typu. V tomto labe má explicitné `false` znamenať vypnutú legacy funkcionalitu a nesmie byť nahradené defaultom.

Do `values.yaml` vlož:

```yaml
config:
  logLevel: info
  legacyAuthorizerEnabled: false
resources:
  requests:
    cpu: 100m
    memory: 128Mi
```

Template používa `required` pre povinný string, `ternary` pre explicitný boolean a `toYaml | nindent` pre vnorenú mapu:

```gotemplate
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          env:
            - name: LOG_LEVEL
              value: {{ required "config.logLevel je povinné" .Values.config.logLevel | quote }}
            - name: LEGACY_AUTHORIZER_ENABLED
              value: {{ ternary "true" "false" .Values.config.legacyAuthorizerEnabled | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
```

Render vykonaj s explicitným override-om `false`:

```bash
helm template payments-dev ./atlas-payments \
  --set config.legacyAuthorizerEnabled=false \
  --show-only templates/deployment.yaml \
  > /tmp/functions.yaml

yq '.spec.template.spec.containers[0].env[]
    | select(.name == "LEGACY_AUTHORIZER_ENABLED")
    | .value' /tmp/functions.yaml
```

Očakávaný výstup je string `false`. Ak template použije chybný výraz:

```gotemplate
value: {{ .Values.config.legacyAuthorizerEnabled | default true | quote }}
```

rovnaký test vráti `true`, pretože Sprig považuje boolean `false` za empty hodnotu pre potreby `default`. Helm syntax aj YAML môžu zostať úplne validné; zlyhá významový contract.

Povinnú hodnotu otestuj jej odstránením:

```bash
helm template payments-dev ./atlas-payments \
  --set config.logLevel=null \
  --show-only templates/deployment.yaml
```

Render má skončiť chybou s textom `config.logLevel je povinné`. Tento negatívny test dokazuje, že `required` guard je zapojený. Nedokazuje, že povolená hodnota `info` je kompatibilná s konkrétnou application verziou; to patrí do runtime testu.

Pipeline čítaj zľava doprava ako transformáciu hodnoty. Pri `toYaml .Values.resources | nindent 12` sa mapa najprv serializuje na YAML a potom sa každý riadok vloží pod `resources:` s dvanásťmi medzerami. Ak sa `nindent` vynechá alebo má nesprávnu hodnotu, výsledkom môže byť syntakticky neplatný manifest alebo field na nesprávnej úrovni.

''',
              "named-templates.md": r'''
## Executable lab: helper s explicitným contextom

Named template je globálne pomenovaný program. Pri väčšom charte je bezpečnejšie odovzdať mu presný context než predpokladať, že bodka vždy reprezentuje root chart object.

V `templates/_helpers.tpl` definuj chart-prefixed helper:

```gotemplate
{{- define "atlas-payments.componentLabels" -}}
app.kubernetes.io/name: {{ include "atlas-payments.name" .root }}
app.kubernetes.io/instance: {{ .root.Release.Name }}
app.kubernetes.io/component: {{ .component | quote }}
{{- end -}}
```

V Deploymente ho zavolaj cez `include` a `dict`:

```gotemplate
metadata:
  labels:
    {{- include "atlas-payments.componentLabels"
        (dict "root" $ "component" "api")
        | nindent 4 }}
```

Znak `$` zachová root context aj vtedy, keď sa call nachádza vo vnútri `with` alebo `range`. `dict` robí vstupy helpera viditeľné: helper dostane root a component, nie nejasnú bodku s meniacim sa významom.

Vyrenderuj iba Deployment a pozri labels:

```bash
helm template payments-dev ./atlas-payments \
  --show-only templates/deployment.yaml \
  | yq '.metadata.labels'
```

Očakávaný output obsahuje stabilné release a component labels:

```yaml
app.kubernetes.io/name: atlas-payments
app.kubernetes.io/instance: payments-dev
app.kubernetes.io/component: api
```

`include` vracia text, takže ho možno ďalej poslať do pipeline a odsadiť cez `nindent`. Ak sa namiesto neho použije action `template`, output nemožno rovnakým spôsobom pipeline-nuť. To je praktický dôvod, prečo sa `include` často používa pri YAML fragments.

Negatívny test zámerne zavolá helper bez `root`:

```gotemplate
{{ include "atlas-payments.componentLabels" (dict "component" "api") }}
```

Render má zlyhať pri prístupe k `.root.Release.Name`. Takýto failure je vhodnejší než tiché vyrenderovanie labels z nesprávneho contextu. Production helper možno ešte posilniť explicitným `required` guardom alebo predaním menšej typed mapy namiesto celého root objectu.

''',
              "chart-dependencies.md": r'''
## Executable lab: `Chart.yaml`, `Chart.lock`, `update` a reprodukovateľný `build`

Dependency declaration je range alebo exact-version intent. Reprodukovateľný build vznikne až vtedy, keď reviewnutý `Chart.lock` a packaged dependency archives zodpovedajú tomuto intentu.

Parent `Chart.yaml` môže obsahovať interný library chart:

```yaml
apiVersion: v2
name: atlas-payments
version: 0.3.0
dependencies:
  - name: atlas-library
    version: 1.6.3
    repository: oci://registry.example.com/helm
  - name: redis
    version: 2.4.1
    repository: oci://registry.example.com/helm
    condition: redis.enabled
```

Values explicitne rozhodnú, či optional runtime dependency patrí do renderu:

```yaml
redis:
  enabled: false
```

Pri vedomom dependency upgrade-e použi:

```bash
helm dependency update ./atlas-payments
helm dependency list ./atlas-payments
git diff -- atlas-payments/Chart.lock
```

`update` resolve-ne dependencies podľa `Chart.yaml`, stiahne packages do `charts/` a môže zmeniť `Chart.lock`. Preto patrí do samostatnej reviewnutej dependency-change operácie, nie do každého production build-u.

V bežnom CI build-e odstráň lokálny cache adresár a obnov ho z locku:

```bash
rm -rf atlas-payments/charts
helm dependency build ./atlas-payments
sha256sum atlas-payments/charts/*.tgz
```

`build` používa existujúci `Chart.lock`; nemá potichu vyberať novšie compatible versions. Po príkaze musí platiť:

```bash
git diff --exit-code -- atlas-payments/Chart.lock
```

Ak sa lock zmenil, build nebol čistou materializáciou schváleného dependency graphu. Samotný nezmenený lock však stále nepreukazuje provenance alebo dôveryhodnosť stiahnutého package-u. CI má navyše uchovať digesty package archives, registry identity a prípadné signature/provenance verification podľa supply-chain contractu.

Optional dependency test vykonaj dvakrát:

```bash
helm template payments-dev ./atlas-payments \
  --set redis.enabled=false > /tmp/without-redis.yaml

helm template payments-dev ./atlas-payments \
  --set redis.enabled=true > /tmp/with-redis.yaml

grep -n 'kind: StatefulSet' /tmp/without-redis.yaml || true
grep -n 'kind: StatefulSet' /tmp/with-redis.yaml
```

Prvý render nesmie obsahovať Redis workload; druhý ho má obsahovať. Tento test preukazuje condition wiring v renderi. Nepreukazuje, že subchart je runtime kompatibilný s parent application, že storage class existuje alebo že upgrade zachová dáta.

''',
              "hooks.md": r'''
## Executable lab: idempotentný `pre-upgrade` migration Job

Hook Job nesmie používať samotnú Helm revision ako jediný idempotency key, pretože retry alebo rollback vytvára ďalšie release transitions. Operation identity má reprezentovať business schema transition, napríklad `payments-schema-s13`.

Values definujú immutable operation subject:

```yaml
migration:
  operationId: payments-schema-s13
  image: ghcr.io/example/atlas-migrations@sha256:3333333333333333333333333333333333333333333333333333333333333333
```

Template `templates/hooks/schema-migrate.yaml`:

```gotemplate
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "atlas-payments.fullname" . }}-schema-migrate
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ required "migration.image je povinný" .Values.migration.image | quote }}
          args:
            - migrate
            - --operation-id
            - {{ required "migration.operationId je povinné" .Values.migration.operationId | quote }}
            - --target-schema
            - S13
```

Migration binary musí v databáze atomicky vytvoriť alebo načítať operation ledger row podľa `operationId`. Prvý attempt vykoná transition `S12 → S13`; ďalší attempt s rovnakým ID overí už dokončený výsledok a skončí bez druhého side effectu.

Pred upgrade-om vyrenderuj iba hook:

```bash
helm template payments-prod ./atlas-payments \
  -f values-prod.yaml \
  --show-only templates/hooks/schema-migrate.yaml
```

Upgrade spusti s explicitným operation ID:

```bash
helm upgrade payments-prod ./atlas-payments \
  -n payments \
  -f values-prod.yaml \
  --set migration.operationId=payments-schema-s13 \
  --wait \
  --timeout 10m
```

Počas incidentu nezisťuj hook iba cez `helm status`. Získaj rendered hook, Job state a log:

```bash
helm get hooks payments-prod -n payments
kubectl get job -n payments -l app.kubernetes.io/instance=payments-prod -o wide
kubectl logs -n payments job/payments-prod-atlas-payments-schema-migrate
```

Ak databáza ukazuje committed `payments-schema-s13`, ale Helm timeoutoval pred successful verdictom, slepý rollback ani nový operation ID nie sú bezpečné. Controlled retry s rovnakým ID musí skončiť ako no-op verification. Hook delete policy upratuje Kubernetes Job resource; nevracia databázový side effect.

Negatívny test spustí migration image s rovnakým operation ID druhýkrát v test databáze. Počet ledger rows aj schema transition musí zostať jeden. Bez tohto second-operation testu je „Job success“ iba first-run evidence.

''',
              "upgrade-rollback.md": r'''
## Executable release transition: render diff, upgrade, history a rollback verdict

Pred mutation treba materializovať current aj candidate generation. Najprv exportuj values a manifest aktuálneho release-u:

```bash
helm get values payments-prod -n payments --all \
  > /tmp/payments-current-values.yaml

helm get manifest payments-prod -n payments \
  > /tmp/payments-current-manifest.yaml
```

Candidate vyrenderuj z presného chart source-u a production values:

```bash
helm template payments-prod ./atlas-payments \
  -n payments \
  -f values-prod.yaml \
  > /tmp/payments-candidate-manifest.yaml

diff -u /tmp/payments-current-manifest.yaml \
        /tmp/payments-candidate-manifest.yaml || true
```

Textový diff nie je semantic Kubernetes diff, ale odhalí image, selectors, environment, hook a policy changes, ktoré by inak zostali skryté v jednom `helm upgrade` príkaze. Candidate následne pošli na server-side admission bez uloženia:

```bash
kubectl apply --server-side --dry-run=server \
  -f /tmp/payments-candidate-manifest.yaml
```

Bounded upgrade:

```bash
helm upgrade --install payments-prod ./atlas-payments \
  -n payments \
  -f values-prod.yaml \
  --atomic \
  --wait \
  --timeout 10m \
  --history-max 20
```

`--wait` sleduje vybrané Kubernetes readiness conditions. `--atomic` po neúspechu požiada Helm o návrat na predchádzajúci release state. Ani jeden flag nevracia database migration, event publication alebo external provider call.

Po upgrade-e prepoj Helm revision s live a business state-om:

```bash
helm history payments-prod -n payments
helm status payments-prod -n payments
kubectl rollout status deployment/payments-prod-atlas-payments \
  -n payments --timeout=5m
kubectl get pods -n payments \
  -l app.kubernetes.io/instance=payments-prod \
  -o custom-columns=NAME:.metadata.name,IMAGE:.spec.containers[0].image,READY:.status.containerStatuses[0].ready
helm test payments-prod -n payments --logs
```

Ak candidate vytvoril nekompatibilný event alebo irreversible schema transition, technický rollback nemusí byť business-compatible. Pred rollbackom preto zodpovedz, či old image dokáže čítať current schema, spracovať nový event backlog a používať current credentials.

Keď je rollback oprávnený, vyber exact revision z histórie:

```bash
helm history payments-prod -n payments
helm rollback payments-prod 19 \
  -n payments \
  --wait \
  --timeout 10m
```

Rollback vytvorí ďalšiu release revision; nevymaže historickú transition. Po ňom zopakuj rollout, `helm test`, loaded-configuration a business validation. Forbidden test musí preukázať, že nový event alebo schema state nespôsobí silent corruption v old consumerovi. Ak to preukázať nemožno, authoritative recovery je tolerantný roll-forward alebo restore/compensation, nie slepý rollback.

''',
              "helm-testing-troubleshooting.md": r'''
## Practical gate: od lint-u po runtime failure, ktorý readiness neodhalí

Jedna zelená kontrola je slabý dôkaz. Praktický gate používa rovnaký chart artifact v niekoľkých vrstvách a na každej presne pomenuje, čo bolo overené.

```bash
helm lint ./atlas-payments

helm template payments-dev ./atlas-payments \
  -n payments-dev \
  > /tmp/payments.yaml

kubectl apply --server-side --dry-run=server \
  -f /tmp/payments.yaml

helm upgrade --install payments-dev ./atlas-payments \
  -n payments-dev \
  --create-namespace \
  --wait \
  --timeout 5m

kubectl rollout status deployment/payments-dev-atlas-payments \
  -n payments-dev --timeout=3m

helm test payments-dev -n payments-dev --logs
```

`lint` kontroluje chart conventions a časť template problémov. `template` materializuje effective values. Server dry-run zapája API a admission. Upgrade vytvára release a controllers. Rollout status overuje Deployment readiness. Až Helm test alebo samostatný business canary overí cestu cez Service k aplikácii.

Dobrý fault injection je chybný Service `targetPort`. Nasadiť ho možno bez zmeny Pod template-u:

```bash
helm upgrade payments-dev ./atlas-payments \
  -n payments-dev \
  --reuse-values \
  --set service.targetPort=9999 \
  --wait \
  --timeout 3m
```

Helm upgrade a Deployment rollout môžu zostať zelené, pretože Pods sú ready a Service resource nemá vlastnú application readiness. Helm test, ktorý volá Service, má zlyhať. Diagnostika potom sleduje request path, nie náhodný restart:

```bash
helm test payments-dev -n payments-dev --logs

kubectl get service payments-dev-atlas-payments \
  -n payments-dev -o yaml

kubectl get endpointslice -n payments-dev \
  -l kubernetes.io/service-name=payments-dev-atlas-payments \
  -o yaml

kubectl get pods -n payments-dev \
  -l app.kubernetes.io/instance=payments-dev \
  -o custom-columns=NAME:.metadata.name,POD_IP:.status.podIP,PORT:.spec.containers[0].ports[0].containerPort

kubectl run service-probe \
  -n payments-dev \
  --image=busybox:1.36 \
  --restart=Never \
  --rm -i \
  -- wget -S -O- http://payments-dev-atlas-payments
```

Service YAML ukáže effective `targetPort: 9999`; EndpointSlice preukáže, že selector našiel Pod IPs, nie že na cieľovom porte niečo počúva. Pod output ukáže reálny container port. Probe cez Service lokalizuje failure medzi Service port mappingom a process listenerom.

Recovery vráti approved port a zopakuje rovnaký gate:

```bash
helm upgrade payments-dev ./atlas-payments \
  -n payments-dev \
  --reuse-values \
  --set service.targetPort=8080 \
  --wait \
  --timeout 3m

helm test payments-dev -n payments-dev --logs
```

Second-operation test je dôležitý: zopakovaný upgrade s rovnakými values nesmie vytvoriť nový ReplicaSet, hook side effect ani configuration drift. Over ho cez `helm history`, ReplicaSet inventory a business request. Tým sa troubleshooting uzatvára stabilitou, nie iba jedným úspešným retryom.

''',
