on:
  push:
    branches:
      - agent/section-10-practical-helm-examples
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-section-10-practical-completion
  cancel-in-progress: false

jobs:
  complete-practical-examples:
    runs-on: self-hosted
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/section-10-practical-helm-examples
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Insert focused executable examples
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path("docs/10-helm-and-cka")
          marker = "## Glossary impact"

