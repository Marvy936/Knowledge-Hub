name: Temporary Section 21 block 45-48 closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "docs/21-ai-agents-and-intelligent-automation/**"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "DOCUMENTATION-REVIEW-STATUS.md"
      - "DOCUMENTATION-AUDIT.md"
      - "documentation-audit.json"
      - ".github/workflows/temporary-section-21-block-45-48-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-section-21-block-45-48-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-21-ai-agents-block-45-48

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize section and run learning-depth closeout
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          readme = Path("docs/21-ai-agents-and-intelligent-automation/README.md")
          replace_once(
              readme,
              "44. [MCP connectors a external tools](mcp-connectors-external-tools.md)\n\n## Plánované authoritative poradie",
              "44. [MCP connectors a external tools](mcp-connectors-external-tools.md)\n"
              "45. [AI-assisted pipeline creation a failure analysis](ai-assisted-pipeline-creation-failure-analysis.md)\n"
              "46. [Agentický code review, testing a remediation](agentic-code-review-testing-remediation.md)\n"
              "47. [GitOps a release agents](gitops-release-agents.md)\n"
              "48. [Incident triage a evidence collection](incident-triage-evidence-collection.md)\n\n"
              "## Plánované authoritative poradie",
          )
          for planned in (
              "45. AI-assisted pipeline creation a failure analysis\n",
              "46. Agentický code review, testing a remediation\n",
              "47. GitOps a release agents\n",
              "48. Incident triage a evidence collection\n",
          ):
              replace_once(readme, planned, "")

          text = readme.read_text(encoding="utf-8")
          marker = "## Stav\n\n"
          if text.count(marker) != 1:
              raise SystemExit("README: expected one status marker")
          prefix, _ = text.split(marker, 1)
          status = (
              "Aktuálny authoritative stav sekcie je **48/62 · In progress**. Dvanásty authoritative blok aktivuje kapitoly 45–48 a incident `AGENT-DELIVERY-12`. Pipeline kapitola oddeľuje natural-language intent, AI proposal, schema/policy/semantic validation, accepted diff, execution generation, artifact identity a business verification a chápe Error Analyzer ako hypothesis generator, nie RCA authority. Code review kapitola viaže exact PR SHA, agent image/instructions, findings, remediation branch, test integrity, independent checks, human approval a post-merge outcome. GitOps kapitola pinne source a manifest commit, artifact digest, render, policy, ownership, sync plan, health a business canary a oddeľuje `Synced`, `Healthy` a user outcome. Incident kapitola zavádza evidence classes, completeness, chain of custody, competing hypotheses, read-only diagnostics, approvals, idempotent runbooks a technical aj business reconciliation. Reálne agent runs, code changes, releases, GitOps syncy, incident remediations ani business outcomes neboli vykonané. Sekcia zostáva `In progress`, nie runtime `Verified`, production `Stable` ani user `Accepted`. Ďalší blok sú kapitoly 49–52: policy generation/validation, human approval/audit/rollback, vendor lock-in/portability a workflow engine oproti agent frameworku.\n"
          )
          readme.write_text(prefix + marker + status, encoding="utf-8", newline="\n")

          roadmap = Path("ROADMAP.md")
          roadmap_updates = {
              "- [ ] AI-assisted pipeline creation a failure analysis": "- [x] [AI-assisted pipeline creation a failure analysis](docs/21-ai-agents-and-intelligent-automation/ai-assisted-pipeline-creation-failure-analysis.md)",
              "- [ ] Agentický code review, testing a remediation": "- [x] [Agentický code review, testing a remediation](docs/21-ai-agents-and-intelligent-automation/agentic-code-review-testing-remediation.md)",
              "- [ ] GitOps a release agents": "- [x] [GitOps a release agents](docs/21-ai-agents-and-intelligent-automation/gitops-release-agents.md)",
              "- [ ] Incident triage a evidence collection": "- [x] [Incident triage a evidence collection](docs/21-ai-agents-and-intelligent-automation/incident-triage-evidence-collection.md)",
          }
          for old, new in roadmap_updates.items():
              replace_once(roadmap, old, new)

          review = Path("DOCUMENTATION-REVIEW-STATUS.md")
          lines = review.read_text(encoding="utf-8").splitlines()
          row_prefix = "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation |"
          matches = [index for index, line in enumerate(lines) if line.startswith(row_prefix)]
          if len(matches) != 1:
              raise SystemExit(f"Review status: expected one Section 21 row, found {len(matches)}")
          lines[matches[0]] = (
              "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation | 48/62 authoritative drafting | In progress | 2026-08-05 | "
              "Dvanásty authoritative blok aktivuje kapitoly 45–48 a incident `AGENT-DELIVERY-12`. Pipeline kapitola viaže intent, account/org/project scope, proposal/model/rule generation, schema/policy/semantic validation, expressions a path coverage, accepted YAML diff, exact execution, artifact digest, deployment verification a competing failure hypotheses. Agentický code review oddeľuje review, test-generation a AutoFix roles, pinne base/head SHA, instructions a runner, chráni test fixtures a assertions, vyžaduje independent checks, required approvals a post-merge verification. GitOps/release kapitola viaže Git desired state, rendered state, live state, artifact provenance, ownership, sync waves/options, health, business gates, drift a Git-based recovery. Incident kapitola indexuje configuration/execution/telemetry/provider/business evidence, completeness, timestamps, chain of custody, hypotheses, approved containment, idempotency, runbooks a technical aj business reconciliation. Reálne pipeline executions, agent PR, releases, syncy, incident actions, recovery drilly a business outcomes neboli vykonané; stav zostáva `In progress`, nie runtime `Verified`, production `Stable` ani user `Accepted`. |"
          )
          review.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          python - <<'PY'
          from pathlib import Path

          audit = Path("DOCUMENTATION-AUDIT.md").read_text(encoding="utf-8")
          files = [
              "ai-assisted-pipeline-creation-failure-analysis.md",
              "agentic-code-review-testing-remediation.md",
              "gitops-release-agents.md",
              "incident-triage-evidence-collection.md",
          ]
          remaining = [
              name
              for name in files
              if f"### `docs/21-ai-agents-and-intelligent-automation/{name}`" in audit
          ]
          if remaining:
              raise SystemExit(f"Section 21 block 45-48 critical/high findings remain: {remaining}")
          print("Section 21 block 45-48 has no critical/high audit entries.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ROADMAP.md \
            GLOSSARY.md \
            DOCUMENTATION-REVIEW-STATUS.md \
            DOCUMENTATION-AUDIT.md \
            documentation-audit.json \
            docs/21-ai-agents-and-intelligent-automation

          if git diff --cached --quiet; then
            echo "No closeout changes required."
            exit 0
          fi

          git commit -m "docs: synchronize agentic delivery block closeout"
          git push origin HEAD:agent/section-21-ai-agents-block-45-48
