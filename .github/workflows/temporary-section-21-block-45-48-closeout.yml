name: Temporary Section 21 block 45-48 closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "docs/21-ai-agents-and-intelligent-automation/**"
      - ".github/workflows/temporary-section-21-block-45-48-closeout.yml"

permissions:
  contents: read

concurrency:
  group: temporary-section-21-block-45-48-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose-learning-depth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-21-ai-agents-block-45-48

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Print exact critical and high findings
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_learning_depth.py --all-docs
          python - <<'PY'
          from pathlib import Path

          audit = Path("DOCUMENTATION-AUDIT.md").read_text(encoding="utf-8")
          paths = [
              "docs/21-ai-agents-and-intelligent-automation/ai-assisted-pipeline-creation-failure-analysis.md",
              "docs/21-ai-agents-and-intelligent-automation/agentic-code-review-testing-remediation.md",
              "docs/21-ai-agents-and-intelligent-automation/gitops-release-agents.md",
              "docs/21-ai-agents-and-intelligent-automation/incident-triage-evidence-collection.md",
          ]

          remaining = []
          for path in paths:
              heading = f"### `{path}`"
              start = audit.find(heading)
              if start == -1:
                  print(f"\nNO CRITICAL/HIGH FINDINGS: {path}")
                  continue
              remaining.append(path)
              end = audit.find("\n### `", start + len(heading))
              if end == -1:
                  end = len(audit)
              print("\n" + "=" * 100)
              print(audit[start:end].rstrip())
              print("=" * 100)

          if remaining:
              raise SystemExit(
                  "Section 21 block 45-48 critical/high findings remain: "
                  + ", ".join(remaining)
              )
          print("Section 21 block 45-48 has no critical/high audit entries.")
          PY
