name: Temporary Section 21 block 45-48 closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "docs/21-ai-agents-and-intelligent-automation/**"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "DOCUMENTATION-REVIEW-STATUS.md"
      - "DOCUMENTATION-AUDIT.md"
      - "documentation-audit.json"
      - ".github/workflows/temporary-section-21-block-45-48-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-section-21-block-45-48-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-21-ai-agents-block-45-48

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply targeted remediation and close out block
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          root = Path("docs/21-ai-agents-and-intelligent-automation")

          pipeline = root / "ai-assisted-pipeline-creation-failure-analysis.md"
          replace_once(
              pipeline,
              "Primárne zdroje:\n\n- https://developer.harness.io/3k-docs/ai/devops-agent/\n- https://developer.harness.io/docs/continuous-integration/troubleshoot-ci/ai/\n- https://developer.harness.io/docs/platform/pipelines/failure-handling/define-a-failure-strategy-on-stages-and-steps/\n- https://developer.harness.io/docs/continuous-delivery/manage-deployments/deployment-logs-and-limitations/\n- https://developer.harness.io/docs/continuous-delivery/verify/continuous-verification-faqs/",
              "Autoritatívny opis generovania a editácie pipeline resource, schema validation, Error Analyzer a explicitného `Accept` poskytuje Harness DevOps Agent documentation na https://developer.harness.io/3k-docs/ai/devops-agent/. CI troubleshooting semantics a AI-assisted diagnosis rozširuje https://developer.harness.io/docs/continuous-integration/troubleshoot-ci/ai/.\n\nFailure-strategy authority vrátane step a stage scope je na https://developer.harness.io/docs/platform/pipelines/failure-handling/define-a-failure-strategy-on-stages-and-steps/. Prevádzkové hranice log completeness a truncation dokumentuje https://developer.harness.io/docs/continuous-delivery/manage-deployments/deployment-logs-and-limitations/, zatiaľ čo verification a no-data semantics sú popísané na https://developer.harness.io/docs/continuous-delivery/verify/continuous-verification-faqs/. Každý zdroj podporuje inú boundary kapitoly; žiadny samostatne nepreukazuje end-to-end business outcome.",
          )

          review = root / "agentic-code-review-testing-remediation.md"
          replace_once(
              review,
              "## 33. Practical review envelope\n\n```yaml",
              "## 33. Practical review envelope\n\nPractical review envelope je machine-readable väzba medzi exact pull-request subjectom, agent generation, findingmi, remediation commitom a nezávislými merge gates. Jeho účelom nie je reprodukovať celý chat, ale zabrániť tomu, aby sa review comment, patch a approval neskôr zamieňali za rovnakú authority.\n\nNasledujúci record ukazuje minimálny evidence contract. Pole `agent_review_is_merge_approval` zostáva explicitne false, pretože úspešný agent run ani review comment nenahrádza protected-branch decision.\n\n```yaml",
          )
          replace_once(
              review,
              "Primárne zdroje:\n\n- https://developer.harness.io/3k-docs/platform/getting-started/agents/code-quality/\n- https://developer.harness.io/docs/code-repository/pull-requests/ai-agents/\n- https://developer.harness.io/docs/security-testing-orchestration/remediations/ai-based-remediations/\n- https://docs.github.com/en/copilot/concepts/agents/code-review\n- https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/review-copilot-output\n- https://docs.github.com/en/copilot/how-tos/copilot-on-github/set-up-copilot/configure-runners",
              "Harness Code Quality Agent documentation na https://developer.harness.io/3k-docs/platform/getting-started/agents/code-quality/ je authority pre Code Review, Code Coverage a AutoFix execution model. Pull-request integration a agent behavior dopĺňa https://developer.harness.io/docs/code-repository/pull-requests/ai-agents/, kým explicitné limity AI security remediation uvádza https://developer.harness.io/docs/security-testing-orchestration/remediations/ai-based-remediations/.\n\nGitHub semantics Copilot code review, vrátane toho, že ide o comment review a nie required merge approval, sú popísané na https://docs.github.com/en/copilot/concepts/agents/code-review. Povinnosť dôkladne overovať agent-authored output dokumentuje https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/review-copilot-output a supported runner boundary opisuje https://docs.github.com/en/copilot/how-tos/copilot-on-github/set-up-copilot/configure-runners. Tieto zdroje spolu podporujú proposal, runner a approval hranice, nie produkčnú správnosť konkrétneho patchu.",
          )

          gitops = root / "gitops-release-agents.md"
          replace_once(
              gitops,
              "## 32. Practical release manifest\n\n```yaml",
              "## 32. Practical release manifest\n\nRelease manifest je composed identity release candidate-u: viaže source a manifest commit, immutable artifact, controller application generation a požadované verification gates. Bez tejto väzby sa `Synced`, image tag alebo pipeline execution nedajú spätne priradiť k jednému authoritative release subjectu.\n\nNasledujúci príklad je deklarovaný release intent pred vykonaním. Neobsahuje tvrdenie `verified`; tento stav môže vzniknúť až po controller read-backu, resource health a business canary v konkrétnom environment-e.\n\n```yaml",
          )
          replace_once(
              gitops,
              "Primárne zdroje:\n\n- https://developer.harness.io/docs/continuous-delivery/gitops/get-started/gitops-architecture/\n- https://developer.harness.io/docs/continuous-delivery/gitops/gitops-entities/agents/install-a-harness-git-ops-agent/\n- https://argo-cd.readthedocs.io/en/stable/operator-manual/architecture/\n- https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/\n- https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/\n- https://argo-cd.readthedocs.io/en/stable/user-guide/commands/argocd_app_sync/\n- https://fluxcd.io/flux/components/kustomize/kustomizations/",
              "Harness control-plane a in-cluster GitOps Agent boundary je popísaná na https://developer.harness.io/docs/continuous-delivery/gitops/get-started/gitops-architecture/ a installation, connectivity a scoped-agent requirements na https://developer.harness.io/docs/continuous-delivery/gitops/gitops-entities/agents/install-a-harness-git-ops-agent/.\n\nArgo CD component authority a continuous desired/live comparison dokumentuje https://argo-cd.readthedocs.io/en/stable/operator-manual/architecture/. Automated sync a rollback constraints sú na https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/, destructive a ownership-sensitive options na https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/ a explicitný sync/preview surface na https://argo-cd.readthedocs.io/en/stable/user-guide/commands/argocd_app_sync/. Flux reconciliation, suspension a Ready conditions poskytujú porovnávací primary model na https://fluxcd.io/flux/components/kustomize/kustomizations/. Zdrojové statusy podporujú controller semantics, nie automatický business outcome.",
          )

          incident = root / "incident-triage-evidence-collection.md"
          replace_once(
              incident,
              "## 35. Practical evidence index\n\n```yaml",
              "## 35. Practical evidence index\n\nEvidence index je append-only mapa medzi incident subjectom, evidence cutoffom, source artifacts, completeness limits, hypotheses a resolution states. Udržiava rozdiel medzi technical mitigation a business reconciliation a umožňuje druhému responderovi reprodukovať záver bez spoliehania sa na modelový summary text.\n\nNasledujúci príklad zámerne ponecháva `business_verified: false`, hoci technical verification prešla. Tým demonštruje, že incident nesmie byť uzavretý iba na základe zlepšených infra metrík alebo úspešného runbooku.\n\n```yaml",
          )
          replace_once(
              incident,
              "Primárne zdroje:\n\n- https://developer.harness.io/docs/ai-sre/users/manage-incidents/\n- https://developer.harness.io/docs/ai-sre/users/manage-incidents/acknowledge-and-triage/\n- https://developer.harness.io/docs/ai-sre/incidents/\n- https://developer.harness.io/docs/continuous-delivery/verify/continuous-verification-faqs/\n- https://developer.harness.io/docs/continuous-delivery/verify/cv-results/apm-logs/\n- https://developer.harness.io/docs/continuous-delivery/manage-deployments/deployment-logs-and-limitations/\n- https://opentelemetry.io/docs/specs/otel/logs/",
              "Harness incident lifecycle, ownership, timelines, runbooks, actions a review je popísaný na https://developer.harness.io/docs/ai-sre/users/manage-incidents/. Acknowledge a triage semantics, vrátane review generated fields a impact assessment, rozvíja https://developer.harness.io/docs/ai-sre/users/manage-incidents/acknowledge-and-triage/, zatiaľ čo širší AI SRE incident model poskytuje https://developer.harness.io/docs/ai-sre/incidents/.\n\nVerification, no-data a evidence limits sú oddelené v https://developer.harness.io/docs/continuous-delivery/verify/continuous-verification-faqs/ a log-analysis results na https://developer.harness.io/docs/continuous-delivery/verify/cv-results/apm-logs/. Truncation a deployment-log hranice dokumentuje https://developer.harness.io/docs/continuous-delivery/manage-deployments/deployment-logs-and-limitations/. OpenTelemetry authority pre log/trace correlation cez trace, span a resource context je https://opentelemetry.io/docs/specs/otel/logs/. Tieto sources definujú evidence mechanisms; incident root cause a business recovery musia vzniknúť z konkrétneho incident bundle-u.",
          )

          readme = root / "README.md"
          replace_once(
              readme,
              "44. [MCP connectors a external tools](mcp-connectors-external-tools.md)\n\n## Plánované authoritative poradie",
              "44. [MCP connectors a external tools](mcp-connectors-external-tools.md)\n"
              "45. [AI-assisted pipeline creation a failure analysis](ai-assisted-pipeline-creation-failure-analysis.md)\n"
              "46. [Agentický code review, testing a remediation](agentic-code-review-testing-remediation.md)\n"
              "47. [GitOps a release agents](gitops-release-agents.md)\n"
              "48. [Incident triage a evidence collection](incident-triage-evidence-collection.md)\n\n"
              "## Plánované authoritative poradie",
          )
          for planned in (
              "45. AI-assisted pipeline creation a failure analysis\n",
              "46. Agentický code review, testing a remediation\n",
              "47. GitOps a release agents\n",
              "48. Incident triage a evidence collection\n",
          ):
              replace_once(readme, planned, "")

          text = readme.read_text(encoding="utf-8")
          marker = "## Stav\n\n"
          if text.count(marker) != 1:
              raise SystemExit("README: expected one status marker")
          prefix, _ = text.split(marker, 1)
          status = (
              "Aktuálny authoritative stav sekcie je **48/62 · In progress**. Dvanásty authoritative blok aktivuje kapitoly 45–48 a incident `AGENT-DELIVERY-12`. Pipeline kapitola oddeľuje intent, proposal, schema/policy/semantic validation, accepted diff, exact execution, artifact identity a business verification a chápe Error Analyzer ako hypothesis generator. Code review kapitola viaže exact PR SHA, agent generation, test integrity, independent checks, protected approval a post-merge outcome. GitOps kapitola oddeľuje Git desired state, render, live state, `Synced`, `Healthy` a user outcome a pinne artifact provenance, ownership, sync plan a recovery. Incident kapitola zavádza evidence classes, completeness, chain of custody, competing hypotheses, read-only diagnostics, approved containment, idempotent runbooks a technical aj business reconciliation. Reálne agent runs, code changes, releases, GitOps syncy, incident remediations ani business outcomes neboli vykonané. Sekcia zostáva `In progress`, nie runtime `Verified`, production `Stable` ani user `Accepted`. Ďalší blok sú kapitoly 49–52: policy generation/validation, human approval/audit/rollback, vendor lock-in/portability a workflow engine oproti agent frameworku.\n"
          )
          readme.write_text(prefix + marker + status, encoding="utf-8", newline="\n")

          roadmap = Path("ROADMAP.md")
          roadmap_updates = {
              "- [ ] AI-assisted pipeline creation a failure analysis": "- [x] [AI-assisted pipeline creation a failure analysis](docs/21-ai-agents-and-intelligent-automation/ai-assisted-pipeline-creation-failure-analysis.md)",
              "- [ ] Agentický code review, testing a remediation": "- [x] [Agentický code review, testing a remediation](docs/21-ai-agents-and-intelligent-automation/agentic-code-review-testing-remediation.md)",
              "- [ ] GitOps a release agents": "- [x] [GitOps a release agents](docs/21-ai-agents-and-intelligent-automation/gitops-release-agents.md)",
              "- [ ] Incident triage a evidence collection": "- [x] [Incident triage a evidence collection](docs/21-ai-agents-and-intelligent-automation/incident-triage-evidence-collection.md)",
          }
          for old, new in roadmap_updates.items():
              replace_once(roadmap, old, new)

          ledger = Path("DOCUMENTATION-REVIEW-STATUS.md")
          lines = ledger.read_text(encoding="utf-8").splitlines()
          row_prefix = "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation |"
          matches = [index for index, line in enumerate(lines) if line.startswith(row_prefix)]
          if len(matches) != 1:
              raise SystemExit(f"Review status: expected one Section 21 row, found {len(matches)}")
          lines[matches[0]] = (
              "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation | 48/62 authoritative drafting | In progress | 2026-08-05 | "
              "Dvanásty authoritative blok aktivuje kapitoly 45–48 a incident `AGENT-DELIVERY-12`. Pipeline kapitola viaže intent, proposal/model/rule generation, schema/policy/semantic validation, path coverage, accepted YAML diff, exact execution, artifact digest, verification a competing hypotheses. Agentický code review oddeľuje review, test generation a AutoFix, pinne base/head SHA, instructions a runner, chráni fixtures/assertions a vyžaduje independent checks, approvals a post-merge proof. GitOps/release kapitola viaže desired, rendered a live state, artifact provenance, ownership, sync options/waves, health, business gates, drift a Git recovery. Incident kapitola indexuje configuration/execution/telemetry/provider/business evidence, completeness, chain of custody, hypotheses, approved containment, idempotency, runbooks a technical aj business reconciliation. Reálne executions, agent PR, releases, syncy, incident actions, recovery drilly a business outcomes neboli vykonané; stav zostáva `In progress`, nie runtime `Verified`, production `Stable` ani user `Accepted`. |"
          )
          ledger.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          python - <<'PY'
          from pathlib import Path

          audit = Path("DOCUMENTATION-AUDIT.md").read_text(encoding="utf-8")
          files = [
              "ai-assisted-pipeline-creation-failure-analysis.md",
              "agentic-code-review-testing-remediation.md",
              "gitops-release-agents.md",
              "incident-triage-evidence-collection.md",
          ]
          remaining = [
              name for name in files
              if f"### `docs/21-ai-agents-and-intelligent-automation/{name}`" in audit
          ]
          if remaining:
              for name in remaining:
                  heading = f"### `docs/21-ai-agents-and-intelligent-automation/{name}`"
                  start = audit.find(heading)
                  end = audit.find("\n### `", start + len(heading))
                  print(audit[start:end if end != -1 else len(audit)])
              raise SystemExit(f"Section 21 block 45-48 critical/high findings remain: {remaining}")
          print("Section 21 block 45-48 has no critical/high audit entries.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ROADMAP.md \
            GLOSSARY.md \
            DOCUMENTATION-REVIEW-STATUS.md \
            DOCUMENTATION-AUDIT.md \
            documentation-audit.json \
            docs/21-ai-agents-and-intelligent-automation
          git commit -m "docs: remediate and synchronize agentic delivery block"
          git push origin HEAD:agent/section-21-ai-agents-block-45-48
