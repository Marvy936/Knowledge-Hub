name: Temporary Section 21 block 41-44 closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "docs/21-ai-agents-and-intelligent-automation/**"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "DOCUMENTATION-REVIEW-STATUS.md"
      - "DOCUMENTATION-AUDIT.md"
      - "documentation-audit.json"
      - ".github/temporary-section-21-block-41-44.tar.gz.b64"
      - ".github/workflows/temporary-section-21-block-41-44-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-section-21-block-41-44-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-21-ai-agents-block-41-44

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize chapters and run learning-depth closeout
        shell: bash
        run: |
          set -euo pipefail

          base64 --decode .github/temporary-section-21-block-41-44.tar.gz.b64 \
            | tar -xz -C docs/21-ai-agents-and-intelligent-automation
          rm .github/temporary-section-21-block-41-44.tar.gz.b64

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          readme = Path("docs/21-ai-agents-and-intelligent-automation/README.md")
          replace_once(
              readme,
              "40. [Production hardening a troubleshooting](production-hardening-troubleshooting.md)\n\n## Plánované authoritative poradie",
              "40. [Production hardening a troubleshooting](production-hardening-troubleshooting.md)\n"
              "41. [Harness AI platform overview](harness-ai-platform-overview.md)\n"
              "42. [DevOps Agent pre pipeline a resource operations](devops-agent-pipeline-resource-operations.md)\n"
              "43. [Worker Agents v pipelines](worker-agents-pipelines.md)\n"
              "44. [MCP connectors a external tools](mcp-connectors-external-tools.md)\n\n"
              "## Plánované authoritative poradie",
          )
          for planned in (
              "41. Harness AI platform overview\n",
              "42. DevOps Agent pre pipeline a resource operations\n",
              "43. Worker Agents v pipelines\n",
              "44. MCP connectors a external tools\n",
          ):
              replace_once(readme, planned, "")

          text = readme.read_text(encoding="utf-8")
          marker = "## Stav\n\n"
          if text.count(marker) != 1:
              raise SystemExit("README: expected one status marker")
          prefix, _ = text.split(marker, 1)
          status = (
              "Aktuálny authoritative stav sekcie je **44/62 · In progress**. Jedenásty authoritative blok aktivuje kapitoly 41–44 a incident `AGENT-HARNESS-11`. Platform overview oddeľuje Harness UI, IDE/MCP a pipeline-agent surfaces a viaže account/org/project scope, RBAC, AI Rules, policies, privacy route, connectors, audit a business read-back. DevOps Agent kapitola chápe AI output ako bounded proposal nad exact resource generation, oddeľuje guidance Rules od OPA enforcementu a vyžaduje semantic diff, informed Accept, authorized save a effective-state proof. Worker Agents kapitola pinne immutable catalog definition, image, instructions, model, MCP set, typed inputs/outputs a scoped token a zavádza deterministic downstream gates, idempotency, reconciliation a kill switch. MCP kapitola používa current protocol `2025-11-25`, oddeľuje host/client/server, negotiated capabilities, tools/resources/prompts, OAuth audience a token boundaries, consent, schema drift a custom-server trust. Reálne Harness AI conversations, resource writes, Worker Agent executions, MCP calls, approvals, provider mutations, incident recovery ani business outcomes neboli vykonané. Sekcia zostáva `In progress`, nie runtime `Verified`, production `Stable` ani user `Accepted`. Ďalší blok sú kapitoly 45–48: AI-assisted pipeline creation/failure analysis, agentický code review/testing/remediation, GitOps/release agents a incident triage/evidence collection.\n"
          )
          readme.write_text(prefix + marker + status, encoding="utf-8", newline="\n")

          roadmap = Path("ROADMAP.md")
          roadmap_updates = {
              "- [ ] Harness AI platform overview": "- [x] [Harness AI platform overview](docs/21-ai-agents-and-intelligent-automation/harness-ai-platform-overview.md)",
              "- [ ] DevOps Agent pre pipeline a resource operations": "- [x] [DevOps Agent pre pipeline a resource operations](docs/21-ai-agents-and-intelligent-automation/devops-agent-pipeline-resource-operations.md)",
              "- [ ] Worker Agents v pipelines": "- [x] [Worker Agents v pipelines](docs/21-ai-agents-and-intelligent-automation/worker-agents-pipelines.md)",
              "- [ ] MCP connectors a external tools": "- [x] [MCP connectors a external tools](docs/21-ai-agents-and-intelligent-automation/mcp-connectors-external-tools.md)",
          }
          for old, new in roadmap_updates.items():
              replace_once(roadmap, old, new)

          review = Path("DOCUMENTATION-REVIEW-STATUS.md")
          lines = review.read_text(encoding="utf-8").splitlines()
          row_prefix = "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation |"
          matches = [index for index, line in enumerate(lines) if line.startswith(row_prefix)]
          if len(matches) != 1:
              raise SystemExit(f"Review status: expected one Section 21 row, found {len(matches)}")
          lines[matches[0]] = (
              "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation | 44/62 authoritative drafting | In progress | 2026-08-05 | "
              "Jedenásty authoritative blok aktivuje kapitoly 41–44 a incident `AGENT-HARNESS-11`. Platform kapitola rozkladá Harness AI na UI, IDE/MCP a pipeline surfaces, pinne exact account/org/project/resource a model/connector/policy generations a zachováva RBAC, privacy, audit a outcome boundaries. DevOps Agent kapitola oddeľuje conversational proposal, AI Rules, schema validation, OPA enforcement, immutable Accept, authorized mutation, Git-backed state a effective provider read-back. Worker Agent kapitola viaže versioned catalog YAML, image digest, instructions, expressions, typed inputs/outputs, model/MCP connectors, scoped tokens, trigger identity, budgets, deterministic gates, retries, reconciliation a canary. MCP kapitola používa current `2025-11-25` baseline, vysvetľuje lifecycle/version negotiation, tools/resources/prompts, sampling/roots/elicitation, HTTP OAuth audience a resource indicators, zákaz token passthrough, capability/schema snapshots, consent, prompt injection, confused deputy a custom-server recovery. Reálne Harness AI calls, resource changes, agents, MCP sessions, approvals, recovery a business outcomes neboli vykonané; stav zostáva `In progress`, nie runtime `Verified`, production `Stable` ani user `Accepted`. |"
          )
          review.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          python - <<'PY'
          from pathlib import Path

          audit = Path("DOCUMENTATION-AUDIT.md").read_text(encoding="utf-8")
          files = [
              "harness-ai-platform-overview.md",
              "devops-agent-pipeline-resource-operations.md",
              "worker-agents-pipelines.md",
              "mcp-connectors-external-tools.md",
          ]
          remaining = [
              name
              for name in files
              if f"### `docs/21-ai-agents-and-intelligent-automation/{name}`" in audit
          ]
          if remaining:
              raise SystemExit(f"Section 21 block 41-44 critical/high findings remain: {remaining}")
          print("Section 21 block 41-44 has no critical/high audit entries.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            ROADMAP.md \
            GLOSSARY.md \
            DOCUMENTATION-REVIEW-STATUS.md \
            DOCUMENTATION-AUDIT.md \
            documentation-audit.json \
            docs/21-ai-agents-and-intelligent-automation \
            .github/temporary-section-21-block-41-44.tar.gz.b64

          if git diff --cached --quiet; then
            echo "No closeout changes required."
            exit 0
          fi

          git commit -m "docs: synchronize Harness AI and MCP block closeout"
          git push origin HEAD:agent/section-21-ai-agents-block-41-44
