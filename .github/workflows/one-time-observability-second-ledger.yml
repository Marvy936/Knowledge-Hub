name: One-time second Observability ledger update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-observability-second-ledger.yml"

permissions:
  contents: write

jobs:
  update-ledger:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Observability ledger and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="${GITHUB_REF_NAME}"
          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin "$branch"
            git reset --hard "origin/${branch}"

            python - <<'PY'
          from pathlib import Path

          path = Path("DOCUMENTATION-REVIEW-STATUS.md")
          text = path.read_text(encoding="utf-8")

          old_status = "| `12-observability` — Observability | 4/16 strict revalidation | In progress | 2026-07-29 |"
          new_status = "| `12-observability` — Observability | 8/16 strict revalidation | In progress | 2026-07-29 |"

          old_suffix = "Zostáva 12 kapitol a finálny section-level pass. |"
          new_suffix = "Druhý authoritative blok bol kompletne prepísaný: `USE method` používa `user/business symptóm → exact service/operation/cohort → component path → complete resource inventory → exact resource subject a enforcement boundary → effective capacity/limit generation → utilization/saturation/error observations → competing resource hypotheses → discriminating evidence → containment/recovery → user, forbidden a adjacent-cohort validation`; `Golden Signals` používajú `business capability a caller outcome → exact workflow/population → latency boundary/distribution → logical traffic unit → business error population → saturation resource/effective capacity → SLI/error-budget verdict → dependency/USE localization → recovery validation`; `Prometheus` používa `measurement intent → metric contract → expected target/discovery → target relabeling → scrape → exposition/sample validation → metric relabeling → post-relabel sample set → WAL/TSDB/staleness → PromQL → recording a alerting rule state → Alertmanager delivery → local/remote read-back validation`; `Alertmanager` používa `firing/resolved alert state → complete alert identity → fan-out všetkým replicas → route tree → group/timing → silence/mute/inhibition verdict → receiver/template → notification attempt/unknown outcome → external incident a resolved closure`. Worked failures pokrývajú per-task provider pool s deklarovanými 64, ale loaded limitom 8 pri 32 workers, ktorý vytvoril 180–420 waiters a 2.7 s acquire p95 pri CPU 37 %; štyri green Golden-Signal panely založené na handler latency, attempt trafficu, HTTP 5xx a CPU namiesto final settlement outcome-u; broad Prometheus `metric_relabel` regex, ktorý pri `up=1` dropol authoritative pool metrics pred TSDB a vytvoril false no-data v rules aj remote write; a staging `ProviderMaintenance` alert, ktorý inhiboval production page v inom Regione, pretože `equal` obsahoval iba `service`. Každá kapitola používa exact resource/Golden-Signal/Prometheus/notification subject, competing hypotheses, discriminating evidence, evidence-preserving containment, authoritative recovery a original aj forbidden outcome. Navigation chain `RED method → USE method → Golden Signals → Prometheus → Alertmanager → Grafana` bol zachovaný. Nový `glossary/12b-observability-resource-golden-prometheus-alert-lifecycles.md` pridal effective-resource, user-outcome/capacity, sample-to-rule a alert-to-notification terminology; generated `GLOSSARY.md` je synchronizovaný a audit-failure artifacts sú prázdne. Aktuálne official Prometheus facts boli overené: native histograms sú stable od Prometheus 3.8.0 a Prometheus má pre Alertmanager HA posielať alerts všetkým replicas priamo, nie cez load balancer. Zostáva 8 kapitol a finálny section-level pass. |"

          if old_status not in text:
              raise SystemExit("Expected 4/16 Observability ledger status was not found.")
          if old_suffix not in text:
              raise SystemExit("Expected first Observability ledger suffix was not found.")

          text = text.replace(old_status, new_status, 1)
          text = text.replace(old_suffix, new_suffix, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

            git rm .github/workflows/one-time-observability-second-ledger.yml
            git add DOCUMENTATION-REVIEW-STATUS.md
            git commit -m "docs(review): record second Observability strict revalidation block"

            if git push origin "HEAD:${branch}"; then
              exit 0
            fi

            echo "::warning::Remote ${branch} changed during ledger update attempt ${attempt}; retrying."
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Unable to push second Observability ledger update after ${max_attempts} attempts."
              exit 1
            fi
          done
