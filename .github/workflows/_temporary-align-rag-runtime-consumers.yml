name: Temporary align RAG runtime consumers

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  align:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/actions-runner-context'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/actions-runner-context
          persist-credentials: true
          fetch-depth: 1

      - name: Align root release-candidate RAG verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/run_practical_v1_release_candidate.py')
          text = path.read_text(encoding='utf-8')
          old = '''    expected_slices = [\n        "direct_prompt_injection",\n        "retrieved_context_prompt_injection",\n    ]\n    if evaluation.get("required_security_slices") != expected_slices:\n        raise ReleaseCandidateError("RAG hard security slice inventory mismatch")\n'''
          new = '''    security_cases = evaluation.get("security_cases")\n    if not isinstance(security_cases, list):\n        raise ReleaseCandidateError("RAG security case evidence is missing")\n    direct_cases = [\n        item\n        for item in security_cases\n        if isinstance(item, dict)\n        and item.get("case_id") == "security-direct-injection"\n        and item.get("attack_type") == "direct"\n    ]\n    if len(direct_cases) != 1 or direct_cases[0].get("case_passed") is not True:\n        raise ReleaseCandidateError("RAG direct prompt-injection runtime case did not pass")\n    if boundary.get("direct_prompt_injection_eval") != "executed":\n        raise ReleaseCandidateError("RAG direct prompt-injection proof boundary mismatch")\n    if (\n        boundary.get("retrieved_context_prompt_injection_eval")\n        != "not-present-in-current-runtime-case-set"\n    ):\n        raise ReleaseCandidateError("RAG retrieved-context injection proof boundary is ambiguous")\n'''
          if old not in text:
              raise SystemExit('stale RAG security verifier block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Create corrected RAG workflow blob
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          path = Path('.github/workflows/rag-clean-checkout-runtime.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '          assert len(evidence["artifacts"]) == 7\n',
              '          assert len(evidence["artifacts"]) == 14\n',
              1,
          )
          old = '''          assert lifecycle["evaluation"]["required_security_slices"] == [\n              "direct_prompt_injection",\n              "retrieved_context_prompt_injection",\n          ]\n'''
          new = '''          assert "security-direct-injection" in lifecycle["evaluation"]["security_case_ids"]\n          assert lifecycle["evaluation"]["retrieved_context_attack_case_present"] is False\n          assert evidence["proof_boundary"]["direct_prompt_injection_eval"] == "executed"\n          assert evidence["proof_boundary"]["retrieved_context_prompt_injection_eval"] == "not-present-in-current-runtime-case-set"\n'''
          if old not in text:
              raise SystemExit('stale RAG workflow security assertion block not found')
          text = text.replace(old, new, 1)
          if 'len(evidence["artifacts"]) == 14' not in text:
              raise SystemExit('RAG artifact count update missing')
          body = json.dumps({
              'content': base64.b64encode(text.encode('utf-8')).decode('ascii'),
              'encoding': 'base64',
          }).encode('utf-8')
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/blobs",
              data=body,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Content-Type': 'application/json',
                  'User-Agent': 'knowledge-hub-rag-consumer-aligner',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
          print('RAG_WORKFLOW_BLOB=' + result['sha'])
          PY

      - name: Commit root verifier correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_practical_v1_release_candidate.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(release): align RAG runtime evidence verifier'
          git push origin HEAD:fix/actions-runner-context
