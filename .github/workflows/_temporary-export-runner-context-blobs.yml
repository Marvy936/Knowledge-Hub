name: Temporary export runner-context blobs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/actions-runner-context'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/actions-runner-context
          persist-credentials: false
          fetch-depth: 1

      - name: Create transformed Git blobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          paths = [
              '.github/workflows/mlops-post-retraining-runtime-chain.yml',
              '.github/workflows/practical-v1-core.yml',
              '.github/workflows/practical-v1-release-candidate.yml',
              '.github/workflows/practical-v1-release-evidence.yml',
          ]
          needle = '$' + '{{ runner.temp }}/'
          replacement = '$' + '{{ github.workspace }}/../'
          mapping = {}

          for name in paths:
              path = Path(name)
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              output = []
              changed = 0
              for line in lines:
                  if line.startswith('      ') and not line.startswith('       ') and needle in line:
                      line = line.replace(needle, replacement)
                      changed += 1
                  output.append(line)
              content = ''.join(output)
              if needle in ''.join(
                  line for line in content.splitlines(True)
                  if line.startswith('      ') and not line.startswith('       ')
              ):
                  raise SystemExit(f'job-level runner.temp remains in {name}')
              if changed < 1:
                  raise SystemExit(f'expected at least one replacement in {name}')

              body = json.dumps({
                  'content': base64.b64encode(content.encode('utf-8')).decode('ascii'),
                  'encoding': 'base64',
              }).encode('utf-8')
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/blobs",
                  data=body,
                  method='POST',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Content-Type': 'application/json',
                      'User-Agent': 'knowledge-hub-runner-context-export',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  result = json.load(response)
              mapping[name] = {'blob_sha': result['sha'], 'replacements': changed}

          print('BLOB_MAPPING=' + json.dumps(mapping, sort_keys=True))
          PY
