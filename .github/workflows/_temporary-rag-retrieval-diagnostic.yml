name: Temporary RAG retrieval diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/actions-runner-context'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install RAG package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -e 'labs/llm-rag[dev]'

      - name: Diagnose exact retrieval cases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from knowledge_hub_rag.contracts import build_corpus_snapshot, build_chunk_manifest
          from knowledge_hub_rag.retrieval import build_retrieval_index, retrieve
          from knowledge_hub_rag.runtime_config import build_runtime_config
          from knowledge_hub_rag.evaluation import run_eval_case

          root = Path('.').resolve()
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          snapshot = build_corpus_snapshot(repo_root=root, source_revision=sha)
          manifest = build_chunk_manifest(repo_root=root, snapshot=snapshot)
          index = build_retrieval_index(manifest)
          config = build_runtime_config(generation='diagnostic-v1', implementation_revision=sha)
          cases = json.loads(Path('labs/llm-rag/data/eval-cases.json').read_text(encoding='utf-8'))
          wanted = {'retrieval-error-budget', 'retrieval-kubernetes-configmap'}
          print(json.dumps({
              'file_count': snapshot['file_count'],
              'chunk_count': manifest['chunk_count'],
              'document_count': index['document_count'],
              'top_k': config['retrieval']['top_k'],
              'min_score': config['retrieval']['min_score'],
          }, sort_keys=True))
          for case in cases:
              if case['case_id'] not in wanted:
                  continue
              retrieval = retrieve(
                  index=index,
                  manifest=manifest,
                  query=case['query'],
                  top_k=20,
                  min_score=config['retrieval']['min_score'],
              )
              normal = retrieve(
                  index=index,
                  manifest=manifest,
                  query=case['query'],
                  top_k=config['retrieval']['top_k'],
                  min_score=config['retrieval']['min_score'],
              )
              result = run_eval_case(case=case, manifest=manifest, index=index, runtime_config=config)
              print('CASE=' + case['case_id'])
              print('EXPECTED=' + json.dumps(case['expected_source_paths'], sort_keys=True))
              print('TOP20=' + json.dumps([
                  {
                      'rank': hit['rank'],
                      'score': hit['score'],
                      'source_path': hit['citation']['source_path'],
                      'heading_path': hit['citation']['heading_path'],
                      'content_prefix': hit['content'][:180],
                  }
                  for hit in retrieval['hits']
              ], ensure_ascii=False, sort_keys=True))
              print('NORMAL=' + json.dumps([
                  {
                      'rank': hit['rank'],
                      'score': hit['score'],
                      'source_path': hit['citation']['source_path'],
                      'heading_path': hit['citation']['heading_path'],
                  }
                  for hit in normal['hits']
              ], ensure_ascii=False, sort_keys=True))
              print('EVAL=' + json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY
