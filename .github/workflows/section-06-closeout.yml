name: Section 06 closeout

on:
  push:
    branches:
      - agent/section-06-explanation-depth
    paths:
      - scripts/section_06_closeout.py
      - .github/workflows/section-06-closeout.yml

permissions:
  contents: write

concurrency:
  group: section-06-closeout
  cancel-in-progress: true

jobs:
  closeout:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/section-06-explanation-depth
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply closeout and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/section_06_closeout.py
          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/06-gitlab DOCUMENTATION-REVIEW-STATUS.md DOCUMENTATION-AUDIT.md documentation-audit.json GLOSSARY.md ROADMAP.md
          git diff --cached --check
          git commit -m "docs: close section 06 explanation depth"
          git push origin HEAD:agent/section-06-explanation-depth
