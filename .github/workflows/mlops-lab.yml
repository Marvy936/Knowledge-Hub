name: MLOps flagship lab

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "labs/mlops/**"
  push:
    branches:
      - main
    paths:
      - "labs/mlops/**"
      - ".github/workflows/mlops-lab.yml"

permissions:
  contents: read

concurrency:
  group: mlops-flagship-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    outputs:
      candidate_id: ${{ steps.evidence.outputs.candidate_id }}
      release_id: ${{ steps.evidence.outputs.release_id }}
      dataset_sha256: ${{ steps.evidence.outputs.dataset_sha256 }}
      model_sha256: ${{ steps.evidence.outputs.model_sha256 }}
      evaluation_sha256: ${{ steps.evidence.outputs.evaluation_sha256 }}
      registry_evidence_id: ${{ steps.evidence.outputs.registry_evidence_id }}
      registry_version: ${{ steps.evidence.outputs.registry_version }}
      registry_artifact_sha256: ${{ steps.evidence.outputs.registry_artifact_sha256 }}
      training_manifest_sha256: ${{ steps.evidence.outputs.training_manifest_sha256 }}
      mlflow_version: ${{ steps.evidence.outputs.mlflow_version }}
      python_version: ${{ steps.evidence.outputs.python_version }}
    env:
      PYTHONHASHSEED: "0"
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FOUNDATION_DIR: "${{ github.workspace }}/../knowledge-hub-mlops-foundation"
      REGISTRY_RUNTIME_DIR: "${{ github.workspace }}/../knowledge-hub-mlops-registry"
      VENV_DIR: "${{ github.workspace }}/../knowledge-hub-mlops-venv"
      TRACKING_URI: "http://127.0.0.1:5057"

    steps:
      - name: Checkout exact subject revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Detect Registry source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f labs/mlops/src/mlops_lab/registry.py && -f labs/mlops/scripts/run_registry_gate.sh ]]; then
            echo "registry_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "registry_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            labs/mlops/pyproject.toml
            labs/machine-learning/pyproject.toml

      - name: Install isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VENV_DIR" "$FOUNDATION_DIR" "$REGISTRY_RUNTIME_DIR"
          python -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          if [[ "${{ steps.source.outputs.registry_present }}" == "true" ]]; then
            "$VENV_DIR/bin/python" -m pip install \
              -e "labs/machine-learning" \
              -e "labs/mlops[dev,registry]"
          else
            "$VENV_DIR/bin/python" -m pip install -e "labs/mlops[dev]"
          fi

      - name: Run MLOps contract suite
        shell: bash
        env:
          PYTHONWARNINGS: error
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" -m pytest labs/mlops/tests -q

      - name: Execute foundation lifecycle and refusal path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FOUNDATION_DIR"
          printf 'id,label\n1,0\n2,1\n' > "$FOUNDATION_DIR/dataset.csv"
          printf 'model-bytes\n' > "$FOUNDATION_DIR/model.bin"

          "$VENV_DIR/bin/python" -m mlops_lab snapshot \
            --dataset "$FOUNDATION_DIR/dataset.csv" \
            --output "$FOUNDATION_DIR/dataset-manifest.json" \
            --dataset-name ci-churn \
            --generation ci-v1

          "$VENV_DIR/bin/python" -m mlops_lab candidate \
            --dataset-manifest "$FOUNDATION_DIR/dataset-manifest.json" \
            --model "$FOUNDATION_DIR/model.bin" \
            --evaluation labs/mlops/data/sample-evaluation.json \
            --source-revision "$SUBJECT_SHA" \
            --output "$FOUNDATION_DIR/candidate.json"

          "$VENV_DIR/bin/python" -m mlops_lab promote \
            --candidate "$FOUNDATION_DIR/candidate.json" \
            --alias-state "$FOUNDATION_DIR/aliases.json" \
            --alias champion \
            --expected-current none \
            --release-output "$FOUNDATION_DIR/release.json"

          if "$VENV_DIR/bin/python" -m mlops_lab promote \
            --candidate "$FOUNDATION_DIR/candidate.json" \
            --alias-state "$FOUNDATION_DIR/aliases.json" \
            --alias champion \
            --expected-current none \
            --release-output "$FOUNDATION_DIR/stale-release.json"; then
            echo "::error::Stale promotion unexpectedly succeeded."
            exit 1
          fi
          test ! -e "$FOUNDATION_DIR/stale-release.json"

      - name: Execute unified Registry lifecycle
        if: steps.source.outputs.registry_present == 'true'
        shell: bash
        env:
          RUNTIME_DIR: ${{ env.REGISTRY_RUNTIME_DIR }}
        run: |
          set -euo pipefail
          bash labs/mlops/scripts/run_registry_gate.sh

      - name: Collect bounded MLOps evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from pathlib import Path

          foundation = Path(os.environ["FOUNDATION_DIR"])
          dataset = json.loads((foundation / "dataset-manifest.json").read_text(encoding="utf-8"))
          candidate = json.loads((foundation / "candidate.json").read_text(encoding="utf-8"))
          release = json.loads((foundation / "release.json").read_text(encoding="utf-8"))
          aliases = json.loads((foundation / "aliases.json").read_text(encoding="utf-8"))
          assert candidate["source_revision"] == os.environ["SUBJECT_SHA"]
          assert release["source_revision"] == os.environ["SUBJECT_SHA"]
          assert release["candidate_id"] == candidate["candidate_id"]
          assert release["dataset_sha256"] == dataset["subject"]["sha256"]
          assert aliases["aliases"]["champion"] == candidate["candidate_id"]
          assert not (foundation / "stale-release.json").exists()

          values = {
              "candidate_id": candidate["candidate_id"],
              "release_id": release["release_id"],
              "dataset_sha256": release["dataset_sha256"],
              "model_sha256": release["model_sha256"],
              "evaluation_sha256": release["evaluation_sha256"],
              "registry_evidence_id": "",
              "registry_version": "",
              "registry_artifact_sha256": "",
              "training_manifest_sha256": "",
              "mlflow_version": "",
              "python_version": platform.python_version(),
          }

          registry_runtime = Path(os.environ["REGISTRY_RUNTIME_DIR"])
          registry_path = registry_runtime / "registry-evidence.json"
          if registry_path.exists():
              registry = json.loads(registry_path.read_text(encoding="utf-8"))
              manifest_path = registry_runtime / "ml" / "artifact" / "manifest.json"
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              registry_candidate = json.loads(
                  (registry_runtime / "ml" / "candidate.json").read_text(encoding="utf-8")
              )
              assert manifest["source_revision"] == os.environ["SUBJECT_SHA"]
              assert registry["candidate_id"] == registry_candidate["candidate_id"]
              assert registry["artifact_readback"]["downloaded_sha256"] == manifest["model_sha256"]
              assert registry["artifact_readback"]["passed"] is True
              assert registry["parity"]["passed"] is True
              values.update(
                  {
                      "registry_evidence_id": registry["registry_evidence_id"],
                      "registry_version": registry["registry"]["version"],
                      "registry_artifact_sha256": registry["artifact_readback"]["downloaded_sha256"],
                      "training_manifest_sha256": hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
                      "mlflow_version": registry["runtime"]["mlflow_version"],
                  }
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          print(json.dumps(values, sort_keys=True))
          PY

      - name: Cleanup isolated runtime
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          pkill -f "$VENV_DIR/bin/mlflow server" 2>/dev/null || true
          rm -rf "$FOUNDATION_DIR" "$REGISTRY_RUNTIME_DIR" "$VENV_DIR"
          test ! -e "$FOUNDATION_DIR"
          test ! -e "$REGISTRY_RUNTIME_DIR"
          test ! -e "$VENV_DIR"

  publish-main-statuses:
    if: github.event_name == 'push' && always()
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      RUNTIME_RESULT: ${{ needs.contract-tests.result }}
      CANDIDATE_ID: ${{ needs.contract-tests.outputs.candidate_id }}
      RELEASE_ID: ${{ needs.contract-tests.outputs.release_id }}
      REGISTRY_EVIDENCE_ID: ${{ needs.contract-tests.outputs.registry_evidence_id }}
      REGISTRY_VERSION: ${{ needs.contract-tests.outputs.registry_version }}
      TRAINING_MANIFEST_SHA256: ${{ needs.contract-tests.outputs.training_manifest_sha256 }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      SUBJECT_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Publish connector-readable MLOps statuses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          success = os.environ["RUNTIME_RESULT"] == "success"
          statuses = [
              {
                  "context": "knowledge-hub/mlops-selfhosted-runtime",
                  "state": "success" if success else "failure",
                  "description": (
                      "Foundation, Registry, restart and cleanup lifecycle passed"
                      if success
                      else "Self-hosted MLOps lifecycle failed"
                  ),
              }
          ]
          if success:
              statuses.extend(
                  [
                      {
                          "context": "knowledge-hub/mlops-foundation-identities",
                          "state": "success",
                          "description": f"candidate={os.environ['CANDIDATE_ID']}; release={os.environ['RELEASE_ID']}",
                      },
                      {
                          "context": "knowledge-hub/mlops-registry-evidence",
                          "state": "success",
                          "description": f"evidence={os.environ['REGISTRY_EVIDENCE_ID']}; version={os.environ['REGISTRY_VERSION']}",
                      },
                      {
                          "context": "knowledge-hub/mlops-training-manifest",
                          "state": "success",
                          "description": f"sha256={os.environ['TRAINING_MANIFEST_SHA256']}",
                      },
                  ]
              )

          url = "https://api.github.com/repos/" + os.environ["REPOSITORY"] + "/statuses/" + os.environ["SUBJECT_SHA"]
          for status in statuses:
              request = urllib.request.Request(
                  url,
                  data=json.dumps(
                      {
                          **status,
                          "description": status["description"][:140],
                          "target_url": os.environ["RUN_URL"],
                      }
                  ).encode("utf-8"),
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Content-Type": "application/json",
                      "User-Agent": "knowledge-hub-mlops-evidence",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  if response.status != 201:
                      raise SystemExit(f"Unexpected status API response: {response.status}")
          PY
