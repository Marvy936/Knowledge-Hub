name: MLOps Registry hosted gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "labs/mlops/**"
  push:
    branches:
      - main
    paths:
      - "labs/mlops/**"
      - ".github/workflows/mlops-registry-hosted.yml"

permissions:
  contents: read

concurrency:
  group: mlops-registry-hosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-roundtrip:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      registry_evidence_id: ${{ steps.evidence.outputs.registry_evidence_id }}
      registry_version: ${{ steps.evidence.outputs.registry_version }}
      registry_run_id: ${{ steps.evidence.outputs.registry_run_id }}
      registry_artifact_sha256: ${{ steps.evidence.outputs.registry_artifact_sha256 }}
      mlflow_version: ${{ steps.evidence.outputs.mlflow_version }}
      python_version: ${{ steps.evidence.outputs.python_version }}
    env:
      PYTHONHASHSEED: "0"
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RUNTIME_DIR: "${{ runner.temp }}/knowledge-hub-mlops-registry"
      VENV_DIR: "${{ runner.temp }}/knowledge-hub-mlops-registry-venv"
      TRACKING_URI: "http://127.0.0.1:5057"

    steps:
      - name: Checkout exact subject revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            labs/mlops/pyproject.toml
            labs/machine-learning/pyproject.toml

      - name: Install isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VENV_DIR" "$RUNTIME_DIR"
          python -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/python" -m pip install \
            -e "labs/machine-learning" \
            -e "labs/mlops[dev,registry]"

      - name: Run MLOps contract suite
        shell: bash
        env:
          PYTHONWARNINGS: error
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" -m pytest labs/mlops/tests -q

      - name: Execute Registry and artifact round-trip
        shell: bash
        run: |
          set -euo pipefail
          ML_RUNTIME="$RUNTIME_DIR/ml"
          BACKEND_DB="$RUNTIME_DIR/mlflow.db"
          ARTIFACT_ROOT="$RUNTIME_DIR/mlartifacts"
          DOWNLOAD_DIR="$RUNTIME_DIR/downloaded"
          SERVER_LOG="$RUNTIME_DIR/mlflow-server.log"
          SERVER_PID=""

          stop_server() {
            if [[ -n "$SERVER_PID" ]] && kill -0 "$SERVER_PID" 2>/dev/null; then
              kill "$SERVER_PID"
              wait "$SERVER_PID" || true
            fi
            SERVER_PID=""
          }

          start_server() {
            "$VENV_DIR/bin/mlflow" server \
              --host 127.0.0.1 \
              --port 5057 \
              --backend-store-uri "sqlite:///$BACKEND_DB" \
              --artifacts-destination "file://$ARTIFACT_ROOT" \
              --allowed-hosts "127.0.0.1:*,localhost:*" \
              >"$SERVER_LOG" 2>&1 &
            SERVER_PID=$!
            for attempt in $(seq 1 60); do
              if "$VENV_DIR/bin/python" - <<'PY'
          import os
          import urllib.request

          try:
              with urllib.request.urlopen(os.environ["TRACKING_URI"] + "/health", timeout=1) as response:
                  raise SystemExit(0 if response.status == 200 else 1)
          except Exception:
              raise SystemExit(1)
          PY
              then
                return 0
              fi
              if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                cat "$SERVER_LOG"
                return 1
              fi
              sleep 1
            done
            cat "$SERVER_LOG"
            return 1
          }

          trap stop_server EXIT
          mkdir -p "$ML_RUNTIME" "$ARTIFACT_ROOT" "$DOWNLOAD_DIR"

          "$VENV_DIR/bin/python" -m ml_lab generate-data \
            --output "$ML_RUNTIME/customers.csv" \
            --rows 1200 \
            --seed 20260805

          "$VENV_DIR/bin/python" -m ml_lab train \
            --input "$ML_RUNTIME/customers.csv" \
            --output-dir "$ML_RUNTIME/artifact" \
            --seed 20260805

          "$VENV_DIR/bin/python" -m mlops_lab snapshot \
            --dataset "$ML_RUNTIME/customers.csv" \
            --output "$ML_RUNTIME/dataset-manifest.json" \
            --dataset-name churn-training \
            --generation hosted-registry-v1

          "$VENV_DIR/bin/python" -m mlops_lab candidate \
            --dataset-manifest "$ML_RUNTIME/dataset-manifest.json" \
            --model "$ML_RUNTIME/artifact/model.joblib" \
            --evaluation labs/mlops/data/sample-evaluation.json \
            --source-revision "$SUBJECT_SHA" \
            --output "$ML_RUNTIME/candidate.json"

          start_server

          "$VENV_DIR/bin/python" -m mlops_lab registry-roundtrip \
            --candidate "$ML_RUNTIME/candidate.json" \
            --model "$ML_RUNTIME/artifact/model.joblib" \
            --sample-request labs/machine-learning/data/sample-request.json \
            --tracking-uri "$TRACKING_URI" \
            --experiment-name knowledge-hub-mlops-hosted \
            --model-name KnowledgeHubChurn \
            --alias champion \
            --download-dir "$DOWNLOAD_DIR" \
            --output "$RUNTIME_DIR/registry-evidence.json"

          "$VENV_DIR/bin/python" -m mlops_lab registry-verify \
            --evidence "$RUNTIME_DIR/registry-evidence.json" \
            --sample-request labs/machine-learning/data/sample-request.json \
            --tracking-uri "$TRACKING_URI"

          stop_server
          start_server

          "$VENV_DIR/bin/python" -m mlops_lab registry-verify \
            --evidence "$RUNTIME_DIR/registry-evidence.json" \
            --sample-request labs/machine-learning/data/sample-request.json \
            --tracking-uri "$TRACKING_URI"

          stop_server
          test -s "$BACKEND_DB"
          test -d "$ARTIFACT_ROOT"
          test -n "$(find "$ARTIFACT_ROOT" -type f -print -quit)"
          test -s "$RUNTIME_DIR/registry-evidence.json"

      - name: Collect bounded Registry evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          runtime = Path(os.environ["RUNTIME_DIR"])
          evidence = json.loads(
              (runtime / "registry-evidence.json").read_text(encoding="utf-8")
          )
          candidate = json.loads(
              (runtime / "ml" / "candidate.json").read_text(encoding="utf-8")
          )

          assert evidence["source_revision"] == os.environ["SUBJECT_SHA"]
          assert evidence["candidate_id"] == candidate["candidate_id"]
          assert evidence["artifact_readback"]["original_sha256"] == candidate["model"]["sha256"]
          assert evidence["artifact_readback"]["downloaded_sha256"] == candidate["model"]["sha256"]
          assert evidence["artifact_readback"]["passed"] is True
          assert evidence["parity"]["passed"] is True
          assert evidence["registry"]["alias_resolved_version"] == evidence["registry"]["version"]
          assert evidence["registry"]["exact_uri"].endswith("/" + evidence["registry"]["version"])
          assert "@" not in evidence["registry"]["exact_uri"]
          assert (runtime / "mlflow.db").is_file()
          assert any((runtime / "mlartifacts").rglob("*"))

          values = {
              "registry_evidence_id": evidence["registry_evidence_id"],
              "registry_version": evidence["registry"]["version"],
              "registry_run_id": evidence["run_id"],
              "registry_artifact_sha256": evidence["artifact_readback"]["downloaded_sha256"],
              "mlflow_version": evidence["runtime"]["mlflow_version"],
              "python_version": platform.python_version(),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          print(json.dumps(values, sort_keys=True))
          PY

      - name: Cleanup isolated runtime
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          pkill -f "$VENV_DIR/bin/mlflow server" 2>/dev/null || true
          rm -rf "$RUNTIME_DIR" "$VENV_DIR"
          test ! -e "$RUNTIME_DIR"
          test ! -e "$VENV_DIR"

  publish-main-statuses:
    if: github.event_name == 'push' && always()
    needs: registry-roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      RUNTIME_RESULT: ${{ needs.registry-roundtrip.result }}
      REGISTRY_EVIDENCE_ID: ${{ needs.registry-roundtrip.outputs.registry_evidence_id }}
      REGISTRY_VERSION: ${{ needs.registry-roundtrip.outputs.registry_version }}
      REGISTRY_RUN_ID: ${{ needs.registry-roundtrip.outputs.registry_run_id }}
      REGISTRY_ARTIFACT_SHA256: ${{ needs.registry-roundtrip.outputs.registry_artifact_sha256 }}
      MLFLOW_VERSION: ${{ needs.registry-roundtrip.outputs.mlflow_version }}
      PYTHON_VERSION: ${{ needs.registry-roundtrip.outputs.python_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      SUBJECT_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Publish connector-readable Registry statuses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          success = os.environ["RUNTIME_RESULT"] == "success"
          statuses = [
              {
                  "context": "knowledge-hub/mlops-registry-hosted-runtime",
                  "state": "success" if success else "failure",
                  "description": (
                      "16 tests, MLflow Registry round-trip, restart verification and cleanup passed"
                      if success
                      else "Hosted MLflow Registry runtime gate failed"
                  ),
              }
          ]
          if success:
              statuses.extend(
                  [
                      {
                          "context": "knowledge-hub/mlops-registry-evidence",
                          "state": "success",
                          "description": f"evidence={os.environ['REGISTRY_EVIDENCE_ID']}",
                      },
                      {
                          "context": "knowledge-hub/mlops-registry-version",
                          "state": "success",
                          "description": f"version={os.environ['REGISTRY_VERSION']}; run={os.environ['REGISTRY_RUN_ID']}",
                      },
                      {
                          "context": "knowledge-hub/mlops-registry-artifact",
                          "state": "success",
                          "description": f"sha256={os.environ['REGISTRY_ARTIFACT_SHA256']}",
                      },
                      {
                          "context": "knowledge-hub/mlops-registry-runtime-versions",
                          "state": "success",
                          "description": f"mlflow={os.environ['MLFLOW_VERSION']}; python={os.environ['PYTHON_VERSION']}",
                      },
                  ]
              )

          url = (
              "https://api.github.com/repos/"
              + os.environ["REPOSITORY"]
              + "/statuses/"
              + os.environ["SUBJECT_SHA"]
          )
          for status in statuses:
              request = urllib.request.Request(
                  url,
                  data=json.dumps(
                      {
                          **status,
                          "description": status["description"][:140],
                          "target_url": os.environ["RUN_URL"],
                      }
                  ).encode("utf-8"),
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Content-Type": "application/json",
                      "User-Agent": "knowledge-hub-mlops-registry-evidence",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  if response.status != 201:
                      raise SystemExit(f"Unexpected status API response: {response.status}")
          PY
