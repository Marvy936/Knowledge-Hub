name: Temporary Section 21 block 25-28 closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "docs/21-ai-agents-and-intelligent-automation/**"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "DOCUMENTATION-REVIEW-STATUS.md"
      - "DOCUMENTATION-AUDIT.md"
      - "documentation-audit.json"
      - ".github/workflows/temporary-section-21-block-25-28-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-section-21-block-25-28-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-21-ai-agents-block-25-28

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize section and run learning-depth closeout
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          readme = Path("docs/21-ai-agents-and-intelligent-automation/README.md")
          replace_once(
              readme,
              "24. [Agent governance a audit](agent-governance-audit.md)\n\n## Plánované authoritative poradie",
              "24. [Agent governance a audit](agent-governance-audit.md)\n"
              "25. [n8n architecture a execution model](n8n-architecture-execution-model.md)\n"
              "26. [Triggers, nodes, expressions a data mapping](triggers-nodes-expressions-data-mapping.md)\n"
              "27. [Webhooks a API integrations](webhooks-api-integrations.md)\n"
              "28. [Credentials, secrets a access control](credentials-secrets-access-control.md)\n\n"
              "## Plánované authoritative poradie",
          )
          for planned in (
              "25. n8n architecture a execution model\n",
              "26. Triggers, nodes, expressions a data mapping\n",
              "27. Webhooks a API integrations\n",
              "28. Credentials, secrets a access control\n",
          ):
              replace_once(readme, planned, "")

          text = readme.read_text(encoding="utf-8")
          marker = "## Stav\n\n"
          if text.count(marker) != 1:
              raise SystemExit("README: expected one status marker")
          prefix, _ = text.split(marker, 1)
          status = (
              "Aktuálny authoritative stav sekcie je **28/62 · In progress**. Siedmy authoritative blok aktivuje kapitoly 25–28 a incident `AGENT-N8N-07`. Architecture kapitola oddeľuje saved, published a effective workflow state, control a execution plane, main/webhook/worker/task-runner paths, database, Redis queue, binary storage, concurrency, durability a exact execution subject. Trigger/data kapitola vysvetľuje items, node parameter resolution, expressions, item linking, `pairedItem`, cardinality, branches, merges, schema contracts a multi-item acceptance. Webhook/API kapitola pokrýva production endpoint, signatures, replay protection, acknowledgement, provider retries, event idempotency, API contracts, timeouts, rate limits, partial success, SSRF a authoritative resource read-back. Credential kapitola viaže secret a executable capability na ownera, project/RBAC, tenant, scopes, encryption key, external secret generation, workflow binding, rotation, revocation, redaction, backup/restore a negative authorization. Reálne n8n executions, provider retries, API mutations, credential rotation, restore, tenant isolation ani business outcomes neboli vykonané. Sekcia zostáva `In progress`, nie runtime `Verified`, production `Stable` ani user `Accepted`. Ďalší blok sú kapitoly 29–32: error workflows/retries/partial execution, idempotency/duplicate-event handling, sub-workflows/reusable contracts a source control/environments.\n"
          )
          readme.write_text(prefix + marker + status, encoding="utf-8", newline="\n")

          roadmap = Path("ROADMAP.md")
          roadmap_updates = {
              "- [ ] n8n architecture a execution model": "- [x] [n8n architecture a execution model](docs/21-ai-agents-and-intelligent-automation/n8n-architecture-execution-model.md)",
              "- [ ] Triggers, nodes, expressions a data mapping": "- [x] [Triggers, nodes, expressions a data mapping](docs/21-ai-agents-and-intelligent-automation/triggers-nodes-expressions-data-mapping.md)",
              "- [ ] Webhooks a API integrations": "- [x] [Webhooks a API integrations](docs/21-ai-agents-and-intelligent-automation/webhooks-api-integrations.md)",
              "- [ ] Credentials, secrets a access control": "- [x] [Credentials, secrets a access control](docs/21-ai-agents-and-intelligent-automation/credentials-secrets-access-control.md)",
          }
          for old, new in roadmap_updates.items():
              replace_once(roadmap, old, new)

          review = Path("DOCUMENTATION-REVIEW-STATUS.md")
          lines = review.read_text(encoding="utf-8").splitlines()
          row_prefix = "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation |"
          matches = [index for index, line in enumerate(lines) if line.startswith(row_prefix)]
          if len(matches) != 1:
              raise SystemExit(f"Review status: expected one Section 21 row, found {len(matches)}")
          lines[matches[0]] = (
              "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation | 28/62 authoritative drafting | In progress | 2026-08-04 | "
              "Siedmy authoritative blok aktivuje kapitoly 25–28 a incident `AGENT-N8N-07`. n8n architecture kapitola oddeľuje saved/published/effective workflow, control a execution plane, ingress, queue, workers, task runners, database, binary storage, concurrency a external side-effect durability. Trigger/data kapitola zavádza item a node lifecycle, expressions, item linking, cardinality, branch/merge/schema contracts a multi-item proof. Webhook/API kapitola spája signatures, replay protection, acknowledgement, retries, event idempotency, API versioning, timeout/rate-limit/partial-success semantics, SSRF a resource read-back. Credential kapitola chápe credential ako executable capability a viaže ho na ownera, tenant, scope, project/RBAC, encryption/external-secret generation, workflow binding, rotation, revocation, redaction, restore a negative authorization. Reálne n8n runtime operations, webhooks, API mutations, provider retries, credential rotation, restore, tenant isolation, incident recovery a business outcomes neboli vykonané; stav zostáva `In progress`, nie runtime `Verified`, production `Stable` ani user `Accepted`. |"
          )
          review.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          python - <<'PY'
          from pathlib import Path

          audit = Path("DOCUMENTATION-AUDIT.md").read_text(encoding="utf-8")
          files = [
              "n8n-architecture-execution-model.md",
              "triggers-nodes-expressions-data-mapping.md",
              "webhooks-api-integrations.md",
              "credentials-secrets-access-control.md",
          ]
          remaining = [
              name
              for name in files
              if f"### `docs/21-ai-agents-and-intelligent-automation/{name}`" in audit
          ]
          if remaining:
              raise SystemExit(f"Section 21 block 25-28 critical/high findings remain: {remaining}")
          print("Section 21 block 25-28 has no critical/high audit entries.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ROADMAP.md \
            GLOSSARY.md \
            DOCUMENTATION-REVIEW-STATUS.md \
            DOCUMENTATION-AUDIT.md \
            documentation-audit.json \
            docs/21-ai-agents-and-intelligent-automation

          if git diff --cached --quiet; then
            echo "No closeout changes required."
            exit 0
          fi

          git commit -m "docs: synchronize n8n block closeout"
          git push origin HEAD:agent/section-21-ai-agents-block-25-28
