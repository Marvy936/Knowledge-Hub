name: Temporary Section 18 block 21-24 push remediation

on:
  push:
    branches:
      - agent/section-18-ml-fundamentals-block-21-24

permissions:
  contents: write

concurrency:
  group: temporary-section-18-block-21-24-push
  cancel-in-progress: true

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-18-ml-fundamentals-block-21-24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remediate and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/temporary_section_18_block_21_24_remediate.py
          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          python - <<'PY'
          from pathlib import Path

          audit = Path("DOCUMENTATION-AUDIT.md").read_text(encoding="utf-8")
          files = [
              "calibration-uncertainty.md",
              "explainability-feature-importance.md",
              "data-quality-bias-responsible-ai.md",
              "reproducibility-random-seeds.md",
          ]
          remaining = [
              name
              for name in files
              if f"### `docs/18-machine-learning-fundamentals/{name}`" in audit
          ]
          if remaining:
              raise SystemExit(
                  f"Block-local critical/high findings remain: {remaining}"
              )
          print("Section 18 block 21-24 has no critical/high audit entries.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/18-machine-learning-fundamentals \
            DOCUMENTATION-AUDIT.md \
            documentation-audit.json \
            GLOSSARY.md \
            ROADMAP.md
          git commit -m "docs: remediate Machine Learning block 21-24 findings"
          git push origin HEAD:agent/section-18-ml-fundamentals-block-21-24
