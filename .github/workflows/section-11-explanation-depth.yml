name: Section 11 explanation depth

on:
  push:
    branches:
      - agent/section-11-explanation-depth
    paths:
      - scripts/section_11_explanation_depth.py
      - scripts/section_11_finalize.py
      - .github/workflows/section-11-explanation-depth.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/section_11_explanation_depth.py
      - scripts/section_11_finalize.py
      - .github/workflows/section-11-explanation-depth.yml

permissions:
  contents: write

concurrency:
  group: section-11-explanation-depth
  cancel-in-progress: true

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-11-explanation-depth
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply preserve-first AWS pass
        shell: bash
        run: |
          set -euo pipefail
          python scripts/section_11_explanation_depth.py
          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/section_11_finalize.py
      - name: Commit documentation result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/11-cloud-and-aws DOCUMENTATION-REVIEW-STATUS.md DOCUMENTATION-AUDIT.md documentation-audit.json GLOSSARY.md ROADMAP.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          git commit -m "docs: deepen AWS walkthrough and troubleshooting boundaries"
          git pull --rebase origin agent/section-11-explanation-depth
          git push origin HEAD:agent/section-11-explanation-depth
