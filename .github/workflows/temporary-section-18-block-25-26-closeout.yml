name: Temporary Section 18 block 25-26 closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "docs/18-machine-learning-fundamentals/**"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "DOCUMENTATION-REVIEW-STATUS.md"
      - "DOCUMENTATION-AUDIT.md"
      - "documentation-audit.json"
      - ".github/workflows/temporary-section-18-block-25-26-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-section-18-block-25-26-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-18-ml-fundamentals-block-25-26

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate final block and synchronize section
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          section = Path("docs/18-machine-learning-fundamentals")
          chapters = {
              "offline-evaluation-production-outcome.md": [
                  "offline", "production outcome", "shadow", "canary", "ML-PAY-89"
              ],
              "ml-troubleshooting-mental-model.md": [
                  "troubleshooting", "first divergence", "hypothesis", "recovery", "ML-PAY-89"
              ],
          }

          for filename, required in chapters.items():
              path = section / filename
              text = path.read_text(encoding="utf-8")
              words = re.findall(r"\b[\w'-]+\b", text, flags=re.UNICODE)
              if len(words) < 2200:
                  raise SystemExit(f"{filename}: only {len(words)} words")
              if text.count("```") < 10:
                  raise SystemExit(f"{filename}: insufficient executable/model surface")
              lower = text.lower()
              missing = [term for term in required if term.lower() not in lower]
              if missing:
                  raise SystemExit(f"{filename}: missing {missing}")
              for concept, alternatives in {
                  "subject": ("subject", "predmet"),
                  "evidence": ("evidence", "dôkaz", "artifact"),
                  "failure": ("failure", "zlyhan", "incident"),
                  "recovery": ("recovery", "obnov", "rollback"),
                  "acceptance": ("acceptance", "positive", "forbidden"),
              }.items():
                  if not any(token in lower for token in alternatives):
                      raise SystemExit(f"{filename}: missing {concept} semantics")

          readme = section / "README.md"
          readme_text = readme.read_text(encoding="utf-8")
          for token in [
              "**26/26 · Ready for user review**",
              "[Offline evaluation oproti production outcome](offline-evaluation-production-outcome.md)",
              "[ML troubleshooting mental model](ml-troubleshooting-mental-model.md)",
          ]:
              if token not in readme_text:
                  raise SystemExit(f"README missing {token}")
          PY

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write

          python - <<'PY'
          from pathlib import Path

          path = Path("DOCUMENTATION-REVIEW-STATUS.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          prefix = "| `18-machine-learning-fundamentals` — Machine Learning Fundamentals |"
          replacement = (
              "| `18-machine-learning-fundamentals` — Machine Learning Fundamentals | "
              "26/26 authoritative drafting | Ready for user review | 2026-08-03 | "
              "Všetkých dvadsaťšesť authoritative kapitol je aktívnych. Záverečný blok 25–26 uzatvára offline-to-production chain od historical estimandu, replay, point-in-time feature parity, shadow/canary/A-B exposure, shared-capacity interference, action compliance, delayed/selective labels, drift a mature business outcome až po jednotný evidence-first ML troubleshooting model. Incident `ML-PAY-89` prepája offline-approved candidate s feature timeoutom, hidden fallbackom, odlišnou queue policy, capacity/reviewer truncation a selective labels; následný retrain-first zásah ukazuje prečo treba exact subject, authority hierarchy, first divergence, hypothesis tree, one-variable mutation, component/journey/business recovery, unknown-outcome read-back, second-operation test a RCA. Sekcia je obsahovo pripravená na user review. Reálne datasety, training/HPO, calibration, inference, rollouty, human workflow, recovery a business impact neboli vykonané. |"
          )
          matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if len(matches) != 1:
              raise SystemExit(f"Expected one Section 18 row, found {len(matches)}")
          lines[matches[0]] = replacement
          path.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8", newline="\n")
          PY

          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ROADMAP.md \
            GLOSSARY.md \
            docs \
            DOCUMENTATION-REVIEW-STATUS.md \
            DOCUMENTATION-AUDIT.md \
            documentation-audit.json

          if git diff --cached --quiet; then
            echo "No synchronized documentation changes required."
            exit 0
          fi

          git commit -m "docs: close Machine Learning Fundamentals section"
          git push origin HEAD:agent/section-18-ml-fundamentals-block-25-26
