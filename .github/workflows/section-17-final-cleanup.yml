name: Keycloak section final cleanup

on:
  push:
    branches:
      - agent/section-17-keycloak-block-29-30
    paths:
      - scripts/section_17_cleanup.py
      - .github/workflows/section-17-final-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-17-keycloak-block-29-30
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove temporary Section 17 tooling
        run: python scripts/section_17_cleanup.py
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "chore: clean final Keycloak validation tooling"
          git pull --rebase origin agent/section-17-keycloak-block-29-30
          git push origin HEAD:agent/section-17-keycloak-block-29-30
