name: Temporary Helm navigation sync

on:
  push:
    branches:
      - agent/helm-practical-examples
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/helm-practical-examples
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize navigation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_navigation.py --write
          if git diff --quiet; then
            echo "Navigation already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: synchronize Helm practical navigation"
          git push origin HEAD:agent/helm-practical-examples
