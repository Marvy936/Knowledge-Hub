name: Practical v1 release evidence

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "labs/machine-learning/**"
      - "labs/mlops/**"
      - "labs/llm-rag/**"
      - "labs/agent-ops/**"
      - "labs/keycloak-ai-api/**"
      - "scripts/practical_v1_core.py"
      - "scripts/run_practical_v1_release_candidate.py"
      - "scripts/finalize_practical_v1_release_evidence.py"
      - "scripts/validate_practical_v1_repo.py"
      - "scripts/tests/**"
      - ".github/workflows/practical-v1-release-evidence.yml"
      - "PRACTICAL-V1-ROADMAP.md"
      - "PRACTICAL-STATUS.md"
      - "PRACTICAL-V1-EVIDENCE.md"
      - "PRACTICAL-V1-RELEASE-CANDIDATE.md"
      - "README.md"
      - "labs/README.md"
  push:
    branches: [main]
    paths:
      - "labs/machine-learning/**"
      - "labs/mlops/**"
      - "labs/llm-rag/**"
      - "labs/agent-ops/**"
      - "labs/keycloak-ai-api/**"
      - "scripts/practical_v1_core.py"
      - "scripts/run_practical_v1_release_candidate.py"
      - "scripts/finalize_practical_v1_release_evidence.py"
      - "scripts/validate_practical_v1_repo.py"
      - "scripts/tests/**"
      - ".github/workflows/practical-v1-release-evidence.yml"
      - "PRACTICAL-V1-ROADMAP.md"
      - "PRACTICAL-STATUS.md"
      - "PRACTICAL-V1-EVIDENCE.md"
      - "PRACTICAL-V1-RELEASE-CANDIDATE.md"
      - "README.md"
      - "labs/README.md"

permissions:
  contents: read

concurrency:
  group: practical-v1-release-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-evidence:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      release_evidence_id: ${{ steps.evidence.outputs.release_evidence_id }}
      release_candidate_id: ${{ steps.evidence.outputs.release_candidate_id }}
      dependency_resolution_id: ${{ steps.evidence.outputs.dependency_resolution_id }}
      workflow_provenance_id: ${{ steps.evidence.outputs.workflow_provenance_id }}
      artifact_manifest_id: ${{ steps.evidence.outputs.artifact_manifest_id }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VENV_DIR: "${{ github.workspace }}/../knowledge-hub-practical-v1-release-venv"
      PACKAGE_ROOT: "${{ github.workspace }}/../knowledge-hub-practical-v1-release-packages"
      WORK_ROOT: "${{ github.workspace }}/../knowledge-hub-practical-v1-release-work"
      EVIDENCE_DIR: "/tmp/knowledge-hub-practical-v1-release-evidence"
      DEPENDENCY_TMP: "${{ github.workspace }}/../knowledge-hub-practical-v1-dependency-resolution.json"
      RC_EVIDENCE: "/tmp/knowledge-hub-practical-v1-release-evidence/release-candidate.json"
      RELEASE_EVIDENCE: "/tmp/knowledge-hub-practical-v1-release-evidence/release-evidence.json"

    steps:
      - name: Checkout exact release subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Verify Docker and Compose runtime
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Install isolated package snapshots
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VENV_DIR" "$PACKAGE_ROOT" "$WORK_ROOT" "$EVIDENCE_DIR" "$DEPENDENCY_TMP" .runtime
          mkdir -p "$PACKAGE_ROOT"
          cp -a labs/machine-learning "$PACKAGE_ROOT/machine-learning"
          cp -a labs/mlops "$PACKAGE_ROOT/mlops"
          cp -a labs/llm-rag "$PACKAGE_ROOT/llm-rag"
          cp -a labs/agent-ops "$PACKAGE_ROOT/agent-ops"
          cp -a labs/keycloak-ai-api "$PACKAGE_ROOT/keycloak-ai-api"
          python -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/python" -m pip install \
            "$PACKAGE_ROOT/machine-learning[dev]" \
            "$PACKAGE_ROOT/mlops[dev,registry,serving]" \
            "$PACKAGE_ROOT/llm-rag[dev]" \
            "$PACKAGE_ROOT/agent-ops[dev]" \
            "$PACKAGE_ROOT/keycloak-ai-api[dev]"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run release-tooling contract tests
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" -m pytest scripts/tests -q -p no:cacheprovider
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Capture exact dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import platform
          import sys
          from pathlib import Path

          packages = sorted(
              (
                  {
                      "name": (dist.metadata.get("Name") or "").strip().lower(),
                      "version": dist.version,
                  }
                  for dist in importlib.metadata.distributions()
                  if (dist.metadata.get("Name") or "").strip()
              ),
              key=lambda item: (item["name"], item["version"]),
          )
          payload = {
              "schema_version": 1,
              "subject_sha": os.environ["SUBJECT_SHA"],
              "python_version": platform.python_version(),
              "python_executable": sys.executable,
              "python_implementation": platform.python_implementation(),
              "platform": platform.platform(),
              "machine": platform.machine(),
              "pip_version": importlib.metadata.version("pip"),
              "packages": packages,
          }
          canonical = json.dumps(
              payload,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          evidence = {
              **payload,
              "dependency_resolution_id": hashlib.sha256(canonical).hexdigest(),
          }
          Path(os.environ["DEPENDENCY_TMP"]).write_text(
              json.dumps(evidence, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Execute exact Practical v1 release-candidate lifecycle
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" scripts/run_practical_v1_release_candidate.py \
            --repo-root . \
            --subject-sha "$SUBJECT_SHA" \
            --work-root "$WORK_ROOT" \
            --evidence-dir "$EVIDENCE_DIR" \
            --output "$RC_EVIDENCE"

      - name: Add dependency and workflow provenance
        shell: bash
        run: |
          set -euo pipefail
          cp "$DEPENDENCY_TMP" "$EVIDENCE_DIR/dependency-resolution.json"
          "$VENV_DIR/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "subject_sha": os.environ["SUBJECT_SHA"],
              "workflow_name": os.environ["GITHUB_WORKFLOW"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "github_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "run_url": (
                  os.environ["GITHUB_SERVER_URL"]
                  + "/"
                  + os.environ["GITHUB_REPOSITORY"]
                  + "/actions/runs/"
                  + os.environ["GITHUB_RUN_ID"]
              ),
          }
          canonical = json.dumps(
              payload,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
              allow_nan=False,
          ).encode("utf-8")
          evidence = {
              **payload,
              "workflow_provenance_id": hashlib.sha256(canonical).hexdigest(),
          }
          (Path(os.environ["EVIDENCE_DIR"]) / "workflow-provenance.json").write_text(
              json.dumps(evidence, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Finalize run-bound release evidence
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" scripts/finalize_practical_v1_release_evidence.py \
            --release-candidate "$RC_EVIDENCE" \
            --dependency-resolution "$EVIDENCE_DIR/dependency-resolution.json" \
            --workflow-provenance "$EVIDENCE_DIR/workflow-provenance.json" \
            --subject-sha "$SUBJECT_SHA" \
            --output "$RELEASE_EVIDENCE"

      - name: Verify final release evidence
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_DIR"])
          final = json.loads(Path(os.environ["RELEASE_EVIDENCE"]).read_text(encoding="utf-8"))
          rc = json.loads(Path(os.environ["RC_EVIDENCE"]).read_text(encoding="utf-8"))
          dependencies = json.loads((root / "dependency-resolution.json").read_text(encoding="utf-8"))
          workflow = json.loads((root / "workflow-provenance.json").read_text(encoding="utf-8"))
          assert final["subject_sha"] == os.environ["SUBJECT_SHA"]
          assert final["release_candidate"]["release_candidate_id"] == rc["release_candidate_id"]
          assert final["dependency_resolution"]["dependency_resolution_id"] == dependencies["dependency_resolution_id"]
          assert final["workflow_provenance"]["workflow_provenance_id"] == workflow["workflow_provenance_id"]
          assert final["workflow_provenance"]["run_id"] == int(os.environ["GITHUB_RUN_ID"])
          assert final["proof_boundary"]["workflow_run_bound"] is True
          assert final["proof_boundary"]["dependency_resolution_bound"] is True
          assert final["proof_boundary"]["release_tag_created"] is False
          assert final["proof_boundary"]["user_acceptance_claimed"] is False
          assert len(final["release_evidence_id"]) == 64
          PY

      - name: Cleanup outer runtime and package snapshots
        shell: bash
        run: |
          set -euo pipefail
          project="kh-keycloak-runtime-${SUBJECT_SHA:0:12}"
          docker compose \
            --project-name "$project" \
            -f labs/keycloak-ai-api/compose.yaml \
            down -v --remove-orphans || true
          pkill -f "$VENV_DIR/bin/python.*-m mlflow server" 2>/dev/null || true
          docker ps -aq --filter "name=kh-mlops-runtime-" | xargs -r docker rm -f
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
            | awk '$1 ~ /^knowledge-hub-mlops-runtime:/ {print $2}' \
            | sort -u \
            | xargs -r docker image rm -f || true
          rm -rf "$WORK_ROOT" "$PACKAGE_ROOT" "$DEPENDENCY_TMP" .runtime "$VENV_DIR"
          test ! -e "$WORK_ROOT"
          test ! -e "$PACKAGE_ROOT"
          test ! -e "$DEPENDENCY_TMP"
          test ! -e .runtime
          test ! -e "$VENV_DIR"
          test -z "$(docker ps -aq --filter 'name=kh-mlops-runtime-')"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build final artifact manifest
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_DIR"])
          final = json.loads(Path(os.environ["RELEASE_EVIDENCE"]).read_text(encoding="utf-8"))
          rc = json.loads(Path(os.environ["RC_EVIDENCE"]).read_text(encoding="utf-8"))
          dependencies = json.loads((root / "dependency-resolution.json").read_text(encoding="utf-8"))
          workflow = json.loads((root / "workflow-provenance.json").read_text(encoding="utf-8"))
          files = {}
          for path in sorted(root.glob("*.json")):
              if path.name == "artifact-manifest.json":
                  continue
              files[path.name] = {
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size_bytes": path.stat().st_size,
              }
          manifest_payload = {
              "schema_version": 1,
              "subject_sha": os.environ["SUBJECT_SHA"],
              "release_evidence_id": final["release_evidence_id"],
              "release_candidate_id": rc["release_candidate_id"],
              "dependency_resolution_id": dependencies["dependency_resolution_id"],
              "workflow_provenance_id": workflow["workflow_provenance_id"],
              "run_id": workflow["run_id"],
              "workflow_cleanup_verified": True,
              "files": files,
          }
          manifest_id = hashlib.sha256(
              json.dumps(
                  manifest_payload,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          (root / "artifact-manifest.json").write_text(
              json.dumps({**manifest_payload, "manifest_id": manifest_id}, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          values = {
              "release_evidence_id": final["release_evidence_id"],
              "release_candidate_id": rc["release_candidate_id"],
              "dependency_resolution_id": dependencies["dependency_resolution_id"],
              "workflow_provenance_id": workflow["workflow_provenance_id"],
              "artifact_manifest_id": manifest_id,
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          print(json.dumps(values, sort_keys=True))
          PY

      - name: Upload canonical release evidence bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: practical-v1-release-evidence-${{ env.SUBJECT_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Emergency cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          project="kh-keycloak-runtime-${SUBJECT_SHA:0:12}"
          docker compose \
            --project-name "$project" \
            -f labs/keycloak-ai-api/compose.yaml \
            down -v --remove-orphans || true
          pkill -f "$VENV_DIR/bin/python.*-m mlflow server" 2>/dev/null || true
          docker ps -aq --filter "name=kh-mlops-runtime-" | xargs -r docker rm -f
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
            | awk '$1 ~ /^knowledge-hub-mlops-runtime:/ {print $2}' \
            | sort -u \
            | xargs -r docker image rm -f || true
          rm -rf "$WORK_ROOT" "$PACKAGE_ROOT" "$DEPENDENCY_TMP" .runtime "$VENV_DIR"
          test ! -e "$WORK_ROOT"
          test ! -e "$PACKAGE_ROOT"
          test ! -e "$DEPENDENCY_TMP"
          test ! -e .runtime
          test ! -e "$VENV_DIR"

  publish-main-statuses:
    if: github.event_name == 'push' && always()
    needs: release-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      RUNTIME_RESULT: ${{ needs.release-evidence.result }}
      RELEASE_EVIDENCE_ID: ${{ needs.release-evidence.outputs.release_evidence_id }}
      RELEASE_CANDIDATE_ID: ${{ needs.release-evidence.outputs.release_candidate_id }}
      DEPENDENCY_ID: ${{ needs.release-evidence.outputs.dependency_resolution_id }}
      PROVENANCE_ID: ${{ needs.release-evidence.outputs.workflow_provenance_id }}
      MANIFEST_ID: ${{ needs.release-evidence.outputs.artifact_manifest_id }}
      ARTIFACT_ID: ${{ needs.release-evidence.outputs.artifact_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      SUBJECT_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Publish connector-readable final release evidence statuses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          success = os.environ["RUNTIME_RESULT"] == "success"
          statuses = [
              {
                  "context": "knowledge-hub/practical-v1-release-evidence",
                  "state": "success" if success else "failure",
                  "description": (
                      "run-bound Practical v1 release evidence passed"
                      if success
                      else "Practical v1 release evidence gate failed"
                  ),
              }
          ]
          if success:
              statuses.extend(
                  [
                      {
                          "context": "knowledge-hub/practical-v1-release-evidence-id",
                          "state": "success",
                          "description": f"evidence={os.environ['RELEASE_EVIDENCE_ID']}; artifact={os.environ['ARTIFACT_ID']}",
                      },
                      {
                          "context": "knowledge-hub/practical-v1-release-provenance",
                          "state": "success",
                          "description": f"provenance={os.environ['PROVENANCE_ID']}; deps={os.environ['DEPENDENCY_ID']}",
                      },
                      {
                          "context": "knowledge-hub/practical-v1-release-manifest",
                          "state": "success",
                          "description": f"rc={os.environ['RELEASE_CANDIDATE_ID']}; manifest={os.environ['MANIFEST_ID']}",
                      },
                  ]
              )

          url = (
              "https://api.github.com/repos/"
              + os.environ["REPOSITORY"]
              + "/statuses/"
              + os.environ["SUBJECT_SHA"]
          )
          for status in statuses:
              request = urllib.request.Request(
                  url,
                  data=json.dumps(
                      {
                          **status,
                          "description": status["description"][:140],
                          "target_url": os.environ["RUN_URL"],
                      }
                  ).encode("utf-8"),
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Content-Type": "application/json",
                      "User-Agent": "knowledge-hub-practical-v1-release-evidence",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  if response.status != 201:
                      raise SystemExit(f"Unexpected status API response: {response.status}")
          PY