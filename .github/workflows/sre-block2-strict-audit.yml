name: SRE block 2 strict audit

on:
  pull_request:
    paths:
      - "docs/14-sre-and-operations/capacity-planning.md"
      - "docs/14-sre-and-operations/incident-management.md"
      - "docs/14-sre-and-operations/on-call-and-escalation.md"
      - "docs/14-sre-and-operations/runbooks-and-playbooks.md"
      - ".github/workflows/sre-block2-strict-audit.yml"

jobs:
  strict-audit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit four SRE chapters
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_learning_depth.py --all-docs --report /tmp/report.md --json /tmp/audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          paths = {
              "docs/14-sre-and-operations/capacity-planning.md",
              "docs/14-sre-and-operations/incident-management.md",
              "docs/14-sre-and-operations/on-call-and-escalation.md",
              "docs/14-sre-and-operations/runbooks-and-playbooks.md",
          }
          data = json.loads(Path('/tmp/audit.json').read_text())
          failed = False
          for item in data['files']:
              if item['path'] in paths:
                  print(f"STRICT {item['path']} words={item['words']} grade={item['grade']} critical={item['critical']} high={item['high']} medium={item['medium']} low={item['low']}")
                  failed |= any(item[k] for k in ('critical', 'high', 'medium'))
          for finding in data['findings']:
              if finding['path'] in paths and finding['severity'] in {'critical', 'high', 'medium'}:
                  print(
                      "FINDING "
                      f"path={finding['path']} severity={finding['severity']} "
                      f"section={finding.get('section')} line={finding.get('line')} "
                      f"rule={finding['rule']} detail={finding['detail']}"
                  )
          if failed:
              raise SystemExit('SRE block 2 still has medium-or-higher findings')
          PY
