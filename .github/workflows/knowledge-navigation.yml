name: Knowledge documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**/*.md"
      - "AUTHORING-GUIDE.md"
      - "templates/**/*.md"
      - "scripts/update_navigation.py"
      - "scripts/update_glossary.py"
      - "scripts/audit_learning_depth.py"
      - ".github/workflows/knowledge-navigation.yml"
  pull_request:
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**/*.md"
      - "AUTHORING-GUIDE.md"
      - "templates/**/*.md"
      - "scripts/update_navigation.py"
      - "scripts/update_glossary.py"
      - "scripts/audit_learning_depth.py"
      - ".github/workflows/knowledge-navigation.yml"

permissions:
  contents: write

concurrency:
  group: knowledge-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve Python interpreter
        shell: bash
        run: |
          set -euo pipefail

          if command -v python >/dev/null 2>&1; then
            python_bin="$(command -v python)"
          elif command -v python3 >/dev/null 2>&1; then
            python_bin="$(command -v python3)"
          else
            echo "::error::Neither python nor python3 is available after actions/setup-python."
            exit 1
          fi

          "$python_bin" --version
          echo "PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"

      - name: Record database prose-first section revalidation
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/databases-style-revalidation-block-1'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/databases-style-revalidation-block-1
          git checkout -B agent/databases-style-revalidation-block-1 origin/agent/databases-style-revalidation-block-1
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path

          readme = Path('docs/15-databases-and-distributed-systems/README.md')
          text = readme.read_text(encoding='utf-8')
          old = '''Aktuálny authoritative stav sekcie je **18/18 · Ready for user review**.

## Completion state

Všetkých 18 authoritative kapitol je vytvorených. Sekcia prešla finálnym section-level consistency gate-om a je pripravená na používateľskú kontrolu; nie je tým automaticky používateľsky schválená, Accepted, Verified ani Stable.'''
          new = '''Aktuálny authoritative stav sekcie je **18/18 · Ready for user review**.

## Completion state

Všetkých 18 authoritative kapitol bolo po pôvodnom authoring passe kompletne znovu spracovaných v piatich prose-first strict blokoch. Každá kapitola má explicitný subject/generation/evidence model, connected failure a vysvetlené positive, recovery, overload alebo forbidden acceptance paths; per-file gate vykazuje nulové critical, high a medium learning-depth findings. Authoritative ordering, navigation, glossary a päť incidentov `DB-PAY-56` až `DB-PAY-60` zostávajú zachované. Sekcia je pripravená na používateľskú kontrolu; nie je tým automaticky používateľsky schválená, Accepted, Verified ani Stable.'''
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('README closeout baseline not found')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          ledger = Path('DOCUMENTATION-REVIEW-STATUS.md')
          lines = ledger.read_text(encoding='utf-8').splitlines()
          replacement = "| `15-databases-and-distributed-systems` — Databases and Distributed Systems | 18/18 prose-first strict revalidation | Ready for user review | 2026-07-30 | Všetkých 18 authoritative kapitol bolo kompletne znovu spracovaných v piatich strict blokoch podľa Keycloak-style prose-first gate-u. `DB-PAY-56` spája data authority, atomic settlement/outbox, safe migration a fenced HA; `DB-PAY-57` clean-point PITR, fleet-wide pooling, PostgreSQL/MySQL/Redis roles a architecture ownership; `DB-PAY-58` immediate/final communication contracts, consumer acknowledgement, route generation a versioned cache coherence; `DB-PAY-59` per-operation CAP decision, formal consistency history, quorum/leader fencing a bounded retry/circuit control; `DB-PAY-60` hierarchical global/provider/tenant admission, atomic semantic idempotency a downstream-credit backpressure. Záverečný incident zachováva 80 Pod-local limiterov s effective admission 36 000 req/s proti provider capacity približne 6 500 attempts/s, 20-minútovú idempotency expiry pri 54-minútovom backlogu, 83 duplicate authoritative operations, 31 duplicate provider effects a theoretical worker concurrency 96 000 proti safe in-flight 1 200. Redesign používa global/provider/tenant/operation-class budgets, recovery reserves, atomic claim + settlement + outbox, semantic fingerprint, stable provider identity, bounded queues/credits, rebalance-safe pause, backlog-age admission a reconciliation pred unknown retryom. Všetky kapitoly používajú explicitné subject/generation/evidence boundaries, positive/recovery/failure/overload/forbidden paths a second-operation, failover, replay alebo sustained-overload validation s nulovými critical/high/medium findings. Ordering 18/18, navigation od SRE po GitOps, glossary fragments `15a`–`15e`, generated artifacts a current primary-source semantics zostávajú zachované. Sekcia je pripravená na používateľskú kontrolu, nie automaticky používateľsky schválená, Accepted, Verified ani Stable. |"
          found = False
          for i, line in enumerate(lines):
              if line.startswith('| `15-databases-and-distributed-systems`'):
                  lines[i] = replacement
                  found = True
                  break
          if not found:
              raise SystemExit('Database ledger row not found')
          ledger.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8', newline='\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/15-databases-and-distributed-systems/README.md DOCUMENTATION-REVIEW-STATUS.md
          if git diff --cached --quiet; then
            echo "Database closeout already recorded."
          else
            git commit -m "docs(db): record prose-first section revalidation"
            git push origin HEAD:agent/databases-style-revalidation-block-1
          fi

      - name: Synchronize and commit generated documentation
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail

          synchronize_documentation() {
            "$PYTHON_BIN" scripts/update_glossary.py --write
            "$PYTHON_BIN" scripts/update_navigation.py --write

            set +e
            "$PYTHON_BIN" scripts/audit_learning_depth.py --all-docs > /tmp/documentation-audit.log 2>&1
            audit_status=$?
            set -e

            if [ "$audit_status" -ne 0 ]; then
              {
                echo "# Documentation learning-depth audit"
                echo
                echo "> Audit execution failed on the self-hosted runner. The output below is preserved for diagnosis."
                echo
                echo '```text'
                cat /tmp/documentation-audit.log
                echo '```'
              } > DOCUMENTATION-AUDIT.md

              "$PYTHON_BIN" -c "import json; from pathlib import Path; log=Path('/tmp/documentation-audit.log').read_text(encoding='utf-8', errors='replace'); Path('documentation-audit.json').write_text(json.dumps({'error': 'audit execution failed', 'log': log}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')"
            fi
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="${GITHUB_REF_NAME}"
          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin "$branch"
            remote_sha="$(git rev-parse "origin/${branch}")"

            if [ "$(git rev-parse HEAD)" != "$remote_sha" ]; then
              echo "Remote ${branch} advanced; regenerating from ${remote_sha}."
              git reset --hard "$remote_sha"
            fi

            synchronize_documentation
            git add ROADMAP.md GLOSSARY.md docs DOCUMENTATION-AUDIT.md documentation-audit.json

            if git diff --cached --quiet; then
              echo "Documentation is already synchronized at ${remote_sha}."
              exit 0
            fi

            git commit -m "docs: synchronize generated documentation"

            if git push origin "HEAD:${branch}"; then
              echo "Synchronized documentation pushed successfully."
              exit 0
            fi

            echo "::warning::Remote ${branch} changed during synchronization attempt ${attempt}; retrying from the latest remote state."
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Unable to push synchronized documentation after ${max_attempts} attempts."
              exit 1
            fi
          done

      - name: Validate synchronized documentation
        if: github.event_name == 'pull_request' || github.actor == 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/update_glossary.py --check
          "$PYTHON_BIN" scripts/update_navigation.py --check
          "$PYTHON_BIN" scripts/audit_learning_depth.py --all-docs --report /tmp/DOCUMENTATION-AUDIT.md --json /tmp/documentation-audit.json
