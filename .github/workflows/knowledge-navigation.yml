name: Knowledge documentation

on:
  push:
    branches:
      - main
      - agent/gitops-platform-block-3
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**/*.md"
      - "AUTHORING-GUIDE.md"
      - "templates/**/*.md"
      - "scripts/update_navigation.py"
      - "scripts/update_glossary.py"
      - "scripts/audit_learning_depth.py"
      - "scripts/assemble_gitops_block3_v2.py"
      - "scripts/integrate_gitops_block3.py"
      - "scripts/.gitops_block3_payload_*.txt"
      - "scripts/.gitops_block3_v2_*.txt"
      - ".github/workflows/knowledge-navigation.yml"
  pull_request:
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**/*.md"
      - "AUTHORING-GUIDE.md"
      - "templates/**/*.md"
      - "scripts/update_navigation.py"
      - "scripts/update_glossary.py"
      - "scripts/audit_learning_depth.py"
      - "scripts/assemble_gitops_block3_v2.py"
      - "scripts/integrate_gitops_block3.py"
      - "scripts/.gitops_block3_payload_*.txt"
      - "scripts/.gitops_block3_v2_*.txt"
      - ".github/workflows/knowledge-navigation.yml"

permissions:
  contents: write

concurrency:
  group: knowledge-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve Python interpreter
        shell: bash
        run: |
          set -euo pipefail

          if command -v python >/dev/null 2>&1; then
            python_bin="$(command -v python)"
          elif command -v python3 >/dev/null 2>&1; then
            python_bin="$(command -v python3)"
          else
            echo "::error::Neither python nor python3 is available after actions/setup-python."
            exit 1
          fi

          "$python_bin" --version
          echo "PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"

      - name: Synchronize and commit generated documentation
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail

          synchronize_documentation() {
            if [ -f scripts/integrate_gitops_block3.py ]; then
              "$PYTHON_BIN" scripts/assemble_gitops_block3_v2.py
              "$PYTHON_BIN" scripts/integrate_gitops_block3.py
              rm -f scripts/assemble_gitops_block3_v2.py scripts/integrate_gitops_block3.py scripts/.gitops_block3_payload_*.txt scripts/.gitops_block3_v2_*.txt
              git show 50a0b4c14318effd57b6f4d9f967f446d2709d6b:.github/workflows/knowledge-navigation.yml > .github/workflows/knowledge-navigation.yml
            fi

            "$PYTHON_BIN" scripts/update_glossary.py --write
            "$PYTHON_BIN" scripts/update_navigation.py --write

            set +e
            "$PYTHON_BIN" scripts/audit_learning_depth.py --all-docs > /tmp/documentation-audit.log 2>&1
            audit_status=$?
            set -e

            if [ "$audit_status" -ne 0 ]; then
              {
                echo "# Documentation learning-depth audit"
                echo
                echo "> Audit execution failed on the self-hosted runner. The output below is preserved for diagnosis."
                echo
                echo '```text'
                cat /tmp/documentation-audit.log
                echo '```'
              } > DOCUMENTATION-AUDIT.md

              "$PYTHON_BIN" -c "import json; from pathlib import Path; log=Path('/tmp/documentation-audit.log').read_text(encoding='utf-8', errors='replace'); Path('documentation-audit.json').write_text(json.dumps({'error': 'audit execution failed', 'log': log}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')"
            fi
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="${GITHUB_REF_NAME}"
          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin "$branch"
            remote_sha="$(git rev-parse "origin/${branch}")"

            if [ "$(git rev-parse HEAD)" != "$remote_sha" ]; then
              echo "Remote ${branch} advanced; regenerating from ${remote_sha}."
              git reset --hard "$remote_sha"
            fi

            synchronize_documentation
            git add -A

            if git diff --cached --quiet; then
              echo "Documentation is already synchronized at ${remote_sha}."
              exit 0
            fi

            git commit -m "docs(gitops): integrate third platform product block"

            if git push origin "HEAD:${branch}"; then
              echo "Synchronized documentation pushed successfully."
              exit 0
            fi

            echo "::warning::Remote ${branch} changed during synchronization attempt ${attempt}; retrying from the latest remote state."

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Unable to push synchronized documentation after ${max_attempts} attempts."
              exit 1
            fi
          done

      - name: Validate synchronized documentation
        if: github.event_name == 'pull_request' || github.actor == 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail

          if [ -f scripts/integrate_gitops_block3.py ]; then
            "$PYTHON_BIN" scripts/assemble_gitops_block3_v2.py
            "$PYTHON_BIN" scripts/integrate_gitops_block3.py
            rm -f scripts/assemble_gitops_block3_v2.py scripts/integrate_gitops_block3.py scripts/.gitops_block3_payload_*.txt scripts/.gitops_block3_v2_*.txt
          fi

          "$PYTHON_BIN" scripts/update_glossary.py --write
          "$PYTHON_BIN" scripts/update_navigation.py --write
          "$PYTHON_BIN" scripts/audit_learning_depth.py --all-docs --report /tmp/DOCUMENTATION-AUDIT.md --json /tmp/documentation-audit.json

          "$PYTHON_BIN" - <<'PY'
          import json
          from pathlib import Path

          targets = {
              "docs/16-gitops-and-platform-engineering/platform-as-a-product.md",
              "docs/16-gitops-and-platform-engineering/golden-paths-and-paved-road.md",
              "docs/16-gitops-and-platform-engineering/self-service.md",
              "docs/16-gitops-and-platform-engineering/developer-experience.md",
          }
          data = json.loads(Path('/tmp/documentation-audit.json').read_text(encoding='utf-8'))
          files = {item['path']: item for item in data.get('files', [])}
          missing = sorted(targets - files.keys())
          if missing:
              raise SystemExit(f"Missing block 3 audit subjects: {missing}")
          failed = False
          for path in sorted(targets):
              item = files[path]
              print(
                  f"{path}: critical={item['critical']} high={item['high']} "
                  f"medium={item['medium']} low={item['low']} words={item['words']}"
              )
              failed = failed or item['critical'] != 0
          if failed:
              raise SystemExit('GitOps block 3 contains critical learning-depth findings')
          PY

          git diff --check
