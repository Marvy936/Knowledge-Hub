name: Knowledge documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**/*.md"
      - "AUTHORING-GUIDE.md"
      - "templates/**/*.md"
      - "scripts/update_navigation.py"
      - "scripts/update_glossary.py"
      - "scripts/audit_learning_depth.py"
      - ".github/workflows/knowledge-navigation.yml"
  pull_request:
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**/*.md"
      - "AUTHORING-GUIDE.md"
      - "templates/**/*.md"
      - "scripts/update_navigation.py"
      - "scripts/update_glossary.py"
      - "scripts/audit_learning_depth.py"
      - ".github/workflows/knowledge-navigation.yml"

permissions:
  contents: write

concurrency:
  group: knowledge-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve Python interpreter
        shell: bash
        run: |
          set -euo pipefail

          if command -v python >/dev/null 2>&1; then
            python_bin="$(command -v python)"
          elif command -v python3 >/dev/null 2>&1; then
            python_bin="$(command -v python3)"
          else
            echo "::error::Neither python nor python3 is available after actions/setup-python."
            exit 1
          fi

          "$python_bin" --version
          echo "PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"

      - name: Remediate final Section 18 block
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/section-18-ml-fundamentals-block-25-26' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail

          branch="${{ github.head_ref }}"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"

          "$PYTHON_BIN" scripts/temporary_section_18_final_remediate.py
          "$PYTHON_BIN" scripts/update_glossary.py --write
          "$PYTHON_BIN" scripts/update_navigation.py --write
          "$PYTHON_BIN" scripts/audit_learning_depth.py --all-docs
          "$PYTHON_BIN" scripts/update_glossary.py --check
          "$PYTHON_BIN" scripts/update_navigation.py --check

          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path

          audit = Path("DOCUMENTATION-AUDIT.md").read_text(encoding="utf-8")
          files = [
              "offline-evaluation-production-outcome.md",
              "ml-troubleshooting-mental-model.md",
          ]
          remaining = [
              name
              for name in files
              if f"### `docs/18-machine-learning-fundamentals/{name}`" in audit
          ]
          if remaining:
              raise SystemExit(
                  f"Final block critical/high findings remain: {remaining}"
              )
          print("Section 18 final block has no critical/high audit entries.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ROADMAP.md \
            GLOSSARY.md \
            docs \
            DOCUMENTATION-REVIEW-STATUS.md \
            DOCUMENTATION-AUDIT.md \
            documentation-audit.json

          if git diff --cached --quiet; then
            echo "No remediation changes required."
            exit 0
          fi

          git commit -m "docs: remediate final Machine Learning findings"
          git push origin "HEAD:$branch"

      - name: Synchronize and commit generated documentation
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail

          synchronize_documentation() {
            "$PYTHON_BIN" scripts/update_glossary.py --write
            "$PYTHON_BIN" scripts/update_navigation.py --write

            set +e
            "$PYTHON_BIN" scripts/audit_learning_depth.py --all-docs > /tmp/documentation-audit.log 2>&1
            audit_status=$?
            set -e

            if [ "$audit_status" -ne 0 ]; then
              {
                echo "# Documentation learning-depth audit"
                echo
                echo "> Audit execution failed on the self-hosted runner. The output below is preserved for diagnosis."
                echo
                echo '```text'
                cat /tmp/documentation-audit.log
                echo '```'
              } > DOCUMENTATION-AUDIT.md

              "$PYTHON_BIN" -c "import json; from pathlib import Path; log=Path('/tmp/documentation-audit.log').read_text(encoding='utf-8', errors='replace'); Path('documentation-audit.json').write_text(json.dumps({'error': 'audit execution failed', 'log': log}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')"
            fi
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="${GITHUB_REF_NAME}"
          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin "$branch"
            remote_sha="$(git rev-parse "origin/${branch}")"

            if [ "$(git rev-parse HEAD)" != "$remote_sha" ]; then
              echo "Remote ${branch} advanced; regenerating from ${remote_sha}."
              git reset --hard "$remote_sha"
            fi

            synchronize_documentation
            git add ROADMAP.md GLOSSARY.md docs DOCUMENTATION-AUDIT.md documentation-audit.json

            if git diff --cached --quiet; then
              echo "Documentation is already synchronized at ${remote_sha}."
              exit 0
            fi

            git commit -m "docs: synchronize generated documentation"

            if git push origin "HEAD:${branch}"; then
              echo "Synchronized documentation pushed successfully."
              exit 0
            fi

            echo "::warning::Remote ${branch} changed during synchronization attempt ${attempt}; retrying from the latest remote state."

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Unable to push synchronized documentation after ${max_attempts} attempts."
              exit 1
            fi
          done

      - name: Validate synchronized documentation
        if: github.event_name == 'pull_request' || github.actor == 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/update_glossary.py --check
          "$PYTHON_BIN" scripts/update_navigation.py --check
          "$PYTHON_BIN" scripts/audit_learning_depth.py --all-docs --report /tmp/DOCUMENTATION-AUDIT.md --json /tmp/documentation-audit.json

  cleanup-branches:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete every remote branch except main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "User-Agent": "knowledge-hub-v1-branch-cleanup",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          names = []
          page = 1
          while True:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/branches?per_page=100&page={page}",
                  headers=headers,
              )
              with urllib.request.urlopen(request) as response:
                  batch = json.load(response)
              if not batch:
                  break
              names.extend(item["name"] for item in batch)
              if len(batch) < 100:
                  break
              page += 1

          deleted = []
          failures = []
          for name in sorted(set(names)):
              if name == "main":
                  continue
              encoded = urllib.parse.quote(name, safe="")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/refs/heads/{encoded}",
                  headers=headers,
                  method="DELETE",
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      if response.status != 204:
                          failures.append((name, response.status))
                          continue
                  deleted.append(name)
              except urllib.error.HTTPError as exc:
                  failures.append((name, exc.code))

          print(json.dumps({"deleted_count": len(deleted), "failures": failures}, sort_keys=True))
          if failures:
              raise SystemExit(f"Unable to delete {len(failures)} branch refs")
          PY
