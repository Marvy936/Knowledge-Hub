name: Knowledge documentation

on:
  pull_request:
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**/*.md"
      - "scripts/.gitops_block4_*.txt"
      - "scripts/assemble_gitops_block4.py"
      - "scripts/integrate_gitops_block4.py"
      - ".github/workflows/knowledge-navigation.yml"

permissions:
  contents: write

concurrency:
  group: knowledge-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Integrate and validate final GitOps block
        shell: bash
        run: |
          set -euo pipefail
          python scripts/assemble_gitops_block4.py
          python scripts/integrate_gitops_block4.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "::error::Final GitOps integration produced no changes."
            exit 1
          fi

          git commit -m "docs(gitops): integrate service catalog guardrails and multi-tenancy"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
