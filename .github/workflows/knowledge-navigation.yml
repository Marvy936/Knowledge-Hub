name: Knowledge documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**/*.md"
      - "AUTHORING-GUIDE.md"
      - "templates/**/*.md"
      - "scripts/**/*.py"
      - ".github/workflows/knowledge-navigation.yml"
  pull_request:
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**/*.md"
      - "AUTHORING-GUIDE.md"
      - "templates/**/*.md"
      - "scripts/**/*.py"
      - ".github/workflows/knowledge-navigation.yml"

permissions:
  contents: write

concurrency:
  group: knowledge-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve Python interpreter
        shell: bash
        run: |
          set -euo pipefail

          if command -v python >/dev/null 2>&1; then
            python_bin="$(command -v python)"
          elif command -v python3 >/dev/null 2>&1; then
            python_bin="$(command -v python3)"
          else
            echo "::error::Neither python nor python3 is available after actions/setup-python."
            exit 1
          fi

          "$python_bin" --version
          echo "PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"

      - name: Complete Databases and Distributed Systems section
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="${GITHUB_REF_NAME}"
          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin "$branch"
            remote_sha="$(git rev-parse "origin/${branch}")"

            if [ "$(git rev-parse HEAD)" != "$remote_sha" ]; then
              echo "Remote ${branch} advanced; retrying from ${remote_sha}."
              git reset --hard "$remote_sha"
            fi

            if [ ! -f scripts/integrate_database_section_final.py ]; then
              echo "::error::Temporary database finalizer is missing."
              exit 1
            fi

            "$PYTHON_BIN" scripts/integrate_database_section_final.py
            "$PYTHON_BIN" scripts/update_glossary.py --write
            "$PYTHON_BIN" scripts/update_navigation.py --write

            set +e
            "$PYTHON_BIN" scripts/audit_learning_depth.py --all-docs --report /tmp/DOCUMENTATION-AUDIT.md --json /tmp/documentation-audit.json
            audit_status=$?
            set -e

            if [ "$audit_status" -ne 0 ]; then
              cat /tmp/DOCUMENTATION-AUDIT.md || true
              echo "::error::Final database section learning-depth audit failed."
              exit "$audit_status"
            fi

            git show 22aaec3e1247cb16aaeb2a9334031943cc6b5658:.github/workflows/knowledge-navigation.yml > .github/workflows/knowledge-navigation.yml
            rm -f scripts/integrate_database_section_final.py
            rm -f docs/review-trigger-final-database.md

            git add -A

            if git diff --cached --quiet; then
              echo "Database section is already finalized at ${remote_sha}."
              exit 0
            fi

            git commit -m "docs(review): complete Databases and Distributed Systems authoritative section"

            if git push origin "HEAD:${branch}"; then
              echo "Database section completion pushed successfully."
              exit 0
            fi

            echo "::warning::Remote ${branch} changed during finalization attempt ${attempt}; retrying."

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Unable to push database section completion after ${max_attempts} attempts."
              exit 1
            fi
          done

      - name: Validate synchronized documentation
        if: github.event_name == 'pull_request' || github.actor == 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/update_glossary.py --check
          "$PYTHON_BIN" scripts/update_navigation.py --check
          "$PYTHON_BIN" scripts/audit_learning_depth.py --all-docs --report /tmp/DOCUMENTATION-AUDIT.md --json /tmp/documentation-audit.json
