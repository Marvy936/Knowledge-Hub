name: Knowledge documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**/*.md"
      - "AUTHORING-GUIDE.md"
      - "templates/**/*.md"
      - "scripts/update_navigation.py"
      - "scripts/update_glossary.py"
      - "scripts/audit_learning_depth.py"
      - ".github/workflows/knowledge-navigation.yml"
  pull_request:
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**/*.md"
      - "AUTHORING-GUIDE.md"
      - "templates/**/*.md"
      - "scripts/update_navigation.py"
      - "scripts/update_glossary.py"
      - "scripts/audit_learning_depth.py"
      - ".github/workflows/knowledge-navigation.yml"

permissions:
  contents: write

concurrency:
  group: knowledge-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize generated documentation
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write

          set +e
          python scripts/audit_learning_depth.py --all-docs > /tmp/documentation-audit.log 2>&1
          audit_status=$?
          set -e

          if [ "$audit_status" -ne 0 ]; then
            {
              echo "# Documentation learning-depth audit"
              echo
              echo "> Audit execution failed on the self-hosted runner. The output below is preserved for diagnosis."
              echo
              echo '```text'
              cat /tmp/documentation-audit.log
              echo '```'
            } > DOCUMENTATION-AUDIT.md

            python - <<'PY'
          import json
          from pathlib import Path
          log = Path('/tmp/documentation-audit.log').read_text(encoding='utf-8', errors='replace')
          Path('documentation-audit.json').write_text(
              json.dumps({'error': 'audit execution failed', 'log': log}, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          fi

      - name: Commit synchronized documentation
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Documentation is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md GLOSSARY.md docs DOCUMENTATION-AUDIT.md documentation-audit.json
          git commit -m "docs: synchronize generated documentation"
          git push

      - name: Validate synchronized documentation
        if: github.event_name == 'pull_request' || github.actor == 'github-actions[bot]'
        run: |
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check
          python scripts/audit_learning_depth.py --all-docs --report /tmp/DOCUMENTATION-AUDIT.md --json /tmp/documentation-audit.json
