name: Knowledge navigation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "scripts/update_navigation.py"
      - ".github/workflows/knowledge-navigation.yml"
  pull_request:
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "scripts/update_navigation.py"
      - ".github/workflows/knowledge-navigation.yml"

permissions:
  contents: write

concurrency:
  group: knowledge-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize generated navigation
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: python scripts/update_navigation.py --write

      - name: Commit synchronized documentation
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Navigation is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md docs
          git commit -m "docs: synchronize generated navigation"
          git push

      - name: Validate synchronized navigation
        if: github.event_name == 'pull_request' || github.actor == 'github-actions[bot]'
        run: python scripts/update_navigation.py --check
