name: Knowledge documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**/*.md"
      - "AUTHORING-GUIDE.md"
      - "templates/**/*.md"
      - "scripts/update_navigation.py"
      - "scripts/update_glossary.py"
      - "scripts/audit_learning_depth.py"
      - ".github/workflows/knowledge-navigation.yml"
  pull_request:
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**/*.md"
      - "AUTHORING-GUIDE.md"
      - "templates/**/*.md"
      - "scripts/update_navigation.py"
      - "scripts/update_glossary.py"
      - "scripts/audit_learning_depth.py"
      - ".github/workflows/knowledge-navigation.yml"

permissions:
  contents: write

concurrency:
  group: knowledge-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize and commit generated documentation
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail

          synchronize_documentation() {
            python scripts/update_glossary.py --write
            python scripts/update_navigation.py --write

            set +e
            python scripts/audit_learning_depth.py --all-docs > /tmp/documentation-audit.log 2>&1
            audit_status=$?
            set -e

            if [ "$audit_status" -ne 0 ]; then
              {
                echo "# Documentation learning-depth audit"
                echo
                echo "> Audit execution failed on the self-hosted runner. The output below is preserved for diagnosis."
                echo
                echo '```text'
                cat /tmp/documentation-audit.log
                echo '```'
              } > DOCUMENTATION-AUDIT.md

              python -c "import json; from pathlib import Path; log=Path('/tmp/documentation-audit.log').read_text(encoding='utf-8', errors='replace'); Path('documentation-audit.json').write_text(json.dumps({'error': 'audit execution failed', 'log': log}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')"
            fi
          }

          update_cloud_ledger_once() {
            python - <<'PY'
          from pathlib import Path

          path = Path("DOCUMENTATION-REVIEW-STATUS.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          prefix = "| `11-cloud-and-aws` — Cloud and AWS |"
          replacement = "| `11-cloud-and-aws` — Cloud and AWS | 8/28 strict revalidation | In progress | 2026-07-28 | Prvých osem authoritative kapitol prešlo manuálnym strict narrative/mechanism/scenario gate-om a používa connected Atlas Payments cloud-adoption subject `CAP-PAY-42`. Prvý blok pokrýva service/deployment model, Region/AZ placement a shared responsibility. Druhý blok bol kompletne prepísaný: `Scalability, elasticity a fault tolerance` používa `business demand/availability objective → workload unit a end-to-end capacity model → bottleneck/failure-domain inventory → scaling alebo failover policy → provisioning/traffic redistribution → serving-capacity realization → downstream/failure behavior → business outcome → scale-in/recovery`; `High availability a disaster recovery` používa `business capability/BIA → dependency/state/trust inventory → failure/disaster scenarios → RTO/RPO contract → HA/DR strategy → backup/replication/isolation evidence → detection/declaration → recovery-point selection/environment activation → reconciliation → traffic cutover/failback`; `AWS Organizations a accounts` používa `workload/risk profile → account request/owner → OU/policy placement → account creation/enrollment → identity/logging/network/security baseline → workload/delegated administration → effective organization policy → operation/incident containment → quarantine/closure`; `IAM` používa `operation intent → credential source/principal session → exact API request → trust/authentication → identity/resource grants → boundary/session/SCP/RCP envelopes → conditions/dependent-service checks → allow/deny → side effect → CloudTrail/business outcome → rotation/revocation`. Worked failures pokrývajú retry-amplified autoscaling, ktoré scale-outom preťažilo DB connection envelope; validný DR snapshot s nekonzistentným ledger/queue checkpointom a kompromitovanými credentials; recovery account presunutý do `Suspended` OU a zablokovaný SCP napriek lokálnemu AdministratorAccess; a Pod používajúci legacy environment access key namiesto očakávanej workload role. Každá kapitola používa exact subject identity, competing hypotheses, discriminating observations, evidence-preserving containment, authoritative recovery, original aj forbidden outcome a earlier controls. README ordering a navigation chain `Shared responsibility → Scalability → HA/DR → Organizations → IAM → VPC` boli overené obojsmerne. Existujúci cloud foundations glossary zostal zachovaný a nový section-specific doplnok pridal capacity, recovery-set, governed-account a effective-authorization terminology. Automatický generated-documentation workflow synchronizoval docs a glossary commity. Zostáva 20 kapitol a finálny section-level pass. |"

          matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one Cloud and AWS row, found {len(matches)}")

          if "| 4/28 strict revalidation |" in lines[matches[0]]:
              lines[matches[0]] = replacement
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

            rm -f .github/workflows/one-time-cloud-ledger.yml
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="${GITHUB_REF_NAME}"
          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin "$branch"
            remote_sha="$(git rev-parse "origin/${branch}")"

            if [ "$(git rev-parse HEAD)" != "$remote_sha" ]; then
              echo "Remote ${branch} advanced; regenerating from ${remote_sha}."
              git reset --hard "$remote_sha"
            fi

            update_cloud_ledger_once
            synchronize_documentation
            git add ROADMAP.md GLOSSARY.md docs DOCUMENTATION-AUDIT.md documentation-audit.json DOCUMENTATION-REVIEW-STATUS.md .github/workflows/one-time-cloud-ledger.yml

            if git diff --cached --quiet; then
              echo "Documentation is already synchronized at ${remote_sha}."
              exit 0
            fi

            git commit -m "docs: synchronize generated documentation"

            if git push origin "HEAD:${branch}"; then
              echo "Synchronized documentation pushed successfully."
              exit 0
            fi

            echo "::warning::Remote ${branch} changed during synchronization attempt ${attempt}; retrying from the latest remote state."

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Unable to push synchronized documentation after ${max_attempts} attempts."
              exit 1
            fi
          done

      - name: Validate synchronized documentation
        if: github.event_name == 'pull_request' || github.actor == 'github-actions[bot]'
        run: |
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check
          python scripts/audit_learning_depth.py --all-docs --report /tmp/DOCUMENTATION-AUDIT.md --json /tmp/documentation-audit.json
