name: Knowledge documentation

on:
  push:
    branches:
      - main
      - agent/gitops-platform-block-3
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**/*.md"
      - "AUTHORING-GUIDE.md"
      - "templates/**/*.md"
      - "scripts/update_navigation.py"
      - "scripts/update_glossary.py"
      - "scripts/audit_learning_depth.py"
      - "scripts/remediate_gitops_block3_supply_chain.py"
      - ".github/workflows/knowledge-navigation.yml"
  pull_request:
    paths:
      - "docs/**/*.md"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**/*.md"
      - "AUTHORING-GUIDE.md"
      - "templates/**/*.md"
      - "scripts/update_navigation.py"
      - "scripts/update_glossary.py"
      - "scripts/audit_learning_depth.py"
      - ".github/workflows/knowledge-navigation.yml"

permissions:
  contents: write

concurrency:
  group: knowledge-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve Python interpreter
        shell: bash
        run: |
          set -euo pipefail
          if command -v python >/dev/null 2>&1; then
            python_bin="$(command -v python)"
          else
            python_bin="$(command -v python3)"
          fi
          "$python_bin" --version
          echo "PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"

      - name: Apply strict supply-chain remediation
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME}"
          git fetch origin "$branch"
          git reset --hard "origin/${branch}"
          "$PYTHON_BIN" scripts/remediate_gitops_block3_supply_chain.py
          rm -f scripts/remediate_gitops_block3_supply_chain.py
          git show 50a0b4c14318effd57b6f4d9f967f446d2709d6b:.github/workflows/knowledge-navigation.yml > .github/workflows/knowledge-navigation.yml
          "$PYTHON_BIN" scripts/update_glossary.py --write
          "$PYTHON_BIN" scripts/update_navigation.py --write
          "$PYTHON_BIN" scripts/audit_learning_depth.py --all-docs --report DOCUMENTATION-AUDIT.md --json documentation-audit.json
          git add -A
          git commit -m "docs(gitops): close third block supply-chain depth gap"
          git push origin "HEAD:${branch}"

      - name: Validate synchronized documentation
        if: github.event_name == 'pull_request' || github.actor == 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/update_glossary.py --check
          "$PYTHON_BIN" scripts/update_navigation.py --check
          "$PYTHON_BIN" scripts/audit_learning_depth.py --all-docs --report /tmp/DOCUMENTATION-AUDIT.md --json /tmp/documentation-audit.json
          git diff --check
