name: Section 07 combined depth

on:
  push:
    branches:
      - agent/section-07-explanation-depth
    paths:
      - scripts/section_07_run_all.py
      - .github/workflows/section-07-all-depth.yml

permissions:
  contents: write

concurrency:
  group: section-07-all-depth
  cancel-in-progress: true

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-07-explanation-depth
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply combined depth pass
        shell: bash
        run: |
          set -euo pipefail
          python scripts/section_07_run_all.py
          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/07-infrastructure-as-code-and-configuration-management DOCUMENTATION-AUDIT.md documentation-audit.json GLOSSARY.md ROADMAP.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          git commit -m "docs: deepen Section 07 Terraform and Ansible explanations"
          git pull --rebase origin agent/section-07-explanation-depth
          git push origin HEAD:agent/section-07-explanation-depth
