name: Practical v1 release candidate

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "labs/machine-learning/**"
      - "labs/mlops/**"
      - "labs/llm-rag/**"
      - "labs/agent-ops/**"
      - "labs/keycloak-ai-api/**"
      - "scripts/practical_v1_core.py"
      - "scripts/run_practical_v1_release_candidate.py"
      - "scripts/validate_practical_v1_repo.py"
      - "scripts/tests/**"
      - ".github/workflows/practical-v1-release-candidate.yml"
      - "PRACTICAL-V1-ROADMAP.md"
      - "PRACTICAL-STATUS.md"
      - "PRACTICAL-V1-EVIDENCE.md"
      - "RELEASE-NOTES-v1.0.0-DRAFT.md"
      - "README.md"
      - "labs/README.md"
  push:
    branches: [main]
    paths:
      - "labs/machine-learning/**"
      - "labs/mlops/**"
      - "labs/llm-rag/**"
      - "labs/agent-ops/**"
      - "labs/keycloak-ai-api/**"
      - "scripts/practical_v1_core.py"
      - "scripts/run_practical_v1_release_candidate.py"
      - "scripts/validate_practical_v1_repo.py"
      - "scripts/tests/**"
      - ".github/workflows/practical-v1-release-candidate.yml"
      - "PRACTICAL-V1-ROADMAP.md"
      - "PRACTICAL-STATUS.md"
      - "PRACTICAL-V1-EVIDENCE.md"
      - "RELEASE-NOTES-v1.0.0-DRAFT.md"
      - "README.md"
      - "labs/README.md"

permissions:
  contents: read

concurrency:
  group: practical-v1-release-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      release_candidate_id: ${{ steps.evidence.outputs.release_candidate_id }}
      core_evidence_id: ${{ steps.evidence.outputs.core_evidence_id }}
      mlops_evidence_id: ${{ steps.evidence.outputs.mlops_evidence_id }}
      rag_evidence_id: ${{ steps.evidence.outputs.rag_evidence_id }}
      identity_evidence_id: ${{ steps.evidence.outputs.identity_evidence_id }}
      artifact_manifest_id: ${{ steps.evidence.outputs.artifact_manifest_id }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VENV_DIR: "${{ github.workspace }}/../knowledge-hub-practical-v1-rc-venv"
      PACKAGE_ROOT: "/tmp/knowledge-hub-practical-v1-rc-packages"
      WORK_ROOT: "${{ github.workspace }}/../knowledge-hub-practical-v1-rc-work"
      EVIDENCE_DIR: "/tmp/knowledge-hub-practical-v1-rc-evidence"
      RC_EVIDENCE: "/tmp/knowledge-hub-practical-v1-rc-evidence/release-candidate.json"

    steps:
      - name: Checkout exact release-candidate subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Verify Docker and Compose runtime
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Install immutable local package snapshots
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VENV_DIR" "$PACKAGE_ROOT" "$WORK_ROOT" "$EVIDENCE_DIR" .runtime
          mkdir -p "$PACKAGE_ROOT"
          cp -a labs/machine-learning "$PACKAGE_ROOT/machine-learning"
          cp -a labs/mlops "$PACKAGE_ROOT/mlops"
          cp -a labs/llm-rag "$PACKAGE_ROOT/llm-rag"
          cp -a labs/agent-ops "$PACKAGE_ROOT/agent-ops"
          cp -a labs/keycloak-ai-api "$PACKAGE_ROOT/keycloak-ai-api"
          python -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/python" -m pip install \
            "$PACKAGE_ROOT/machine-learning[dev]" \
            "$PACKAGE_ROOT/mlops[dev,registry,serving]" \
            "$PACKAGE_ROOT/llm-rag[dev]" \
            "$PACKAGE_ROOT/agent-ops[dev]" \
            "$PACKAGE_ROOT/keycloak-ai-api[dev]"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run release-tooling contract tests
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" -m pytest scripts/tests -q -p no:cacheprovider
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Execute exact Practical v1 release-candidate lifecycle
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" scripts/run_practical_v1_release_candidate.py \
            --repo-root . \
            --subject-sha "$SUBJECT_SHA" \
            --work-root "$WORK_ROOT" \
            --evidence-dir "$EVIDENCE_DIR" \
            --output "$RC_EVIDENCE"

      - name: Verify release-candidate component evidence
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_DIR"])
          rc = json.loads(Path(os.environ["RC_EVIDENCE"]).read_text(encoding="utf-8"))
          assert rc["subject_sha"] == os.environ["SUBJECT_SHA"]
          assert rc["all_passed"] is True
          assert rc["cleanup_verified"] is True
          assert rc["repository_clean_after"] is True
          assert list(rc["components"]) == ["core", "identity", "mlops", "rag"] or set(rc["components"]) == {"core", "mlops", "rag", "identity"}
          assert rc["proof_boundary"]["release_tag_created"] is False
          assert rc["proof_boundary"]["user_acceptance_claimed"] is False
          assert rc["proof_boundary"]["remote_oci_registry_claimed"] is False
          assert rc["proof_boundary"]["production_platform_claimed"] is False
          assert rc["proof_boundary"]["production_identity_claimed"] is False
          for name in ("core", "mlops", "rag", "identity"):
              path = root / f"{name}.json"
              assert path.is_file()
              value = json.loads(path.read_text(encoding="utf-8"))
              assert value["subject_sha"] == os.environ["SUBJECT_SHA"]
              assert len(value["evidence_id"]) == 64
              assert rc["components"][name]["evidence_id"] == value["evidence_id"]
          assert len(rc["release_candidate_id"]) == 64
          PY

      - name: Cleanup outer release-candidate runtime
        shell: bash
        run: |
          set -euo pipefail
          project="kh-keycloak-runtime-${SUBJECT_SHA:0:12}"
          docker compose \
            --project-name "$project" \
            -f labs/keycloak-ai-api/compose.yaml \
            down -v --remove-orphans || true
          pkill -f "$VENV_DIR/bin/python.*-m mlflow server" 2>/dev/null || true
          docker ps -aq --filter "name=kh-mlops-runtime-" | xargs -r docker rm -f
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
            | awk '$1 ~ /^knowledge-hub-mlops-runtime:/ {print $2}' \
            | sort -u \
            | xargs -r docker image rm -f || true
          rm -rf "$PACKAGE_ROOT" "$WORK_ROOT" .runtime
          test ! -e "$PACKAGE_ROOT"
          test ! -e "$WORK_ROOT"
          test ! -e .runtime
          test -z "$(docker ps -aq --filter 'name=kh-mlops-runtime-')"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Finalize release-candidate evidence manifest
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          "$VENV_DIR/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_DIR"])
          rc_path = Path(os.environ["RC_EVIDENCE"])
          rc = json.loads(rc_path.read_text(encoding="utf-8"))
          rc["workflow_cleanup_verified"] = True
          payload = {key: value for key, value in rc.items() if key != "release_candidate_id"}
          rc["release_candidate_id"] = hashlib.sha256(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          rc_path.write_text(json.dumps(rc, sort_keys=True, indent=2) + "\n", encoding="utf-8")

          files = {}
          for path in sorted(root.glob("*.json")):
              if path.name == "artifact-manifest.json":
                  continue
              files[path.name] = {
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size_bytes": path.stat().st_size,
              }
          manifest_payload = {
              "schema_version": 1,
              "subject_sha": os.environ["SUBJECT_SHA"],
              "release_candidate_id": rc["release_candidate_id"],
              "workflow_cleanup_verified": True,
              "files": files,
          }
          manifest_id = hashlib.sha256(
              json.dumps(
                  manifest_payload,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()
          (root / "artifact-manifest.json").write_text(
              json.dumps({**manifest_payload, "manifest_id": manifest_id}, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )

          values = {
              "release_candidate_id": rc["release_candidate_id"],
              "core_evidence_id": rc["components"]["core"]["evidence_id"],
              "mlops_evidence_id": rc["components"]["mlops"]["evidence_id"],
              "rag_evidence_id": rc["components"]["rag"]["evidence_id"],
              "identity_evidence_id": rc["components"]["identity"]["evidence_id"],
              "artifact_manifest_id": manifest_id,
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          print(json.dumps(values, sort_keys=True))
          PY

      - name: Upload canonical release-candidate evidence bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: practical-v1-release-candidate-${{ env.SUBJECT_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup virtual environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VENV_DIR" "$PACKAGE_ROOT"
          test ! -e "$VENV_DIR"
          test ! -e "$PACKAGE_ROOT"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Emergency cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          project="kh-keycloak-runtime-${SUBJECT_SHA:0:12}"
          docker compose \
            --project-name "$project" \
            -f labs/keycloak-ai-api/compose.yaml \
            down -v --remove-orphans || true
          pkill -f "$VENV_DIR/bin/python.*-m mlflow server" 2>/dev/null || true
          docker ps -aq --filter "name=kh-mlops-runtime-" | xargs -r docker rm -f
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
            | awk '$1 ~ /^knowledge-hub-mlops-runtime:/ {print $2}' \
            | sort -u \
            | xargs -r docker image rm -f || true
          rm -rf "$PACKAGE_ROOT" "$WORK_ROOT" .runtime "$VENV_DIR"
          test ! -e "$PACKAGE_ROOT"
          test ! -e "$WORK_ROOT"
          test ! -e .runtime
          test ! -e "$VENV_DIR"

  publish-main-statuses:
    if: github.event_name == 'push' && always()
    needs: release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      RUNTIME_RESULT: ${{ needs.release-candidate.result }}
      RC_ID: ${{ needs.release-candidate.outputs.release_candidate_id }}
      CORE_ID: ${{ needs.release-candidate.outputs.core_evidence_id }}
      MLOPS_ID: ${{ needs.release-candidate.outputs.mlops_evidence_id }}
      RAG_ID: ${{ needs.release-candidate.outputs.rag_evidence_id }}
      IDENTITY_ID: ${{ needs.release-candidate.outputs.identity_evidence_id }}
      MANIFEST_ID: ${{ needs.release-candidate.outputs.artifact_manifest_id }}
      ARTIFACT_ID: ${{ needs.release-candidate.outputs.artifact_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      SUBJECT_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Publish connector-readable release-candidate statuses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          success = os.environ["RUNTIME_RESULT"] == "success"
          statuses = [
              {
                  "context": "knowledge-hub/practical-v1-release-candidate",
                  "state": "success" if success else "failure",
                  "description": (
                      "core + MLOps + RAG + Keycloak/agent release-candidate gates passed"
                      if success
                      else "Practical v1 release-candidate gate failed"
                  ),
              }
          ]
          if success:
              statuses.extend(
                  [
                      {
                          "context": "knowledge-hub/practical-v1-rc-evidence",
                          "state": "success",
                          "description": f"rc={os.environ['RC_ID']}; artifact={os.environ['ARTIFACT_ID']}",
                      },
                      {
                          "context": "knowledge-hub/practical-v1-rc-components",
                          "state": "success",
                          "description": f"core={os.environ['CORE_ID']}; mlops={os.environ['MLOPS_ID']}",
                      },
                      {
                          "context": "knowledge-hub/practical-v1-rc-ai",
                          "state": "success",
                          "description": f"rag={os.environ['RAG_ID']}; identity={os.environ['IDENTITY_ID']}",
                      },
                      {
                          "context": "knowledge-hub/practical-v1-rc-manifest",
                          "state": "success",
                          "description": f"manifest={os.environ['MANIFEST_ID']}",
                      },
                  ]
              )

          url = (
              "https://api.github.com/repos/"
              + os.environ["REPOSITORY"]
              + "/statuses/"
              + os.environ["SUBJECT_SHA"]
          )
          for status in statuses:
              request = urllib.request.Request(
                  url,
                  data=json.dumps(
                      {
                          **status,
                          "description": status["description"][:140],
                          "target_url": os.environ["RUN_URL"],
                      }
                  ).encode("utf-8"),
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Content-Type": "application/json",
                      "User-Agent": "knowledge-hub-practical-v1-release-candidate",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  if response.status != 201:
                      raise SystemExit(f"Unexpected status API response: {response.status}")
          PY
