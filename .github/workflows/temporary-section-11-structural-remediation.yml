name: Temporary section 10 focused remediation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/sections-10-13-prose-first-revalidation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-section-10-focused-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: self-hosted
    steps:
      - name: Checkout coordinator branch
        uses: actions/checkout@v4
        with:
          ref: agent/sections-10-13-prose-first-revalidation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fix the remaining Section 10 findings
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin agent/section-10-practical-helm-examples
          git checkout -B section-10-remediation origin/agent/section-10-practical-helm-examples

          python - <<'PY'
          from pathlib import Path

          root = Path('docs/10-helm-and-cka')

          walkthrough = root / 'helm-chart-practical-walkthrough.md'
          text = walkthrough.read_text(encoding='utf-8')
          old = '''Význam flags:

- `--install` vytvorí release, ak ešte neexistuje;
- `--atomic` pri zlyhaní upgrade-u požiada Helm o rollback a automaticky zapína čakanie;
- `--wait` čaká na vybrané Kubernetes readiness conditions;
- `--timeout` ohraničí čakanie, nie celý business recovery čas;
- `--history-max` obmedzí počet uložených revisions.
'''
          new = '''Tento príkaz má dve vstupné vetvy. `--install` dovolí vytvoriť release, keď ešte neexistuje; pri existujúcom release-e sa vykonáva upgrade z aktuálnej revision na candidate generation. Preto pred prvým spustením aj opakovaným upgrade-om musí byť rovnaký release name, namespace a chart source súčasťou exact subjectu.

`--wait` čaká na vybrané Kubernetes readiness conditions a `--timeout 5m` ohraničuje toto čakanie. Nejde o päťminútový business recovery limit a úspešné čakanie nepreukazuje funkčnú Service cestu, správne načítanú konfiguráciu ani payment outcome. Tieto hranice sa overujú samostatnými runtime a business testami po release transition.

`--atomic` pri neúspešnom upgrade-e požiada Helm o návrat k predchádzajúcemu release state-u a automaticky zapína čakanie. Nevracia však databázovú migráciu, odoslaný event ani externý side effect. `--history-max 10` iba obmedzuje počet Helm revisions uchovaných pre release; nemení retention externých dát ani kompatibilitu rollbacku. Flags teda znižujú mechanické riziko transition, ale nenahrádzajú recovery rozhodnutie.
'''
          if old not in text:
              raise SystemExit('Expected walkthrough flag block was not found')
          walkthrough.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          named = root / 'named-templates.md'
          text = named.read_text(encoding='utf-8')
          old = '''```bash
helm template payments-dev ./atlas-payments \\
  --show-only templates/deployment.yaml \\
  | yq '.metadata.labels'
```'''
          new = '''```bash
helm lint ./atlas-payments

helm template payments-dev ./atlas-payments \\
  --show-only templates/deployment.yaml \\
  > /tmp/named-template-deployment.yaml

yq '.metadata.labels' /tmp/named-template-deployment.yaml

helm template payments-dev ./atlas-payments \\
  --show-only templates/deployment.yaml \\
  --debug > /tmp/named-template-debug.txt
```'''
          if old not in text:
              raise SystemExit('Expected named-template command block was not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'Očakávaný output obsahuje stabilné release a component labels:',
              '`helm lint` najprv overí chart-level template a convention chyby. Druhý príkaz uloží presný rendered Deployment, takže `yq` číta semantic field path namiesto vizuálneho odhadu. `--debug` zachová širší render context pri failure-i; jeho úspech stále nepreukazuje API admission ani runtime. Očakávaný label output je:',
              1,
          )
          named.write_text(text, encoding='utf-8', newline='\n')

          timed = root / 'cka-timed-labs.md'
          text = timed.read_text(encoding='utf-8')
          heading = '## Executable timed lab: bezpečný image rollout a Service verification'
          if heading not in text:
              marker = '## Glossary impact' if '## Glossary impact' in text else '## Primárne zdroje'
              addition = r'''
## Executable timed lab: bezpečný image rollout a Service verification

Lab `CKA-WRK-21` dáva 12 minút na zmenu image Deploymentu `payments-api` v namespace `payments` bez zníženia available replicas pod dve. Najprv sa fixne context a current generation; príkazy ešte nič nemenia:

```bash
kubectl config current-context
kubectl config view --minify
kubectl -n payments get deployment payments-api -o wide
kubectl -n payments get deployment payments-api -o yaml > /tmp/payments-before.yaml
```

Prvé dva príkazy chránia pred správnou zmenou v nesprávnom clustri. Live YAML zachová selector, strategy, image a generation pre neskorší forbidden-change diff. Samotné uloženie súboru nepreukazuje, že resource je zdravý; preto sa pred mutation overí current availability:

```bash
kubectl -n payments get deployment payments-api \
  -o jsonpath='{.status.availableReplicas}{"/"}{.spec.replicas}{"\n"}'
kubectl -n payments get pods \
  -l app.kubernetes.io/name=payments-api -o wide
```

Candidate image sa nastaví exact digestom a controller transition sa sleduje oddelene od command exit code-u:

```bash
kubectl -n payments set image deployment/payments-api \
  api=registry.example.com/payments-api@sha256:4444444444444444444444444444444444444444444444444444444444444444

kubectl -n payments rollout status deployment/payments-api --timeout=4m
kubectl -n payments get deployment payments-api \
  -o jsonpath='{.spec.template.spec.containers[?(@.name=="api")].image}{"\n"}'
```

`set image` preukazuje iba accepted mutation. `rollout status` overí Deployment controller a readiness conditions; JSONPath potvrdí exact digest v live Pod template. Serving path sa ešte testuje cez Service z izolovaného probe Podu:

```bash
kubectl -n payments get service,endpointslice \
  -l app.kubernetes.io/name=payments-api

kubectl -n payments run payments-probe \
  --image=curlimages/curl:8.10.1 \
  --restart=Never --rm -i \
  -- curl -fsS http://payments-api:8080/ready
```

Nakoniec sa porovná zachovanie selectoru a strategy. Zakázaná skratka je zmazať affinity, probes alebo rollout constraints iba preto, aby nové Pody nabehli. Pri neúspechu sa číta new ReplicaSet, Events a Pod reason; nevykonáva sa ďalší nesúvisiaci patch. Task je uzavretý až po exact image, požadovanej availability, funkčnej Service ceste a diff-e bez forbidden changes.

'''
              if marker not in text:
                  raise SystemExit('Insertion marker missing in cka-timed-labs.md')
              text = text.replace(marker, addition.strip() + '\n\n' + marker, 1)
              timed.write_text(text, encoding='utf-8', newline='\n')

          drills = root / 'cka-troubleshooting-drills.md'
          text = drills.read_text(encoding='utf-8')
          heading = '## Executable drill: Ready Pody, ale Service nemá endpointy'
          if heading not in text:
              marker = '## Glossary impact' if '## Glossary impact' in text else '## Primárne zdroje'
              addition = r'''
## Executable drill: Ready Pody, ale Service nemá endpointy

Drill `CKA-SVC-24` začína symptómom `503` cez Service `payments-api`, hoci dva application Pody sú `Ready`. Najprv sa zachová exact Service, Deployment a endpoint generation bez restartu:

```bash
kubectl -n payments get service payments-api -o yaml > /tmp/service-before.yaml
kubectl -n payments get deployment,pod -l app.kubernetes.io/name=payments-api -o wide
kubectl -n payments get endpointslice \
  -l kubernetes.io/service-name=payments-api -o yaml
kubectl -n payments get events --sort-by=.lastTimestamp | tail -n 30
```

Ak EndpointSlice nemá endpoints, hypotézy sú selector mismatch, Pody bez readiness, wrong namespace alebo controller problem. Service selector sa preto porovná s live Pod labels:

```bash
kubectl -n payments get service payments-api \
  -o jsonpath='{.spec.selector}{"\n"}'
kubectl -n payments get pods \
  -l app.kubernetes.io/name=payments-api --show-labels
kubectl -n payments get pod \
  -l app.kubernetes.io/name=payments-api \
  -o jsonpath='{range .items[*]}{.metadata.name}{" ready="}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}'
```

Observation ukáže, že Service vyberá `app=payment-api`, zatiaľ čo Pody majú `app=payments-api`. To lokalizuje failure na selector contract; container log ani Node restart nie sú relevantná prvá oprava. Pred mutation sa uloží intended selector z Deployment template a potom sa opraví autoritatívny Service field:

```bash
kubectl -n payments patch service payments-api --type=merge \
  -p '{"spec":{"selector":{"app":"payments-api"}}}'

kubectl -n payments get endpointslice \
  -l kubernetes.io/service-name=payments-api -w
```

Po vzniku endpoints sa vykoná actual request, nie iba control-plane read-back:

```bash
kubectl -n payments run service-probe \
  --image=curlimages/curl:8.10.1 \
  --restart=Never --rm -i \
  -- curl -fsS http://payments-api:8080/ready

kubectl -n payments diff -f /tmp/service-before.yaml || true
```

Diff musí ukázať iba intended selector transition. Zakázané výsledky sú odstránenie readiness probe, broad NetworkPolicy bypass alebo zmena Service identity/portu. Second-operation test zopakuje rovnaký patch; resource generation a endpoints musia zostať stabilné bez ďalšieho side effectu. Takto drill preukazuje symptom, diskriminačný observation point, minimálnu opravu aj stabilitu po opakovaní.

'''
              if marker not in text:
                  raise SystemExit('Insertion marker missing in cka-troubleshooting-drills.md')
              text = text.replace(marker, addition.strip() + '\n\n' + marker, 1)
              drills.write_text(text, encoding='utf-8', newline='\n')
          PY

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          git add docs
          if git diff --cached --quiet; then
            echo 'No Section 10 remediation changes were needed.'
            exit 0
          fi

          git commit -m "docs(helm): close practical command and prose findings"
          git push origin HEAD:agent/section-10-practical-helm-examples
