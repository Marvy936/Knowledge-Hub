name: Keycloak section final verification

on:
  push:
    branches:
      - agent/section-17-keycloak-block-29-30
    paths:
      - scripts/section_17_final_verify.py
      - .github/workflows/section-17-final-verify.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/section_17_final_verify.py
      - .github/workflows/section-17-final-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-17-keycloak-block-29-30
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify final Section 17 state
        run: python scripts/section_17_final_verify.py
