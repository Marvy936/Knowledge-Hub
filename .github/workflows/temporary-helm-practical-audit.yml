name: Temporary Helm practical audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: self-hosted
    steps:
      - name: Checkout revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit practical Helm chapter
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_learning_depth.py \
            --all-docs \
            --report /tmp/documentation-audit.md \
            --json /tmp/documentation-audit.json

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          target = "docs/10-helm-and-cka/helm-practical-chart-walkthrough.md"
          data = json.loads(Path("/tmp/documentation-audit.json").read_text())
          item = next(item for item in data["files"] if item["path"] == target)
          print(
              f"STRICT {target} words={item['words']} grade={item['grade']} "
              f"critical={item['critical']} high={item['high']} "
              f"medium={item['medium']} low={item['low']}"
          )

          text = Path(target).read_text(encoding="utf-8")
          requirements = {
              "Chart.yaml": r"\bChart\.yaml\b",
              "values.yaml": r"\bvalues\.yaml\b",
              "JSON Schema": r"values\.schema\.json",
              "helpers": r"_helpers\.tpl",
              "Deployment": r"kind:\s+Deployment",
              "Service": r"kind:\s+Service",
              "hook": r"helm\.sh/hook",
              "Helm test": r"helm test",
              "lint": r"helm lint",
              "render": r"helm template",
              "server dry-run": r"dry-run=server",
              "upgrade": r"helm upgrade",
              "read-back": r"helm get manifest",
              "rollback": r"helm rollback",
              "dependency lock": r"Chart\.lock",
              "semantic false test": r"legacyAuthorizerEnabled=false",
          }

          missing = [name for name, pattern in requirements.items() if not re.search(pattern, text, re.I)]
          explained = len(re.findall(
              r"(?:preukazuje|nepreukazuje|očakávaš|výstup|hranica|verdict)",
              text,
              re.I,
          ))
          print(f"PRACTICAL explained-evidence-markers={explained} missing={missing}")

          if item["critical"] or item["high"] or item["medium"] or missing or explained < 20:
              for finding in data["findings"]:
                  if finding["path"] == target and finding["severity"] in {"critical", "high", "medium"}:
                      print(
                          "FINDING "
                          f"severity={finding['severity']} section={finding['section']} "
                          f"line={finding['line']} rule={finding['rule']} detail={finding['detail']}"
                      )
              raise SystemExit(1)
          PY
