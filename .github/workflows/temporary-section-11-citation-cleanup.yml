name: Temporary section 11 citation cleanup

on:
  push:
    branches:
      - agent/sections-10-13-prose-first-revalidation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/sections-10-13-prose-first-revalidation
          fetch-depth: 0

      - name: Remove UI citation tokens from Markdown
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('docs/11-cloud-and-aws')
          pattern = re.compile(r'\s*cite[^]+')
          changed = []
          for path in root.glob('*.md'):
              text = path.read_text(encoding='utf-8')
              cleaned = pattern.sub('', text)
              if cleaned != text:
                  path.write_text(cleaned, encoding='utf-8', newline='\n')
                  changed.append(str(path))
          print('\n'.join(changed) if changed else 'No citation tokens found.')
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/11-cloud-and-aws
          git commit -m "docs(aws): remove non-repository citation tokens"
          git push origin HEAD:agent/sections-10-13-prose-first-revalidation
