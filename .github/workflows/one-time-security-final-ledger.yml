name: One-time Security final ledger update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-security-final-ledger.yml

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Security and Identity review status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("DOCUMENTATION-REVIEW-STATUS.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          prefix = "| `13-security-and-identity` — Security and Identity |"
          old_state = "| 16/19 strict revalidation | In progress | 2026-07-29 |"
          new_state = "| 19/19 strict revalidation | Ready for user review | 2026-07-29 |"
          appendix = (
              " Piaty a záverečný authoritative blok bol kompletne prepísaný okolo connected release a resource-access incidentu `SEC-PAY-51`: "
              "`Image signing` používa `release intent a exact OCI subject → signing authority/issuance context → signature alebo attestation → trust-root/certificate/time evidence → signer a subject authorization → registry publication/promotion → policy decision na final deployment boundary → resolved runtime digest → re-evaluation/quarantine/revocation → second-release validation`; "
              "`Policy as Code` používa `business/security intent → exact decision subject a input contract → executable policy/supporting data → immutable policy artifact → distribution a loaded generation → structured decision → authoritative enforcement → decision audit/runtime evidence → exception/rollout/rollback/revocation → bypass a second-decision validation`; "
              "`Zero Trust` používa `business operation a protected resource → human/workload/device identities a assurance → exact action/data/environment scope → trusted posture/policy/threat context → resource-specific decision → bounded session alebo communication path → enforcement na každom access path-e → continuous evidence/re-evaluation → revocation/containment/trust recovery → allowed/forbidden/bypass validation`. "
              "Worked failure pokrýva multi-platform release index `sha256:pay7240`, ktorého keyless bundle podpísal iba amd64 manifest `sha256:pay7240-amd`, zatiaľ čo production arm64 runtime použil compromised `sha256:pay7240-arm`; verifier hľadal ľubovoľnú validnú signature v repository, neviazal signed subject na selected platform/runtime digest a cache-oval allow podľa tagu. Policy plane súčasne používal skew medzi `POL-IMG-16` a `POL-IMG-17`, vstup bez final digestu, tag-based cache, `failurePolicy: Ignore` a custom `AtlasRelease` controller path mimo intended PEP-u. Human WebAuthn session a mTLS/workload identities boli platné, ale VPN/internal location, osemhodinový broad bearer token, nereagujúci EDR posture event, stale policy a direct controller path vytvorili implicit trust a 47-minútovú revocation latency. Root cause je subject misbinding, incomplete intent-to-enforcement contract a one-time authorization bez complete resource-path enforcement a revocation; malicious artifact je trigger a multi-platform ambiguity, revision skew, fail-open timeout, broad token a network trust sú causal amplifiers. Recovery používa trusted rebuild s novými index/platform digests, exact index/platform signing contract, platform-specific provenance/SBOM, semantic signer policy, immutable `POL-IMG-18`, active-generation readiness, digest/policy/quarantine-aware cache, complete native/custom-controller PEP coverage, short-lived device-bound JIT human session, attested audience-bound workload identity, event-driven posture/signer/policy revocation, runtime/rollback retirement a second-release/second-decision/second-operation negative tests. "
              "Finálny section-level consistency gate overil authoritative ordering všetkých 19 kapitol, connected incident chain `SEC-PAY-47` až `SEC-PAY-51`, konzistentné distinctions configured/published/loaded/effective/runtime a authentication/authorization/assurance, obojsmerný navigation chain od `12-observability/cardinality.md` cez CIA, identity, directory, federation, secrets, cryptography, vulnerability, threat a supply-chain vrstvy až po `Zero Trust → ROADMAP`, všetky section glossary fragments vrátane `glossary/13i-security-signing-policy-zero-trust-lifecycles.md`, synchronizovaný generated `GLOSSARY.md`, prázdne audit-failure artifacts a current official facts pre Sigstore/Cosign, OPA/Rego, Kubernetes CEL admission, Kyverno, NIST Zero Trust a CISA maturity model. Sekcia je pripravená na používateľskú kontrolu, nie automaticky používateľsky schválená."
          )

          updated = []
          found = False
          for line in lines:
              if line.startswith(prefix):
                  found = True
                  if old_state not in line:
                      raise SystemExit("Unexpected Security and Identity ledger state")
                  if not line.endswith(" |"):
                      raise SystemExit("Unexpected ledger row terminator")
                  line = line.replace(old_state, new_state, 1)
                  line = line[:-2] + appendix + " |"
              updated.append(line)

          if not found:
              raise SystemExit("Security and Identity ledger row not found")

          path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          PY

      - name: Remove one-time workflow
        shell: bash
        run: rm .github/workflows/one-time-security-final-ledger.yml

      - name: Commit final review state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DOCUMENTATION-REVIEW-STATUS.md .github/workflows/one-time-security-final-ledger.yml
          git commit -m "docs(review): complete Security and Identity strict revalidation"
          git push
