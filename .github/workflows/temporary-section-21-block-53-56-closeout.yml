name: Temporary Section 21 block 53-56 closeout

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/section21-block-53-56/**"
      - ".github/workflows/temporary-section-21-block-53-56-closeout.yml"

permissions:
  contents: read

jobs:
  diagnose-fragments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/section-21-ai-agents-block-53-56

      - name: Diagnose encoded fragments
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          expected = {
              "n8n-temporal-airflow-prefect-use-cases.md.gz.b64": (10232, "dfcf4637ec257377d07f3fdd051fca7f69846c5ed11d2234c94ed25d45c2b776"),
              "event-driven-automation.md.gz.b64": (9072, "dbd272444c1cf17a13337c57d1b54d113dc0bc1b414a48c3d8af552537b40e02"),
              "ai-assisted-ci-cd.md.gz.b64": (8848, "aa38b92cf86577e1b98a6959ad7cbb5ec099c69b9bdbf4f667d919c45b5c9cec"),
              "ai-assisted-observability-incident-response.md.gz.b64": (9120, "e6435faa58e38082ce3043edea02012577cefd2d0587b16e578d3d658327ca96"),
          }
          root = Path('.github/section21-block-53-56')
          failed = []
          for name, (expected_length, expected_raw_sha) in expected.items():
              path = root / name
              encoded = path.read_text(encoding='ascii').strip()
              encoded_sha = hashlib.sha256(encoded.encode('ascii')).hexdigest()
              try:
                  raw = gzip.decompress(base64.b64decode(encoded, validate=True))
                  raw_sha = hashlib.sha256(raw).hexdigest()
                  status = 'OK' if len(encoded) == expected_length and raw_sha == expected_raw_sha else 'MISMATCH'
              except Exception as exc:
                  raw_sha = f'ERROR:{type(exc).__name__}:{exc}'
                  status = 'CORRUPT'
              print(f'{name}: status={status} length={len(encoded)} expected_length={expected_length} encoded_sha256={encoded_sha} raw_sha256={raw_sha}')
              if status != 'OK':
                  failed.append(name)
          if failed:
              raise SystemExit('Corrupt or mismatched fragments: ' + ', '.join(failed))
          PY
