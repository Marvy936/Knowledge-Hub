name: Temporary Section 21 block 53-56 closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "docs/21-ai-agents-and-intelligent-automation/**"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "DOCUMENTATION-REVIEW-STATUS.md"
      - "DOCUMENTATION-AUDIT.md"
      - "documentation-audit.json"
      - ".github/section21-block-53-56/**"
      - ".github/workflows/temporary-section-21-block-53-56-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-section-21-block-53-56-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-21-ai-agents-block-53-56

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize chapters and run closeout
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          FILES = {
            "docs/21-ai-agents-and-intelligent-automation/n8n-temporal-airflow-prefect-use-cases.md": {
              "fragment": ".github/section21-block-53-56/n8n-temporal-airflow-prefect-use-cases.md.gz.b64",
              "sha256": "dfcf4637ec257377d07f3fdd051fca7f69846c5ed11d2234c94ed25d45c2b776",
            },
            "docs/21-ai-agents-and-intelligent-automation/event-driven-automation.md": {
              "fragment": ".github/section21-block-53-56/event-driven-automation.md.gz.b64",
              "sha256": "dbd272444c1cf17a13337c57d1b54d113dc0bc1b414a48c3d8af552537b40e02",
            },
            "docs/21-ai-agents-and-intelligent-automation/ai-assisted-ci-cd.md": {
              "fragments": [
                ".github/section21-block-53-56/ai-assisted-ci-cd.md.gz.b64.part-01",
                ".github/section21-block-53-56/ai-assisted-ci-cd.md.gz.b64.part-02",
                ".github/section21-block-53-56/ai-assisted-ci-cd.md.gz.b64.part-03",
                ".github/section21-block-53-56/ai-assisted-ci-cd.md.gz.b64.part-04",
              ],
              "sha256": "aa38b92cf86577e1b98a6959ad7cbb5ec099c69b9bdbf4f667d919c45b5c9cec",
            },
            "docs/21-ai-agents-and-intelligent-automation/ai-assisted-observability-incident-response.md": {
              "fragment": ".github/section21-block-53-56/ai-assisted-observability-incident-response.md.gz.b64",
              "sha256": "e6435faa58e38082ce3043edea02012577cefd2d0587b16e578d3d658327ca96",
            },
          }

          for raw_path, metadata in FILES.items():
              fragment_paths = metadata.get("fragments")
              if fragment_paths is None:
                  fragment_paths = [metadata["fragment"]]
              fragments = [Path(value) for value in fragment_paths]
              encoded = "".join(fragment.read_text(encoding="ascii").strip() for fragment in fragments)
              content = gzip.decompress(base64.b64decode(encoded, validate=True))
              actual = hashlib.sha256(content).hexdigest()
              if actual != metadata["sha256"]:
                  raise SystemExit(f"{raw_path}: checksum mismatch {actual} != {metadata['sha256']}")
              path = Path(raw_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
              for fragment in fragments:
                  fragment.unlink()

          obsolete = Path(".github/section21-block-53-56/ai-assisted-ci-cd.md.gz.b64")
          if obsolete.exists():
              obsolete.unlink()

          fragment_dir = Path(".github/section21-block-53-56")
          if fragment_dir.exists() and not any(fragment_dir.iterdir()):
              fragment_dir.rmdir()

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          root = Path("docs/21-ai-agents-and-intelligent-automation")
          readme = root / "README.md"
          replace_once(
              readme,
              "52. [Workflow engine oproti agent frameworku](workflow-engine-vs-agent-framework.md)\n\n## Plánované authoritative poradie",
              "52. [Workflow engine oproti agent frameworku](workflow-engine-vs-agent-framework.md)\n"
              "53. [n8n oproti Temporal, Airflow a Prefect use cases](n8n-temporal-airflow-prefect-use-cases.md)\n"
              "54. [Event-driven automation](event-driven-automation.md)\n"
              "55. [AI-assisted CI/CD](ai-assisted-ci-cd.md)\n"
              "56. [AI-assisted observability a incident response](ai-assisted-observability-incident-response.md)\n\n"
              "## Plánované authoritative poradie",
          )
          for planned in (
              "53. n8n oproti Temporal, Airflow a Prefect use cases\n",
              "54. Event-driven automation\n",
              "55. AI-assisted CI/CD\n",
              "56. AI-assisted observability a incident response\n",
          ):
              replace_once(readme, planned, "")

          text = readme.read_text(encoding="utf-8")
          marker = "## Stav\n\n"
          if text.count(marker) != 1:
              raise SystemExit("README: expected one status marker")
          prefix, _ = text.split(marker, 1)
          status = (
              "Aktuálny authoritative stav sekcie je **56/62 · In progress**. Štrnásty authoritative blok aktivuje kapitoly 53–56 a incident `AGENT-AUTO-14`. Runtime-selection kapitola oddeľuje integration workflow, durable application orchestration, batch/data Dag a Python-first flow a viaže výber na state authority, retries, versioning, operability a exit strategy. Event-driven kapitola zavádza CloudEvents envelope, event/command boundary, outbox/inbox, ordering, backpressure, replay, security a business idempotency. AI-assisted CI/CD kapitola viaže exact SHA, untrusted context, test integrity, permissions, OIDC, runner isolation, artifact provenance a independent deployment verification. Observability kapitola oddeľuje traces, metrics, logs, change events, no-data, sampling, hypotheses, runbook approval a technical aj business recovery. Reálne runtime migrations, event replays, AI-authored pipeline changes, deployments, incident actions ani business outcomes neboli vykonané. Sekcia zostáva `In progress`, nie runtime `Verified`, production `Stable` ani user `Accepted`. Ďalší blok sú kapitoly 57–60: AI-assisted security operations, knowledge assistants a enterprise search, ticket/email/chat automation a autonomous remediation boundaries.\n"
          )
          readme.write_text(prefix + marker + status, encoding="utf-8", newline="\n")

          roadmap = Path("ROADMAP.md")
          updates = {
              "- [ ] n8n oproti Temporal, Airflow a Prefect use cases": "- [x] [n8n oproti Temporal, Airflow a Prefect use cases](docs/21-ai-agents-and-intelligent-automation/n8n-temporal-airflow-prefect-use-cases.md)",
              "- [ ] Event-driven automation": "- [x] [Event-driven automation](docs/21-ai-agents-and-intelligent-automation/event-driven-automation.md)",
              "- [ ] AI-assisted CI/CD": "- [x] [AI-assisted CI/CD](docs/21-ai-agents-and-intelligent-automation/ai-assisted-ci-cd.md)",
              "- [ ] AI-assisted observability a incident response": "- [x] [AI-assisted observability a incident response](docs/21-ai-agents-and-intelligent-automation/ai-assisted-observability-incident-response.md)",
          }
          for old, new in updates.items():
              replace_once(roadmap, old, new)

          review = Path("DOCUMENTATION-REVIEW-STATUS.md")
          lines = review.read_text(encoding="utf-8").splitlines()
          row_prefix = "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation |"
          matches = [i for i, line in enumerate(lines) if line.startswith(row_prefix)]
          if len(matches) != 1:
              raise SystemExit(f"Review status: expected one Section 21 row, found {len(matches)}")
          lines[matches[0]] = (
              "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation | 56/62 authoritative drafting | In progress | 2026-08-05 | "
              "Štrnásty authoritative blok aktivuje kapitoly 53–56 a incident `AGENT-AUTO-14`. Runtime comparison viaže n8n, Temporal, Airflow a Prefect na exact business invariants, state authority, time/retry semantics, versioning, security, operability, cost a tested coexistence. Event-driven kapitola oddeľuje event od commandu, používa CloudEvents identity, schema generations, outbox/inbox, ordering, backpressure, DLQ, replay, privacy a business reconciliation. AI-assisted CI/CD oddeľuje model proposal od merge/deployment authority a pinne source/workflow SHA, permissions, runner, tests, OIDC, artifact digest a attestation. AI-assisted observability overuje telemetry pipeline, resource identity, no-data, sampling, cardinality, competing hypotheses, read-only diagnostics, runbook approval a technical aj business recovery. Reálne platform selection drilly, event replays, agent-authored CI changes, deployments, incident remediations a business outcomes neboli vykonané; stav zostáva `In progress`, nie runtime `Verified`, production `Stable` ani user `Accepted`. |"
          )
          review.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          python - <<'PY'
          from pathlib import Path

          audit = Path("DOCUMENTATION-AUDIT.md").read_text(encoding="utf-8")
          files = [
              "n8n-temporal-airflow-prefect-use-cases.md",
              "event-driven-automation.md",
              "ai-assisted-ci-cd.md",
              "ai-assisted-observability-incident-response.md",
          ]
          remaining = [
              name for name in files
              if f"### `docs/21-ai-agents-and-intelligent-automation/{name}`" in audit
          ]
          if remaining:
              for name in remaining:
                  heading = f"### `docs/21-ai-agents-and-intelligent-automation/{name}`"
                  start = audit.find(heading)
                  end = audit.find("\n### `", start + len(heading))
                  print(audit[start:end if end != -1 else len(audit)])
              raise SystemExit(f"Section 21 block 53-56 critical/high findings remain: {remaining}")
          print("Section 21 block 53-56 has no critical/high audit entries.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No closeout changes required."
            exit 0
          fi

          git commit -m "docs: add and synchronize intelligent automation block"
          git push origin HEAD:agent/section-21-ai-agents-block-53-56
