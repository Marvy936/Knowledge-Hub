name: Keycloak block 1 integration

on:
  push:
    branches:
      - agent/keycloak-identity-block-1

permissions:
  contents: write

concurrency:
  group: keycloak-block1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/keycloak-identity-block-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Integrate section and generated documentation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/integrate_keycloak_block1.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "::error::Keycloak integration produced no changes."
            exit 1
          fi

          git commit -m "docs(keycloak): integrate architecture OIDC and SAML block"
          git push origin "HEAD:${GITHUB_REF_NAME}"
