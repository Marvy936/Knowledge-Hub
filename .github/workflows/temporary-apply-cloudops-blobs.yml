name: Temporary apply CloudOps prose rewrites

on:
  push:
    branches: [agent/sections-10-13-prose-first-revalidation]

permissions:
  contents: write

jobs:
  apply:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sections-10-13-prose-first-revalidation
          fetch-depth: 0
      - name: Materialize reviewed blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          write_blob() {
            local sha="$1"
            local path="$2"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content \
              | tr -d '\n' | base64 -d > "$path"
          }

          write_blob 4323524425a8c344b3bc2454cdf1ead1b0a4816c docs/11-cloud-and-aws/cloudops-engineer-associate-soa-c03.md
          write_blob 1f5a7109e78c837d70cc14c0143d15f3b6c691b9 docs/11-cloud-and-aws/cloudops-domain-review-timed-reasoning.md
          write_blob 1f0f67e54b20a1611fcf638ceeeab2337fb05284 docs/11-cloud-and-aws/cloudops-hands-on-labs.md
          write_blob 1f83958022658d1fff1542a23c6188cfe0bdcaab docs/11-cloud-and-aws/cloudops-troubleshooting-drills.md

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          git add docs GLOSSARY.md
          git commit -m "docs(aws): rewrite CloudOps preparation as practical prose"
          git push origin HEAD:agent/sections-10-13-prose-first-revalidation
