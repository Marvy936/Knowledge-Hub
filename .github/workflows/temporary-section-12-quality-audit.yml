name: Temporary Section 12 prose and practical audit

on:
  push:
    branches:
      - agent/section-12-practical-prose-revalidation

permissions:
  contents: write

concurrency:
  group: temporary-section12-quality-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-12-practical-prose-revalidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact local remediation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          replacements = [
              (
                  'docs/12-observability/instrumentation-telemetry.md',
                  "## End-to-end lifecycle\n\n```text",
                  "## End-to-end lifecycle\n\n"
                  "Instrumentation sa správa ako versionovaný production data path, nie ako jednorazové pridanie SDK. "
                  "Každá transition mení, čo responder môže z výsledku usúdiť: producer môže record vytvoriť, "
                  "processor ho transformovať, exporter potvrdiť transport a backend ho až následne sprístupniť query. "
                  "Preto sa celý mechanizmus číta v nasledujúcom poradí a každá boundary má samostatný read-back.\n\n"
                  "```text",
              ),
              (
                  'docs/12-observability/golden-signals.md',
                  "## Outcome-first lifecycle\n\n```text",
                  "## Outcome-first lifecycle\n\n"
                  "Golden Signals tvoria jeden verdict iba vtedy, keď všetky štyri používajú kompatibilnú operation population a time boundary. "
                  "Lifecycle preto najprv fixuje user journey a až potom oddeľuje demand, incorrect outcomes, end-to-end duration a čakajúcu prácu pred capacity cliffom. "
                  "Každá ďalšia query musí zostať spätne naviazaná na tento subject a nesmie zameniť logical operation za interný attempt.\n\n"
                  "```text",
              ),
              (
                  'docs/12-observability/golden-signals.md',
                  "## Exact Golden Signals subject\n\n```yaml",
                  "## Exact Golden Signals subject\n\n"
                  "Subject určuje spoločnú population, ktorú budú Latency, Traffic a Errors merať, a zároveň pomenúva resource boundaries relevantné pre Saturation. "
                  "Bez tejto väzby môže každý panel používať inú release, cohort alebo unit a spoločný dashboard nebude mať kauzálny význam. "
                  "Atlas preto zapisuje contract ako versionovaný, kontrolovateľný artefakt.\n\n"
                  "```yaml",
              ),
              (
                  'docs/12-observability/prometheus.md',
                  "## End-to-end lifecycle\n\n```text",
                  "## End-to-end lifecycle\n\n"
                  "Prometheus verdict vzniká až po sérii odlišných control a data-path rozhodnutí. "
                  "Discovery určí kandidáta, relabeling z neho vytvorí effective target, scrape prečíta exposition a TSDB až následne sprístupní samples query a rules. "
                  "Úspech jednej boundary preto nesmie byť použitý ako dôkaz úplnosti nasledujúcej; lifecycle sa číta v tomto poradí.\n\n"
                  "```text",
              ),
              (
                  'docs/12-observability/alertmanager.md',
                  "## End-to-end lifecycle\n\n```text",
                  "## End-to-end lifecycle\n\n"
                  "Alertmanager nie je jednorazový forwarder, ale stateful notification workflow. "
                  "Alert instance sa najprv deduplikuje a routuje, potom vstupuje do grouping a timing state-u a až receiver attempt môže vytvoriť external notification. "
                  "Každý krok má inú proof boundary, preto sa celý delivery mechanizmus overuje v nasledujúcom poradí.\n\n"
                  "```text",
              ),
              (
                  'docs/12-observability/elasticsearch-opensearch.md',
                  "## Document-to-query lifecycle\n\n```text",
                  "## Document-to-query lifecycle\n\n"
                  "Search evidence vzniká až po viacerých samostatných verdicts. "
                  "Bulk envelope môže byť prijatý, jednotlivý item odmietnutý mappingom, úspešne indexed document ešte nemusí byť refreshed a searchable a green shard allocation nepreukazuje úplnosť source events. "
                  "Preto sa ingest, durability, visibility a lifecycle boundaries čítajú v nasledujúcom poradí a každá má vlastný read-back.\n\n"
                  "```text",
              ),
          ]
          for path, old, new in replacements:
              replace_once(Path(path), old, new)

          citation_pattern = re.compile(r'\s*cite[^]+')
          for path in Path('docs/12-observability').glob('*.md'):
              text = path.read_text(encoding='utf-8')
              cleaned = citation_pattern.sub('', text)
              if cleaned != text:
                  path.write_text(cleaned, encoding='utf-8', newline='\n')
          PY
      - name: Build Section 12 quality report
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_learning_depth.py --all-docs --report /tmp/audit.md --json /tmp/audit.json
          python - <<'PY'
          import json, re
          from pathlib import Path

          raw = json.loads(Path('/tmp/audit.json').read_text(encoding='utf-8'))
          audit = {x['path']: x for x in raw['files']}
          strict_findings = [
              finding
              for finding in raw['findings']
              if finding['path'].startswith('docs/12-observability/')
              and finding['severity'] in {'critical', 'high', 'medium'}
          ]

          rows, failures = [], []
          for path in sorted(Path('docs/12-observability').glob('*.md')):
              if path.name == 'README.md':
                  continue
              text = path.read_text(encoding='utf-8')
              outside, fenced = [], False
              for line in text.splitlines():
                  if line.strip().startswith('```'):
                      fenced = not fenced
                      continue
                  if not fenced:
                      outside.append(line)
              prose = sum(len(re.findall(r'[\wÀ-ž]+', line)) for line in outside if line.strip() and not re.match(r'\s*(?:[-*+] |\d+\. |#|\|)', line))
              bullets = sum(len(re.findall(r'[\wÀ-ž]+', line)) for line in outside if re.match(r'\s*(?:[-*+] |\d+\. )', line))
              share = bullets / max(1, prose + bullets)
              blocks = len(re.findall(r'```(?:bash|shell|python|json|yaml|yml|hcl|terraform|sql|console|promql|logql|traceql|text|ini|toml|conf)\n', text))
              executable = len(re.findall(r'(?m)^(?:curl|kubectl|promtool|amtool|logcli|otelcol|fluent-bit|jq|yq|rate\(|sum\(|histogram_quantile\(|count_over_time\(|\{[^\n]*\}|from\s+traces)', text))
              explanations = len(re.findall(r'(?i)(tento príkaz|táto query|výstup|preukazuje|nepreukazuje|dokazuje|observation|dôkaz|read-back|výsledok query)', text))
              item = audit[path.as_posix()]
              rows.append(f'{path.as_posix()}|strict={item["critical"]}/{item["high"]}/{item["medium"]}|prose={prose}|bullet_share={share:.3f}|blocks={blocks}|executable={executable}|explanations={explanations}')
              if item['critical'] or item['high'] or item['medium']:
                  failures.append(f'{path.name}: strict findings')
              if prose < 650:
                  failures.append(f'{path.name}: only {prose} prose words')
              if share > 0.34:
                  failures.append(f'{path.name}: bullet share {share:.3f}')
              if blocks < 2 or executable < 2:
                  failures.append(f'{path.name}: practical examples too thin')
              if explanations < 3:
                  failures.append(f'{path.name}: evidence explanation too thin ({explanations})')

          exact = [
              f"{finding['severity'].upper()} {finding['path']}:{finding['line']} [{finding['rule']}] {finding['section']} — {finding['detail']}"
              for finding in strict_findings
          ]
          status = 'success' if not failures else 'failure'
          output = [f'status={status}', '', *rows, '', 'STRICT FINDINGS', *(exact or ['none']), '', 'FAILURES', *(failures or ['none'])]
          Path('.github/section12-quality-report.txt').write_text('\n'.join(output) + '\n', encoding='utf-8', newline='\n')
          print('\n'.join(output))
          PY
      - name: Publish remediation and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/12-observability .github/section12-quality-report.txt
          if ! git diff --cached --quiet; then
            git commit -m "docs(observability): apply exact Section 12 remediation"
            git push origin HEAD:agent/section-12-practical-prose-revalidation
          fi
