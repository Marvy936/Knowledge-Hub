name: Temporary section 11 full practical audit

on:
  push:
    branches:
      - agent/sections-10-13-prose-first-revalidation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: self-hosted
    steps:
      - name: Checkout revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit all section 11 chapters
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_learning_depth.py \
            --all-docs \
            --report /tmp/documentation-audit.md \
            --json /tmp/documentation-audit.json

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('docs/11-cloud-and-aws')
          targets = sorted(str(path) for path in root.glob('*.md') if path.name != 'README.md')
          if len(targets) != 28:
              raise SystemExit(f'Expected 28 chapters, found {len(targets)}: {targets}')

          data = json.loads(Path('/tmp/documentation-audit.json').read_text())
          stats = {item['path']: item for item in data['files']}
          failed = False

          for target in targets:
              item = stats[target]
              text = Path(target).read_text(encoding='utf-8')
              fenced = len(re.findall(r'^```(?:bash|shell|sh|json|yaml|yml|hcl|sql|python|gotemplate|text)?\s*$', text, re.M))
              executable = len(re.findall(
                  r'\b(?:aws|kubectl|helm|psql|terraform|dig|nc|openssl|ss|curl|jq|python)\b',
                  text,
                  re.I,
              ))
              explanations = len(re.findall(
                  r'(?:preukazuje|nepreukazuje|výstup|príkaz|command|read-back|praktick|verdict|dôkaz|evidence)',
                  text,
                  re.I,
              ))
              print(
                  f"STRICT {target} words={item['words']} grade={item['grade']} "
                  f"critical={item['critical']} high={item['high']} "
                  f"medium={item['medium']} low={item['low']} "
                  f"fenced={fenced} executable={executable} explanations={explanations}"
              )

              if item['critical'] or item['high'] or item['medium']:
                  failed = True
              if fenced < 2 or executable < 2 or explanations < 2:
                  print(f'::error file={target}::Insufficient explained practical material')
                  failed = True

          if failed:
              for finding in data['findings']:
                  if finding['path'] in targets and finding['severity'] in {'critical', 'high', 'medium'}:
                      print(
                          'FINDING '
                          f"path={finding['path']} severity={finding['severity']} "
                          f"section={finding['section']} line={finding['line']} "
                          f"rule={finding['rule']} detail={finding['detail']}"
                      )
              raise SystemExit(1)
          PY
