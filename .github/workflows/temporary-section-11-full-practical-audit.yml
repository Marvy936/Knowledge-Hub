name: Temporary section 10 and 11 materializer

on:
  push:
    branches:
      - agent/sections-10-13-prose-first-revalidation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-sections-10-11-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: self-hosted
    steps:
      - name: Checkout section 11 branch
        uses: actions/checkout@v4
        with:
          ref: agent/sections-10-13-prose-first-revalidation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize section 11 final prose chapters
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/temporary-cloudops-finops-rewrite.yml')
          text = source.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          Path('/tmp/section11_rewrite.py').write_text(script + "\n", encoding='utf-8')
          PY

          python /tmp/section11_rewrite.py
          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          rm -f .github/cloudops-finops-rewrite.trigger
          rm -f .github/workflows/temporary-cloudops-finops-rewrite.yml
          rm -f .github/workflows/temporary-section-11-full-practical-audit.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github
          git commit -m "docs(aws): materialize prose-first practical closeout chapters"
          git push origin HEAD:agent/sections-10-13-prose-first-revalidation

      - name: Materialize section 10 focused practical labs
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin agent/section-10-practical-helm-examples
          git checkout -B section-10-practical origin/agent/section-10-practical-helm-examples

          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/temporary-section-10-practical-completion.yml')
          text = source.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          Path('/tmp/section10_practical.py').write_text(script + "\n", encoding='utf-8')
          PY

          python /tmp/section10_practical.py
          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          rm -f .github/workflows/temporary-section-10-practical-completion.yml
          rm -f .github/section10-practical-run.txt

          git add docs .github
          git commit -m "docs(helm): materialize focused executable examples"
          git push origin HEAD:agent/section-10-practical-helm-examples
