name: Publish Interactive Lab Image

on:
  push:
    branches:
      - main
    paths:
      - "labs/interactive/**"
      - ".github/workflows/publish-interactive-lab-image.yml"
  workflow_dispatch:

concurrency:
  group: knowledge-hub-interactive-lab-publish
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/marvy936/knowledge-hub-lab-docker-network-debug

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 55
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4

      - name: Prepare isolated Docker client config
        run: |
          DOCKER_CONFIG="$RUNNER_TEMP/kh-docker-${GITHUB_RUN_ID}"
          rm -rf "$DOCKER_CONFIG"
          mkdir -p "$DOCKER_CONFIG"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"

      - name: Build multi-lab image
        run: docker build -t "$IMAGE_NAME:test" -f labs/interactive/Dockerfile labs/interactive

      - name: List bundled labs without privileged mode
        run: docker run --rm "$IMAGE_NAME:test" list

      - name: Prove shell-only labs without privileged mode
        run: |
          docker run --rm "$IMAGE_NAME:test" ids shell > /tmp/kh-shell-lab-ids
          test -s /tmp/kh-shell-lab-ids
          while IFS= read -r LAB; do
            [ -n "$LAB" ] || continue
            echo "=== unprivileged self-test: $LAB ==="
            timeout -k 10s 5m docker run --rm "$IMAGE_NAME:test" "$LAB" self-test
          done < /tmp/kh-shell-lab-ids

      - name: Preflight K3s runtimes
        run: |
          docker run --rm "$IMAGE_NAME:test" ids k3s > /tmp/kh-k3s-lab-ids
          test -s /tmp/kh-k3s-lab-ids
          while IFS= read -r LAB; do
            [ -n "$LAB" ] || continue
            echo "=== k3s self-test: $LAB ==="
            NAME="kh-ci-${LAB}-${GITHUB_RUN_ID}"
            trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
            if ! timeout -k 30s 10m docker run --rm --name "$NAME" --privileged \
              --cgroupns=host \
              -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
              "$IMAGE_NAME:test" "$LAB" self-test; then
              docker rm -f "$NAME" >/dev/null 2>&1 || true
              exit 1
            fi
          done < /tmp/kh-k3s-lab-ids

      - name: Preflight MinIO S3 runtime
        run: |
          NAME="kh-ci-minio-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
          timeout -k 30s 5m docker run --rm --name "$NAME" --privileged \
            "$IMAGE_NAME:test" s3-versioning-minio self-test

      - name: Preflight RabbitMQ routing runtime
        run: |
          NAME="kh-ci-rabbitmq-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
          timeout -k 30s 8m docker run --rm --name "$NAME" --privileged \
            "$IMAGE_NAME:test" rabbitmq-routing-key self-test

      - name: Prove established Docker-backed labs before publication
        run: |
          docker run --rm "$IMAGE_NAME:test" ids docker > /tmp/kh-docker-lab-ids
          test -s /tmp/kh-docker-lab-ids
          while IFS= read -r LAB; do
            [ -n "$LAB" ] || continue
            case "$LAB" in
              s3-versioning-minio|rabbitmq-routing-key) continue ;;
            esac
            echo "=== self-test: $LAB ==="
            NAME="kh-ci-${LAB}-${GITHUB_RUN_ID}"
            if ! timeout -k 30s 8m docker run --rm --name "$NAME" --privileged "$IMAGE_NAME:test" "$LAB" self-test; then
              docker rm -f "$NAME" >/dev/null 2>&1 || true
              exit 1
            fi
          done < /tmp/kh-docker-lab-ids

      - name: Prove help is embedded without starting sandbox
        run: |
          docker run --rm "$IMAGE_NAME:test" ids > /tmp/kh-lab-ids
          while IFS= read -r LAB; do
            [ -n "$LAB" ] || continue
            docker run --rm "$IMAGE_NAME:test" "$LAB" help | grep -F "Knowledge Hub Interactive Lab"
          done < /tmp/kh-lab-ids

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish latest and immutable SHA tag
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          docker tag "$IMAGE_NAME:test" "$IMAGE_NAME:latest"
          docker tag "$IMAGE_NAME:test" "$IMAGE_NAME:sha-$SHORT_SHA"
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:sha-$SHORT_SHA"

      - name: Prove anonymous public pull and shell runtime
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          docker logout ghcr.io || true
          docker image rm "$IMAGE_NAME:test" "$IMAGE_NAME:latest" "$IMAGE_NAME:sha-$SHORT_SHA" || true
          docker pull "$IMAGE_NAME:latest"
          docker run --rm "$IMAGE_NAME:latest" list
          LAST_SHELL_LAB="$(docker run --rm "$IMAGE_NAME:latest" ids shell | tail -n 1)"
          test -n "$LAST_SHELL_LAB"
          docker run --rm "$IMAGE_NAME:latest" "$LAST_SHELL_LAB" help | grep -F "Knowledge Hub Interactive Lab"
          timeout -k 10s 5m docker run --rm "$IMAGE_NAME:latest" "$LAST_SHELL_LAB" self-test

      - name: Remove temporary Docker client config
        if: always()
        run: |
          if [[ -n "${DOCKER_CONFIG:-}" ]]; then
            rm -rf "$DOCKER_CONFIG"
          fi
