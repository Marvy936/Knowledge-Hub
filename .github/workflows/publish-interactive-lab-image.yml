name: Publish Interactive Lab Image

on:
  push:
    branches:
      - main
    paths:
      - "labs/interactive/**"
      - ".github/workflows/publish-interactive-lab-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/marvy936/knowledge-hub-lab-docker-network-debug

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 75
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4

      - name: Build multi-lab image
        run: docker build -t "$IMAGE_NAME:test" -f labs/interactive/Dockerfile labs/interactive

      - name: Prove every lab before publication
        run: |
          docker run --rm "$IMAGE_NAME:test" list
          docker run --rm "$IMAGE_NAME:test" ids > /tmp/kh-lab-ids
          while IFS= read -r LAB; do
            [ -n "$LAB" ] || continue
            echo "=== self-test: $LAB ==="
            docker run --rm --privileged "$IMAGE_NAME:test" "$LAB" self-test
          done < /tmp/kh-lab-ids

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish latest and immutable SHA tag
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          docker tag "$IMAGE_NAME:test" "$IMAGE_NAME:latest"
          docker tag "$IMAGE_NAME:test" "$IMAGE_NAME:sha-$SHORT_SHA"
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:sha-$SHORT_SHA"

      - name: Prove anonymous public pull and registry runtime
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          docker logout ghcr.io || true
          docker image rm "$IMAGE_NAME:test" "$IMAGE_NAME:latest" "$IMAGE_NAME:sha-$SHORT_SHA" || true
          docker pull "$IMAGE_NAME:latest"
          docker run --rm "$IMAGE_NAME:latest" list
          LAST_LAB="$(docker run --rm "$IMAGE_NAME:latest" ids | tail -n 1)"
          test -n "$LAST_LAB"
          docker run --rm "$IMAGE_NAME:latest" "$LAST_LAB" help | grep -F "Knowledge Hub Interactive Lab"
          docker run --rm --privileged "$IMAGE_NAME:latest" "$LAST_LAB" self-test
