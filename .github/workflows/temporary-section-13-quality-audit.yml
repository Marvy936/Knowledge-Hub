name: Temporary Section 13 practical audit

on:
  push:
    branches:
      - agent/section-13-practical-prose-revalidation

permissions:
  contents: write

concurrency:
  group: temporary-section13-quality-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-13-practical-prose-revalidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply final exact remediation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'secrets-management.md': (
                  '## Exact secret subject SEC-PAY-49\n\n```yaml',
                  '## Exact secret subject SEC-PAY-49\n\n'
                  'Secret subject musí spojiť value alebo key reference s účelom, target trustom, všetkými consumers a loaded generations. '
                  'V incidente je toto rozlíšenie rozhodujúce, pretože jedna exportovateľná key mala štyri odlišné federation purposes a storage encryption tento coupling neodhalila.\n\n'
                  '```yaml'
              ),
              'vulnerability-and-patch-management.md': (
                  '## Exact remediation subject SEC-PAY-50\n\n```yaml',
                  '## Exact remediation subject SEC-PAY-50\n\n'
                  'Remediation subject musí pokryť nielen vulnerable component, ale aj builder, outputs, exposure interval, runtime a rollback paths. '
                  'Takto možno odlíšiť package update od dôveryhodnej obnovy po builder compromise a karanténovať všetky artifacts vytvorené v affected window.\n\n'
                  '```yaml'
              ),
              'threat-modeling.md': (
                  '## Threat statements\n\nPoužiteľný threat statement má actor, condition, action, asset a impact:\n\n```text',
                  '## Threat statements\n\n'
                  'Použiteľný threat statement má actor, condition, action, asset a impact. '
                  'Tieto prvky vytvárajú kauzálnu vetu, z ktorej možno odvodiť presný control owner, observation point a forbidden negative test; samotný názov attack technique takýto engineering vstup neposkytuje.\n\n'
                  '```text'
              ),
          }

          root = Path('docs/13-security-and-identity')
          for name, (old, new) in replacements.items():
              path = root / name
              text = path.read_text(encoding='utf-8')
              if old in text:
                  text = text.replace(old, new, 1)
                  path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Build Section 13 quality report
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_learning_depth.py --all-docs --report /tmp/audit.md --json /tmp/audit.json
          python - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('docs/13-security-and-identity')
          raw = json.loads(Path('/tmp/audit.json').read_text(encoding='utf-8'))
          audit = {x['path']: x for x in raw['files']}
          strict_findings = [
              finding for finding in raw['findings']
              if finding['path'].startswith('docs/13-security-and-identity/')
              and finding['severity'] in {'critical', 'high', 'medium'}
          ]
          executable_pattern = re.compile(
              r'(?m)^(?:curl|kubectl|openssl|ldapsearch|ldapmodify|ldapwhoami|kinit|klist|kvno|setspn|repadmin|dcdiag|nltest|Resolve-DnsName|'
              r'Get-AD|Get-Mg|az |aws |gcloud |vault |cosign |syft |grype |trivy |opa |conftest |kyverno |docker buildx|'
              r'jq |yq |python |from |package |allow\b|deny\b|apiVersion:|kind:|resource |data |input |SELECT |POST |GET )'
          )
          explanation_pattern = re.compile(
              r'(?i)(tento príkaz|táto query|tento výstup|výstup preukazuje|nepreukazuje|dokazuje|nedokazuje|'
              r'observation|dôkaz|read-back|loaded state|effective state|runtime state|acceptance|forbidden outcome)'
          )

          rows, failures = [], []
          for path in sorted(root.glob('*.md')):
              if path.name == 'README.md':
                  continue
              text = path.read_text(encoding='utf-8')
              outside, fenced = [], False
              for line in text.splitlines():
                  if line.strip().startswith('```'):
                      fenced = not fenced
                      continue
                  if not fenced:
                      outside.append(line)
              prose = sum(len(re.findall(r'[\wÀ-ž]+', line)) for line in outside if line.strip() and not re.match(r'\s*(?:[-*+] |\d+\. |#|\|)', line))
              bullets = sum(len(re.findall(r'[\wÀ-ž]+', line)) for line in outside if re.match(r'\s*(?:[-*+] |\d+\. )', line))
              share = bullets / max(1, prose + bullets)
              blocks = len(re.findall(r'```(?:bash|shell|powershell|python|json|yaml|yml|hcl|terraform|sql|console|rego|cel|xml|ldif|conf|text)\n', text))
              executable = len(executable_pattern.findall(text))
              explanations = len(explanation_pattern.findall(text))
              item = audit[path.as_posix()]
              rows.append(f'{path.as_posix()}|strict={item["critical"]}/{item["high"]}/{item["medium"]}|prose={prose}|bullet_share={share:.3f}|blocks={blocks}|executable={executable}|explanations={explanations}')
              if item['critical'] or item['high'] or item['medium']:
                  failures.append(f'{path.name}: strict findings')
              if prose < 750:
                  failures.append(f'{path.name}: only {prose} prose words')
              if share > 0.34:
                  failures.append(f'{path.name}: bullet share {share:.3f}')
              if blocks < 2 or executable < 2:
                  failures.append(f'{path.name}: practical examples too thin')
              if explanations < 3:
                  failures.append(f'{path.name}: evidence explanation too thin ({explanations})')

          exact = [f"{f['severity'].upper()} {f['path']}:{f['line']} [{f['rule']}] {f['section']} — {f['detail']}" for f in strict_findings]
          status = 'success' if not failures else 'failure'
          output = [f'status={status}', '', *rows, '', 'STRICT FINDINGS', *(exact or ['none']), '', 'FAILURES', *(failures or ['none'])]
          Path('.github/section13-quality-report.txt').write_text('\n'.join(output) + '\n', encoding='utf-8', newline='\n')
          print('\n'.join(output))
          PY
      - name: Publish remediation and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/13-security-and-identity .github/section13-quality-report.txt
          if ! git diff --cached --quiet; then
            git commit -m "docs(security): close final Section 13 findings"
            git push origin HEAD:agent/section-13-practical-prose-revalidation
          fi
