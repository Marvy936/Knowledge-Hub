name: Temporary Section 13 closeout

on:
  push:
    branches:
      - agent/section-13-practical-prose-revalidation

permissions:
  contents: write

concurrency:
  group: temporary-section13-closeout
  cancel-in-progress: true

jobs:
  closeout:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-13-practical-prose-revalidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply and validate closeout
        shell: bash
        run: python .github/section13_closeout.py
      - name: Publish closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs(security): close practical Section 13 revalidation"
            git push origin HEAD:agent/section-13-practical-prose-revalidation
          fi
