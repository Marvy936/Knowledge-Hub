name: GitOps revalidation block 3 strict audit

on:
  pull_request:
    paths:
      - 'docs/16-gitops-and-platform-engineering/platform-as-a-product.md'
      - 'docs/16-gitops-and-platform-engineering/golden-paths-and-paved-road.md'
      - 'docs/16-gitops-and-platform-engineering/self-service.md'
      - 'docs/16-gitops-and-platform-engineering/developer-experience.md'
      - '.github/workflows/gitops-block-3-strict-audit.yml'

permissions:
  contents: read

jobs:
  strict-audit:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit GitOps block 3
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_learning_depth.py --all-docs --report /tmp/report.md --json /tmp/audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          paths = {
              'docs/16-gitops-and-platform-engineering/platform-as-a-product.md',
              'docs/16-gitops-and-platform-engineering/golden-paths-and-paved-road.md',
              'docs/16-gitops-and-platform-engineering/self-service.md',
              'docs/16-gitops-and-platform-engineering/developer-experience.md',
          }
          data = json.loads(Path('/tmp/audit.json').read_text())
          failed = False
          for item in data['files']:
              if item['path'] in paths:
                  print(f"STRICT {item['path']} words={item['words']} grade={item['grade']} critical={item['critical']} high={item['high']} medium={item['medium']} low={item['low']}")
                  failed |= any(item[k] for k in ('critical', 'high', 'medium'))
          for finding in data['findings']:
              if finding['path'] in paths and finding['severity'] in {'critical', 'high', 'medium'}:
                  print(f"FINDING path={finding['path']} severity={finding['severity']} section={finding.get('section')} line={finding.get('line')} rule={finding['rule']} detail={finding['detail']}")
          if failed:
              raise SystemExit('GitOps block 3 still has medium-or-higher findings')
          PY
