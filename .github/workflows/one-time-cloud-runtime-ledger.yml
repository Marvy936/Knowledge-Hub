name: One-time Cloud runtime ledger update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-cloud-runtime-ledger.yml"

permissions:
  contents: write

jobs:
  update-ledger:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update ledger and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="${GITHUB_REF_NAME}"
          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin "$branch"
            git reset --hard "origin/${branch}"

            python - <<'PY'
          from pathlib import Path

          path = Path("DOCUMENTATION-REVIEW-STATUS.md")
          text = path.read_text(encoding="utf-8")

          old_status = "| `11-cloud-and-aws` — Cloud and AWS | 16/28 strict revalidation |"
          new_status = "| `11-cloud-and-aws` — Cloud and AWS | 20/28 strict revalidation |"

          old_suffix = "Existujúce cloud foundations a networking/fleet glossaries zostali zachované; nový `glossary/11c-aws-edge-storage-data-lifecycles.md` pridal load-balancer selection, object/block/file recovery, database transaction/failover a DNS/cache-isolation terminology. Zostáva 12 kapitol a finálny section-level pass."
          new_suffix = "Existujúce cloud foundations a networking/fleet glossaries zostali zachované; `glossary/11c-aws-edge-storage-data-lifecycles.md` pokrýva load-balancer selection, object/block/file recovery, database transaction/failover a DNS/cache-isolation terminology. Piaty blok bol kompletne prepísaný: `Lambda` používa `business event → source/delivery generation → invocation admission/concurrency → execution environment → handler/downstream side effect → acknowledgement/unknown outcome → retry/backlog/replay → business reconciliation`; `ECS a EKS` používajú `immutable workload intent → orchestrator desired state → scheduler placement → compute/network/storage realization → workload identity → readiness/target eligibility → traffic/business outcome → update/drain`; `CloudWatch a CloudTrail` používajú `operational/audit otázka → exact evidence subject → signal/API event generation → delivery/identity/retention → evaluation/investigation → correlation → action → validation/closure`; `Systems Manager` používa `operation intent → managed-node eligibility → pinned document a resolved target manifest → rate-controlled execution → per-node result → application validation → compliance/recovery`. Worked failures pokrývajú SQS visibility-generation mismatch a duplicate settlement; ECS/EKS scale-out blokovaný spoločným subnet IP exhaustion napriek voľnému CPU; telemetry dimension drift, ktorý cez missing-data alarm spustil deštruktívnu remediation slučku; a mutable patch tag, ktorý rozšíril schválený štvorčlenný canary na celý 36-node fleet. Každá kapitola používa exact runtime/evidence/operation subject, competing hypotheses, discriminating observations, evidence-preserving containment, authoritative recovery a original aj forbidden business outcome. README ordering a navigation chain `Route 53/CloudFront → Lambda → ECS/EKS → CloudWatch/CloudTrail → Systems Manager → KMS/Secrets Manager` boli overené obojsmerne. Nový `glossary/11d-aws-runtime-observability-operations-lifecycles.md` pridal serverless delivery/concurrency/replay, container placement/capacity/identity, telemetry/audit/remediation a Systems Manager target/execution/patch terminology. Zostáva 8 kapitol a finálny section-level pass."

          if old_status not in text:
              raise SystemExit("Expected 16/28 Cloud and AWS ledger status was not found.")
          if old_suffix not in text:
              raise SystemExit("Expected Cloud and AWS ledger suffix was not found.")

          text = text.replace(old_status, new_status, 1)
          text = text.replace(old_suffix, new_suffix, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

            git rm .github/workflows/one-time-cloud-runtime-ledger.yml
            git add DOCUMENTATION-REVIEW-STATUS.md
            git commit -m "docs(review): record fifth Cloud and AWS strict revalidation block"

            if git push origin "HEAD:${branch}"; then
              exit 0
            fi

            echo "::warning::Remote ${branch} changed during ledger update attempt ${attempt}; retrying."
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Unable to push ledger update after ${max_attempts} attempts."
              exit 1
            fi
          done
