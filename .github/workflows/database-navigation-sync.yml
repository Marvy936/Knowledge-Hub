name: Database navigation sync

on:
  push:
    branches:
      - agent/databases-style-revalidation-block-1

permissions:
  contents: write

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/databases-style-revalidation-block-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize navigation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_navigation.py --write
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/15-databases-and-distributed-systems/indexes-locks-and-migrations.md docs/15-databases-and-distributed-systems/replication-and-high-availability.md
          git commit -m 'docs: synchronize database navigation'
          git push origin HEAD:agent/databases-style-revalidation-block-1