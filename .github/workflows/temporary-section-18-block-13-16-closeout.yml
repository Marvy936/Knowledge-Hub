name: Temporary Section 18 block 13-16 closeout

on:
  push:
    branches:
      - agent/section-18-ml-fundamentals-block-13-16
    paths:
      - "docs/18-machine-learning-fundamentals/**"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**"
      - "DOCUMENTATION-REVIEW-STATUS.md"
      - "scripts/update_navigation.py"
      - "scripts/update_glossary.py"
      - "scripts/audit_learning_depth.py"
      - ".github/workflows/temporary-section-18-block-13-16-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-section-18-block-13-16-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-18-ml-fundamentals-block-13-16

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remediate findings and synchronize documentation
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one replacement target in {path}, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "docs/18-machine-learning-fundamentals/overfitting-underfitting-bias-variance.md",
              "## 2. Exact generalization subject\n\n```yaml",
              "## 2. Exact generalization subject\n\nGeneralization verdict má význam iba pre presne identifikovanú kombináciu tasku, population, splitu, feature/model procedure, regularization a evaluation cohorts. Manifest nižšie preto nie je administratívna metadata: určuje, ktoré training a validation výsledky možno porovnať a ktoré patria k inej experimentálnej generácii. Bez tohto contractu sa rozdiel skóre môže nesprávne pripísať capacity alebo variance, hoci sa medzi runmi zmenili dáta, features alebo policy.\n\n```yaml",
          )

          replace_once(
              "docs/18-machine-learning-fundamentals/overfitting-underfitting-bias-variance.md",
              "## 11. Approximation, estimation a optimization error\n\nObserved error can be separated conceptually:\n\n- approximation error — model class cannot represent desired function;\n- estimation error — finite/noisy data means fitted function differs from best in class;\n- optimization error — training failed to find sufficiently good parameters for empirical objective;\n- evaluation error — metric/split/implementation does not estimate intended scenario.\n\nIncreasing model capacity addresses approximation but may worsen estimation. Training longer addresses optimization, not wrong target/split. This taxonomy prevents random fixes.",
              "## 11. Approximation, estimation a optimization error\n\nObserved error nie je jedna homogénna veličina. Diagnostika musí určiť, či limit vzniká v reprezentácii model class, v konečnom a noisy training sample, v samotnom optimization procedure alebo v evaluation contracte. Každý typ chyby predpovedá iný evidence pattern a vyžaduje inú zmenu; bez tohto rozdelenia tím ľahko zvýši capacity, predĺži training alebo pridá dáta bez zásahu do skutočnej príčiny.\n\n- approximation error — model class nedokáže reprezentovať požadovanú funkciu ani pri ideálnom fitnutí v rámci danej class;\n- estimation error — finite alebo noisy data spôsobia, že fitted function sa odlišuje od najlepšej funkcie dostupnej v zvolenej class;\n- optimization error — training procedure nenašla dostatočne dobré parameters pre deklarovaný empirical objective;\n- evaluation error — metric, split alebo implementation neodhaduje scenár, podľa ktorého sa bude rozhodovať v produkcii.\n\nIncreasing model capacity môže znížiť approximation error, ale zároveň zvýšiť estimation variance. Training longer rieši iba optimization error a nepomôže pri wrong targete, leakage alebo chybnom splite. Taxonómia preto viaže každú remediation na falzifikovateľnú hypotézu namiesto náhodného tuningu.",
          )

          replace_once(
              "docs/18-machine-learning-fundamentals/gradient-descent-learning-rate-convergence.md",
              "## 18. Early stopping a checkpoint authority\n\n```python",
              "## 18. Early stopping a checkpoint authority\n\nEarly stopping kombinuje validation-based selection so zastavením optimization trajectory. Autoritatívny výsledok preto nie je automaticky posledný epoch ani posledný zapísaný checkpoint, ale presne označený step, ktorého monitorovaná validation metric splnila selection rule. Workflow musí oddeliť weights určené pre inference export od complete training checkpointu potrebného na exact resume, pretože callback môže obnoviť best weights bez zodpovedajúceho optimizer a schedule state.\n\n```python",
          )

          replace_once(
              "docs/18-machine-learning-fundamentals/regularization-early-stopping.md",
              "## 2. Exact regularization subject\n\n```yaml",
              "## 2. Exact regularization subject\n\nRegularization subject musí zachytiť všetky mechanizmy, ktoré menia objective, update alebo selected checkpoint, nie iba jeden spoločný názov experimentu. Manifest preto oddeľuje parameter penalties, optimizer decay, stochastic layers, data transformations a stopping policy vrátane scope-u a selection authority. Dve konfigurácie s rovnakým číselným koeficientom nie sú ekvivalentné, ak zasahujú iné variables alebo vstupujú do training lifecycle iným spôsobom.\n\n```yaml",
          )

          replace_once(
              "docs/18-machine-learning-fundamentals/hyperparameters-hyperparameter-optimization.md",
              "## 13. Failure hypotheses\n\nPri sklamaní searchu treba odlíšiť aspoň tieto hypotézy:\n\n- search space neobsahuje použiteľnú konfiguráciu;\n- objective nereprezentuje business outcome;\n- split alebo CV porušuje time/entity boundary;\n- sampler nemal dostatočný budget;\n- pruner odstránil kandidátov príliš skoro;\n- trial failures systematicky zasahujú určitú časť space-u;\n- parallel scheduler zvýhodňuje krátke trialy;\n- selected configuration bola refitovaná iným pipeline contractom;\n- validation set bol opakovaným tuningom preťažený;\n- apparent gain je seed alebo fold variance.\n\nKaždá hypotéza musí predpovedať odlišný evidence pattern. Viac trialov samo osebe nevyrieši zlý objective alebo leakage.",
              "## 13. Failure hypotheses\n\nSklamanie hyperparameter searchu nemá jednu univerzálnu príčinu. Pred ďalším spustením treba rozlíšiť coverage problémy search space-u, chybnú evaluation authority, scheduler alebo pruner bias, systematické execution failures a selection overfit. Každá hypotéza musí predpovedať odlišný trial-state, metric, timing alebo cohort pattern; iba zvýšenie počtu trialov nevyrieši zlý objective, leakage ani nekompatibilný refit.\n\n- search-space coverage — povolený priestor neobsahuje použiteľnú konfiguráciu alebo constraints vylúčili relevantný región;\n- objective mismatch — optimalizovaná metrika nereprezentuje business outcome alebo ignoruje povinné guardrails;\n- split/CV violation — foldy porušujú time alebo entity boundary a vracajú optimistický selection signal;\n- insufficient sampler budget — sampler nemal dosť observations na preskúmanie dôležitých regiónov space-u;\n- premature pruning — pruner odstránil pomaly sa zlepšujúcich kandidátov skôr, než ich intermediate metric bola porovnateľná;\n- systematic trial failures — konkrétna časť space-u zlyháva pre OOM, invalid combinations alebo infrastructure limits a preto sa javí horšia bez validného score;\n- parallel scheduling bias — scheduler zvýhodňuje krátke trialy alebo pracuje so stale observations pri vysokej concurrency;\n- refit contract drift — selected configuration bola refitovaná s iným preprocessing, dataset alebo training procedure než trial;\n- validation selection overfit — opakované rozhodnutia spotrebovali ten istý validation set a apparent gain sa neprenáša na independent test;\n- seed/fold variance — rozdiel medzi kandidátmi je menší než variabilita spôsobená sample composition alebo stochastic trainingom.\n\nEvidence review má pre každú hypotézu uviesť očakávaný a falzifikačný signál. Napríklad viac failed trialov v high-memory regióne podporuje execution-capacity hypothesis, kým stabilné trial completion s gainom iba na jednom fold-e skôr ukazuje selection variance alebo split problém.",
          )

          path = Path("DOCUMENTATION-REVIEW-STATUS.md")
          text = path.read_text(encoding="utf-8")
          prefix = "| `18-machine-learning-fundamentals` — Machine Learning Fundamentals |"
          replacement = (
              "| `18-machine-learning-fundamentals` — Machine Learning Fundamentals | "
              "16/26 authoritative drafting | In progress | 2026-08-03 | "
              "Šestnásť authoritative kapitol je aktívnych. Blok 13–16 oddeľuje optimization trajectory od generalization a business acceptance; learning-rate, schedule, batch a checkpoint generácie od nepresného epoch-based convergence verdictu; underfitting/overfitting/bias/variance od leakage, population shift a label noise; objective penalty, decoupled weight decay, stochastic regularization a early-stopping checkpoint semantics; a exact HPO search-space/trial/budget/objective/split/sampler/pruner/refit lifecycle vrátane nested evaluation, pruning, parallel scheduling a resume. Incident `ML-PAY-86` prepája false convergence, nesprávny resume, prekrývajúcu sa regularizáciu a validation-overfit hyperparameter search. Kapitoly 17–26 zostávajú plánované. Reálne optimizer trajectories, training, HPO studies, refit, inference a business actions neboli vykonané. |"
          )
          lines = text.splitlines()
          matches = [index for index, line in enumerate(lines) if line.startswith(prefix)]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one Section 18 ledger row, found {len(matches)}")
          lines[matches[0]] = replacement
          path.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8", newline="\n")
          PY

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md GLOSSARY.md docs DOCUMENTATION-REVIEW-STATUS.md DOCUMENTATION-AUDIT.md documentation-audit.json

          if git diff --cached --quiet; then
            echo "No remediation changes required."
            exit 0
          fi

          git commit -m "docs: remediate Machine Learning block 13-16 findings"
          git push origin HEAD:agent/section-18-ml-fundamentals-block-13-16
