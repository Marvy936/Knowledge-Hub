name: Temporary Section 21 block 49-52 closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "docs/21-ai-agents-and-intelligent-automation/**"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "DOCUMENTATION-REVIEW-STATUS.md"
      - "DOCUMENTATION-AUDIT.md"
      - "documentation-audit.json"
      - ".github/workflows/temporary-section-21-block-49-52-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-section-21-block-49-52-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-21-ai-agents-block-49-52

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize section and run learning-depth closeout
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          root = Path("docs/21-ai-agents-and-intelligent-automation")
          readme = root / "README.md"
          replace_once(
              readme,
              "48. [Incident triage a evidence collection](incident-triage-evidence-collection.md)\n\n## Plánované authoritative poradie",
              "48. [Incident triage a evidence collection](incident-triage-evidence-collection.md)\n"
              "49. [Policy generation a policy validation](policy-generation-policy-validation.md)\n"
              "50. [Human approval, audit a rollback](human-approval-audit-rollback.md)\n"
              "51. [Vendor lock-in a portability agentických workflowov](vendor-lock-in-portability-agentic-workflows.md)\n"
              "52. [Workflow engine oproti agent frameworku](workflow-engine-vs-agent-framework.md)\n\n"
              "## Plánované authoritative poradie",
          )
          for planned in (
              "49. Policy generation a policy validation\n",
              "50. Human approval, audit a rollback\n",
              "51. Vendor lock-in a portability agentických workflowov\n",
              "52. Workflow engine oproti agent frameworku\n",
          ):
              replace_once(readme, planned, "")

          text = readme.read_text(encoding="utf-8")
          marker = "## Stav\n\n"
          if text.count(marker) != 1:
              raise SystemExit("README: expected one status marker")
          prefix, _ = text.split(marker, 1)
          status = (
              "Aktuálny authoritative stav sekcie je **52/62 · In progress**. Trinásty authoritative blok aktivuje kapitoly 49–52 a incident `AGENT-GOV-13`. Policy kapitola oddeľuje control objective, exact input/event contract, AI proposal, Rego semantics, positive/negative/mutation tests, policy-set scope/action, immutable bundle a runtime decision evidence. Approval kapitola viaže exact subject, quorum, separation of duties, expiry, pre-execution revalidation, audit completeness, rollback, compensating actions a business reconciliation. Portability kapitola rozkladá vendor lock-in na API, state, checkpoint, memory, identity, approval, audit a operational vrstvy a vyžaduje canonical contracts, conformance suite a reálny exit drill. Workflow-engine kapitola prideľuje durable state, timers, retries, approvals a operation IDs deterministic engine-u a probabilistické reasoning, memory a tool trajectory agent frameworku. Reálne policy evaluations, approvals, audit exports, rollbacks, migrations, crash/replay drilly ani business outcomes neboli vykonané. Sekcia zostáva `In progress`, nie runtime `Verified`, production `Stable` ani user `Accepted`. Ďalší blok sú kapitoly 53–56: n8n oproti Temporal/Airflow/Prefect use cases, event-driven automation, AI-assisted CI/CD a AI-assisted observability/incident response.\n"
          )
          readme.write_text(prefix + marker + status, encoding="utf-8", newline="\n")

          roadmap = Path("ROADMAP.md")
          roadmap_updates = {
              "- [ ] Policy generation a policy validation": "- [x] [Policy generation a policy validation](docs/21-ai-agents-and-intelligent-automation/policy-generation-policy-validation.md)",
              "- [ ] Human approval, audit a rollback": "- [x] [Human approval, audit a rollback](docs/21-ai-agents-and-intelligent-automation/human-approval-audit-rollback.md)",
              "- [ ] Vendor lock-in a portability agentických workflowov": "- [x] [Vendor lock-in a portability agentických workflowov](docs/21-ai-agents-and-intelligent-automation/vendor-lock-in-portability-agentic-workflows.md)",
              "- [ ] Workflow engine oproti agent frameworku": "- [x] [Workflow engine oproti agent frameworku](docs/21-ai-agents-and-intelligent-automation/workflow-engine-vs-agent-framework.md)",
          }
          for old, new in roadmap_updates.items():
              replace_once(roadmap, old, new)

          review = Path("DOCUMENTATION-REVIEW-STATUS.md")
          lines = review.read_text(encoding="utf-8").splitlines()
          row_prefix = "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation |"
          matches = [index for index, line in enumerate(lines) if line.startswith(row_prefix)]
          if len(matches) != 1:
              raise SystemExit(f"Review status: expected one Section 21 row, found {len(matches)}")
          lines[matches[0]] = (
              "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation | 52/62 authoritative drafting | In progress | 2026-08-05 | "
              "Trinásty authoritative blok aktivuje kapitoly 49–52 a incident `AGENT-GOV-13`. Policy generation kapitola viaže business control, governed subject/event, canonical input, model/prompt generation, Rego source, tests, policy set, scope/severity, bundle activation, decision evidence, exceptions a recovery. Human approval kapitola oddeľuje proposal, exact subject, eligible approvers, quorum, self-approval, expiry, revalidation, operation identity, audit chain, technical rollback a business reconciliation. Portability kapitola inventarizuje domain contracts, tools, events, model/prompt adapters, memory, checkpoints, approvals, identity, policy, audit a exit drilly. Workflow-engine kapitola oddeľuje durable process authority od agent trajectory a vyžaduje typed boundaries, single retry ownera, stable operation IDs, failure injection a business read-back. Reálne policy runs, approvals, audit exports, rollbacks, vendor migrations, engine crashes, replay tests a business outcomes neboli vykonané; stav zostáva `In progress`, nie runtime `Verified`, production `Stable` ani user `Accepted`. |"
          )
          review.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          python - <<'PY'
          from pathlib import Path

          audit = Path("DOCUMENTATION-AUDIT.md").read_text(encoding="utf-8")
          files = [
              "policy-generation-policy-validation.md",
              "human-approval-audit-rollback.md",
              "vendor-lock-in-portability-agentic-workflows.md",
              "workflow-engine-vs-agent-framework.md",
          ]
          remaining = [
              name
              for name in files
              if f"### `docs/21-ai-agents-and-intelligent-automation/{name}`" in audit
          ]
          if remaining:
              for name in remaining:
                  heading = f"### `docs/21-ai-agents-and-intelligent-automation/{name}`"
                  start = audit.find(heading)
                  end = audit.find("\n### `", start + len(heading))
                  print(audit[start:end if end != -1 else len(audit)])
              raise SystemExit(f"Section 21 block 49-52 critical/high findings remain: {remaining}")
          print("Section 21 block 49-52 has no critical/high audit entries.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ROADMAP.md \
            GLOSSARY.md \
            DOCUMENTATION-REVIEW-STATUS.md \
            DOCUMENTATION-AUDIT.md \
            documentation-audit.json \
            docs/21-ai-agents-and-intelligent-automation

          if git diff --cached --quiet; then
            echo "No closeout changes required."
            exit 0
          fi

          git commit -m "docs: synchronize agent governance block closeout"
          git push origin HEAD:agent/section-21-ai-agents-block-49-52
