name: Temporary Section 10 practical validation

on:
  push:
    branches:
      - agent/section-10-practical-helm-examples
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-section-10-practical-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - name: Checkout Section 10 branch
        uses: actions/checkout@v4
        with:
          ref: agent/section-10-practical-helm-examples
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize generated documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          if ! git diff --quiet; then
            git add docs GLOSSARY.md
            git commit -m "docs: synchronize Section 10 generated documentation"
            git push origin HEAD:agent/section-10-practical-helm-examples
          fi

      - name: Validate prose depth and executable examples
        id: practical_gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check
          python scripts/audit_learning_depth.py --all-docs --report /tmp/audit.md --json /tmp/audit.json
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('docs/10-helm-and-cka')
          data = json.loads(Path('/tmp/audit.json').read_text(encoding='utf-8'))
          section = [item for item in data['files'] if item['path'].startswith('docs/10-helm-and-cka/')]
          failures = []
          for item in section:
              print(
                  f"STRICT {item['path']} words={item['words']} grade={item['grade']} "
                  f"critical={item['critical']} high={item['high']} medium={item['medium']} low={item['low']}"
              )
              if item['critical'] or item['high'] or item['medium']:
                  failures.append(
                      f"{item['path']}: {item['critical']}/{item['high']}/{item['medium']}"
                  )

          helm_files = [
              'helm-chart-practical-walkthrough.md',
              'helm-chart-template-values-release.md',
              'template-functions-pipelines.md',
              'named-templates.md',
              'chart-dependencies.md',
              'hooks.md',
              'upgrade-rollback.md',
              'helm-testing-troubleshooting.md',
          ]
          for name in helm_files:
              text = (root / name).read_text(encoding='utf-8')
              bash_blocks = len(re.findall(r'```(?:bash|shell)\n', text))
              structured_blocks = len(re.findall(r'```(?:yaml|yml|json|gotemplate)\n', text))
              helm_commands = len(re.findall(r'(?m)^helm\s+', text))
              explanatory_markers = len(re.findall(
                  r'(?i)(tento príkaz|príkaz preukazuje|výstup|očakávan|nepreukazuje|znamená|overí)',
                  text,
              ))
              print(
                  f"PRACTICAL {name} bash={bash_blocks} structured={structured_blocks} "
                  f"helm_commands={helm_commands} explanations={explanatory_markers}"
              )
              if bash_blocks < 1 or helm_commands < 2 or explanatory_markers < 3:
                  failures.append(f'{name}: insufficient executable Helm walkthrough')
              if name in {
                  'helm-chart-practical-walkthrough.md',
                  'helm-chart-template-values-release.md',
                  'template-functions-pipelines.md',
                  'named-templates.md',
                  'chart-dependencies.md',
                  'hooks.md',
              } and structured_blocks < 1:
                  failures.append(f'{name}: missing explained chart/config example')

          for name in ['cka-timed-labs.md', 'cka-troubleshooting-drills.md']:
              text = (root / name).read_text(encoding='utf-8')
              bash_blocks = len(re.findall(r'```(?:bash|shell)\n', text))
              kubectl_commands = len(re.findall(r'(?m)^kubectl\s+', text))
              explanations = len(re.findall(
                  r'(?i)(tento príkaz|príkaz preukazuje|výstup|očakávan|nepreukazuje|overí|zakázan)',
                  text,
              ))
              print(
                  f"PRACTICAL {name} bash={bash_blocks} kubectl={kubectl_commands} explanations={explanations}"
              )
              if bash_blocks < 2 or kubectl_commands < 6 or explanations < 3:
                  failures.append(f'{name}: insufficient executable CKA drill')

          if failures:
              print('FAILED PRACTICAL/DEPTH GATE:')
              for failure in failures:
                  print(f'- {failure}')
              raise SystemExit(1)
          PY

      - name: Publish temporary validation verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'status=%s\ncommit=%s\n' '${{ job.status }}' "$(git rev-parse HEAD)" > .github/section10-practical-validation-result.txt
          git add .github/section10-practical-validation-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci(docs): record Section 10 practical validation"
            git push origin HEAD:agent/section-10-practical-helm-examples
          fi
