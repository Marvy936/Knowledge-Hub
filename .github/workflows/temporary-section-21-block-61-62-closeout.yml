name: Temporary Section 21 block 61-62 closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "docs/21-ai-agents-and-intelligent-automation/**"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "DOCUMENTATION-REVIEW-STATUS.md"
      - "DOCUMENTATION-AUDIT.md"
      - "documentation-audit.json"
      - ".github/workflows/temporary-section-21-block-61-62-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-section-21-block-61-62-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-21-ai-agents-block-61-62

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize section and run final learning-depth closeout
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          root = Path("docs/21-ai-agents-and-intelligent-automation")
          readme = root / "README.md"
          replace_once(
              readme,
              "60. [Autonomous remediation boundaries](autonomous-remediation-boundaries.md)\n\n"
              "## Plánované authoritative poradie\n\n"
              "Nasledujúci inventory je schválený plán sekcie. Položka sa zmení na aktívny Markdown link až v pracovnom bloku, ktorý vytvorí a validuje príslušnú kapitolu. Tým sa plánovaný obsah nezamieňa za hotovú dokumentáciu.\n\n"
              "61. Evaluation-driven automation lifecycle\n"
              "62. Intelligent automation troubleshooting\n\n"
              "## Authoring a evidence štandard",
              "60. [Autonomous remediation boundaries](autonomous-remediation-boundaries.md)\n"
              "61. [Evaluation-driven automation lifecycle](evaluation-driven-automation-lifecycle.md)\n"
              "62. [Intelligent automation troubleshooting](intelligent-automation-troubleshooting.md)\n\n"
              "## Authoring a evidence štandard",
          )

          text = readme.read_text(encoding="utf-8")
          marker = "## Stav\n\n"
          if text.count(marker) != 1:
              raise SystemExit("README: expected one status marker")
          prefix, _ = text.split(marker, 1)
          status = (
              "Aktuálny authoritative stav sekcie je **62/62 · Ready for user review**. Šestnásty a záverečný authoritative blok aktivuje kapitoly 61–62 a incident `AGENT-EVAL-16`. Evaluation-driven lifecycle viaže composed candidate a baseline identity, governed dataset generations, representative a critical slices, deterministic aj modelové gradery, human calibration, hard thresholds, failure injection, offline, shadow, canary a online evaluation, promotion, rollback a business post-condition. Troubleshooting kapitola rozkladá incident na trigger, orchestration, queue, model, prompt, retrieval, memory, tool, connector, identity, policy, approval, side effect, telemetry a business vrstvy; používa evidence freeze, correlation, competing hypotheses, safe replay, generation bisection, unknown-outcome reconciliation a second-operation acceptance. Všetkých 62 kapitol sekcie má authoritative prose-first obsah a synchronizovaný repository evidence model. Dokumentačné kontroly nepreukazujú živé eval runs, model/provider behavior, tool side effects, incident recovery, rollback drilly ani business outcomes; sekcia je preto `Ready for user review`, nie runtime `Verified`, production `Stable` ani user `Accepted`.\n"
          )
          readme.write_text(prefix + marker + status, encoding="utf-8", newline="\n")

          roadmap = Path("ROADMAP.md")
          updates = {
              "- [ ] Evaluation-driven automation lifecycle": "- [x] [Evaluation-driven automation lifecycle](docs/21-ai-agents-and-intelligent-automation/evaluation-driven-automation-lifecycle.md)",
              "- [ ] Intelligent automation troubleshooting": "- [x] [Intelligent automation troubleshooting](docs/21-ai-agents-and-intelligent-automation/intelligent-automation-troubleshooting.md)",
          }
          for old, new in updates.items():
              replace_once(roadmap, old, new)

          review = Path("DOCUMENTATION-REVIEW-STATUS.md")
          lines = review.read_text(encoding="utf-8").splitlines()
          row_prefix = "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation |"
          matches = [i for i, line in enumerate(lines) if line.startswith(row_prefix)]
          if len(matches) != 1:
              raise SystemExit(f"Review status: expected one Section 21 row, found {len(matches)}")
          lines[matches[0]] = (
              "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation | 62/62 authoritative drafting and section closeout | Ready for user review | 2026-08-05 | "
              "Šestnásty a záverečný authoritative blok aktivuje kapitoly 61–62 a incident `AGENT-EVAL-16`. Evaluation lifecycle viaže exact workflow/prompt/model/tool/policy/index/runtime subject, pinned baseline, governed dataset a evaluator generations, representative aj critical slices, deterministic hard gates, calibrated model judges, human agreement, uncertainty, cost, shadow, canary, online sampling, production feedback, promotion, waivers a rollback. Troubleshooting rozlišuje symptom od business outcome-u a diagnostikuje trigger, event identity, orchestration state, queue, model request/output, prompt hierarchy, retrieval, memory, tool, connector, workload identity, policy, approval, downstream side effect, telemetry a domain ledger; recovery používa evidence preservation, correlation, safe replay, bisection, reconciliation a alternate-scenario acceptance. Všetkých 62 kapitol má authoritative prose-first obsah a synchronizovaný repository evidence model. Reálne eval experiments, production traces, provider behavior, side effects, incident response, rollback a business outcomes neboli vykonané; sekcia je `Ready for user review`, nie runtime `Verified`, production `Stable` ani user `Accepted`. |"
          )
          review.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          python - <<'PY'
          from pathlib import Path

          audit = Path("DOCUMENTATION-AUDIT.md").read_text(encoding="utf-8")
          files = [
              "evaluation-driven-automation-lifecycle.md",
              "intelligent-automation-troubleshooting.md",
          ]
          remaining = [
              name for name in files
              if f"### `docs/21-ai-agents-and-intelligent-automation/{name}`" in audit
          ]
          if remaining:
              for name in remaining:
                  heading = f"### `docs/21-ai-agents-and-intelligent-automation/{name}`"
                  start = audit.find(heading)
                  end = audit.find("\n### `", start + len(heading))
                  print(audit[start:end if end != -1 else len(audit)])
              raise SystemExit(f"Section 21 block 61-62 critical/high findings remain: {remaining}")
          print("Section 21 block 61-62 has no critical/high audit entries.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ROADMAP.md \
            GLOSSARY.md \
            DOCUMENTATION-REVIEW-STATUS.md \
            DOCUMENTATION-AUDIT.md \
            documentation-audit.json \
            docs/21-ai-agents-and-intelligent-automation

          if git diff --cached --quiet; then
            echo "No closeout changes required."
            exit 0
          fi

          git commit -m "docs: complete AI agents and intelligent automation section"
          git push origin HEAD:agent/section-21-ai-agents-block-61-62
