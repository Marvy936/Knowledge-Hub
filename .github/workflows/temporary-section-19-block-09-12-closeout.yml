name: Temporary Section 19 block 09-12 closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "docs/19-mlops-and-ml-platforms/**"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "DOCUMENTATION-REVIEW-STATUS.md"
      - "DOCUMENTATION-AUDIT.md"
      - "documentation-audit.json"
      - "scripts/temporary_section_19_block_09_12_closeout.py"
      - ".github/workflows/temporary-section-19-block-09-12-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-section-19-block-09-12-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-19-mlops-block-09-12

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize status and generated documentation
        shell: bash
        run: |
          set -euo pipefail

          python scripts/temporary_section_19_block_09_12_closeout.py
          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          python - <<'PY'
          from pathlib import Path

          audit = Path("DOCUMENTATION-AUDIT.md").read_text(encoding="utf-8")
          critical_high = audit.split("## Critical and high findings", 1)[1].split(
              "## All findings by rule", 1
          )[0]
          files = [
              "ml-pipeline-orchestration.md",
              "training-pipelines-distributed-training.md",
              "ci-for-ml-code-data-pipelines.md",
              "continuous-delivery-for-models.md",
          ]
          remaining = [
              name
              for name in files
              if f"### `docs/19-mlops-and-ml-platforms/{name}`" in critical_high
          ]
          if remaining:
              raise SystemExit(
                  f"Section 19 block 09-12 critical/high findings remain: {remaining}"
              )
          print("Section 19 block 09-12 has no critical/high audit entries.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ROADMAP.md \
            GLOSSARY.md \
            docs \
            DOCUMENTATION-REVIEW-STATUS.md \
            DOCUMENTATION-AUDIT.md \
            documentation-audit.json

          if git diff --cached --quiet; then
            echo "No closeout changes required."
            exit 0
          fi

          git commit -m "docs: synchronize MLOps chapters 09-12"
          git push origin "HEAD:agent/section-19-mlops-block-09-12"
