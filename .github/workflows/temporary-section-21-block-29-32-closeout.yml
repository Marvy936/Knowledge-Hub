name: Temporary Section 21 block 29-32 closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "docs/21-ai-agents-and-intelligent-automation/**"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "DOCUMENTATION-REVIEW-STATUS.md"
      - "DOCUMENTATION-AUDIT.md"
      - "documentation-audit.json"
      - ".github/workflows/temporary-section-21-block-29-32-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-section-21-block-29-32-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-21-ai-agents-block-29-32

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize section and run learning-depth closeout
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          readme = Path("docs/21-ai-agents-and-intelligent-automation/README.md")
          replace_once(
              readme,
              "28. [Credentials, secrets a access control](credentials-secrets-access-control.md)\n\n## Plánované authoritative poradie",
              "28. [Credentials, secrets a access control](credentials-secrets-access-control.md)\n"
              "29. [Error workflows, retries a partial execution](error-workflows-retries-partial-execution.md)\n"
              "30. [Idempotency a duplicate-event handling](idempotency-duplicate-event-handling.md)\n"
              "31. [Sub-workflows a reusable workflow contracts](sub-workflows-reusable-workflow-contracts.md)\n"
              "32. [Source control a environments](source-control-environments.md)\n\n"
              "## Plánované authoritative poradie",
          )
          for planned in (
              "29. Error workflows, retries a partial execution\n",
              "30. Idempotency a duplicate-event handling\n",
              "31. Sub-workflows a reusable workflow contracts\n",
              "32. Source control a environments\n",
          ):
              replace_once(readme, planned, "")

          text = readme.read_text(encoding="utf-8")
          marker = "## Stav\n\n"
          if text.count(marker) != 1:
              raise SystemExit("README: expected one status marker")
          prefix, _ = text.split(marker, 1)
          status = (
              "Aktuálny authoritative stav sekcie je **32/62 · In progress**. Ôsmy authoritative blok aktivuje kapitoly 29–32 a incident `AGENT-N8N-08`. Error/retry kapitola oddeľuje node attempt, workflow execution, provider delivery a business outcome, používa per-item terminal state, unknown-outcome reconciliation, quarantine a error-handler isolation. Idempotency kapitola zavádza canonical tenant-scoped operation key, payload fingerprint, atomic claim, durable state machine, inbox/outbox boundary, provider-native enforcement a crash-after-commit recovery. Sub-workflow kapitola chápe reusable workflow ako versioned capability s input/output/error/cardinality contractom, item linkingom, bounded credentials, retry ownershipom, dependency graphom a coordinated promotion. Source-control kapitola oddeľuje Git desired state, saved definition, published workflow a effective runtime, viaže ich na credential/variable/sub-workflow/node generations a uzatvára promotion composed manifestom, loaded-state read-backom, drift detection a rollbackom. Reálne n8n failures, retries, duplicate deliveries, sub-workflow calls, Git promotions, credential mappings, rollbacky ani business outcomes neboli vykonané. Sekcia zostáva `In progress`, nie runtime `Verified`, production `Stable` ani user `Accepted`. Ďalší blok sú kapitoly 33–36: self-hosting s PostgreSQL, queue mode/Redis/workers/scaling, binary data/storage/execution retention a n8n monitoring/logs/security audit.\n"
          )
          readme.write_text(prefix + marker + status, encoding="utf-8", newline="\n")

          roadmap = Path("ROADMAP.md")
          roadmap_updates = {
              "- [ ] Error workflows, retries a partial execution": "- [x] [Error workflows, retries a partial execution](docs/21-ai-agents-and-intelligent-automation/error-workflows-retries-partial-execution.md)",
              "- [ ] Idempotency a duplicate-event handling": "- [x] [Idempotency a duplicate-event handling](docs/21-ai-agents-and-intelligent-automation/idempotency-duplicate-event-handling.md)",
              "- [ ] Sub-workflows a reusable workflow contracts": "- [x] [Sub-workflows a reusable workflow contracts](docs/21-ai-agents-and-intelligent-automation/sub-workflows-reusable-workflow-contracts.md)",
              "- [ ] Source control a environments": "- [x] [Source control a environments](docs/21-ai-agents-and-intelligent-automation/source-control-environments.md)",
          }
          for old, new in roadmap_updates.items():
              replace_once(roadmap, old, new)

          review = Path("DOCUMENTATION-REVIEW-STATUS.md")
          lines = review.read_text(encoding="utf-8").splitlines()
          row_prefix = "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation |"
          matches = [index for index, line in enumerate(lines) if line.startswith(row_prefix)]
          if len(matches) != 1:
              raise SystemExit(f"Review status: expected one Section 21 row, found {len(matches)}")
          lines[matches[0]] = (
              "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation | 32/62 authoritative drafting | In progress | 2026-08-05 | "
              "Ôsmy authoritative blok aktivuje kapitoly 29–32 a incident `AGENT-N8N-08`. Error/retry kapitola rozlišuje technical attempt, absorbed error, execution status, partial per-item outcome, unknown external commit, quarantine a isolated error handler. Idempotency kapitola používa canonical tenant-scoped logical operation, stable key, payload conflict, atomic claim, provider/local ledger, inbox/outbox, replay/ordering a crash-after-commit reconciliation. Reusable sub-workflow kapitola zavádza versioned input/output/error/cardinality contract, item provenance, timeout/retry ownership, credential a tenant boundary, dependency graph a expand-migrate-contract promotion. Source-control kapitola oddeľuje Git commit, saved, published a effective runtime state a viaže workflow definitions na credentials, variables, child/error references, node/runtime generations, publication, drift, rollback a restore. Reálne n8n retries, duplicate events, provider mutations, sub-workflow calls, environment promotions, rollbacky, incident recovery a business outcomes neboli vykonané; stav zostáva `In progress`, nie runtime `Verified`, production `Stable` ani user `Accepted`. |"
          )
          review.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          python - <<'PY'
          from pathlib import Path

          audit = Path("DOCUMENTATION-AUDIT.md").read_text(encoding="utf-8")
          files = [
              "error-workflows-retries-partial-execution.md",
              "idempotency-duplicate-event-handling.md",
              "sub-workflows-reusable-workflow-contracts.md",
              "source-control-environments.md",
          ]
          remaining = [
              name
              for name in files
              if f"### `docs/21-ai-agents-and-intelligent-automation/{name}`" in audit
          ]
          if remaining:
              raise SystemExit(f"Section 21 block 29-32 critical/high findings remain: {remaining}")
          print("Section 21 block 29-32 has no critical/high audit entries.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ROADMAP.md \
            GLOSSARY.md \
            DOCUMENTATION-REVIEW-STATUS.md \
            DOCUMENTATION-AUDIT.md \
            documentation-audit.json \
            docs/21-ai-agents-and-intelligent-automation

          if git diff --cached --quiet; then
            echo "No closeout changes required."
            exit 0
          fi

          git commit -m "docs: synchronize n8n reliability block closeout"
          git push origin HEAD:agent/section-21-ai-agents-block-29-32
