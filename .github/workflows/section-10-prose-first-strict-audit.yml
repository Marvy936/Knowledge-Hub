name: Section 10 prose-first strict audit

on:
  pull_request:
    paths:
      - 'docs/10-helm-and-cka/**.md'
      - '.github/workflows/section-10-prose-first-strict-audit.yml'

permissions:
  contents: read

jobs:
  strict-audit:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit section 10
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_learning_depth.py --all-docs --report /tmp/report.md --json /tmp/audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          prefix = 'docs/10-helm-and-cka/'
          data = json.loads(Path('/tmp/audit.json').read_text())
          failed = False
          for item in data['files']:
              if item['path'].startswith(prefix) and item['path'] != prefix + 'README.md':
                  print(f"STRICT {item['path']} words={item['words']} grade={item['grade']} critical={item['critical']} high={item['high']} medium={item['medium']} low={item['low']}")
                  failed |= any(item[k] for k in ('critical', 'high', 'medium'))
          for finding in data['findings']:
              if finding['path'].startswith(prefix) and finding['path'] != prefix + 'README.md' and finding['severity'] in {'critical', 'high', 'medium'}:
                  print(f"FINDING path={finding['path']} severity={finding['severity']} section={finding.get('section')} line={finding.get('line')} rule={finding['rule']} detail={finding['detail']}")
          if failed:
              raise SystemExit('Section 10 still has medium-or-higher findings')
          PY
