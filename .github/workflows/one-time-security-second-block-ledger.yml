name: One-time Security second block ledger update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-security-second-block-ledger.yml

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update review ledger
        shell: python
        run: |
          from pathlib import Path

          path = Path("DOCUMENTATION-REVIEW-STATUS.md")
          text = path.read_text(encoding="utf-8")
          row = """| `13-security-and-identity` — Security and Identity | 8/19 strict revalidation | In progress | 2026-07-29 | Prvý authoritative blok bol kompletne prepísaný okolo connected Atlas Payments security subjectu `SEC-PAY-47`: `CIA triáda` používa `business capability a asset → exact security subject/trust boundaries → C/I/A objectives → threat/vulnerability/exposure/impact → required assurance → preventive/detective/response/recovery controls → effective-state evidence → containment/recovery → allowed/forbidden/residual-risk validation`; `Authentication, authorization a auditing` používa `identity proofing/eligibility → authenticator → authentication event → session/token → principal mapping → principal–action–resource–context request → PIP/PDP/PEP → operation result → delegated-actor audit → revocation a second-session validation`; `Least privilege` používa `business task → required action/resource/data inventory → privilege dimensions → minimal entitlement a maximum envelope → JIT activation → effective access → positive/negative/escalation tests → audit → revocation/removal`; `IAM a RBAC` používa `authoritative identity/owner state → entitlement desired generation → joiner/mover/leaver event → account/group/role reconciliation → federation/session → RBAC/ABAC evaluation → effective-access graph → review/revoke → second-sync validation`. Worked incident pokrýva human principal presunutý z Payments Operations do Finance Analytics, pri ktorom add-only mover sync odstránil direct group, ale ponechal nested path `finance-emea → legacy-shared-operations → prod-payment-operators`; validná WebAuthn session preto získala Kubernetes operator binding. Broad role umožnila arbitrary Pod create, výber `settlement-debug` ServiceAccountu, provider Secret use, route-config mutation a scale-to-zero, čím jeden identity defect narušil confidentiality, integrity aj availability. Root cause je incomplete entitlement reconciliation a chýbajúca session revocation; ukradnutá session je trigger a broad role causal amplifier. Recovery používa complete desired-state reconciliation, revocation odvodených sessions/tokens, provider credential rotation, signed GitOps restore, business reconciliation, mediated JIT `settlement.requeue.one` capability, negative escalation fixtures a second-login/second-sync test. Navigation chain `12-observability/Cardinality → CIA triáda → Authentication/authorization/auditing → Least privilege → IAM/RBAC → Active Directory` bol zachovaný. Nový `glossary/13a-security-goals-access-privilege-iam-lifecycles.md` pridal CIA assurance/recovery, principal-decision-audit, task-to-revocation a identity-entitlement reconciliation terminology; generated `GLOSSARY.md` je synchronizovaný a audit-failure artifacts sú prázdne. Aktuálne official facts boli overené: NIST SP 800-63 Revision 4 je finálna suite od júla 2025 a oddeľuje IAL, AAL a FAL; Kubernetes RBAC permissions sú additive bez deny rules a permissions ako workload creation, `bind`, `escalate` a `impersonate` vyžadujú explicitnú escalation analýzu. Druhý authoritative blok bol kompletne prepísaný okolo connected incidentu `SEC-PAY-48`: `Active Directory` používa `authoritative identity/policy change → exact forest/domain/object/DC generation → local commit a replication metadata → site/topology/partition replication → DNS/DC locator a selected replica → LDAP/Kerberos/GPO read → logon/group/policy effective state → resource authorization → convergence/revocation/second-session verdict`; `LDAP` používa `application directory question → exact directory/replica/schema subject → DNS/TLS → Bind state → base/scope/filter/projection → ACL/schema/index/controls → result/referral generation → client mapping/cache → freshness a second-replica validation`; `Kerberos` používa `principal/realm/long-term credential → KDC/pre-auth → AS/TGT → TGS/service ticket → AP/authenticator/replay → GSS context → PAC/group/local mapping → resource authorization → ticket/session/delegation lifecycle → revocation/rotation`; `OAuth 2.0` používa `protected-operation intent → issuer/client/resource registration → authorization transaction → state/redirect/PKCE → code/grant → token endpoint → audience/scope/lifetime/sender binding → RS validation → local tenant/object/business authorization → refresh/exchange/derived-token graph → revocation and audit`. Worked failure pokrýva removal `GG-PAY-Settlement-Approvers` na `DC-BTS-01` o `07:40 UTC`, ktorý sa pre chybnú `BTS-FRA` site-link schedule nereplikoval na `DC-FRA-02`; chýbajúce subnet-to-site mapovanie `10.48.24.0/24` spôsobilo výber stale DC. Fresh LDAP query s empty cache stále vrátila membership a fresh TGT vydaný `08:11 UTC` niesol privileged PAC/group generation. Protocol-correct OAuth Authorization Code + PKCE flow potom o `08:13 UTC` vydal hodinový JWT s broad audience `atlas-internal` a scope `payments.approve`; Resource Server kontroloval signature/audience/scope, ale nie current JIT, tenant, object a workflow authorization. Root cause je neconverged AD directory state; wrong DC selection, long-lived authorization snapshot, broad audience a scope-only RS policy sú causal amplifiers. Recovery opravuje replication schedule a subnet mapping, overuje object metadata na všetkých required DC/GC/LDAP replicas, ruší Kerberos/application/OAuth sessions a refresh descendants, zavádza resource-specific token, current JIT/resource check, per-replica canary a second-removal/second-login test. Navigation chain `IAM/RBAC → Active Directory → LDAP → Kerberos → OAuth 2.0 → OpenID Connect` bol zachovaný obojsmerne. Nový `glossary/13f-security-directory-ldap-kerberos-oauth-lifecycles.md` pridal directory convergence/replica selection, replica-bound LDAP query, KDC/PAC/ticket generation a OAuth grant/revocation terminology; generated `GLOSSARY.md` je synchronizovaný a audit-failure artifacts sú prázdne. Aktuálne official facts boli overené: AD sites/subnets riadia client affinity a replication topology; LDAP RFC 4511/4513 oddeľujú protocol operation, Bind a StartTLS security state; RFC 4120 oddeľuje ticket authentication od authorization a vyžaduje freshness/replay controls, pričom RFC 8429 deprecates 3DES/RC4; OAuth Security BCP RFC 9700 z januára 2025 vyžaduje exact redirect URI matching, PKCE pre public clients a zakazuje Resource Owner Password Credentials pre nové návrhy. Zostáva 11 kapitol a finálny section-level pass. |"""

          lines = text.splitlines()
          replaced = False
          for index, line in enumerate(lines):
              if line.startswith("| `13-security-and-identity`"):
                  lines[index] = row
                  replaced = True
                  break

          if not replaced:
              marker = "## Section-level completion criteria"
              marker_index = lines.index(marker)
              insert_at = marker_index
              while insert_at > 0 and lines[insert_at - 1] == "":
                  insert_at -= 1
              lines.insert(insert_at, row)

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Commit ledger and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DOCUMENTATION-REVIEW-STATUS.md
          git rm .github/workflows/one-time-security-second-block-ledger.yml
          git commit -m "docs(review): record second Security and Identity strict revalidation block"
          git push
