name: Temporary PR 195 comment source fixer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.issue.number == 195 && github.event.issue.pull_request && github.actor == 'Marvy936' && github.event.comment.body == '/apply-pr195-runtime-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/actions-runner-context
          persist-credentials: true
          fetch-depth: 1

      - name: Patch exact runtime source defects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # MLOps controlled retraining: preserve cust-000001 style IDs.
          retraining = Path('labs/mlops/scripts/run_live_retraining_runtime.py')
          text = retraining.read_text(encoding='utf-8')
          old = '''    try:\n        max_customer_id = max(int(row["customer_id"]) for row in rows)\n    except (KeyError, TypeError, ValueError) as exc:\n        raise LiveRetrainingError("baseline customer_id values must be integers") from exc\n    appended = dict(rows[0])\n    appended["customer_id"] = str(max_customer_id + 1)\n'''
          new = '''    parsed_ids: list[tuple[str, int, int]] = []\n    try:\n        for row in rows:\n            raw = row["customer_id"]\n            if not isinstance(raw, str) or not raw:\n                raise ValueError("customer_id must be a non-empty string")\n            match = re.fullmatch(r"(.*?)([0-9]+)", raw)\n            if match is None:\n                raise ValueError("customer_id must end with a decimal suffix")\n            parsed_ids.append((match.group(1), int(match.group(2)), len(match.group(2))))\n    except (KeyError, TypeError, ValueError) as exc:\n        raise LiveRetrainingError(\n            "baseline customer_id values must share a stable prefix and decimal suffix"\n        ) from exc\n    raw_ids = [row["customer_id"] for row in rows]\n    if len(set(raw_ids)) != len(raw_ids):\n        raise LiveRetrainingError("baseline customer_id values must be unique")\n    prefixes = {prefix for prefix, _, _ in parsed_ids}\n    if len(prefixes) != 1:\n        raise LiveRetrainingError("baseline customer_id values must share one prefix")\n    prefix = next(iter(prefixes))\n    numeric_ids = [number for _, number, _ in parsed_ids]\n    if len(set(numeric_ids)) != len(numeric_ids):\n        raise LiveRetrainingError("baseline customer_id numeric suffixes must be unique")\n    widths = {width for _, _, width in parsed_ids}\n    if prefix and len(widths) != 1:\n        raise LiveRetrainingError("prefixed customer_id values must use one numeric suffix width")\n    width = next(iter(widths)) if prefix else 0\n    next_numeric_id = max(numeric_ids) + 1\n    next_customer_id = f"{prefix}{next_numeric_id:0{width}d}" if prefix else str(next_numeric_id)\n    if next_customer_id in set(raw_ids):\n        raise LiveRetrainingError("derived fresh customer_id already exists")\n    appended = dict(rows[0])\n    appended["customer_id"] = next_customer_id\n'''
          if old in text:
              text = text.replace(old, new, 1)
              if 'import re\n' not in text:
                  text = text.replace('import json\n', 'import json\nimport re\n', 1)
          elif 'next_customer_id' not in text:
              raise SystemExit('unexpected retraining customer_id source')
          retraining.write_text(text, encoding='utf-8')

          retraining_tests = Path('labs/mlops/tests/test_live_retraining_runtime.py')
          tests = retraining_tests.read_text(encoding='utf-8')
          if 'test_retraining_snapshot_preserves_prefixed_customer_id_contract' not in tests:
              tests += '''\n\ndef test_retraining_snapshot_preserves_prefixed_customer_id_contract(tmp_path: Path) -> None:\n    baseline = tmp_path / "baseline-prefixed.csv"\n    baseline.write_text(\n        "customer_id,value\\n"\n        "cust-000001,a\\n"\n        "cust-000002,b\\n"\n        "cust-000003,c\\n",\n        encoding="utf-8",\n    )\n    output = tmp_path / "fresh-prefixed.csv"\n    base_rows, new_rows, _ = runtime._build_retraining_snapshot(baseline, output)\n    with output.open("r", encoding="utf-8", newline="") as handle:\n        rows = list(csv.DictReader(handle))\n    assert base_rows == 3\n    assert new_rows == 4\n    assert [row["customer_id"] for row in rows] == [\n        "cust-000001", "cust-000002", "cust-000003", "cust-000004"\n    ]\n'''
              retraining_tests.write_text(tests, encoding='utf-8')

          # Keycloak live identity: build promoted RAG via canonical package contracts.
          identity = Path('labs/keycloak-ai-api/scripts/run_live_identity_gate.py')
          text = identity.read_text(encoding='utf-8')
          if 'labs/llm-rag/scripts/build_corpus.py' in text:
              start = text.index('def _build_rag(')
              end = text.index('\n\ndef _build_agent(', start)
              replacement = '''def _build_rag(repo_root: Path, runtime_root: Path, subject_sha: str) -> dict[str, Any]:
    from keycloak_ai_api.rag_bridge import OfflinePromotedRagExecutor, RagBundlePaths
    from knowledge_hub_rag.contracts import atomic_write_json as rag_atomic_write_json, build_chunk_manifest, build_corpus_snapshot
    from knowledge_hub_rag.evaluation import build_prompt_release, run_eval_suite
    from knowledge_hub_rag.retrieval import build_retrieval_index, validate_retrieval_index
    from knowledge_hub_rag.runtime_config import build_runtime_config, validate_runtime_config

    rag = runtime_root / "rag"
    rag.mkdir(parents=True, exist_ok=False)
    manifest = rag / "manifest.json"
    index = rag / "index.json"
    config = rag / "runtime-config.json"
    evaluation = rag / "eval-report.json"
    release = rag / "prompt-release.json"
    cases_path = repo_root / "labs" / "llm-rag" / "data" / "eval-cases.json"
    cases = json.loads(cases_path.read_text(encoding="utf-8"))
    if not isinstance(cases, list) or not cases or not all(isinstance(item, dict) for item in cases):
        raise IdentityRuntimeError("RAG eval cases must be a non-empty object list")
    snapshot = build_corpus_snapshot(repo_root=repo_root, source_revision=subject_sha)
    manifest_value = build_chunk_manifest(repo_root=repo_root, snapshot=snapshot)
    rag_atomic_write_json(manifest, manifest_value)
    index_value = build_retrieval_index(manifest_value)
    validate_retrieval_index(index_value, manifest_value)
    rag_atomic_write_json(index, index_value)
    config_value = build_runtime_config(generation="keycloak-live-identity-rag-v1", implementation_revision=subject_sha)
    validate_runtime_config(config_value)
    rag_atomic_write_json(config, config_value)
    eval_value = run_eval_suite(cases=cases, manifest=manifest_value, index=index_value, runtime_config=config_value)
    if eval_value.get("suite_passed") is not True:
        raise IdentityRuntimeError("promoted RAG evaluation is not all-passed")
    rag_atomic_write_json(evaluation, eval_value)
    release_value = build_prompt_release(runtime_config=config_value, eval_report=eval_value, cases=cases, manifest=manifest_value, index=index_value)
    rag_atomic_write_json(release, release_value)
    executor = OfflinePromotedRagExecutor(RagBundlePaths(manifest=manifest, index=index, runtime_config=config, eval_cases=cases_path, eval_report=evaluation, prompt_release=release))
    positive_cases = sorted((case for case in cases if case.get("attack_type") == "none" and case.get("expected_answer") == "answered"), key=lambda item: str(item.get("case_id", "")))
    if not positive_cases:
        raise IdentityRuntimeError("RAG eval set contains no positive promoted-query case")
    query = str(positive_cases[0]["query"])
    preflight = executor.query(query)
    if preflight.get("status") != "answered" or not preflight.get("citations"):
        raise IdentityRuntimeError("promoted RAG bundle failed positive bridge read-back")
    return {
        "manifest": manifest,
        "index": index,
        "runtime_config": config,
        "eval_cases": cases_path,
        "eval_report": evaluation,
        "prompt_release": release,
        "query": query,
        "snapshot_id": _require_sha256(snapshot.get("corpus_snapshot_id"), "RAG corpus_snapshot_id"),
        "index_id": _require_sha256(index_value.get("retrieval_index_id"), "RAG retrieval_index_id"),
        "report_id": _require_sha256(eval_value.get("eval_report_id"), "RAG eval_report_id"),
        "prompt_release_id": _require_sha256(release_value.get("prompt_release_id"), "RAG prompt_release_id"),
    }
'''
              text = text[:start] + replacement + text[end:]
          if 'labs/llm-rag/scripts/build_corpus.py' in text:
              raise SystemExit('stale Keycloak RAG wrapper call remains')
          identity.write_text(text, encoding='utf-8')

          # Container serving mounts: copy authoritative artifacts into disposable staging.
          container = Path('labs/mlops/scripts/run_containerized_inference_runtime.py')
          text = container.read_text(encoding='utf-8')
          if 'import shutil\n' not in text:
              text = text.replace('import os\n', 'import os\nimport shutil\n', 1)
          old_mount = '''def _prepare_readonly_mounts(\n    *,\n    deployment_path: Path,\n    artifact_manifest_path: Path,\n    model_path: Path,\n    expected_model_sha256: str,\n) -> dict[str, str]:\n    for path in (deployment_path, artifact_manifest_path, model_path):\n        if not path.is_file() or path.is_symlink():\n            raise RuntimeGateError(f"serving mount must be a regular non-symlink file: {path}")\n        path.chmod(0o444)\n    if _sha256_file(model_path) != expected_model_sha256:\n        raise RuntimeGateError("model digest changed while preparing read-only serving mount")\n    return {\n        "deployment": oct(stat.S_IMODE(deployment_path.stat().st_mode)),\n        "manifest": oct(stat.S_IMODE(artifact_manifest_path.stat().st_mode)),\n        "model": oct(stat.S_IMODE(model_path.stat().st_mode)),\n    }\n'''
          new_mount = '''def _prepare_readonly_mounts(\n    *,\n    staging_dir: Path,\n    deployment_path: Path,\n    artifact_manifest_path: Path,\n    model_path: Path,\n    expected_model_sha256: str,\n) -> dict[str, str]:\n    sources = (deployment_path, artifact_manifest_path, model_path)\n    for path in sources:\n        if not path.is_file() or path.is_symlink():\n            raise RuntimeGateError(f"serving mount source must be a regular non-symlink file: {path}")\n    if staging_dir.exists() or staging_dir.is_symlink():\n        raise RuntimeGateError("serving mount staging directory must be fresh")\n    artifact_staging = staging_dir / "artifact"\n    artifact_staging.mkdir(parents=True, exist_ok=False)\n    staged_deployment = staging_dir / "deployment.json"\n    staged_manifest = artifact_staging / "manifest.json"\n    staged_model = artifact_staging / "model.joblib"\n    for source, target in (\n        (deployment_path, staged_deployment),\n        (artifact_manifest_path, staged_manifest),\n        (model_path, staged_model),\n    ):\n        shutil.copyfile(source, target)\n        target.chmod(0o444)\n    if _sha256_file(staged_model) != expected_model_sha256:\n        raise RuntimeGateError("model digest changed while preparing read-only serving mount")\n    if _sha256_file(model_path) != expected_model_sha256:\n        raise RuntimeGateError("authoritative model digest changed during serving mount preparation")\n    return {\n        "deployment": oct(stat.S_IMODE(staged_deployment.stat().st_mode)),\n        "manifest": oct(stat.S_IMODE(staged_manifest.stat().st_mode)),\n        "model": oct(stat.S_IMODE(staged_model.stat().st_mode)),\n    }\n'''
          if old_mount in text:
              text = text.replace(old_mount, new_mount, 1)
          elif 'serving mount staging directory must be fresh' not in text:
              raise SystemExit('unexpected container mount helper source')
          old_call = '''        mount_modes = _prepare_readonly_mounts(\n            deployment_path=deployment_path,\n            artifact_manifest_path=artifact_manifest_path,\n            model_path=model_path,\n            expected_model_sha256=deployment["model"]["sha256"],\n        )\n\n        run_result = _run(\n'''
          new_call = '''        mount_root = runtime_dir / "container-runtime-serving-mounts"\n        mount_modes = _prepare_readonly_mounts(\n            staging_dir=mount_root,\n            deployment_path=deployment_path,\n            artifact_manifest_path=artifact_manifest_path,\n            model_path=model_path,\n            expected_model_sha256=deployment["model"]["sha256"],\n        )\n        mount_deployment_path = mount_root / "deployment.json"\n        mount_artifact_dir = mount_root / "artifact"\n\n        run_result = _run(\n'''
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          text = text.replace('f"type=bind,src={deployment_path.resolve()},dst=/runtime/deployment.json,readonly"', 'f"type=bind,src={mount_deployment_path.resolve()},dst=/runtime/deployment.json,readonly"')
          text = text.replace('f"type=bind,src={artifact_dir},dst=/runtime/artifact,readonly"', 'f"type=bind,src={mount_artifact_dir},dst=/runtime/artifact,readonly"')
          text = text.replace('deployment_path=deployment_path.resolve(),\n            artifact_dir=artifact_dir,', 'deployment_path=mount_deployment_path.resolve(),\n            artifact_dir=mount_artifact_dir,')
          if 'path.chmod(0o444)' in text and 'target.chmod(0o444)' not in text:
              raise SystemExit('stale source chmod remains in container mount helper')
          container.write_text(text, encoding='utf-8')

          container_tests = Path('labs/mlops/tests/test_containerized_inference_runtime.py')
          tests = container_tests.read_text(encoding='utf-8')
          tests = tests.replace(
              '''    modes = runtime._prepare_readonly_mounts(\n        deployment_path=deployment,\n        artifact_manifest_path=manifest,\n        model_path=model,\n        expected_model_sha256=expected,\n    )\n''',
              '''    source_modes = {path.name: stat.S_IMODE(path.stat().st_mode) for path in (deployment, manifest, model)}\n    staging = tmp_path / "staging"\n    modes = runtime._prepare_readonly_mounts(\n        staging_dir=staging,\n        deployment_path=deployment,\n        artifact_manifest_path=manifest,\n        model_path=model,\n        expected_model_sha256=expected,\n    )\n''',
              1,
          )
          tests = tests.replace(
              '''    for path in (deployment, manifest, model):\n        assert stat.S_IMODE(path.stat().st_mode) == 0o444\n    assert runtime._sha256_file(model) == expected\n''',
              '''    assert {path.name: stat.S_IMODE(path.stat().st_mode) for path in (deployment, manifest, model)} == source_modes\n    for path in (staging / "deployment.json", staging / "artifact" / "manifest.json", staging / "artifact" / "model.joblib"):\n        assert stat.S_IMODE(path.stat().st_mode) == 0o444\n    assert runtime._sha256_file(model) == expected\n    assert runtime._sha256_file(staging / "artifact" / "model.joblib") == expected\n''',
              1,
          )
          tests = tests.replace(
              '''        runtime._prepare_readonly_mounts(\n            deployment_path=deployment,\n            artifact_manifest_path=manifest,\n            model_path=model,\n            expected_model_sha256="0" * 64,\n        )\n''',
              '''        runtime._prepare_readonly_mounts(\n            staging_dir=tmp_path / "staging-tampered",\n            deployment_path=deployment,\n            artifact_manifest_path=manifest,\n            model_path=model,\n            expected_model_sha256="0" * 64,\n        )\n''',
              1,
          )
          container_tests.write_text(tests, encoding='utf-8')
          PY
          git diff --check

      - name: Run focused contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -e 'labs/machine-learning' -e 'labs/mlops[dev,registry,serving]' -e 'labs/llm-rag[dev]' -e 'labs/agent-ops[dev]' -e 'labs/keycloak-ai-api[dev]'
          python -m pytest labs/mlops/tests/test_live_retraining_runtime.py labs/mlops/tests/test_containerized_inference_runtime.py -q -p no:cacheprovider
          python -m pytest labs/keycloak-ai-api/tests/test_rag_bridge.py labs/keycloak-ai-api/tests/test_agent_bridge_retrieval.py labs/keycloak-ai-api/tests/test_agent_knowledge_route.py -q -p no:cacheprovider

      - name: Commit exact source fixes to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/mlops/scripts/run_live_retraining_runtime.py labs/mlops/tests/test_live_retraining_runtime.py labs/mlops/scripts/run_containerized_inference_runtime.py labs/mlops/tests/test_containerized_inference_runtime.py labs/keycloak-ai-api/scripts/run_live_identity_gate.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(runtime): close remaining local execution defects'
          git push origin HEAD:fix/actions-runner-context
