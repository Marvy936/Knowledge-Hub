name: Interactive Labs

on:
  push:
    branches:
      - main
    paths:
      - "labs/interactive/**"
      - ".github/workflows/interactive-labs.yml"
  pull_request:
    paths:
      - "labs/interactive/**"
      - ".github/workflows/interactive-labs.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: kh-interactive-labs:test

jobs:
  multi-lab-runtime:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4

      - name: Build multi-lab image
        run: docker build -t "$IMAGE_NAME" -f labs/interactive/Dockerfile labs/interactive

      - name: List bundled labs without privileged mode
        run: docker run --rm "$IMAGE_NAME" list

      - name: Preflight Kubernetes cgroup runtime
        run: |
          docker run --rm --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            "$IMAGE_NAME" kubernetes-configmap-rollout self-test

      - name: Self-test every remaining bundled lab
        run: |
          docker run --rm "$IMAGE_NAME" ids > /tmp/kh-lab-ids
          while IFS= read -r LAB; do
            [ -n "$LAB" ] || continue
            [ "$LAB" != "kubernetes-configmap-rollout" ] || continue
            echo "=== self-test: $LAB ==="
            docker run --rm --privileged "$IMAGE_NAME" "$LAB" self-test
          done < /tmp/kh-lab-ids

      - name: Prove help is embedded without starting sandbox
        run: |
          docker run --rm "$IMAGE_NAME" ids > /tmp/kh-lab-ids
          while IFS= read -r LAB; do
            [ -n "$LAB" ] || continue
            docker run --rm "$IMAGE_NAME" "$LAB" help | grep -F "Knowledge Hub Interactive Lab"
          done < /tmp/kh-lab-ids
