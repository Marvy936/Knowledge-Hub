name: Interactive Labs

on:
  push:
    branches:
      - main
    paths:
      - "labs/interactive/**"
      - ".github/workflows/interactive-labs.yml"
  pull_request:
    paths:
      - "labs/interactive/**"
      - ".github/workflows/interactive-labs.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: kh-interactive-labs:test

jobs:
  multi-lab-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4

      - name: Build multi-lab image
        run: docker build -t "$IMAGE_NAME" -f labs/interactive/Dockerfile labs/interactive

      - name: List bundled labs without privileged mode
        run: docker run --rm "$IMAGE_NAME" list

      - name: Self-test Docker service discovery
        run: docker run --rm --privileged "$IMAGE_NAME" docker-network-debug self-test

      - name: Self-test Docker volume persistence
        run: docker run --rm --privileged "$IMAGE_NAME" docker-volume-persistence self-test

      - name: Self-test Keycloak client credentials
        run: docker run --rm --privileged "$IMAGE_NAME" keycloak-service-account self-test

      - name: Prove help is embedded
        run: |
          docker run --rm --privileged "$IMAGE_NAME" docker-network-debug lab-help | grep -F "Docker: Service Discovery Troubleshooting"
          docker run --rm --privileged "$IMAGE_NAME" docker-volume-persistence lab-help | grep -F "Docker: Volume Persistence Troubleshooting"
          docker run --rm --privileged "$IMAGE_NAME" keycloak-service-account lab-help | grep -F "Keycloak: Client Credentials"
