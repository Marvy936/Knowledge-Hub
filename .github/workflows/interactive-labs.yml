name: Interactive Labs

on:
  push:
    branches:
      - main
    paths:
      - "labs/interactive/**"
      - ".github/workflows/interactive-labs.yml"
  pull_request:
    paths:
      - "labs/interactive/**"
      - ".github/workflows/interactive-labs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-only-reference-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: labs/interactive/docker-network-debug

    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4

      - name: Validate outer Compose model
        run: docker compose config >/dev/null

      - name: Build Docker-only lab image
        run: docker compose build lab

      - name: Prove initial scenario fails
        run: |
          if docker compose run --rm lab check; then
            echo "Reference challenge unexpectedly passed before the learner repair." >&2
            exit 1
          fi

      - name: Apply intended learner repair inside the lab
        run: |
          docker compose run --rm lab bash -c \
            "sed -i 's/^DB_HOST=.*/DB_HOST=postgres/' /workspace/scenario.env && apply"

      - name: Prove repaired scenario passes
        run: docker compose run --rm lab check

      - name: Prove reset restores the broken state
        run: |
          docker compose run --rm lab reset
          if docker compose run --rm lab check; then
            echo "Reset did not restore the intentionally broken challenge." >&2
            exit 1
          fi

      - name: Cleanup complete sandbox
        if: always()
        run: docker compose down -v --remove-orphans || true
