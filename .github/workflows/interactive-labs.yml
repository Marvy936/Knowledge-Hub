name: Interactive Labs

on:
  push:
    branches:
      - main
    paths:
      - "labs/interactive/**"
      - ".github/workflows/interactive-labs.yml"
  pull_request:
    paths:
      - "labs/interactive/**"
      - ".github/workflows/interactive-labs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-command-reference-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4

      - name: Build self-contained lab image
        run: |
          docker build \
            -t kh-docker-network-debug:test \
            -f labs/interactive/docker-network-debug/lab/Dockerfile \
            labs/interactive/docker-network-debug

      - name: Prove complete one-container lifecycle
        run: docker run --rm --privileged kh-docker-network-debug:test self-test

      - name: Prove learner help is embedded
        run: |
          docker run --rm --privileged kh-docker-network-debug:test lab-help > /tmp/lab-help.txt
          grep -F "help      show this screen again" /tmp/lab-help.txt
          grep -F "reset     restore the intentionally broken scenario" /tmp/lab-help.txt
