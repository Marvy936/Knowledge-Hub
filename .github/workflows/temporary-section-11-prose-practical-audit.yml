name: Temporary section 11 prose and practical audit

on:
  push:
    branches:
      - agent/sections-10-13-prose-first-revalidation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: self-hosted
    steps:
      - name: Checkout revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit rewritten AWS chapters
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_learning_depth.py \
            --all-docs \
            --report /tmp/documentation-audit.md \
            --json /tmp/documentation-audit.json

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          targets = [
              "docs/11-cloud-and-aws/iaas-paas-saas.md",
              "docs/11-cloud-and-aws/public-private-hybrid-cloud.md",
              "docs/11-cloud-and-aws/regions-availability-zones.md",
              "docs/11-cloud-and-aws/shared-responsibility-model.md",
              "docs/11-cloud-and-aws/scalability-elasticity-fault-tolerance.md",
              "docs/11-cloud-and-aws/high-availability-disaster-recovery.md",
              "docs/11-cloud-and-aws/aws-organizations-accounts.md",
              "docs/11-cloud-and-aws/iam.md",
          ]

          data = json.loads(Path("/tmp/documentation-audit.json").read_text())
          stats = {item["path"]: item for item in data["files"]}
          failed = False

          for target in targets:
              item = stats[target]
              print(
                  f"STRICT {target} words={item['words']} grade={item['grade']} "
                  f"critical={item['critical']} high={item['high']} "
                  f"medium={item['medium']} low={item['low']}"
              )
              if item["critical"] or item["high"] or item["medium"]:
                  failed = True

              text = Path(target).read_text(encoding="utf-8")
              fenced = len(re.findall(r"^```(?:bash|shell|sh|json|yaml|hcl|sql|text)?\s*$", text, re.M))
              executable = len(re.findall(
                  r"\b(?:aws|kubectl|helm|psql|terraform|dig|nc|openssl)\b",
                  text,
              ))
              explanations = len(re.findall(
                  r"(?:preukazuje|nepreukazuje|výstup|príkaz|command|read-back|praktick)",
                  text,
                  re.I,
              ))
              print(
                  f"PRACTICAL {target} fenced={fenced} executable_markers={executable} "
                  f"explanation_markers={explanations}"
              )
              if fenced < 2 or executable < 2 or explanations < 2:
                  print(f"::error file={target}::Insufficient explained practical material")
                  failed = True

          if failed:
              for finding in data["findings"]:
                  if finding["path"] in targets and finding["severity"] in {"critical", "high", "medium"}:
                      print(
                          "FINDING "
                          f"path={finding['path']} severity={finding['severity']} "
                          f"section={finding['section']} line={finding['line']} "
                          f"rule={finding['rule']} detail={finding['detail']}"
                      )
              raise SystemExit(1)
          PY
