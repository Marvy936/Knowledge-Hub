name: Keycloak block 25-28 gate fix

on:
  push:
    branches:
      - agent/section-17-keycloak-block-25-28
    paths:
      - scripts/section_17_block_25_28_gate_fix.py
      - .github/workflows/section-17-block-25-28-gate-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-17-keycloak-block-25-28
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch gate token
        run: python scripts/section_17_block_25_28_gate_fix.py
      - name: Commit patched gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/section_17_block_25_28.py
          if git diff --cached --quiet; then
            echo "Gate token already corrected."
            exit 0
          fi
          git commit -m "chore: correct Keycloak block 25-28 semantic gate"
          git pull --rebase origin agent/section-17-keycloak-block-25-28
          git push origin HEAD:agent/section-17-keycloak-block-25-28
