name: Temporary Section 11 exact findings reporter

on:
  push:
    branches:
      - agent/sections-10-13-prose-first-revalidation

permissions:
  contents: write

concurrency:
  group: temporary-section11-exact-findings-reporter
  cancel-in-progress: true

jobs:
  report:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sections-10-13-prose-first-revalidation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write exact strict findings
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_learning_depth.py --all-docs --report /tmp/audit.md --json /tmp/audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path('/tmp/audit.json').read_text(encoding='utf-8'))
          findings = [
              item for item in audit['findings']
              if item['path'].startswith('docs/11-cloud-and-aws/')
              and item['severity'] in {'critical', 'high', 'medium'}
          ]
          lines = [
              f"{item['severity'].upper()}|{item['path']}|line={item['line']}|"
              f"rule={item['rule']}|section={item['section']}|detail={item['detail']}"
              for item in findings
          ]
          Path('.github/section11-strict-findings.txt').write_text(
              '\n'.join(lines or ['none']) + '\n', encoding='utf-8', newline='\n'
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/section11-strict-findings.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci(docs): record exact Section 11 findings"
            git push origin HEAD:agent/sections-10-13-prose-first-revalidation
          fi
