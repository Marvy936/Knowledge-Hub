name: Temporary Section 11 exact findings audit

on:
  push:
    branches:
      - agent/sections-10-13-prose-first-revalidation

permissions:
  contents: write

concurrency:
  group: temporary-section11-exact-findings
  cancel-in-progress: true

jobs:
  audit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sections-10-13-prose-first-revalidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish exact findings
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_learning_depth.py --all-docs --report /tmp/audit.md --json /tmp/audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('/tmp/audit.json').read_text(encoding='utf-8'))
          findings = [x for x in audit['findings'] if x['path'].startswith('docs/11-cloud-and-aws/') and x['severity'] in {'critical','high','medium'}]
          Path('.github/section11-strict-findings.txt').write_text('\n'.join(f"{x['severity'].upper()}|{x['path']}|line={x['line']}|rule={x['rule']}|section={x['section']}|detail={x['detail']}" for x in findings) + ('\n' if findings else 'none\n'), encoding='utf-8', newline='\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/section11-strict-findings.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci(docs): refresh exact Section 11 findings"
            git push origin HEAD:agent/sections-10-13-prose-first-revalidation
          fi
