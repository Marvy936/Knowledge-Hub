name: Temporary Section 11 final quality gate

on:
  push:
    branches:
      - agent/sections-10-13-prose-first-revalidation

permissions:
  contents: write

concurrency:
  group: temporary-section11-final-gate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sections-10-13-prose-first-revalidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate prose and practical examples
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check
          python scripts/audit_learning_depth.py --all-docs --report /tmp/audit.md --json /tmp/audit.json
          python - <<'PY'
          import json, re
          from pathlib import Path
          audit = {x['path']: x for x in json.loads(Path('/tmp/audit.json').read_text())['files']}
          failures, rows = [], []
          for path in sorted(Path('docs/11-cloud-and-aws').glob('*.md')):
              if path.name == 'README.md':
                  continue
              text = path.read_text(encoding='utf-8')
              outside, fenced = [], False
              for line in text.splitlines():
                  if line.strip().startswith('```'):
                      fenced = not fenced
                      continue
                  if not fenced:
                      outside.append(line)
              prose = sum(len(re.findall(r'[\wÀ-ž]+', line)) for line in outside if line.strip() and not re.match(r'\s*(?:[-*+] |\d+\. |#|\|)', line))
              bullets = sum(len(re.findall(r'[\wÀ-ž]+', line)) for line in outside if re.match(r'\s*(?:[-*+] |\d+\. )', line))
              share = bullets / max(1, prose + bullets)
              blocks = len(re.findall(r'```(?:bash|shell|json|yaml|yml|hcl|terraform|sql|console|text)\n', text))
              commands = len(re.findall(r'(?m)^(?:aws|kubectl|terraform|curl|dig|openssl|psql|mysql|redis-cli|jq|yq|nc|ss)\s+', text))
              explanations = len(re.findall(r'(?i)(tento príkaz|prvý príkaz|druhý príkaz|výstup|preukazuje|nepreukazuje|dokazuje|observation|dôkaz|read-back)', text))
              item = audit[path.as_posix()]
              rows.append(f'{path.as_posix()}|strict={item["critical"]}/{item["high"]}/{item["medium"]}|prose={prose}|bullet_share={share:.3f}|blocks={blocks}|commands={commands}|explanations={explanations}')
              if item['critical'] or item['high'] or item['medium']:
                  failures.append(f'{path.name}: strict findings')
              if prose < 650:
                  failures.append(f'{path.name}: only {prose} prose words')
              if share > 0.34:
                  failures.append(f'{path.name}: bullet share {share:.3f}')
              if blocks < 1 or commands < 2:
                  failures.append(f'{path.name}: insufficient executable examples')
              if explanations < 3:
                  failures.append(f'{path.name}: command evidence explanation too thin ({explanations})')
          status = 'success' if not failures else 'failure'
          Path('.github/section11-final-quality-report.txt').write_text('\n'.join([f'status={status}', '', *rows, '', 'FAILURES', *(failures or ['none'])]) + '\n', encoding='utf-8', newline='\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/section11-final-quality-report.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci(docs): record final Section 11 quality gate"
            git push origin HEAD:agent/sections-10-13-prose-first-revalidation
          fi
          grep -qx 'status=success' .github/section11-final-quality-report.txt
