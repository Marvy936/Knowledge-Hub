name: Temporary Section 11 exact remediation and audit

on:
  push:
    branches:
      - agent/sections-10-13-prose-first-revalidation

permissions:
  contents: write

concurrency:
  group: temporary-section11-exact-remediation
  cancel-in-progress: false

jobs:
  remediate-and-audit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sections-10-13-prose-first-revalidation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add missing mental models and re-audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/997cb919a31bcfdf56abe49cadc4158d8e17fa39" --jq .content \
            | tr -d '\n' | base64 -d > /tmp/remediate.py
          python /tmp/remediate.py
          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs --report /tmp/audit.md --json /tmp/audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('/tmp/audit.json').read_text(encoding='utf-8'))
          findings = [x for x in audit['findings'] if x['path'].startswith('docs/11-cloud-and-aws/') and x['severity'] in {'critical','high','medium'}]
          Path('.github/section11-strict-findings.txt').write_text('\n'.join(f"{x['severity'].upper()}|{x['path']}|line={x['line']}|rule={x['rule']}|section={x['section']}|detail={x['detail']}" for x in findings) + ('\n' if findings else 'none\n'), encoding='utf-8', newline='\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs GLOSSARY.md .github/section11-strict-findings.txt
          if ! git diff --cached --quiet; then
            git commit -m "docs(aws): add prose context to practical examples"
            git push origin HEAD:agent/sections-10-13-prose-first-revalidation
          fi
