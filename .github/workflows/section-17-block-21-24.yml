name: Keycloak block 21-24 completion

on:
  push:
    branches:
      - agent/section-17-keycloak-block-21-24
    paths:
      - scripts/section_17_block_21_24.py
      - .github/workflows/section-17-block-21-24.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/section_17_block_21_24.py
      - .github/workflows/section-17-block-21-24.yml

permissions:
  contents: write

concurrency:
  group: section-17-block-21-24
  cancel-in-progress: true

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-17-keycloak-block-21-24
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and activate Keycloak block 21-24
        shell: bash
        run: |
          set -euo pipefail
          python scripts/section_17_block_21_24.py
          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
      - name: Commit documentation result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/17-keycloak-and-identity-platform DOCUMENTATION-REVIEW-STATUS.md DOCUMENTATION-AUDIT.md documentation-audit.json GLOSSARY.md ROADMAP.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          git commit -m "docs: activate Keycloak chapters 21-24"
          git pull --rebase origin agent/section-17-keycloak-block-21-24
          git push origin HEAD:agent/section-17-keycloak-block-21-24
