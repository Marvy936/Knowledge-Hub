name: Temporary inspect ML date parsing

on:
  push:
    branches: [fix/actions-runner-context]
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/_temporary-inspect-ml-date-parsing.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout diagnostic subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - name: Print exact tracked ML parsing contract
        shell: bash
        run: |
          set -euo pipefail
          echo '--- tracked ML files ---'
          git ls-files 'labs/machine-learning/**' | sort
          echo '--- train.py datetime references ---'
          grep -RIn --include='*.py' 'to_datetime\|date_format\|date' labs/machine-learning/src labs/machine-learning/tests || true
          echo '--- train.py around warning line ---'
          nl -ba labs/machine-learning/src/ml_lab/train.py | sed -n '220,280p'
          echo '--- train tests ---'
          nl -ba labs/machine-learning/tests/test_train.py | sed -n '1,320p'
          echo '--- candidate CSV/date-like values ---'
          find labs/machine-learning -maxdepth 4 -type f \( -name '*.csv' -o -name '*.json' \) -print | sort
          grep -RInE --include='*.csv' --include='*.json' '[0-9]{4}-[0-9]{2}-[0-9]{2}|[0-9]{2}/[0-9]{2}/[0-9]{4}' labs/machine-learning | head -100 || true
