name: Activate AI roadmap and user review

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/activate_ai_roadmap.py
      - scripts/patch_activate_ai_roadmap.py
      - scripts/finalize_ai_roadmap_activation.py
      - .github/workflows/activate-ai-roadmap.yml

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/activate-ai-roadmap-and-user-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Activate and finalize AI sections
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch_activate_ai_roadmap.py
          python scripts/activate_ai_roadmap.py
          python scripts/finalize_ai_roadmap_activation.py
          python scripts/update_navigation.py --write
          python scripts/update_glossary.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_navigation.py --check
          git diff --check
      - name: Commit finalized activation result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.md FUTURE-IDENTITY-AI-ROADMAP.md DOCUMENTATION-REVIEW-STATUS.md DOCUMENTATION-AUDIT.md documentation-audit.json GLOSSARY.md docs/18-machine-learning-fundamentals docs/19-mlops-and-ml-platforms docs/20-llm-and-genai-engineering docs/21-ai-agents-and-intelligent-automation
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No final activation changes to commit."
            exit 0
          fi
          git commit -m "docs: finalize AI roadmap activation state"
          git push origin HEAD:agent/activate-ai-roadmap-and-user-review
