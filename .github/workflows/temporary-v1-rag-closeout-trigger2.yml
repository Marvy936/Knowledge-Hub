name: Temporary Practical v1 RAG closeout executor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-v1-rag-closeout-trigger2.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Apply staged source closeout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/temporary_v1_rag_closeout.py

      - name: Validate focused RAG contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/kh-v1-rag-closeout-venv
          /tmp/kh-v1-rag-closeout-venv/bin/python -m pip install --upgrade pip
          /tmp/kh-v1-rag-closeout-venv/bin/python -m pip install -e 'labs/llm-rag[dev]'
          /tmp/kh-v1-rag-closeout-venv/bin/python -m compileall -q labs/llm-rag/scripts scripts/run_practical_v1_release_candidate.py
          /tmp/kh-v1-rag-closeout-venv/bin/python -m pytest -p no:cacheprovider labs/llm-rag/tests -q
          rm -rf /tmp/kh-v1-rag-closeout-venv

      - name: Commit validated closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix(rag): execute indirect injection runtime gate"
          git push origin HEAD:main
