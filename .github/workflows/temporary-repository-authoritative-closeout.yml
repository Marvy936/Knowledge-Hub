name: Temporary repository authoritative closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/temporary-repository-authoritative-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/repository-authoritative-closeout

      - name: Record roadmap closeout status
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("ROADMAP.md")
          text = path.read_text(encoding="utf-8")
          old = "Checkbox označuje, či je téma spracovaná v repozitári. Skutočná úroveň zvládnutia a potreba opakovania sa sledujú samostatne v [REVIEW.md](REVIEW.md)."
          new = old + "\n\nAktuálny authoritative documentation inventory je uzavretý: všetky témy uvedené v tejto roadmape majú aktívny dokumentačný odkaz a zaškrtnutý stav. Section-level prijatie sa eviduje v [DOCUMENTATION-REVIEW-STATUS.md](DOCUMENTATION-REVIEW-STATUS.md), zatiaľ čo praktické laby, runtime verifikácia a zvládnutie učiva zostávajú samostatnými vrstvami."
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected one roadmap status paragraph, found {count}")
          text = text.replace(old, new, 1)
          if "- [ ] " in text:
              remaining = [line for line in text.splitlines() if line.startswith("- [ ] ")]
              raise SystemExit(f"Unchecked roadmap entries remain: {remaining}")
          path.write_text(text, encoding="utf-8", newline="\n")
          print("Roadmap authoritative closeout status recorded.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "docs: record roadmap authoritative closeout"
          git push origin HEAD:agent/repository-authoritative-closeout
