name: Temporary repository authoritative closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "README.md"
      - "FUTURE-IDENTITY-AI-ROADMAP.md"
      - "ROADMAP.md"
      - "DOCUMENTATION-REVIEW-STATUS.md"
      - ".github/workflows/temporary-repository-authoritative-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-repository-authoritative-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/repository-authoritative-closeout

      - name: Synchronize top-level authoritative status
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          readme = Path("README.md")
          replace_once(
              readme,
              "Sekcie 00–17 boli používateľom schválené v aktuálnom rozsahu. Machine Learning Fundamentals, MLOps and ML Platforms, LLM and GenAI Engineering a AI Agents and Intelligent Automation sú aktivované ako sekcie 18–21 s plánovaným inventorym; ich kapitoly sa budú spracúvať po blokoch. Pôvodné rozhodnutia, flagship projekty a produktové tracky zostávajú v [FUTURE-IDENTITY-AI-ROADMAP.md](FUTURE-IDENTITY-AI-ROADMAP.md).",
              "Sekcie 00–17 boli používateľom schválené v aktuálnom rozsahu. Sekcie 18–21 majú dokončené authoritative inventory: Machine Learning Fundamentals **26/26**, MLOps and ML Platforms **34/34**, LLM and GenAI Engineering **37/37** a AI Agents and Intelligent Automation **62/62**. Všetky štyri sú `Ready for user review`; tento stav znamená dokončený dokumentačný pass, nie používateľské prijatie, runtime verifikáciu alebo production stability. Pôvodné rozhodnutia, plánované laby, troubleshooting drilly, flagship projekty a produktové tracky zostávajú v [FUTURE-IDENTITY-AI-ROADMAP.md](FUTURE-IDENTITY-AI-ROADMAP.md).",
          )

          future = Path("FUTURE-IDENTITY-AI-ROADMAP.md")
          replace_once(
              future,
              "Tento dokument zachytáva schválené rozhodnutia pre identity, ML, MLOps, LLM a agentickú automatizáciu. Keycloak and Identity Platform je dokončená ako sekcia 17 a používateľom schválená v aktuálnom rozsahu. Sekcie 18–21 sú od 2. augusta 2026 aktivované v hlavnej roadmape; tento súbor zostáva detailným planning inventorym pre ich kapitoly, laby, troubleshooting drilly a cross-section flagship projekty.",
              "Tento dokument zachytáva schválené rozhodnutia pre identity, ML, MLOps, LLM a agentickú automatizáciu. Keycloak and Identity Platform je dokončená ako sekcia 17 a používateľom schválená v aktuálnom rozsahu. Authoritative chapter inventory sekcií 18–21 je takisto dokončené a všetky štyri sekcie sú `Ready for user review`. Tento súbor zostáva future implementation inventorym pre praktické laby, troubleshooting drilly, cross-section flagship projekty a produktové tracky; už nie je backlogom pre chapter drafting.",
          )
          replace_once(
              future,
              "```text\nexistujúca roadmapa\n→ Keycloak and Identity Platform — 30/30 · User reviewed\n→ Machine Learning Fundamentals\n→ MLOps and ML Platforms\n→ LLM and GenAI Engineering\n→ AI Agents and Intelligent Automation\n```",
              "```text\nexistujúca roadmapa\n→ Keycloak and Identity Platform — 30/30 · User reviewed\n→ Machine Learning Fundamentals — 26/26 · Ready for user review\n→ MLOps and ML Platforms — 34/34 · Ready for user review\n→ LLM and GenAI Engineering — 37/37 · Ready for user review\n→ AI Agents and Intelligent Automation — 62/62 · Ready for user review\n```\n\n`Ready for user review` potvrdzuje uzavreté authoritative dokumentačné inventory. Neznamená vykonané laby, runtime `Verified`, production `Stable` ani user `Accepted`.",
          )

          roadmap_text = Path("ROADMAP.md").read_text(encoding="utf-8")
          if "- [ ] " in roadmap_text:
              remaining = [line for line in roadmap_text.splitlines() if line.startswith("- [ ] ")]
              raise SystemExit(f"Unchecked roadmap entries remain: {remaining}")

          ledger = Path("DOCUMENTATION-REVIEW-STATUS.md").read_text(encoding="utf-8")
          expected_ledger = [
              "| `18-machine-learning-fundamentals` — Machine Learning Fundamentals | 26/26 authoritative drafting | Ready for user review |",
              "| `19-mlops-and-ml-platforms` — MLOps and ML Platforms | 34/34 authoritative drafting | Ready for user review |",
              "| `20-llm-and-genai-engineering` — LLM and GenAI Engineering | 37/37 authoritative drafting | Ready for user review |",
              "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation | 62/62 authoritative drafting and section closeout | Ready for user review |",
          ]
          missing = [entry for entry in expected_ledger if entry not in ledger]
          if missing:
              raise SystemExit(f"Review ledger does not match top-level status: {missing}")

          root = readme.read_text(encoding="utf-8")
          future_text = future.read_text(encoding="utf-8")
          stale = [
              phrase for phrase in (
                  "s plánovaným inventorym",
                  "ich kapitoly sa budú spracúvať po blokoch",
              )
              if phrase in root or phrase in future_text
          ]
          if stale:
              raise SystemExit(f"Stale chapter-drafting status remains: {stale}")

          required = ["26/26", "34/34", "37/37", "62/62", "Ready for user review"]
          for path, text in ((readme, root), (future, future_text)):
              absent = [value for value in required if value not in text]
              if absent:
                  raise SystemExit(f"{path}: missing final status values {absent}")

          print("Top-level repository status matches the completed authoritative inventories.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md FUTURE-IDENTITY-AI-ROADMAP.md

          if git diff --cached --quiet; then
            echo "No repository closeout changes required."
            exit 0
          fi

          git commit -m "docs: synchronize repository authoritative status"
          git push origin HEAD:agent/repository-authoritative-closeout
