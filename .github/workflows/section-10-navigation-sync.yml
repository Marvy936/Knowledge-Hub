name: Section 10 navigation sync

on:
  push:
    branches:
      - agent/sections-10-13-prose-first-revalidation
    paths:
      - '.github/workflows/section-10-navigation-sync.yml'

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize navigation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_navigation.py --write
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/10-helm-and-cka ROADMAP.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: synchronize section 10 navigation'
          git push origin HEAD:agent/sections-10-13-prose-first-revalidation
