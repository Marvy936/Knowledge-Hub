name: Temporary batch remaining runtime source fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/actions-runner-context'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/actions-runner-context
          persist-credentials: true
          fetch-depth: 1

      - name: Apply exact remaining source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Controlled retraining must preserve the authoritative customer_id schema.
          retraining_path = Path('labs/mlops/scripts/run_live_retraining_runtime.py')
          text = retraining_path.read_text(encoding='utf-8')
          old = '''    try:\n        max_customer_id = max(int(row["customer_id"]) for row in rows)\n    except (KeyError, TypeError, ValueError) as exc:\n        raise LiveRetrainingError("baseline customer_id values must be integers") from exc\n    appended = dict(rows[0])\n    appended["customer_id"] = str(max_customer_id + 1)\n'''
          new = '''    parsed_ids: list[tuple[str, int, int]] = []\n    try:\n        for row in rows:\n            raw = row["customer_id"]\n            if not isinstance(raw, str) or not raw:\n                raise ValueError("customer_id must be a non-empty string")\n            match = re.fullmatch(r"(.*?)([0-9]+)", raw)\n            if match is None:\n                raise ValueError("customer_id must end with a decimal suffix")\n            parsed_ids.append((match.group(1), int(match.group(2)), len(match.group(2))))\n    except (KeyError, TypeError, ValueError) as exc:\n        raise LiveRetrainingError(\n            "baseline customer_id values must share a stable prefix and decimal suffix"\n        ) from exc\n    raw_ids = [row["customer_id"] for row in rows]\n    if len(set(raw_ids)) != len(raw_ids):\n        raise LiveRetrainingError("baseline customer_id values must be unique")\n    prefixes = {prefix for prefix, _, _ in parsed_ids}\n    if len(prefixes) != 1:\n        raise LiveRetrainingError("baseline customer_id values must share one prefix")\n    prefix = next(iter(prefixes))\n    numeric_ids = [number for _, number, _ in parsed_ids]\n    if len(set(numeric_ids)) != len(numeric_ids):\n        raise LiveRetrainingError("baseline customer_id numeric suffixes must be unique")\n    widths = {width for _, _, width in parsed_ids}\n    if prefix and len(widths) != 1:\n        raise LiveRetrainingError(\n            "prefixed customer_id values must use one numeric suffix width"\n        )\n    width = next(iter(widths)) if prefix else 0\n    next_numeric_id = max(numeric_ids) + 1\n    next_customer_id = (\n        f"{prefix}{next_numeric_id:0{width}d}" if prefix else str(next_numeric_id)\n    )\n    if next_customer_id in set(raw_ids):\n        raise LiveRetrainingError("derived fresh customer_id already exists")\n    appended = dict(rows[0])\n    appended["customer_id"] = next_customer_id\n'''
          if old in text:
              text = text.replace(old, new, 1)
              if 'import re\n' not in text:
                  text = text.replace('import json\n', 'import json\nimport re\n', 1)
          elif 'next_customer_id' not in text:
              raise SystemExit('retraining customer_id source is neither old nor corrected')
          retraining_path.write_text(text, encoding='utf-8')

          # 2) Keycloak live runtime must build the promoted RAG bundle via package contracts.
          identity_path = Path('labs/keycloak-ai-api/scripts/run_live_identity_gate.py')
          text = identity_path.read_text(encoding='utf-8')
          if 'labs/llm-rag/scripts/build_corpus.py' in text:
              start = text.index('def _build_rag(')
              end = text.index('\n\ndef _build_agent(', start)
              replacement = '''def _build_rag(repo_root: Path, runtime_root: Path, subject_sha: str) -> dict[str, Any]:
    from keycloak_ai_api.rag_bridge import OfflinePromotedRagExecutor, RagBundlePaths
    from knowledge_hub_rag.contracts import (
        atomic_write_json as rag_atomic_write_json,
        build_chunk_manifest,
        build_corpus_snapshot,
    )
    from knowledge_hub_rag.evaluation import build_prompt_release, run_eval_suite
    from knowledge_hub_rag.retrieval import build_retrieval_index, validate_retrieval_index
    from knowledge_hub_rag.runtime_config import build_runtime_config, validate_runtime_config

    rag = runtime_root / "rag"
    rag.mkdir(parents=True, exist_ok=False)
    manifest = rag / "manifest.json"
    index = rag / "index.json"
    config = rag / "runtime-config.json"
    evaluation = rag / "eval-report.json"
    release = rag / "prompt-release.json"
    cases_path = repo_root / "labs" / "llm-rag" / "data" / "eval-cases.json"

    try:
        cases = json.loads(cases_path.read_text(encoding="utf-8"))
    except (OSError, json.JSONDecodeError) as exc:
        raise IdentityRuntimeError(f"cannot read RAG eval cases: {exc}") from exc
    if not isinstance(cases, list) or not cases or not all(isinstance(item, dict) for item in cases):
        raise IdentityRuntimeError("RAG eval cases must be a non-empty object list")

    snapshot = build_corpus_snapshot(repo_root=repo_root, source_revision=subject_sha)
    manifest_value = build_chunk_manifest(repo_root=repo_root, snapshot=snapshot)
    if manifest_value.get("source_revision") != subject_sha:
        raise IdentityRuntimeError("RAG chunk manifest source revision mismatch")
    rag_atomic_write_json(manifest, manifest_value)

    index_value = build_retrieval_index(manifest_value)
    validate_retrieval_index(index_value, manifest_value)
    rag_atomic_write_json(index, index_value)

    config_value = build_runtime_config(
        generation="keycloak-live-identity-rag-v1",
        implementation_revision=subject_sha,
    )
    validate_runtime_config(config_value)
    rag_atomic_write_json(config, config_value)

    eval_value = run_eval_suite(
        cases=cases,
        manifest=manifest_value,
        index=index_value,
        runtime_config=config_value,
    )
    if eval_value.get("suite_passed") is not True:
        raise IdentityRuntimeError(
            "promoted RAG evaluation is not all-passed: "
            + json.dumps(
                {
                    "critical_failures": eval_value.get("critical_failures"),
                    "threshold_failures": eval_value.get("threshold_failures"),
                },
                sort_keys=True,
            )
        )
    rag_atomic_write_json(evaluation, eval_value)

    release_value = build_prompt_release(
        runtime_config=config_value,
        eval_report=eval_value,
        cases=cases,
        manifest=manifest_value,
        index=index_value,
    )
    rag_atomic_write_json(release, release_value)

    executor = OfflinePromotedRagExecutor(
        RagBundlePaths(
            manifest=manifest,
            index=index,
            runtime_config=config,
            eval_cases=cases_path,
            eval_report=evaluation,
            prompt_release=release,
        )
    )
    positive_cases = sorted(
        (
            case
            for case in cases
            if case.get("attack_type") == "none" and case.get("expected_answer") == "answered"
        ),
        key=lambda item: str(item.get("case_id", "")),
    )
    if not positive_cases:
        raise IdentityRuntimeError("RAG eval set contains no positive promoted-query case")
    query = str(positive_cases[0]["query"])
    preflight = executor.query(query)
    if preflight.get("status") != "answered" or not preflight.get("citations"):
        raise IdentityRuntimeError("promoted RAG bundle failed positive bridge read-back")

    return {
        "manifest": manifest,
        "index": index,
        "runtime_config": config,
        "eval_cases": cases_path,
        "eval_report": evaluation,
        "prompt_release": release,
        "query": query,
        "snapshot_id": _require_sha256(
            snapshot.get("corpus_snapshot_id"), "RAG corpus_snapshot_id"
        ),
        "index_id": _require_sha256(
            index_value.get("retrieval_index_id"), "RAG retrieval_index_id"
        ),
        "report_id": _require_sha256(
            eval_value.get("eval_report_id"), "RAG eval_report_id"
        ),
        "prompt_release_id": _require_sha256(
            release_value.get("prompt_release_id"), "RAG prompt_release_id"
        ),
    }
'''
              text = text[:start] + replacement + text[end:]
          if 'labs/llm-rag/scripts/build_corpus.py' in text:
              raise SystemExit('stale Keycloak RAG wrapper call remains')
          identity_path.write_text(text, encoding='utf-8')

          # 3) Container startup diagnostics must already be present.
          container_text = Path('labs/mlops/scripts/run_containerized_inference_runtime.py').read_text(encoding='utf-8')
          for marker in ('serving container readiness failed; ', 'docker", "inspect"', 'docker", "logs"'):
              if marker not in container_text:
                  raise SystemExit(f'container diagnostic marker missing: {marker}')
          PY
          git diff --check

      - name: Add retraining schema regression if missing
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'test_retraining_snapshot_preserves_prefixed_customer_id_contract' labs/mlops/tests/test_live_retraining_runtime.py; then
            cat >> labs/mlops/tests/test_live_retraining_runtime.py <<'PY'


def test_retraining_snapshot_preserves_prefixed_customer_id_contract(tmp_path: Path) -> None:
    baseline = tmp_path / "baseline-prefixed.csv"
    baseline.write_text(
        "customer_id,value\n"
        "cust-000001,a\n"
        "cust-000002,b\n"
        "cust-000003,c\n",
        encoding="utf-8",
    )
    output = tmp_path / "fresh-prefixed.csv"
    base_rows, new_rows, _ = runtime._build_retraining_snapshot(baseline, output)
    with output.open("r", encoding="utf-8", newline="") as handle:
        rows = list(csv.DictReader(handle))
    assert base_rows == 3
    assert new_rows == 4
    assert [row["customer_id"] for row in rows] == [
        "cust-000001",
        "cust-000002",
        "cust-000003",
        "cust-000004",
    ]
PY
          fi

      - name: Run exact contract suites
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q \
            -e 'labs/machine-learning' \
            -e 'labs/mlops[dev,registry,serving]' \
            -e 'labs/llm-rag[dev]' \
            -e 'labs/agent-ops[dev]' \
            -e 'labs/keycloak-ai-api[dev]'
          python -m pytest labs/mlops/tests -q -p no:cacheprovider
          python -m pytest \
            labs/keycloak-ai-api/tests/test_rag_bridge.py \
            labs/keycloak-ai-api/tests/test_agent_bridge_retrieval.py \
            labs/keycloak-ai-api/tests/test_agent_knowledge_route.py \
            -q -p no:cacheprovider

      - name: Commit batch correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            labs/mlops/scripts/run_live_retraining_runtime.py \
            labs/mlops/tests/test_live_retraining_runtime.py \
            labs/keycloak-ai-api/scripts/run_live_identity_gate.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(runtime): align retraining and identity orchestration'
          git push origin HEAD:fix/actions-runner-context
