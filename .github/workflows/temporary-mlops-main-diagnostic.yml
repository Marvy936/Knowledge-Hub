name: Temporary MLOps main diagnostic

on:
  push:
    branches:
      - main
    paths:
      - "labs/mlops/**"
      - ".github/workflows/temporary-mlops-main-diagnostic.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: temporary-mlops-main-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VENV_DIR: "${{ runner.temp }}/knowledge-hub-mlops-diagnostic-venv"
      LOG_FILE: "${{ runner.temp }}/knowledge-hub-mlops-diagnostic.log"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      SUBJECT_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout exact main revision
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            labs/mlops/pyproject.toml
            labs/machine-learning/pyproject.toml

      - name: Capture exact install and pytest result
        id: diagnostic
        if: always() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success'
        shell: bash
        run: |
          set +e
          rm -rf "$VENV_DIR"
          : > "$LOG_FILE"

          python -m venv "$VENV_DIR" >> "$LOG_FILE" 2>&1
          rc=$?
          stage="venv"

          if [[ $rc -eq 0 ]]; then
            "$VENV_DIR/bin/python" -m pip install --upgrade pip >> "$LOG_FILE" 2>&1
            rc=$?
            stage="pip-upgrade"
          fi

          if [[ $rc -eq 0 ]]; then
            "$VENV_DIR/bin/python" -m pip install \
              -e "labs/machine-learning" \
              -e "labs/mlops[dev,registry]" >> "$LOG_FILE" 2>&1
            rc=$?
            stage="install"
          fi

          if [[ $rc -eq 0 ]]; then
            PYTHONWARNINGS=error "$VENV_DIR/bin/python" -m pytest labs/mlops/tests -q >> "$LOG_FILE" 2>&1
            rc=$?
            stage="pytest"
          fi

          if [[ $rc -eq 0 ]]; then
            result="success"
            summary="MLOps install and full pytest suite passed"
          else
            result="failure"
            summary=$(grep -E '(^FAILED |^ERROR |E   |ModuleNotFoundError|ImportError|AssertionError|ContractError|Traceback|error:)' "$LOG_FILE" | tail -n 1)
            if [[ -z "$summary" ]]; then
              summary=$(tail -n 1 "$LOG_FILE")
            fi
            summary=$(printf '%s' "$summary" | tr '\n\r' '  ' | cut -c1-160)
          fi

          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

          echo "result=$result"
          echo "stage=$stage"
          echo "summary=$summary"
          tail -n 160 "$LOG_FILE"
          exit 0

      - name: Publish run locator and failure summary to blocker issue
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          DIAGNOSTIC_RESULT: ${{ steps.diagnostic.outputs.result }}
          DIAGNOSTIC_STAGE: ${{ steps.diagnostic.outputs.stage }}
          DIAGNOSTIC_SUMMARY: ${{ steps.diagnostic.outputs.summary }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          if os.environ["CHECKOUT_OUTCOME"] != "success":
              result = "failure"
              stage = "checkout"
              summary = "Exact main checkout failed"
          elif os.environ["PYTHON_OUTCOME"] != "success":
              result = "failure"
              stage = "setup-python"
              summary = "Python 3.12 setup failed"
          else:
              result = os.environ.get("DIAGNOSTIC_RESULT") or "failure"
              stage = os.environ.get("DIAGNOSTIC_STAGE") or "unknown"
              summary = os.environ.get("DIAGNOSTIC_SUMMARY") or "No summary was produced"

          body = "\n".join(
              [
                  "## Automated MLOps diagnostic",
                  "",
                  f"- Subject: `{os.environ['SUBJECT_SHA']}`",
                  f"- Result: `{result}`",
                  f"- Stage: `{stage}`",
                  f"- Summary: `{summary}`",
                  f"- Run: {os.environ['RUN_URL']}",
              ]
          )
          url = (
              "https://api.github.com/repos/"
              + os.environ["REPOSITORY"]
              + "/issues/151/comments"
          )
          request = urllib.request.Request(
              url,
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "knowledge-hub-mlops-diagnostics",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise SystemExit(f"Unexpected issue API response: {response.status}")
          print(body)
          PY

      - name: Fail when diagnostic failed
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          DIAGNOSTIC_RESULT: ${{ steps.diagnostic.outputs.result }}
        run: |
          set -euo pipefail
          [[ "$CHECKOUT_OUTCOME" == "success" ]]
          [[ "$PYTHON_OUTCOME" == "success" ]]
          [[ "$DIAGNOSTIC_RESULT" == "success" ]]

      - name: Cleanup diagnostic runtime
        if: always()
        shell: bash
        run: |
          rm -rf "$VENV_DIR" "$LOG_FILE"
