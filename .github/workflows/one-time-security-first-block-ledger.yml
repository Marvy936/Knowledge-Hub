name: One-time Security first block ledger update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-security-first-block-ledger.yml

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update review ledger
        shell: python
        run: |
          from pathlib import Path

          path = Path("DOCUMENTATION-REVIEW-STATUS.md")
          text = path.read_text(encoding="utf-8")
          row = """| `13-security-and-identity` — Security and Identity | 4/19 strict revalidation | In progress | 2026-07-29 | Prvý authoritative blok bol kompletne prepísaný okolo connected Atlas Payments security subjectu `SEC-PAY-47`: `CIA triáda` používa `business capability a asset → exact security subject/trust boundaries → C/I/A objectives → threat/vulnerability/exposure/impact → required assurance → preventive/detective/response/recovery controls → effective-state evidence → containment/recovery → allowed/forbidden/residual-risk validation`; `Authentication, authorization a auditing` používa `identity proofing/eligibility → authenticator → authentication event → session/token → principal mapping → principal–action–resource–context request → PIP/PDP/PEP → operation result → delegated-actor audit → revocation a second-session validation`; `Least privilege` používa `business task → required action/resource/data inventory → privilege dimensions → minimal entitlement a maximum envelope → JIT activation → effective access → positive/negative/escalation tests → audit → revocation/removal`; `IAM a RBAC` používa `authoritative identity/owner state → entitlement desired generation → joiner/mover/leaver event → account/group/role reconciliation → federation/session → RBAC/ABAC evaluation → effective-access graph → review/revoke → second-sync validation`. Worked incident pokrýva human principal presunutý z Payments Operations do Finance Analytics, pri ktorom add-only mover sync odstránil direct group, ale ponechal nested path `finance-emea → legacy-shared-operations → prod-payment-operators`; validná WebAuthn session preto získala Kubernetes operator binding. Broad role umožnila arbitrary Pod create, výber `settlement-debug` ServiceAccountu, provider Secret use, route-config mutation a scale-to-zero, čím jeden identity defect narušil confidentiality, integrity aj availability. Root cause je incomplete entitlement reconciliation a chýbajúca session revocation; ukradnutá session je trigger a broad role causal amplifier. Recovery používa complete desired-state reconciliation, revocation odvodených sessions/tokens, provider credential rotation, signed GitOps restore, business reconciliation, mediated JIT `settlement.requeue.one` capability, negative escalation fixtures a second-login/second-sync test. Navigation chain `12-observability/Cardinality → CIA triáda → Authentication/authorization/auditing → Least privilege → IAM/RBAC → Active Directory` bol zachovaný. Nový `glossary/13a-security-goals-access-privilege-iam-lifecycles.md` pridal CIA assurance/recovery, principal-decision-audit, task-to-revocation a identity-entitlement reconciliation terminology; generated `GLOSSARY.md` je synchronizovaný a audit-failure artifacts sú prázdne. Aktuálne official facts boli overené: NIST SP 800-63 Revision 4 je finálna suite od júla 2025 a oddeľuje IAL, AAL a FAL; Kubernetes RBAC permissions sú additive bez deny rules a permissions ako workload creation, `bind`, `escalate` a `impersonate` vyžadujú explicitnú escalation analýzu. Zostáva 15 kapitol a finálny section-level pass. |"""

          lines = text.splitlines()
          replaced = False
          for index, line in enumerate(lines):
              if line.startswith("| `13-security-and-identity`"):
                  lines[index] = row
                  replaced = True
                  break

          if not replaced:
              marker = "## Section-level completion criteria"
              marker_index = lines.index(marker)
              insert_at = marker_index
              while insert_at > 0 and lines[insert_at - 1] == "":
                  insert_at -= 1
              lines.insert(insert_at, row)

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Commit ledger and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DOCUMENTATION-REVIEW-STATUS.md
          git rm .github/workflows/one-time-security-first-block-ledger.yml
          git commit -m "docs(review): record first Security and Identity strict revalidation block"
          git push
