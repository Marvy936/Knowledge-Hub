name: Section 02 explanation depth

on:
  push:
    branches:
      - agent/section-02-explanation-depth
    paths:
      - scripts/section_02_explanation_depth.py
      - .github/workflows/section-02-explanation-depth.yml

permissions:
  contents: write

concurrency:
  group: section-02-explanation-depth
  cancel-in-progress: true

jobs:
  rewrite:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/section-02-explanation-depth
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply and validate documentation changes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/section_02_explanation_depth.py
          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs

      - name: Commit generated result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/02-networking-and-web DOCUMENTATION-REVIEW-STATUS.md GLOSSARY.md ROADMAP.md DOCUMENTATION-AUDIT.md documentation-audit.json
          git diff --cached --check
          git commit -m "docs: deepen networking explanation and validation" 
          git push origin HEAD:agent/section-02-explanation-depth
