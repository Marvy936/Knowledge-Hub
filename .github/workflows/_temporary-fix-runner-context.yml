name: Temporary fix job env runner context

on:
  push:
    branches:
      - fix/actions-runner-context
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/actions-runner-context')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/actions-runner-context
          persist-credentials: true
          fetch-depth: 1

      - name: Replace invalid job-level runner.temp expressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.github/workflows')
          changed = []
          needle = '${{ runner.temp }}/'
          replacement = '${{ github.workspace }}/../'

          for path in sorted(root.glob('*.yml')):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              output = []
              file_changed = False
              for line in lines:
                  # jobs.<job_id>.env entries are indented exactly six spaces.
                  # Step-level env/with entries are deeper and remain untouched.
                  if line.startswith('      ') and not line.startswith('       ') and needle in line:
                      line = line.replace(needle, replacement)
                      file_changed = True
                  output.append(line)
              if file_changed:
                  path.write_text(''.join(output), encoding='utf-8')
                  changed.append(path.as_posix())

          offenders = []
          for path in sorted(root.glob('*.yml')):
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), start=1):
                  if line.startswith('      ') and not line.startswith('       ') and needle in line:
                      offenders.append(f'{path}:{lineno}:{line.strip()}')
          if offenders:
              raise SystemExit('job-level runner.temp expressions remain:\n' + '\n'.join(offenders))

          print('changed files:')
          for item in changed:
              print(item)
          PY

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'fix(ci): remove invalid job-level runner context'
          git push origin HEAD:fix/actions-runner-context
