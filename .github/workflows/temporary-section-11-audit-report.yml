name: Temporary section 10 practical materializer

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/sections-10-13-prose-first-revalidation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-section-10-practical-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: self-hosted
    steps:
      - name: Checkout coordinator branch
        uses: actions/checkout@v4
        with:
          ref: agent/sections-10-13-prose-first-revalidation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize focused Helm examples
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f .github/workflows/temporary-section-11-audit-report.yml
          rm -f .github/section11-audit-report.trigger
          git add .github
          git commit -m "ci(docs): remove temporary section 11 report runner"
          git push origin HEAD:agent/sections-10-13-prose-first-revalidation

          git fetch origin agent/section-10-practical-helm-examples
          git checkout -B section-10-practical origin/agent/section-10-practical-helm-examples

          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/temporary-section-10-practical-completion.yml')
          text = source.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          Path('/tmp/section10_practical.py').write_text(script + "\n", encoding='utf-8')
          PY

          python /tmp/section10_practical.py
          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          rm -f .github/workflows/temporary-section-10-practical-completion.yml
          rm -f .github/section10-practical-run.txt
          rm -f .github/section10-practical-completion.trigger

          git add docs .github
          git commit -m "docs(helm): materialize focused executable examples"
          git push origin HEAD:agent/section-10-practical-helm-examples
