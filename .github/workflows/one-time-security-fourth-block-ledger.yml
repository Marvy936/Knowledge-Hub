name: One-time Security fourth block ledger update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-security-fourth-block-ledger.yml

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update review ledger
        shell: python
        run: |
          from pathlib import Path

          path = Path("DOCUMENTATION-REVIEW-STATUS.md")
          lines = path.read_text(encoding="utf-8").splitlines()

          prefix = "| `13-security-and-identity` — Security and Identity |"
          index = next(i for i, line in enumerate(lines) if line.startswith(prefix))
          row = lines[index]

          old_status = "| 12/19 strict revalidation | In progress |"
          new_status = "| 16/19 strict revalidation | In progress |"
          if old_status not in row:
              raise SystemExit("Expected 12/19 Security and Identity ledger status not found")
          row = row.replace(old_status, new_status, 1)

          old_tail = " Zostáva 7 kapitol a finálny section-level pass. |"
          if old_tail not in row:
              raise SystemExit("Expected third-block ledger tail not found")

          fourth_block = """ Štvrtý authoritative blok bol kompletne prepísaný okolo connected release-compromise incidentu `SEC-PAY-50`: `Vulnerability a patch management` používa `security intelligence/finding → exact remediation subject/evidence generation → affected-state, exposure a exploitation verdict → priority/owner → evidence-preserving containment → patch/rebuild/mitigation/replacement → staged rollout a runtime activation → compromise assessment → original/forbidden validation → rollback a creation-path retirement`; `Threat modeling` používa `business/security objective → exact threat-model subject/scope → assets, actors, data a state transitions → trust/identity/administrative boundaries → assumptions a dependency failure modes → concrete threat statement/attack path → control mechanism → testovateľný requirement → negative test/operational evidence → residual-risk owner a update trigger`; `Supply-chain security` používa `release intent/trust policy → exact source revision a source controls → resolved dependencies/actions/build definition → builder identity/isolation/execution generation → immutable digest → provenance/SBOM/signature/test evidence → registry promotion → semantic consumer policy → deployed digest/runtime inventory → continuous re-evaluation/revocation/recovery`; `SBOM` používa `immutable software subject → lifecycle stage/generation method/evidence authority → component identities/relationships → completeness/accuracy/confidence → signature/attestation → distribution/promotion → ingestion/normalization → vulnerability/VEX/license decisions → runtime/rollback mapping → remediation verification`. Worked failure pokrýva approved source revision `a81f2e9` a production image `sha256:pay7240`, ktorý vznikol na persistentnom self-hosted runneri `runner-prod-17` z builder digestu `sha256:builder17` s vulnerable `atlas-build-helper 2.4.1`. Crafted merged-PR title vyvolal command injection a po application testoch vložil `settlement-debug.jar` do final image. Source SCA zostala green; release signature a provenance mali matching malicious subject digest, ale provenance generoval tenant-controlled job na compromised runneri. Signed CycloneDX 1.7 SBOM bola iba source-lockfile inventory spätne označená final digestom, takže neobsahovala injected JAR ani nedeklarovala wrong lifecycle stage/completeness. Admission kontrolovalo existenciu evidence, nie approved builder, provenance authority, source, parameters, SBOM method a completeness. Root cause je vulnerable persistent privileged build execution path; source-only coverage, nepravdivé threat-model assumptions a existence-only evidence policy sú amplifiers. Recovery quarantinuje builder, runner a všetky outputs z exposure intervalu, zachováva forensic evidence, rotuje credentials, zavádza pinned fixed builder a fresh ephemeral isolation, platform-generated provenance mimo tenant steps, separate builder/toolchain BOM a platform-specific final-artifact SBOM, semantic policy, referrer-preserving promotion, new digest rollout, runtime/rollback retirement a second clean-build/adversarial test. Navigation chain `Encryption at rest a in transit → Vulnerability a patch management → Threat modeling → Supply-chain security → SBOM → Image signing` bol zachovaný obojsmerne. Nový `glossary/13h-security-vulnerability-threat-supply-sbom-lifecycles.md` pridal remediation/runtime activation, objective-to-negative-test, release trust/evidence authority a SBOM lifecycle/completeness terminology; generated `GLOSSARY.md` je synchronizovaný a audit-failure artifacts sú prázdne. Aktuálne official facts boli overené: CVSS je stále v4.0 s Base/Threat/Environmental/Supplemental groups; SLSA 1.2 je current approved specification s Build a Source tracks; SPDX 3.0.1 je current published specification; CycloneDX 1.7 je current stable BOM specification a ECMA-424, 2nd Edition. Zostávajú 3 kapitoly a finálny section-level pass. |"""

          row = row.replace(old_tail, fourth_block, 1)
          lines[index] = row
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Commit ledger and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DOCUMENTATION-REVIEW-STATUS.md
          git rm .github/workflows/one-time-security-fourth-block-ledger.yml
          git commit -m "docs(review): record fourth Security and Identity strict revalidation block"
          git push