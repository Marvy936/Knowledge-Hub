name: Synchronize Section 17 to 18 navigation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-section-17-to-18-navigation.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-18-ml-fundamentals-block-01-04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and validate cross-section navigation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_navigation.py --write
          python scripts/update_navigation.py --check
          changed="$(git diff --name-only)"
          expected="docs/17-keycloak-and-identity-platform/keycloak-troubleshooting.md"
          if [[ "$changed" != "$expected" ]]; then
            printf 'Unexpected navigation diff:\n%s\n' "$changed"
            exit 1
          fi
          git diff --check
      - name: Commit generated navigation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/17-keycloak-and-identity-platform/keycloak-troubleshooting.md
          git commit -m "docs: link Keycloak troubleshooting to ML fundamentals"
          git push origin HEAD:agent/section-18-ml-fundamentals-block-01-04
