name: SRE prose revalidation closeout

on:
  push:
    branches:
      - agent/sre-style-revalidation-block-4
    paths:
      - "scripts/close_sre_prose_revalidation.py"
      - ".github/workflows/sre-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sre-style-revalidation-block-4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply section closeout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/close_sre_prose_revalidation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/14-sre-and-operations/README.md DOCUMENTATION-REVIEW-STATUS.md
          git commit -m "docs(sre): record 15/15 prose-first strict revalidation"
          git push origin HEAD:agent/sre-style-revalidation-block-4
