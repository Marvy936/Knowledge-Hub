name: Temporary Section 21 block 17-20 closeout

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/21-ai-agents-and-intelligent-automation/.block-17-20-candidate*'

permissions:
  contents: write

jobs:
  closeout:
    if: github.head_ref == 'agent/section-21-ai-agents-block-17-20'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: agent/section-21-ai-agents-block-17-20

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Synchronize Section 21 block 17-20 documentation
        shell: bash
        run: |
          set -euo pipefail

          python scripts/temporary_section_21_block_17_20_closeout.py
          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check
          python scripts/temporary_section_21_block_17_20_verify.py

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ROADMAP.md \
            GLOSSARY.md \
            docs \
            DOCUMENTATION-REVIEW-STATUS.md \
            DOCUMENTATION-AUDIT.md \
            documentation-audit.json

          if git diff --cached --quiet; then
            echo "No closeout changes required."
            exit 0
          fi

          git commit -m "docs: synchronize AI Agents chapters 17-20"
          git push origin "HEAD:agent/section-21-ai-agents-block-17-20"
