name: Temporary documentation navigation sync

on:
  push:
    branches:
      - agent/sections-10-13-prose-first-revalidation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-documentation-navigation-sync
  cancel-in-progress: false

jobs:
  sync-navigation:
    runs-on: self-hosted
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/sections-10-13-prose-first-revalidation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and commit canonical navigation
        shell: bash
        run: |
          set -euo pipefail

          python scripts/update_navigation.py --write
          python scripts/update_navigation.py --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs
          git rm .github/workflows/temporary-section-11-cleanup.yml
          git commit -m "docs: synchronize generated navigation"
          git push origin HEAD:agent/sections-10-13-prose-first-revalidation
