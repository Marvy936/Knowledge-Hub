name: Temporary Section 21 block 37-40 closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "docs/21-ai-agents-and-intelligent-automation/**"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "DOCUMENTATION-REVIEW-STATUS.md"
      - "DOCUMENTATION-AUDIT.md"
      - "documentation-audit.json"
      - ".github/workflows/temporary-section-21-block-37-40-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-section-21-block-37-40-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-21-ai-agents-block-37-40

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize section and run learning-depth closeout
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          readme = Path("docs/21-ai-agents-and-intelligent-automation/README.md")
          replace_once(
              readme,
              "36. [n8n monitoring, logs a security audit](n8n-monitoring-logs-security-audit.md)\n\n## Plánované authoritative poradie",
              "36. [n8n monitoring, logs a security audit](n8n-monitoring-logs-security-audit.md)\n"
              "37. [AI Agent nodes, tools a memory](ai-agent-nodes-tools-memory.md)\n"
              "38. [Human approval pre citlivé tool calls](human-approval-sensitive-tool-calls.md)\n"
              "39. [RAG a knowledge workflows v n8n](rag-knowledge-workflows-n8n.md)\n"
              "40. [Production hardening a troubleshooting](production-hardening-troubleshooting.md)\n\n"
              "## Plánované authoritative poradie",
          )
          for planned in (
              "37. AI Agent nodes, tools a memory\n",
              "38. Human approval pre citlivé tool calls\n",
              "39. RAG a knowledge workflows v n8n\n",
              "40. Production hardening a troubleshooting\n",
          ):
              replace_once(readme, planned, "")

          text = readme.read_text(encoding="utf-8")
          marker = "## Stav\n\n"
          if text.count(marker) != 1:
              raise SystemExit("README: expected one status marker")
          prefix, _ = text.split(marker, 1)
          status = (
              "Aktuálny authoritative stav sekcie je **40/62 · In progress**. Desiaty authoritative blok aktivuje kapitoly 37–40 a incident `AGENT-N8N-10`. AI Agent kapitola viaže exact workflow/model/tool generation, bounded tool inventory, schema a deterministic authority parameters, read/draft/commit capability classes, typed tool results, iteration budget a tenant-safe memory. Approval kapitola chápe human review ako immutable, expiring decision nad exact tool callom s reviewer authorization, precondition revalidation, replay protection, idempotency a provider read-backom. RAG kapitola oddeľuje ingestion a query, pinne document/chunk/embedding/index generations, presadzuje tenant/ACL/effective-date filters, citations, abstention, deletion propagation a blue-green reindex. Production kapitola skladá node/network/task-runner hardening, model fallback contracts, tenant/idempotency/approval/RAG controls, canary, kill switch, observability a layer-by-layer troubleshooting. Reálne agent executions, human approvals, RAG ingestion/query, model fallbacks, side effects, incident recovery ani business outcomes neboli vykonané. Sekcia zostáva `In progress`, nie runtime `Verified`, production `Stable` ani user `Accepted`. Ďalší blok sú kapitoly 41–44: Harness AI platform overview, DevOps Agent, Worker Agents a MCP connectors/external tools.\n"
          )
          readme.write_text(prefix + marker + status, encoding="utf-8", newline="\n")

          roadmap = Path("ROADMAP.md")
          roadmap_updates = {
              "- [ ] AI Agent nodes, tools a memory": "- [x] [AI Agent nodes, tools a memory](docs/21-ai-agents-and-intelligent-automation/ai-agent-nodes-tools-memory.md)",
              "- [ ] Human approval pre citlivé tool calls": "- [x] [Human approval pre citlivé tool calls](docs/21-ai-agents-and-intelligent-automation/human-approval-sensitive-tool-calls.md)",
              "- [ ] RAG a knowledge workflows v n8n": "- [x] [RAG a knowledge workflows v n8n](docs/21-ai-agents-and-intelligent-automation/rag-knowledge-workflows-n8n.md)",
              "- [ ] Production hardening a troubleshooting": "- [x] [Production hardening a troubleshooting](docs/21-ai-agents-and-intelligent-automation/production-hardening-troubleshooting.md)",
          }
          for old, new in roadmap_updates.items():
              replace_once(roadmap, old, new)

          review = Path("DOCUMENTATION-REVIEW-STATUS.md")
          lines = review.read_text(encoding="utf-8").splitlines()
          row_prefix = "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation |"
          matches = [index for index, line in enumerate(lines) if line.startswith(row_prefix)]
          if len(matches) != 1:
              raise SystemExit(f"Review status: expected one Section 21 row, found {len(matches)}")
          lines[matches[0]] = (
              "| `21-ai-agents-and-intelligent-automation` — AI Agents and Intelligent Automation | 40/62 authoritative drafting | In progress | 2026-08-05 | "
              "Desiaty authoritative blok aktivuje kapitoly 37–40 a incident `AGENT-N8N-10`. AI Agent kapitola oddeľuje model proposal od deterministic identity/authorization, vysvetľuje tool descriptions a schemas, `$fromAI()`, wrappers, read/draft/commit classes, typed results, budgets, memory keys/backends/poisoning a cross-tenant negative tests. Human approval kapitola zavádza immutable envelope, parameter digest, reviewer identity, expiry, freshness, callback/replay protection, separation of duties, idempotent commit a durable audit. RAG kapitola viaže authoritative documents, loaders, normalization, chunking, metadata, embedding/index generations, filters, retrieval/reranking, citations, groundedness, abstention, ACL/delete propagation, evaluation a blue-green recovery. Production kapitola spája blocked nodes, external task runners, SSRF/network policy, credentials, promotion, model fallback, tenant/idempotency/approval/RAG controls, limits, canary, kill switch, telemetry a symptom-based troubleshooting. Reálne agent calls, approvals, ingestion/query, production hardening drilly, recovery a business outcomes neboli vykonané; stav zostáva `In progress`, nie runtime `Verified`, production `Stable` ani user `Accepted`. |"
          )
          review.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          python - <<'PY'
          from pathlib import Path

          audit = Path("DOCUMENTATION-AUDIT.md").read_text(encoding="utf-8")
          files = [
              "ai-agent-nodes-tools-memory.md",
              "human-approval-sensitive-tool-calls.md",
              "rag-knowledge-workflows-n8n.md",
              "production-hardening-troubleshooting.md",
          ]
          remaining = [
              name
              for name in files
              if f"### `docs/21-ai-agents-and-intelligent-automation/{name}`" in audit
          ]
          if remaining:
              raise SystemExit(f"Section 21 block 37-40 critical/high findings remain: {remaining}")
          print("Section 21 block 37-40 has no critical/high audit entries.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ROADMAP.md \
            GLOSSARY.md \
            DOCUMENTATION-REVIEW-STATUS.md \
            DOCUMENTATION-AUDIT.md \
            documentation-audit.json \
            docs/21-ai-agents-and-intelligent-automation

          if git diff --cached --quiet; then
            echo "No closeout changes required."
            exit 0
          fi

          git commit -m "docs: synchronize n8n AI workflow block closeout"
          git push origin HEAD:agent/section-21-ai-agents-block-37-40
