name: One-time Cloud protection and value ledger update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-cloud-protection-value-ledger.yml"

permissions:
  contents: write

jobs:
  update-ledger:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update ledger and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="${GITHUB_REF_NAME}"
          max_attempts=3
          python_bin="$(command -v python || command -v python3)"

          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin "$branch"
            git reset --hard "origin/${branch}"

            "$python_bin" - <<'PY'
          from pathlib import Path

          path = Path("DOCUMENTATION-REVIEW-STATUS.md")
          text = path.read_text(encoding="utf-8")

          old_status = "| `11-cloud-and-aws` — Cloud and AWS | 20/28 strict revalidation |"
          new_status = "| `11-cloud-and-aws` — Cloud and AWS | 24/28 strict revalidation |"
          old_marker = "Zostáva 8 kapitol a finálny section-level pass."
          new_block = """Šiesty blok bol kompletne prepísaný: `KMS a Secrets Manager` používa `business protected-value/credential intent → exact key/secret/target/consumer subject → authorization a key state → cryptographic/retrieval operation → target credential mutation → staging-label transition → consumer refresh/loaded state → old generation revocation → business validation → audit/recovery/retirement`; `AWS Backup` používa `business recovery objective → exact protected data/dependency subject → consistency a clean-point boundary → effective backup policy/assignment → capture/recovery-point generation → isolated copy/key/retention lineage → clean candidate selection → restore generation → dependencies/application → reconciliation a business validation → promotion/fencing/cutover`; `Well-Architected Framework` používa `business outcome/constraints → exact workload-review subject → current evidence inventory/cut-off → applicability → evidence-backed answer → failure scenario/risk → trade-off decision → owned improvement alebo expiring acceptance → bounded implementation → validation → residual-risk verdict/milestone → re-review`; `Cost management a FinOps` používa `business outcome/unit → exact billing/usage/workload subject → metering/pricing/discount generation → attribution a shared allocation → cost/forecast/anomaly signal → causal engineering hypothesis → bounded optimization/containment → cross-pillar validation → normalized realized value/savings → commitment/forecast/allocation update`. Worked failures pokrývajú Secrets Manager rotation split-brain medzi staging labelom, target credentialom a consumer-loaded state-om; technicky úspešné, ale business-dirty a vzájomne nekonzistentné isolated recovery points po útoku; Well-Architected reliability risk falošne uzavretý screenshotom `Multi-AZ enabled`, po ktorom unknown commit outcome vytvoril duplicate provider authorization; a júlový spend $128,000 pri nižšom počte úspešných payments, ktorého príčinou bola secret-rotation retry, NAT a telemetry amplification, nie legitímny rast ani commitment baseline. Každá kapitola používa exact protection/recovery/review/financial subject, competing hypotheses, discriminating evidence, evidence-preserving containment, authoritative recovery alebo bounded change a allowed aj forbidden business outcome. README ordering a navigation chain `Systems Manager → KMS/Secrets Manager → AWS Backup → Well-Architected Framework → Cost management/FinOps → SOA-C03` boli overené obojsmerne. Nový `glossary/11e-aws-protection-recovery-risk-value-lifecycles.md` pridal cryptographic/secret consumer-state, clean recovery/restore, architecture-risk closure a attributed-value/realized-savings terminology. Zostávajú 4 kapitoly a finálny section-level pass."""

          if old_status not in text:
              raise SystemExit("Expected 20/28 Cloud and AWS ledger status was not found.")
          if old_marker not in text:
              raise SystemExit("Expected Cloud and AWS remaining-work marker was not found.")

          text = text.replace(old_status, new_status, 1)
          text = text.replace(old_marker, new_block, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

            git rm .github/workflows/one-time-cloud-protection-value-ledger.yml
            git add DOCUMENTATION-REVIEW-STATUS.md
            git commit -m "docs(review): record sixth Cloud and AWS strict revalidation block"

            if git push origin "HEAD:${branch}"; then
              exit 0
            fi

            echo "::warning::Remote ${branch} changed during ledger update attempt ${attempt}; retrying."
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Unable to push ledger update after ${max_attempts} attempts."
              exit 1
            fi
          done