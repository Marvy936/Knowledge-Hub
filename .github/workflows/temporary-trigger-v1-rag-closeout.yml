name: Temporary trigger Practical v1 RAG closeout

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-trigger-v1-rag-closeout.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch closeout workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/temporary-v1-rag-indirect-closeout.yml/dispatches" \
            -d '{"ref":"main"}'
