name: Keycloak block 05-08 diagnostic

on:
  push:
    branches:
      - agent/section-17-keycloak-continuation
    paths:
      - scripts/section_17_block_05_08_diagnostic.py
      - .github/workflows/section-17-block-05-08-diagnostic.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/section_17_block_05_08_diagnostic.py
      - .github/workflows/section-17-block-05-08-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/section-17-keycloak-continuation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build diagnostic report
        run: python scripts/section_17_block_05_08_diagnostic.py
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/17-keycloak-and-identity-platform/SECTION-17-BLOCK-05-08-GATE.md
          if git diff --cached --quiet; then
            echo "Diagnostic report unchanged."
            exit 0
          fi
          git commit -m "chore: record Keycloak block 05-08 gate diagnostic"
          git pull --rebase origin agent/section-17-keycloak-continuation
          git push origin HEAD:agent/section-17-keycloak-continuation
