name: Temporary Section 18 block 17-20 closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "docs/18-machine-learning-fundamentals/**"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "DOCUMENTATION-REVIEW-STATUS.md"
      - "DOCUMENTATION-AUDIT.md"
      - "documentation-audit.json"
      - ".github/workflows/temporary-section-18-block-17-20-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-section-18-block-17-20-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-18-ml-fundamentals-block-17-20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize generated documentation
        shell: bash
        run: |
          set -euo pipefail

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          python - <<'PY'
          from pathlib import Path

          audit = Path("DOCUMENTATION-AUDIT.md").read_text(encoding="utf-8")
          files = [
              "classification-metrics.md",
              "regression-metrics.md",
              "imbalanced-datasets-threshold-selection.md",
              "cross-validation.md",
          ]
          remaining = [
              name
              for name in files
              if f"### `docs/18-machine-learning-fundamentals/{name}`" in audit
          ]
          if remaining:
              raise SystemExit(
                  f"Block-local critical/high findings remain: {remaining}"
              )
          print("Section 18 block 17-20 has no critical/high audit entries.")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ROADMAP.md \
            GLOSSARY.md \
            docs \
            DOCUMENTATION-REVIEW-STATUS.md \
            DOCUMENTATION-AUDIT.md \
            documentation-audit.json

          if git diff --cached --quiet; then
            echo "Generated documentation is already synchronized."
            exit 0
          fi

          git commit -m "docs: synchronize Machine Learning block 17-20 audit"
          git push origin HEAD:agent/section-18-ml-fundamentals-block-17-20
