name: Temporary Section 18 block 17-20 closeout

on:
  push:
    branches:
      - agent/section-18-ml-fundamentals-block-17-20
    paths:
      - "docs/18-machine-learning-fundamentals/**"
      - "ROADMAP.md"
      - "GLOSSARY.md"
      - "glossary/**"
      - "DOCUMENTATION-REVIEW-STATUS.md"
      - "scripts/update_navigation.py"
      - "scripts/update_glossary.py"
      - "scripts/audit_learning_depth.py"
      - ".github/workflows/temporary-section-18-block-17-20-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-section-18-block-17-20-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-18-ml-fundamentals-block-17-20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate block and synchronize documentation
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          section = Path("docs/18-machine-learning-fundamentals")
          chapters = {
              "classification-metrics.md": ["classification", "precision", "recall", "roc", "ML-PAY-87"],
              "regression-metrics.md": ["regression", "mae", "rmse", "r²", "ML-PAY-87"],
              "imbalanced-datasets-threshold-selection.md": ["imbalance", "threshold", "resampling", "prevalence", "ML-PAY-87"],
              "cross-validation.md": ["cross-validation", "groupkfold", "timeseriessplit", "out-of-fold", "ML-PAY-87"],
          }

          for filename, required in chapters.items():
              path = section / filename
              text = path.read_text(encoding="utf-8")
              words = re.findall(r"\b[\w'-]+\b", text, flags=re.UNICODE)
              if len(words) < 1200:
                  raise SystemExit(f"{filename}: only {len(words)} words")
              if text.count("```") < 6:
                  raise SystemExit(f"{filename}: insufficient executable/model surface")
              lower = text.lower()
              missing = [term for term in required if term.lower() not in lower]
              if missing:
                  raise SystemExit(f"{filename}: missing {missing}")
              semantic_groups = {
                  "subject": ("subject", "predmet"),
                  "evidence": ("evidence", "dôkaz", "artifact"),
                  "failure": ("failure", "zlyhan", "incident"),
                  "recovery": ("recovery", "obnov", "rollback"),
                  "acceptance": ("acceptance", "positive", "forbidden"),
              }
              for group, alternatives in semantic_groups.items():
                  if not any(token in lower for token in alternatives):
                      raise SystemExit(f"{filename}: missing {group} semantics")

          readme = section / "README.md"
          readme_text = readme.read_text(encoding="utf-8")
          for token in [
              "**20/26 · In progress**",
              "[Classification metrics](classification-metrics.md)",
              "[Regression metrics](regression-metrics.md)",
              "[Imbalanced datasets a threshold selection](imbalanced-datasets-threshold-selection.md)",
              "[Cross-validation](cross-validation.md)",
          ]:
              if token not in readme_text:
                  raise SystemExit(f"README missing {token}")
          PY

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write

          python - <<'PY'
          from pathlib import Path

          path = Path("DOCUMENTATION-REVIEW-STATUS.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          prefix = "| `18-machine-learning-fundamentals` — Machine Learning Fundamentals |"
          replacement = (
              "| `18-machine-learning-fundamentals` — Machine Learning Fundamentals | "
              "20/26 authoritative drafting | In progress | 2026-08-03 | "
              "Dvadsať authoritative kapitol je aktívnych. Blok 17–20 spája classification score/probability/class/top-K/business-action boundaries; confusion, precision/recall, ROC/PR, log-loss a multiclass/multilabel aggregation; regression target/unit/transform/residual, absolute/squared/baseline-relative/quantile a multioutput evidence; natural oproti sampled prevalence, fold-local weighting/resampling, model oproti threshold/top-K policy generation a selective-label feedback; a deployment-aligned KFold, stratified/group/temporal, out-of-fold, nested-CV, failed-fold a final-refit lifecycle. Incident `ML-PAY-87` prepája misleading aggregate metrics, scorer-direction a unit mismatch, double weighting, hidden queue truncation, shared-group leakage a global preprocessing/resampling. Kapitoly 21–26 zostávajú plánované. Reálne evaluation jobs, resampling, threshold deployment, CV fits, refit ani business actions neboli vykonané. |"
          )
          matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if len(matches) != 1:
              raise SystemExit(f"Expected one Section 18 row, found {len(matches)}")
          lines[matches[0]] = replacement
          path.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8", newline="\n")
          PY

          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md GLOSSARY.md docs DOCUMENTATION-REVIEW-STATUS.md DOCUMENTATION-AUDIT.md documentation-audit.json

          if git diff --cached --quiet; then
            echo "No synchronized documentation changes required."
            exit 0
          fi

          git commit -m "docs: close Machine Learning Fundamentals block 17-20"
          git push origin HEAD:agent/section-18-ml-fundamentals-block-17-20
