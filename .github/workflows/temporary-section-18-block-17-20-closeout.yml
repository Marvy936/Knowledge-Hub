name: Temporary Section 18 block 17-20 closeout

on:
  push:
    branches:
      - agent/section-18-ml-fundamentals-block-17-20
    paths:
      - "docs/18-machine-learning-fundamentals/**"
      - "DOCUMENTATION-AUDIT.md"
      - "documentation-audit.json"
      - ".github/workflows/temporary-section-18-block-17-20-closeout.yml"

permissions:
  contents: write

concurrency:
  group: temporary-section-18-block-17-20-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correct-api:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/section-18-ml-fundamentals-block-17-20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correct API example and validate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("docs/18-machine-learning-fundamentals/imbalanced-datasets-threshold-selection.md")
          text = path.read_text(encoding="utf-8")

          old = '''```python
from sklearn.model_selection import TunedThresholdClassifierCV

thresholded = TunedThresholdClassifierCV(
    estimator=base_classifier,
    scoring="f1",
    cv=group_aware_cv,
)
thresholded.fit(X_train, y_train, groups=merchant_id_train)
```

Presný metadata-routing a `groups` support závisí od current API/configuration, preto production code musí byť overený proti pinned scikit-learn version. Conceptual boundary zostáva: fit/tune authority je training domain; untouched test iba akceptuje locked procedure.'''

          new = '''```python
from sklearn.model_selection import (
    StratifiedGroupKFold,
    TunedThresholdClassifierCV,
)

splitter = StratifiedGroupKFold(
    n_splits=5,
    shuffle=True,
    random_state=17,
)
group_splits = list(
    splitter.split(
        X_train,
        y_train,
        groups=merchant_id_train,
    )
)

thresholded = TunedThresholdClassifierCV(
    estimator=base_classifier,
    scoring="f1",
    cv=group_splits,
)
thresholded.fit(X_train, y_train)
```

Current `TunedThresholdClassifierCV` akceptuje cez `cv` iterable explicitných train/validation indexov. Precomputed splits preto zachovajú group boundary bez odovzdania `groups` do `fit()`, kde by `**params` smerovali k underlying classifieru. Exact API a metadata-routing behavior sa aj tak overujú proti pinned scikit-learn version. Conceptual boundary zostáva: fit/tune authority je training domain; untouched test iba akceptuje locked procedure.'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected one threshold example, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

          python scripts/update_glossary.py --write
          python scripts/update_navigation.py --write
          python scripts/audit_learning_depth.py --all-docs
          python scripts/update_glossary.py --check
          python scripts/update_navigation.py --check

          python - <<'PY'
          from pathlib import Path

          audit = Path("DOCUMENTATION-AUDIT.md").read_text(encoding="utf-8")
          files = [
              "classification-metrics.md",
              "regression-metrics.md",
              "imbalanced-datasets-threshold-selection.md",
              "cross-validation.md",
          ]
          remaining = [name for name in files if f"### `docs/18-machine-learning-fundamentals/{name}`" in audit]
          if remaining:
              raise SystemExit(f"Block-local critical/high findings remain: {remaining}")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/18-machine-learning-fundamentals DOCUMENTATION-AUDIT.md documentation-audit.json GLOSSARY.md ROADMAP.md

          if git diff --cached --quiet; then
            echo "No API correction changes required."
            exit 0
          fi

          git commit -m "docs: correct threshold tuning group-split example"
          git push origin HEAD:agent/section-18-ml-fundamentals-block-17-20
